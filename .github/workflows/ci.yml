name: CI

# DOD-M15-COMPOSE-CI-1 (first half) — this repo had NO automated gate at all.
#
# `.github/` held issue templates; Cloud Build builds and pushes images; the buildspecs run smoke
# scripts. Nothing ran `pnpm run test`, `lint`, or `typecheck` on a push, ever. The whole suite ran
# only when a person remembered to run it locally, which is how a migration shipped that created a
# table the ops agent could not read, and how 32 database-suite failures sat unnoticed.
#
# ─── What this job deliberately does NOT do yet ────────────────────────────────────────────────
#
# It does not start Postgres and run the integration suites. That is the SECOND half of
# DOD-M15-COMPOSE-CI-1 and it is blocked on DOD-M15-DIRECTORY-ROT-1: those suites currently fail 25
# tests because the files share one database and assert whole-table properties, so wiring them in
# today produces a permanently red pipeline — which teaches everyone to ignore the pipeline, the
# opposite of the point.
#
# The database job is written below and DISABLED behind `if: false`, with the reason on it, rather
# than left out. A missing job is indistinguishable from one nobody thought of; a disabled one with
# a named blocker is a decision on the record.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

jobs:
  gate:
    name: Gate (test, lint, typecheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gate sequence from .claude/CLAUDE.md, in its documented order.
      - name: Test
        env:
          # DOD-M15-CI-SKIPS-SILENT-1: an unacknowledged CI run that skips the integration suites
          # FAILS by design — that guard exists so "we did not test this" cannot look like "this
          # passed". This run skips them on purpose (see the disabled database job below), so the
          # decision is declared here rather than the guard being deleted. Remove this line the day
          # the database job is enabled.
          CELLO_GATE_UNIT_ONLY: "1"
        run: pnpm run test

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # DOD-M15-CI-SKIPS-SILENT-1: the run above skips ~600 tests across 38 files because
      # CELLO_ENV is unset. The reporter prints that after the summary; this step makes it
      # impossible to scroll past in the Actions UI, where nobody reads mid-log output.
      - name: State what did NOT run
        if: always()
        run: |
          echo "::warning title=Integration suites did not run::This gate ran the unit tests only."
          echo "The CELLO_ENV=local suites (database, RLS, hash chains, migrations) are skipped here."
          echo "They are blocked on DOD-M15-DIRECTORY-ROT-1 — see the disabled job in this workflow."

  # ── Database suites — DISABLED, blocked on DOD-M15-DIRECTORY-ROT-1 ────────────────────────────
  #
  # Enable by deleting `if: false` once the directory suite survives its own run. Verify locally
  # first with:  docker compose up -d && CELLO_ENV=local pnpm run test
  #
  # Do NOT enable it "to see how bad it is" — a red required check that everyone learns to ignore is
  # worse than an honest absence, which is what the warning step above makes visible instead.
  database:
    name: Gate with Postgres (blocked — DOD-M15-DIRECTORY-ROT-1)
    runs-on: ubuntu-latest
    needs: gate
    if: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same compose stack developers use — Postgres with pgaudit, then Flyway to head.
      # Using compose rather than a service container keeps one definition of the schema path.
      - name: Start Postgres and migrate
        run: |
          docker compose up -d
          # Flyway runs as a one-shot container; fail loudly if it did not reach head.
          docker compose logs flyway | tail -20
          docker compose logs flyway | grep -q "Successfully applied\|Schema \"public\" is up to date" \
            || { echo "FAIL: migrations did not reach head"; exit 1; }

      - name: Test with the database
        env:
          CELLO_ENV: local
        run: pnpm run test
