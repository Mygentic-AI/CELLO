name: CI

# DOD-M15-COMPOSE-CI-1 (first half) — this repo had NO automated gate at all.
#
# `.github/` held issue templates; Cloud Build builds and pushes images; the buildspecs run smoke
# scripts. Nothing ran `pnpm run test`, `lint`, or `typecheck` on a push, ever. The whole suite ran
# only when a person remembered to run it locally, which is how a migration shipped that created a
# table the ops agent could not read, and how 32 database-suite failures sat unnoticed.
#
# ─── Both halves now run ───────────────────────────────────────────────────────────────────────
#
# The database job below was disabled behind `if: false`, blocked on DOD-M15-DIRECTORY-ROT-1: the
# integration suites failed 25 tests because files shared one database and asserted whole-table
# properties, and wiring that in would have made a permanently red required check — which teaches
# everyone to ignore the pipeline, the opposite of the point.
#
# That blocker is cleared, and clearing it turned up one more thing worth naming: the directory
# suite passing alone was NOT sufficient. The root gate is one vitest process, so `directory` and
# `operations-agent` interleave against one database, and on a freshly composed database the same
# command failed 16 tests one run and 19 the next — a DIFFERENT set each time, which is the same
# moving-failing-set signature this milestone chased before. The database run is therefore SERIAL
# (`fileParallelism` in vitest.config.ts, scoped to CELLO_ENV=local). Serial: 2245 passing, zero
# failures, twice back to back, 205s. The unit job below keeps its parallelism and runs in 38s.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

jobs:
  gate:
    name: Gate (test, lint, typecheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gate sequence from .claude/CLAUDE.md, in its documented order.
      - name: Test
        env:
          # DOD-M15-CI-SKIPS-SILENT-1: an unacknowledged CI run that skips the integration suites
          # FAILS by design — that guard exists so "we did not test this" cannot look like "this
          # passed". THIS job is still unit-only, and that is now a division of labour rather than a
          # gap: it gives fast feedback on every push while the `database` job below runs the same
          # suite for real. The acknowledgement stays because this job genuinely does skip them.
          CELLO_GATE_UNIT_ONLY: "1"
        run: pnpm run test

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # DOD-M15-CI-SKIPS-SILENT-1: the run above skips ~600 tests across 38 files because
      # CELLO_ENV is unset. The reporter prints that after the summary; this step makes it
      # impossible to scroll past in the Actions UI, where nobody reads mid-log output.
      - name: State what did NOT run
        if: always()
        run: |
          echo "::warning title=This job ran the unit tests only::The CELLO_ENV=local suites (database, RLS, hash chains, migrations) were skipped HERE."
          echo "They run in the 'Gate with Postgres' job of this same workflow — check that job's result before trusting this one."

  # ── Database suites — ENABLED 2026-08-22, DOD-M15-COMPOSE-CI-1 ────────────────────────────────
  #
  # This is the job that actually covers RLS policies, hash-chain constraints and migrations —
  # things a unit test cannot fake, and the reason a quarter of the suite was inert on every run.
  #
  # A FRESH DATABASE EVERY TIME, which is stricter than a developer's machine. Local databases carry
  # scars: a chain broken by a pre-fix fixture stays broken, and the DoD line records having to
  # `docker compose down -v` once to clear one. Here there is nothing to inherit, so a chain failure
  # is always a real one.
  #
  # If this goes red, do NOT re-disable it. It passed 195/196 files and 2245 tests twice in a row on
  # a clean database when it was enabled; a failure means something regressed, and hiding it
  # recreates the exact hole this milestone exists to close.
  database:
    name: Gate with Postgres
    runs-on: ubuntu-latest
    needs: gate

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same compose stack developers use — Postgres with pgaudit, then Flyway to head.
      # Using compose rather than a service container keeps one definition of the schema path.
      - name: Start Postgres and migrate
        run: |
          docker compose up -d
          # Flyway runs as a one-shot container; fail loudly if it did not reach head.
          docker compose logs flyway | tail -20
          docker compose logs flyway | grep -q "Successfully applied\|Schema \"public\" is up to date" \
            || { echo "FAIL: migrations did not reach head"; exit 1; }

      - name: Test with the database
        env:
          CELLO_ENV: local
        run: pnpm run test
