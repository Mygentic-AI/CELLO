name: Publish @cello-protocol/interfaces

on:
  push:
    tags:
      - 'interfaces-v*'

jobs:
  publish:
    name: Build and publish @cello-protocol/interfaces
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm 10.33.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @cello-protocol/interfaces
        run: |
          pnpm --filter @cello-protocol/interfaces run typecheck
          test -d packages/interfaces/dist && test "$(ls -A packages/interfaces/dist)" || (echo "ERROR: dist/ is empty after build" && exit 1)

      - name: Publish @cello-protocol/interfaces to npm
        run: pnpm publish --filter @cello-protocol/interfaces --access public --no-git-checks --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
