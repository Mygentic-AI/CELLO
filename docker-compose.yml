services:
  postgres:
    build:
      context: docker/postgres
    image: cello-postgres:18
    environment:
      POSTGRES_DB: cello_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      # Host port is a VARIABLE so two worktrees can each run their own Postgres. Hardcoded, the
      # second checkout either fails to bind ("port is already allocated") or silently shares the
      # first one's server -- and the spine harness DROPs and re-migrates its databases, so two
      # branches re-migrate one server to two different heads. That surfaces as a bogus
      # `migration.out.of.date`. The harness sets this from DATABASE_URL; 5433 keeps the default.
      - "${CELLO_PG_HOST_PORT:-5433}:5432"
    command: >
      postgres
      -c shared_preload_libraries=pgaudit
      -c pgaudit.log=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cello_dev"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s

  flyway:
    image: flyway/flyway:11.13.2
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/cello_dev
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: dev
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: 10
    volumes:
      - ./packages/directory/db/migrations:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy

  # Dev role passwords — MUST run AFTER Flyway, never as an initdb hook.
  # The service roles (cello_service, cello_analytics, cello_ops_agent) are CREATED by the
  # migrations (V2/V7/V26) with no password. An initdb hook fires at first boot, before Flyway,
  # so its ALTER ROLE statements would target roles that do not exist yet — leaving them
  # password-less on every fresh volume and failing every service-role connection with
  # `password authentication failed for user "cello_service"`.
  role-passwords:
    image: postgres:18
    environment:
      PGPASSWORD: dev
    entrypoint:
      ["psql", "-h", "postgres", "-U", "postgres", "-d", "cello_dev", "-v", "ON_ERROR_STOP=1",
       "-f", "/sql/01-dev-role-passwords.sql"]
    volumes:
      - ./docker/postgres/initdb:/sql:ro
    depends_on:
      flyway:
        condition: service_completed_successfully

