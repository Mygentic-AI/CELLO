# ─── Stubs ───────────────────────────────────────────────────
stubs:
  - what: "M2-aware `cello-mcp` startup with FROST bootstrap"
    why: >
      The current `cello-mcp` binary was built for M1 and does not bootstrap
      FROST key shares or inject a `thresholdSigner` into `createClient`. Without
      this, `cello_initiate_session` would return `frost_signer_not_configured`.
    replaced_by: >
      Update `packages/adapter-claude-code/src/cello-mcp.ts` to call
      `bootstrapKeyShares` at startup (test-only, guarded by NODE_ENV check in
      production) and pass a `FrostThresholdSigner` to `createClient`. This
      enables local FROST ceremonies using in-process stubs.

