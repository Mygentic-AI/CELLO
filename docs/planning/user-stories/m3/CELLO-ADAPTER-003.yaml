# ─── Identity ───────────────────────────────────────────────
id: CELLO-ADAPTER-003
domain: MCP Tool Surface
actor: AGENT
priority: P0
components:
  - adapter-claude-code

# ─── Intent ─────────────────────────────────────────────────
story: >
  As a Claude Code agent,
  I want the `@cello/adapter-claude-code` MCP server updated for M3 — pushing
  typed channel notifications for connection results, pending-review requests, and
  Round 2 disclosure requests; maintaining three bounded event queues; exposing the
  full M3 tool set over stdio; and updating SKILL.md
  so that a Claude Code agent can register, discover connections, and react to
  every stage of the two-round connection negotiation reactively from M3 onward.

  This story extends CELLO-ADAPTER-002 (M1). The adapter pattern is unchanged:
  - Channel notifications wake Claude Code without polling
  - Event queues buffer between CelloClient callbacks and MCP tool calls
  - The stdio/InMemoryTransport factory produces identical tool registrations

  **Channel notification types — M3:**

  Deterministic auto-result (receiver side — no agent decision needed):
  ```json
  { "type": "cello_connection_result", "from": "<pubkey_hex>", "result": "accepted" | "rejected" | "insufficient" }
  ```

  Inference mode — agent must decide (receiver side):
  ```json
  { "type": "cello_connection_request", "from": "<pubkey_hex>", "connection_request_id": "<hex>" }
  ```
  The agent calls `cello_await_connection_request` to retrieve the full ConnectionReport.
  The report is never included in the notification payload.

  Round 2 disclosure request arrived (sender side):
  ```json
  { "type": "cello_disclosure_requested", "from": "<pubkey_hex>", "connection_request_id": "<hex>" }
  ```
  `cello_request_connection` returns `{ result: 'disclosure_requested', connection_request_id, requested_items }`
  when the blocking call resolves — no separate tool is needed to retrieve it.

  Content, trust signals, endorsements, attestations, and connection package items are
  NEVER included in any notification — notifications are wake-up signals only. This is
  the same principle as `cello_message` notifications.

  **Three event queues:**

  1. **Connection result queue** — deterministic auto-accept / auto-reject / insufficient
     outcomes generated by CONNPOL-001. Bounded at 256. Drained by `cello_list_connections`
     (passive) or by the agent reading `cello_connection_result` notifications; no blocking
     drain tool. Oldest entry dropped silently on overflow — the connection record still
     exists in the client's connection table, only the notification is lost.

  2. **Connection pending review queue** — inference-mode ConnectionReports awaiting agent
     decision. Bounded at 64. These require agent attention; the lower bound keeps the
     agent from being buried. Oldest dropped silently on overflow — the sender's
     `cello_request_connection` call times out naturally on their side.

  3. **Disclosure request queue** — Round 2 disclosure requests arriving at the sender
     while `cello_request_connection` is blocking. Routed directly to the blocking call's
     resolver; no separate persistent queue. Not surfaced as a standalone drain tool.

  **Startup sequence — updated for M3:**
  1. Load K_local from `CELLO_KEY_FILE` (unchanged from M0)
  2. Load ML-DSA key from `CELLO_ML_DSA_KEY_FILE` if the file exists (created on first
     `cello_register`; absent means not yet registered)
  3. Load trust store from `CELLO_TRUST_STORE` (absent → empty store loaded without error:
     `{ endorsements_received: [], attestations_received: [], endorsements_issued: [] }`)
  4. Start CelloClient + libp2p
  5. Start MCP server
  6. Agent calls `cello_register` when ready — registration is never automatic

  Multi-agent test convention (same machine, isolated identities):
  CELLO_KEY_FILE_A / CELLO_KEY_FILE_B,
  CELLO_ML_DSA_KEY_FILE_A / CELLO_ML_DSA_KEY_FILE_B,
  CELLO_TRUST_STORE_A / CELLO_TRUST_STORE_B.

  **CelloClient subscriptions (M3):**
  The adapter subscribes to two new CelloClient events defined in CONNREQ-002:
  - `onConnectionResult` — fires on auto-accept, auto-reject, or agent-confirmed result;
    adapter pushes `cello_connection_result` notification and enqueues to the result queue.
  - `onConnectionPendingReview` — fires when inference mode produces a report needing
    agent review; adapter pushes `cello_connection_request` notification and enqueues to
    the pending review queue.

  **SKILL.md update:**
  Reflects M3 tool set. Adds a registration and connection workflow section. Documents
  the three env vars (CELLO_KEY_FILE, CELLO_ML_DSA_KEY_FILE, CELLO_TRUST_STORE). Notes
  that trust stores start empty in M3 — endorsement and attestation management tools
  are M6. No new installation steps beyond version bump.

# ─── Behavior (EARS) ───────────────────────────────────────
behavior:
  - trigger: "When `CelloClient.onConnectionResult` fires with a deterministic outcome (auto-accept, auto-reject, or agent-confirmed result)"
    action: >
      the adapter shall enqueue the event in the connection result queue and push
      `{ type: 'cello_connection_result', from: <counterparty_pubkey_hex>,
      result: 'accepted' | 'rejected' | 'insufficient' }` as a `claude/channel`
      notification. No connection package items, endorsements, or multiaddrs appear
      in the notification.

  - trigger: "When `CelloClient.onConnectionPendingReview` fires with an inference-mode ConnectionReport"
    action: >
      the adapter shall enqueue the ConnectionReport in the connection pending review
      queue and push `{ type: 'cello_connection_request', from: <counterparty_pubkey_hex>,
      connection_request_id: <hex> }` as a `claude/channel` notification. Report content
      is not included in the notification.

  - trigger: "When a Round 2 disclosure request arrives at the sender while `cello_request_connection` is blocking"
    action: >
      the adapter shall route the disclosure request directly to the blocking
      `cello_request_connection` call's resolver; that call returns
      `{ result: 'disclosure_requested', connection_request_id, requested_items }`.
      Concurrently, the adapter pushes a `{ type: 'cello_disclosure_requested',
      from: <counterparty_pubkey_hex>, connection_request_id: <hex> }` notification
      so the agent's system prompt can react if `cello_request_connection` was not
      actively awaited.

  - trigger: "When the agent calls `cello_await_connection_request({ timeout_ms })`"
    action: >
      the adapter shall return the next ConnectionReport from the pending review queue
      immediately if one is present, or block until one arrives or the timeout expires.
      Events are consumed in arrival order.

  - trigger: "When the connection pending review queue already holds 64 entries and a 65th report arrives"
    action: >
      the adapter shall silently drop the oldest report from the front of the queue and
      enqueue the new report. No error is returned; the dropped entry's corresponding
      sender's `cello_request_connection` will time out naturally.

  - trigger: "When the adapter starts and `CELLO_TRUST_STORE` is absent or points to a non-existent file"
    action: >
      the adapter shall load an empty trust store
      `{ endorsements_received: [], attestations_received: [], endorsements_issued: [] }`
      and continue without error. No log warning is emitted — an absent trust store is
      normal for a fresh installation.

  - trigger: "When the MCP server factory is invoked with a transport argument"
    action: >
      the factory shall register the full M3 tool set identically under stdio and
      InMemoryTransport. Removed M0 tools continue to return `tool_removed`.

# ─── Notes ─────────────────────────────────────────────────
notes: |
  All ACs with `test_type: e2e` require A and B to be separate OS processes, each
  running their own cello-mcp binary with distinct key files (CELLO_KEY_FILE_A/B,
  CELLO_ML_DSA_KEY_FILE_A/B, CELLO_TRUST_STORE_A/B), communicating via relay and
  directory over real network connections.

  `test_type: unit` applies to queue-behavior, notification-payload, and startup ACs
  that can be driven entirely in-process.

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "Two adapter instances A (sender) and B (receiver, inference-mode policy); both registered and connected to the M3 relay and directory; running as separate OS processes"
    when: "A calls `cello_request_connection` targeting B"
    then: >
      B's adapter receives the inbound connection package; CONNPOL-001 inference produces
      a ConnectionReport; the adapter pushes
      `{ type: 'cello_connection_request', from: <A_pubkey>, connection_request_id: <hex> }`
      via `claude/channel` before B's agent calls `cello_await_connection_request`; B then
      calls `cello_await_connection_request` and receives the full ConnectionReport
    test_type: e2e
    component_under_test: adapter-claude-code

  - id: AC-002
    given: "Two adapter instances A and B; B has open (auto-accept) policy; running as separate OS processes"
    when: "A calls `cello_request_connection` targeting B"
    then: >
      B's adapter auto-accepts deterministically; pushes
      `{ type: 'cello_connection_result', from: <A_pubkey>, result: 'accepted' }` via
      `claude/channel`; the event is also enqueued in B's connection result queue;
      the notification arrives before any drain tool is called
    test_type: e2e
    component_under_test: adapter-claude-code

  - id: AC-003
    given: "A `cello_connection_request` channel notification payload"
    when: "Inspected"
    then: "Contains exactly `type`, `from`, and `connection_request_id` fields — no ConnectionReport content, no endorsements, no attestations, no multiaddrs"
    test_type: unit
    component_under_test: adapter-claude-code

  - id: AC-004
    given: "A `cello_connection_result` channel notification payload"
    when: "Inspected"
    then: "Contains exactly `type`, `from`, and `result` fields — no connection package items, no trust signals, no multiaddrs"
    test_type: unit
    component_under_test: adapter-claude-code

  - id: AC-005
    given: "A `cello_disclosure_requested` channel notification payload"
    when: "Inspected"
    then: "Contains exactly `type`, `from`, and `connection_request_id` fields — no requested item details, no trust signals"
    test_type: unit
    component_under_test: adapter-claude-code

  - id: AC-006
    given: "Two pending-review events arrive before `cello_await_connection_request` is called"
    when: "Agent calls `cello_await_connection_request` twice"
    then: "Each call returns the next ConnectionReport in arrival order; neither blocks"
    test_type: unit
    component_under_test: adapter-claude-code

  - id: AC-007
    given: "The connection pending review queue holds 64 entries (all unread) and a 65th report arrives"
    when: "The adapter enqueues the new report"
    then: "The oldest entry is dropped silently; the queue holds 64 entries; no error is raised; no log warning is emitted"
    test_type: unit
    component_under_test: adapter-claude-code

  - id: AC-008
    given: "An adapter started with `CELLO_TRUST_STORE` pointing to a non-existent file"
    when: "The adapter starts and `cello_status` is called"
    then: "The adapter starts successfully; `cello_status` returns `trust_store: { endorsements_received: 0, attestations_received: 0, endorsements_issued: 0 }`; no error or warning is logged for the absent file"
    test_type: unit
    component_under_test: adapter-claude-code

  - id: AC-009
    given: "An adapter started without a prior registration (no `CELLO_ML_DSA_KEY_FILE` file present)"
    when: "`cello_status` is called"
    then: "Response shows `registered: false`, `agent_id: null`; the adapter is functional for status queries; `cello_request_connection` returns `{ error: { reason: 'not_registered' } }`"
    test_type: unit
    component_under_test: adapter-claude-code

  - id: AC-010
    given: "Two adapter instances on the same machine configured with CELLO_KEY_FILE_A/B, CELLO_ML_DSA_KEY_FILE_A/B, CELLO_TRUST_STORE_A/B pointing to distinct files"
    when: "Both adapters start, both register, and each calls `cello_status`"
    then: "Each adapter reports its own distinct `agent_id` and `k_local_pubkey`; neither adapter's trust store or key material is visible from the other's tools"
    test_type: unit
    component_under_test: adapter-claude-code

  - id: AC-011
    given: "An adapter whose `CELLO_ML_DSA_KEY_FILE` file exists but contains corrupt bytes"
    when: "The adapter starts"
    then: "The adapter starts successfully (transport, MCP server functional); logs `ml_dsa_key_load_failed`; `cello_request_connection` returns `{ error: { reason: 'ml_dsa_key_unavailable' } }`; `cello_status` shows `registered: false`; no private key bytes appear in logs"
    test_type: unit
    component_under_test: adapter-claude-code

  - id: AC-012
    given: "An M3 adapter instance"
    when: "Agent calls `cello_connect_peer({ multiaddr: '...' })` (M0 removed tool)"
    then: "Returns `{ error: { reason: 'tool_removed', replacement: 'cello_initiate_session' } }`"
    test_type: unit
    component_under_test: adapter-claude-code

  - id: AC-013
    given: "The M3 MCP server factory invoked with InMemoryTransport and with stdio"
    when: "Tool registries of both instances are inspected"
    then: >
      Both contain the full M3 tool set: all M1/M2 session tools plus cello_register,
      cello_request_connection, cello_await_connection_request, cello_list_connections,
      cello_set_policy, cello_get_policy. Neither contains cello_connect_peer or
      cello_list_peers.
    test_type: unit
    component_under_test: adapter-claude-code

  - id: AC-014
    given: "The updated SKILL.md in `packages/adapter-claude-code/`"
    when: "Inspected"
    then: >
      References the M3 tool set; includes a registration and connection workflow section;
      documents CELLO_KEY_FILE, CELLO_ML_DSA_KEY_FILE, and CELLO_TRUST_STORE env vars;
      notes that trust stores are empty in M3 and endorsement/attestation management is
      deferred to M6; installation instructions unchanged except version bump
    test_type: manual
    component_under_test: adapter-claude-code

# ─── Security Invariants ───────────────────────────────────
security_invariants:
  - id: SI-001
    statement: >
      No channel notification (`cello_connection_request`, `cello_connection_result`,
      `cello_disclosure_requested`) shall include ConnectionReport content, connection
      package items, endorsement data, attestation data, trust signal details, or
      multiaddrs. Notifications are wake-up signals only.
    adversarial_condition: >
      even when the ConnectionReport contains rich trust signal data — the adapter must
      never include content in the notification payload; details are retrieved via
      `cello_await_connection_request`
    test_type: unit
    component_under_test: adapter-claude-code

  - id: SI-002
    statement: "Neither K_local private key nor ML-DSA secret key shall appear in any tool response, notification payload, log, or error message"
    adversarial_condition: "even when registration fails, key file is corrupt, connection request construction fails, or key loading throws an exception"
    test_type: unit
    component_under_test: adapter-claude-code

  - id: SI-003
    statement: "The adapter shall never auto-register at startup. Registration is an explicit opt-in action via `cello_register`"
    adversarial_condition: "even when the adapter detects it is unregistered and a key file path is configured — the owner must consciously create a directory presence"
    test_type: unit
    component_under_test: adapter-claude-code

