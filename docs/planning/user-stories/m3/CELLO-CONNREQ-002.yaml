# ─── Identity ───────────────────────────────────────────────
id: CELLO-CONNREQ-002
domain: Connection Requests
actor: CLIENT
priority: P0
components:
  - client
  - directory

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO Client,
  I want to send a connection request (carrying my connection package) to a target agent
  via the directory, have the receiver evaluate it against their policy, and receive an
  accept/decline/insufficient response — establishing a persistent connection record on
  both sides and the directory
  so that two agents can transition from "registered strangers" to "connected peers" with
  cryptographically verified trust signals, and subsequent session establishment (SESSION-006)
  is gated on this accepted connection.

  This is the M3 centerpiece — the protocol interaction that wires together registration
  (REG-001), connection packages (CONNREQ-001), and policy evaluation (CONNPOL-001) into
  a network flow. The directory relays the connection package but cannot modify it (items
  are ML-DSA signed by the originator). The directory stores the connection state once
  accepted.

  **Connection request flow (one-round with optional retry):**

  1. Agent A calls `cello_request_connection({ target_pubkey, package_items })`.
  2. The client constructs a ConnectionPackage per CONNREQ-001 (pseudonym binding +
     selected endorsements/attestations), signs the pseudonym binding.
  3. The client sends `connection_request { target_pubkey, package_cbor }` on its
     authenticated signaling stream to the directory.
  4. The directory verifies: (a) sender is registered, (b) target is registered and has
     an active profile, (c) no existing accepted connection between sender and target
     exists. If any check fails, the directory responds to the sender immediately without
     bothering the target. Rejection reasons: `not_registered`, `target_not_found`,
     `already_connected`.
  5. The directory relays the request to the target's signaling stream as
     `connection_request_inbound { from_pubkey, package_cbor }`.
  6. The target client validates the package (CONNREQ-001): pseudonym binding, all item
     signatures, expiry checks, target_pubkey matches. Then evaluates against the
     target's `SignalRequirementPolicy` (CONNPOL-001).
  7. Based on the policy verdict:
     - `accept` → target client sends `connection_response { from_pubkey, verdict: 'accept' }`
       to directory. Directory creates connection records on both sides. Both clients
       receive `connection_established { counterparty_pubkey, connection_id }`.
     - `insufficient` → target client sends `connection_response { from_pubkey,
       verdict: 'insufficient', unmet_requirements }` to directory. Directory relays to
       sender as `connection_insufficient { target_pubkey, unmet_requirements }`. Sender
       can construct a new package with more items and retry (same flow from step 1).
     - `reject` (policy_closed or pseudonym_binding_invalid) → target client sends
       `connection_response { from_pubkey, verdict: 'reject', reason }` to directory.
       Directory relays to sender as `connection_rejected { target_pubkey, reason }`.

  **Connection state on the directory:**
  `{ connection_id, participants: [A_pubkey, B_pubkey], established_at, status: 'active' }`
  Indexed by both participants' pubkeys. Used by SESSION-006 to gate session establishment.
  Connection IDs are 16-byte CSPRNG (same as session_ids).

  **Connection state on the client:**
  `{ connection_id, counterparty_pubkey, counterparty_primary_pubkey,
  counterparty_ml_dsa_pubkey, established_at, status: 'active' }`
  The client caches the counterparty's cryptographic keys from the connection exchange so
  future session establishments can verify FROST signatures without re-querying the
  directory.

  **Auto-evaluation (M3 default):** in M3 the receiver's client automatically evaluates
  inbound connection requests against the configured policy and responds without agent/owner
  intervention. The agent is notified after the fact via a channel notification
  (ADAPTER-003). M5+ may introduce an "approval required" mode where the owner must
  confirm, but M3 is fully automatic to keep the protocol testable without human-in-the-loop.

  **Retry semantics:** a sender who receives `insufficient` can retry with a new package
  containing more items. There is no state between retries — each connection request is
  independent. The directory does not track retry counts in M3 (rate limiting is M5+).

  **Mutual connections:** connections are symmetric. If A connects to B, B is also
  connected to A. There is no directed/asymmetric connection concept.

# ─── Behavior (EARS) ───────────────────────────────────────
behavior:
  - trigger: "When an authenticated registered client sends `connection_request { target_pubkey, package_cbor }` on its signaling stream"
    action: >
      the directory shall (a) verify sender is registered (`not_registered` if not),
      (b) verify target has an active profile (`target_not_found` if not), (c) verify no
      existing active connection between the two (`already_connected` if yes), (d) relay
      the request to the target's signaling stream as `connection_request_inbound`.
  - trigger: "When the target client receives `connection_request_inbound { from_pubkey, package_cbor }`"
    action: >
      the target client shall (a) validate the connection package per CONNREQ-001,
      (b) retrieve the sender's profile from the directory to cross-check `ml_dsa_pubkey`,
      (c) evaluate the validated package against the local `SignalRequirementPolicy` via
      CONNPOL-001, (d) send `connection_response { from_pubkey, verdict, ... }` to the
      directory based on the policy verdict.
  - trigger: "When the directory receives `connection_response { verdict: 'accept' }`"
    action: >
      the directory shall (a) generate a 16-byte CSPRNG connection_id, (b) create
      connection records for both participants in `DirectoryStore`, (c) push
      `connection_established { counterparty_pubkey, connection_id }` to both clients'
      signaling streams.
  - trigger: "When the directory receives `connection_response { verdict: 'insufficient', unmet_requirements }`"
    action: >
      the directory shall relay `connection_insufficient { target_pubkey,
      unmet_requirements }` to the sender's signaling stream. No connection record is
      created. The sender may retry with a richer package.
  - trigger: "When the directory receives `connection_response { verdict: 'reject', reason }`"
    action: >
      the directory shall relay `connection_rejected { target_pubkey, reason }` to the
      sender's signaling stream. No connection record is created.
  - trigger: "When the target's signaling stream is disconnected when a connection request arrives"
    action: >
      the directory shall queue the inbound request (up to 32 per target, M3 bound).
      On the target's next authenticated signaling stream, queued requests are delivered
      in arrival order. If the queue bound is exceeded, the oldest request is dropped and
      the sender receives `target_unavailable`.
  - trigger: "When a client queries its connections"
    action: >
      the client shall return the list of active connections with `{ connection_id,
      counterparty_pubkey, counterparty_primary_pubkey, established_at, status }`.

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "Two registered agents A and B; B has an `open` policy; no existing connection"
    when: "A sends a connection request to B with a valid package (pseudonym binding only)"
    then: >
      The directory relays to B; B's client auto-evaluates (open → accept); B sends
      `connection_response { verdict: 'accept' }`; the directory creates connection
      records; both A and B receive `connection_established` with matching connection_id;
      both clients' connection lists show the counterparty
    test_type: integration
    component_under_test: client

  - id: AC-002
    given: "Two registered agents A and B; B requires `min_count: 2` endorsements; A's package has 1 endorsement"
    when: "A sends a connection request to B"
    then: >
      B's client evaluates → insufficient; B sends `connection_response { verdict:
      'insufficient', unmet_requirements }`; A receives `connection_insufficient` with
      the unmet requirement detail; no connection is created
    test_type: integration
    component_under_test: client

  - id: AC-003
    given: "Agent A receives `connection_insufficient` with `{ min_count: 2, provided: 1 }`"
    when: "A retries with a new package containing 3 endorsements"
    then: >
      B's client evaluates → accept; connection is established; the retry is a fresh
      independent request with no state carried from the first attempt
    test_type: integration
    component_under_test: client

  - id: AC-004
    given: "Two registered agents A and B; B has a `closed` policy"
    when: "A sends a connection request to B"
    then: >
      B's client evaluates → reject (policy_closed); A receives `connection_rejected
      { reason: 'policy_closed' }`; no connection is created
    test_type: integration
    component_under_test: client

  - id: AC-005
    given: "Agent A and B already have an active connection"
    when: "A sends another connection request to B"
    then: "The directory rejects immediately with `already_connected`; B is not notified"
    test_type: integration
    component_under_test: directory

  - id: AC-006
    given: "Agent A is registered; target pubkey K_X has no profile on the directory"
    when: "A sends a connection request to K_X"
    then: "The directory rejects immediately with `target_not_found`"
    test_type: integration
    component_under_test: directory

  - id: AC-007
    given: "An unregistered client authenticated to the directory"
    when: "The client attempts to send a connection request"
    then: "The directory rejects with `not_registered`"
    test_type: integration
    component_under_test: directory

  - id: AC-008
    given: "Agent A sends a connection request to B; B's signaling stream is disconnected"
    when: "B reconnects and authenticates within the queue bound"
    then: "B receives the queued `connection_request_inbound` on its fresh stream; B evaluates and responds; the flow completes normally"
    test_type: integration
    component_under_test: directory

  - id: AC-009
    given: "An established connection between A and B"
    when: "Both clients query their connection list"
    then: >
      A sees `{ connection_id, counterparty_pubkey: B_pubkey, status: 'active' }`;
      B sees `{ connection_id, counterparty_pubkey: A_pubkey, status: 'active' }`;
      both connection_ids are identical
    test_type: integration
    component_under_test: client

  - id: AC-010
    given: "A connection request whose package has a tampered pseudonym binding (ML-DSA signature invalid)"
    when: "B's client validates the package"
    then: >
      CONNREQ-001 validation marks it `pseudonym_binding_invalid`; CONNPOL-001 returns
      `reject`; B sends `connection_response { verdict: 'reject', reason:
      'pseudonym_binding_invalid' }`; A receives `connection_rejected`
    test_type: integration
    component_under_test: client

  - id: AC-011
    given: "A connection request where A's package endorsement has `target_pubkey` set to a different agent's pubkey"
    when: "B's client validates the package"
    then: "The endorsement is marked `target_mismatch` and does not count; if B's policy requires endorsements, the verdict may be `insufficient`"
    test_type: integration
    component_under_test: client

  - id: AC-012
    given: "256 connection requests from distinct agents to agent B in rapid succession"
    when: "All are processed"
    then: "All 256 connection_ids are unique; each is 16 bytes; no collisions among the established connections"
    test_type: integration
    component_under_test: directory

# ─── Security Invariants ───────────────────────────────────
security_invariants:
  - id: SI-001
    statement: >
      The directory shall never modify the contents of a `connection_request` package
      during relay. The package is opaque to the directory — items are ML-DSA signed by
      the originator and verifiable only by the receiver.
    adversarial_condition: >
      even when the directory could insert, remove, or reorder items — the receiver
      verifies each item's ML-DSA signature independently; any modification is detected
      as a signature failure.
    test_type: integration
    component_under_test: directory

  - id: SI-002
    statement: >
      The directory shall never create a connection record without receiving an explicit
      `connection_response { verdict: 'accept' }` from the target client.
    adversarial_condition: >
      even when a sender's request appears valid and the target's profile has an `open`
      policy — the directory does not evaluate policy itself; it waits for the target
      client's verdict. The policy evaluation is client-side and the directory trusts the
      client's response.
    test_type: integration
    component_under_test: directory

  - id: SI-003
    statement: >
      The directory shall never relay a `connection_request_inbound` to the target when
      the sender is not registered. The sender's registration status is verified before
      any relay occurs.
    adversarial_condition: >
      even when the sender is authenticated (K_local challenge-response passed) but has
      not completed registration — authentication proves key possession; registration
      proves identity establishment with DKG. Both are required.
    test_type: integration
    component_under_test: directory

  - id: SI-004
    statement: >
      Connection IDs shall be 16 bytes from a CSPRNG and shall not collide with existing
      active connections.
    adversarial_condition: >
      even when 256+ connections are created in rapid succession — 128 bits of entropy
      prevents guessing or collision.
    test_type: integration
    component_under_test: directory

# ─── Degraded Behavior ─────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While the target's signaling stream is disconnected when a connection request arrives"
    fallback: >
      the directory queues the request (up to 32 per target). On reconnect the target
      receives all queued requests. If the queue overflows, the oldest request is dropped
      and the sender receives `target_unavailable`. No connection is created.
    test_type: integration
    component_under_test: directory

  - id: DB-002
    condition: "While the sender's signaling stream disconnects after sending `connection_request` but before receiving the response"
    fallback: >
      the directory processes the request normally (relays to target, receives response).
      If the verdict is `accept`, the connection record is created — connection
      establishment is not conditioned on the sender being online for the response.
      The `connection_established` event is queued for delivery on the sender's next
      authenticated signaling stream.
    test_type: integration
    component_under_test: directory

