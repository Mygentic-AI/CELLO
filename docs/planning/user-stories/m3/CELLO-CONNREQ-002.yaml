# ─── Identity ───────────────────────────────────────────────
id: CELLO-CONNREQ-002
domain: Connection Requests
actor: CLIENT
priority: P0
components:
  - client
  - directory

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO Client,
  I want to send a connection request (carrying my connection package) to a target agent
  via the directory, have the receiver evaluate it against their policy — either
  automatically or with agent review — and receive a final accept/reject/insufficient
  response, establishing a persistent connection record on both sides and the directory
  so that two agents can transition from "registered strangers" to "connected peers" with
  cryptographically verified trust signals, and subsequent session establishment (SESSION-006)
  is gated on this accepted connection.

  This is the M3 centerpiece — the protocol interaction that wires together registration
  (REG-001), connection packages (CONNREQ-001), and policy evaluation (CONNPOL-001) into
  a network flow. The directory relays connection packages but cannot modify them (items
  are ML-DSA signed by the originator). The directory stores connection state once
  accepted.

  **ROUND 1 (always happens):**

  1. Agent A calls `cello_request_connection({ target_pubkey, include_endorsements?,
     include_attestations? })`. The call blocks for up to 5 minutes total (spanning
     both rounds if Round 2 occurs).
  2. The client constructs a ConnectionPackage (CONNREQ-001): pseudonym binding +
     selected endorsements/attestations.
  3. The client sends `connection_request { target_pubkey, package_cbor }` on its
     authenticated signaling stream to the directory.
  4. The directory pre-checks: (a) sender is registered, (b) target is registered,
     (c) no existing active connection between the two. Failure reasons:
     `not_registered` | `target_not_found` | `already_connected`. On failure the
     directory responds to the sender immediately and does not contact the target.
  5. The directory fetches the target's `registered_at` and `is_provisional` from its
     store, then relays to the target's signaling stream as
     `connection_request_inbound { from_pubkey, package_cbor, sender_registered_at,
     sender_is_provisional }`.
  6. The target client validates the package (CONNREQ-001: pseudonym binding,
     signatures, expiry, target_pubkey match) and builds
     `DirectoryContext { registered_at: sender_registered_at, is_provisional:
     sender_is_provisional, conversation_count: 0, clean_close_rate: 1.0 }`, then
     calls `evaluateConnectionPackage()` (CONNPOL-001).
  7. Based on `ConnectionReport.verdict`:

     - `auto_accept` (deterministic mode, requirements met or open policy): target
       client sends `connection_response { verdict: 'accept' }` to directory; directory
       creates connection records; pushes `connection_established { counterparty_pubkey,
       connection_id }` to BOTH clients; target fires `onConnectionResult` event.
     - `auto_reject` (closed policy, `pseudonym_binding_invalid`, or `is_provisional`):
       target client sends `connection_response { verdict: 'reject', reason }` to
       directory; directory relays `connection_rejected { target_pubkey, reason }` to
       sender; target fires `onConnectionResult` event.
     - `auto_insufficient` (deterministic mode, requirements not met): target client
       sends `connection_response { verdict: 'insufficient', unmet_requirements }` to
       directory; directory relays `connection_insufficient { target_pubkey,
       unmet_requirements }` to sender; `cello_request_connection` returns
       `{ result: 'insufficient', unmet_requirements }`. The sender can construct a
       new package with more items and retry from Step 1 (fresh request, no state).
     - `pending_agent_review` (inference mode): target client queues the
       ConnectionReport for the agent; fires `onConnectionPendingReview` event; the
       blocking `cello_await_connection_request` call returns the report to the target
       agent.

     **Whitelist fast path:** before calling `evaluateConnectionPackage()`, the target
     client checks its local whitelist. If the sender's pubkey is whitelisted, the
     client immediately sends `connection_response { verdict: 'accept' }` without
     calling the policy engine or notifying the agent. Directory creates connection
     records normally.

  **Agent actions after `pending_agent_review`:**

  - `cello_accept_connection({ connection_request_id })` — target client sends
    `connection_response { verdict: 'accept' }`; directory creates connection records
    and pushes `connection_established` to both; `cello_request_connection` on the
    sender returns `{ result: 'accepted', connection_id }`.
  - `cello_reject_connection({ connection_request_id, reason? })` — target client
    sends `connection_response { verdict: 'reject', reason: 'agent_declined' }`;
    `cello_request_connection` returns `{ result: 'rejected' }`.
  - `cello_request_more_disclosure({ connection_request_id, requested_items[] })` —
    initiates Round 2 (see below).

  **ROUND 2 (only when inference mode + agent chose request_more):**

  8. Target client sends `disclosure_request { connection_request_id, requested_items[]
     }` to directory. `requested_items[]` enumerates everything wanted in ONE message
     (e.g. `[{ type: 'endorsement', min_count: 2 }, { type: 'attestation',
     attestation_type: 'linkedin_profile' }]`). No further rounds after this.
  9. Directory relays to sender's signaling stream as
     `disclosure_request_inbound { from_pubkey, connection_request_id, requested_items[]
     }`.
  10. The sender's `cello_request_connection` is still blocking (within its 5-minute
      total timeout). The client receives `disclosure_request_inbound` and fires
      `onDisclosureRequested`. `cello_request_connection` returns
      `{ result: 'disclosure_requested', connection_request_id, requested_items[] }`,
      unblocking the sender. The sender must now call
      `cello_respond_to_disclosure_request`.
  11. Sender agent calls `cello_respond_to_disclosure_request({ connection_request_id,
      include_endorsements?, include_attestations? })`. May include any subset of the
      requested items, or nothing (declining to disclose further). Client constructs
      `package_v2` and sends `disclosure_response { connection_request_id, package_cbor
      }` to directory.
  12. Directory relays to target's signaling stream as
      `disclosure_response_inbound { connection_request_id, package_cbor }`.
  13. Target client validates `package_v2` and re-runs `evaluateConnectionPackage()`.
      The new ConnectionReport is queued for the agent.
      `cello_await_connection_request` returns the updated report.
  14. Agent calls `cello_accept_connection` OR `cello_reject_connection`. No further
      `cello_request_more_disclosure` — Round 2 is the hard stop. If the agent attempts
      `cello_request_more_disclosure` on a Round 2 report, the client returns
      `{ error: 'max_rounds_reached' }` immediately.

  **Connection state on the directory:**
  `{ connection_id, participants: [A_pubkey, B_pubkey], established_at, status: 'active' }`
  Indexed by both participants' pubkeys. Used by SESSION-006 to gate session
  establishment. Connection IDs are 16-byte CSPRNG (same as session_ids).

  **Connection state on the client:**
  `{ connection_id, counterparty_pubkey, counterparty_primary_pubkey,
  counterparty_ml_dsa_pubkey, established_at, status: 'active' }`
  The client caches the counterparty's cryptographic keys from the connection exchange
  so future session establishments can verify FROST signatures without re-querying the
  directory.

  **5-minute timeout:** `cello_request_connection` blocks for up to 5 minutes total,
  spanning both rounds. If no `connection_established` or final `connection_rejected`
  arrives within 5 minutes of the original call, it returns `{ result: 'timeout' }`.
  The inference path requires an AI agent to read the ConnectionReport scorecard and
  decide — 30 seconds is not sufficient for that decision loop.

  **Round 2 sender-silence timeout:** Once the target client sends `disclosure_request`
  (initiating Round 2), if no `disclosure_response` arrives from the sender within
  2 minutes, the target client sends `connection_response { verdict: 'reject',
  reason: 'disclosure_timeout' }` to the directory and fires `onConnectionResult` with
  `{ result: 'rejected', reason: 'disclosure_timeout' }`. This is a separate timer from
  the overall 5-minute sender timeout — the sender's `cello_request_connection` may still
  be blocking when the target side times out and rejects; the directory will relay
  `connection_rejected` back to the sender, causing `cello_request_connection` to return
  `{ result: 'rejected' }` before the 5-minute overall timeout fires.

  **Mutual connections:** connections are symmetric. If A connects to B, B is also
  connected to A. There is no directed/asymmetric connection concept.

  **Wire frames introduced by this story (added to `@cello/protocol-types`):**
  - `connection_request` (sender → directory)
  - `connection_request_inbound` (directory → target)
  - `connection_response` (target → directory)
  - `connection_established` (directory → both)
  - `connection_rejected` (directory → sender)
  - `connection_insufficient` (directory → sender)
  - `disclosure_request` (target → directory)
  - `disclosure_request_inbound` (directory → sender)
  - `disclosure_response` (sender → directory)
  - `disclosure_response_inbound` (directory → target)

  **CelloClient event additions (integration points for ADAPTER-003):**
  - `onConnectionResult(result: ConnectionEstablishedEvent | ConnectionRejectedEvent)` —
    fires on auto-accept, auto-reject, agent-accept, agent-reject.
  - `onConnectionPendingReview(report: ConnectionReport)` — fires when inference mode
    queues a report for agent review.
  - `onDisclosureRequested(request: DisclosureRequestEvent)` — fires when a Round 2
    disclosure request arrives at the sender.

# ─── Behavior (EARS) ───────────────────────────────────────
behavior:
  - trigger: "When an authenticated registered client sends `connection_request { target_pubkey, package_cbor }` on its signaling stream"
    action: >
      the directory shall (a) verify sender is registered (`not_registered` if not),
      (b) verify target has an active profile (`target_not_found` if not), (c) verify no
      existing active connection between the two (`already_connected` if yes), (d) fetch
      the target's `registered_at` and `is_provisional` from its store, (e) relay the
      request to the target's signaling stream as `connection_request_inbound
      { from_pubkey, package_cbor, sender_registered_at, sender_is_provisional }`.
  - trigger: "When the target client receives `connection_request_inbound`"
    action: >
      the target client shall (a) check the whitelist — if sender is whitelisted,
      immediately send `connection_response { verdict: 'accept' }` without calling the
      policy engine; (b) otherwise validate the connection package per CONNREQ-001,
      (c) build DirectoryContext from `sender_registered_at` and `sender_is_provisional`,
      (d) call `evaluateConnectionPackage()` (CONNPOL-001), (e) act on the
      ConnectionReport verdict: send `connection_response` for auto_accept / auto_reject
      / auto_insufficient, or queue the report and fire `onConnectionPendingReview` for
      pending_agent_review.
  - trigger: "When the directory receives `connection_response { verdict: 'accept' }`"
    action: >
      the directory shall (a) generate a 16-byte CSPRNG connection_id, (b) create
      connection records for both participants in DirectoryStore, (c) push
      `connection_established { counterparty_pubkey, connection_id }` to both clients'
      signaling streams.
  - trigger: "When the directory receives `connection_response { verdict: 'insufficient', unmet_requirements }`"
    action: >
      the directory shall relay `connection_insufficient { target_pubkey,
      unmet_requirements }` to the sender's signaling stream. No connection record is
      created. The sender may retry with a richer package (fresh Round 1 request).
  - trigger: "When the directory receives `connection_response { verdict: 'reject', reason }`"
    action: >
      the directory shall relay `connection_rejected { target_pubkey, reason }` to the
      sender's signaling stream. No connection record is created.
  - trigger: "When the target agent calls `cello_request_more_disclosure({ connection_request_id, requested_items[] })`"
    action: >
      the target client shall (a) verify this is a Round 1 report (not already Round 2),
      returning `{ error: 'max_rounds_reached' }` if not, (b) send `disclosure_request
      { connection_request_id, requested_items[] }` to the directory. The directory
      relays it to the sender's signaling stream as `disclosure_request_inbound
      { from_pubkey, connection_request_id, requested_items[] }`.
  - trigger: "When the sender client receives `disclosure_request_inbound`"
    action: >
      the client shall fire `onDisclosureRequested`, and `cello_request_connection`
      shall return `{ result: 'disclosure_requested', connection_request_id,
      requested_items[] }`, unblocking the sender agent.
  - trigger: "When the sender agent calls `cello_respond_to_disclosure_request({ connection_request_id, include_endorsements?, include_attestations? })`"
    action: >
      the client shall construct a new ConnectionPackage (package_v2) with the
      specified items, send `disclosure_response { connection_request_id, package_cbor }`
      to the directory. The directory relays it to the target's signaling stream as
      `disclosure_response_inbound { connection_request_id, package_cbor }`.
  - trigger: "When the target client receives `disclosure_response_inbound`"
    action: >
      the target client shall validate package_v2 per CONNREQ-001, re-run
      `evaluateConnectionPackage()`, queue the new ConnectionReport, and return it via
      `cello_await_connection_request`. The agent then calls `cello_accept_connection`
      or `cello_reject_connection`; no further `cello_request_more_disclosure` is
      permitted.
  - trigger: "When 5 minutes elapse from the original `cello_request_connection` call without a `connection_established` or final `connection_rejected` arriving at the sender"
    action: >
      the client shall return `{ result: 'timeout' }` from `cello_request_connection`.
      No connection record is created.
  - trigger: "When 2 minutes elapse from the target client sending `disclosure_request` (Round 2) without receiving `disclosure_response` from the sender"
    action: >
      the target client shall send `connection_response { verdict: 'reject', reason:
      'disclosure_timeout' }` to the directory. The directory relays
      `connection_rejected { target_pubkey, reason: 'disclosure_timeout' }` to the
      sender's signaling stream. `cello_request_connection` on the sender returns
      `{ result: 'rejected', reason: 'disclosure_timeout' }`. No connection record is
      created. The target fires `onConnectionResult` with the rejection.
  - trigger: "When a `connection_established`, `connection_rejected`, or `connection_insufficient` event is delivered to a client"
    action: >
      the client shall invoke the appropriate CelloClient event callback
      (`onConnectionResult` for established/rejected; the caller of
      `cello_request_connection` receives the structured result). These callbacks are
      the integration points for adapters (ADAPTER-003) to populate their event queues.

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "Two registered agents A and B (separate processes, real libp2p + real directory); B has an `open` policy; no existing connection"
    when: "A calls `cello_request_connection({ target_pubkey: B })` with a valid package (pseudonym binding only)"
    then: >
      `cello_request_connection` returns `{ result: 'accepted', connection_id }`;
      AND querying B's client connection list (from B's process, not A's) returns an
      entry with the identical connection_id — proving `connection_established` was
      delivered to B's signaling stream, not injected in-process;
      AND the directory's connection record shows both A_pubkey and B_pubkey as
      participants with status 'active' — queryable from the directory process independently
      of what either client reports
    test_type: e2e
    component_under_test: client, directory

  - id: AC-002
    given: "Two registered agents A and B (separate processes); B has a `closed` policy"
    when: "A calls `cello_request_connection({ target_pubkey: B })`"
    then: >
      `cello_request_connection` returns `{ result: 'rejected' }`;
      AND the directory's connection store has no record for the A–B pair (queryable
      from the directory process);
      AND B's signaling handler received a `connection_request_inbound` frame and sent
      `connection_response { verdict: 'reject' }` back — proven by the directory having
      received and relayed that verdict (the directory only sends `connection_rejected`
      to A after receiving the target's explicit `connection_response`, never on its own)
    test_type: e2e
    component_under_test: client, directory

  - id: AC-003
    given: "Two registered agents A and B (separate processes); B has inference mode policy; B's agent calls `cello_request_more_disclosure` requesting 2 endorsements; A responds with 2 valid endorsements"
    when: "B re-evaluates the disclosure response and calls `cello_accept_connection`"
    then: >
      `cello_request_connection` returns `{ result: 'accepted', connection_id }`;
      AND B's `cello_await_connection_request` (running in B's process) returned the
      updated Round 2 ConnectionReport with `is_round_2: true` before the accept call —
      proving `disclosure_response_inbound` was delivered to B's signaling stream;
      AND the directory's connection store shows the A–B connection as 'active' with a
      connection_id matching what both clients hold — cross-process state that could only
      exist if all three wire frames (disclosure_request → disclosure_response →
      connection_established) traversed the directory's signaling handlers
    test_type: e2e
    component_under_test: client, directory

  - id: AC-004
    given: "Two registered agents A and B (separate processes); B has inference mode policy; B calls `cello_request_more_disclosure`; A responds with 0 additional endorsements"
    when: "B re-evaluates and calls `cello_reject_connection`"
    then: >
      `cello_request_connection` returns `{ result: 'rejected' }`;
      AND the directory's connection store has no record for the A–B pair;
      AND B's process received `disclosure_response_inbound` on its signaling stream
      (the empty package_v2 arrived over the wire) — proven by B's client having
      called `evaluateConnectionPackage()` a second time (the updated ConnectionReport
      with `is_round_2: true` was available to B's agent before the reject call)
    test_type: e2e
    component_under_test: client, directory

  - id: AC-005
    given: "Agent A is registered; target pubkey K_X has no profile on the directory"
    when: "A calls `cello_request_connection({ target_pubkey: K_X })`"
    then: "The directory rejects immediately with `target_not_found`; B is not contacted"
    test_type: e2e
    component_under_test: directory

  - id: AC-006
    given: "Agent A and B already have an active connection"
    when: "A calls `cello_request_connection({ target_pubkey: B })` again"
    then: "The directory rejects immediately with `already_connected`; B is not notified; no duplicate connection record is created"
    test_type: e2e
    component_under_test: directory

  - id: AC-007
    given: "An unregistered client authenticated to the directory"
    when: "The client attempts to send `connection_request`"
    then: "The directory rejects with `not_registered`; the target is not contacted"
    test_type: e2e
    component_under_test: directory

  - id: AC-008
    given: "Agent B has A's pubkey in its local whitelist"
    when: "A sends a connection request to B"
    then: >
      `connection_established` is pushed to both clients; `cello_request_connection`
      returns `{ result: 'accepted', connection_id }`;
      AND no `onConnectionPendingReview` event fires on B's process (the policy engine
      was bypassed — proven by B's agent never receiving a `pending_review` notification);
      AND `evaluateConnectionPackage()` call count on B's process is zero for this
      request (assert via a test-injectable counter, not a result-shape check)
    test_type: e2e
    component_under_test: client, directory

  - id: AC-009
    given: "A sends a connection request to B; B is online but the test harness suppresses B's `connection_response` (simulating a hung evaluation)"
    when: "5 minutes elapse from the original `cello_request_connection` call without a final response"
    then: >
      `cello_request_connection` returns `{ result: 'timeout' }`; no connection record
      is created; any late-arriving `connection_response` from B is discarded by the
      directory
    test_type: e2e
    component_under_test: client, directory

  - id: AC-010
    given: "B has inference mode policy; B's agent has already called `cello_request_more_disclosure` (Round 2 in progress); B's agent attempts to call `cello_request_more_disclosure` again on the same request"
    when: "The client processes the second `cello_request_more_disclosure` call"
    then: "The client returns `{ error: 'max_rounds_reached' }` immediately; no `disclosure_request` is sent to the directory"
    test_type: unit
    component_under_test: client

  - id: AC-011
    given: "A connection request whose package has a tampered pseudonym binding (ML-DSA signature invalid); A and B are separate processes"
    when: "B's client receives and validates the package"
    then: >
      `cello_request_connection` returns `{ result: 'rejected' }`;
      AND the directory's connection store has no record for the A–B pair;
      AND the directory received `connection_response { verdict: 'reject', reason:
      'pseudonym_binding_invalid' }` from B's signaling stream — proven by the directory
      having sent `connection_rejected` to A (the directory only sends this after
      receiving an explicit verdict frame from the target; it cannot generate this on its own)
    test_type: e2e
    component_under_test: client

  - id: AC-012
    given: "An established connection between A and B (separate processes)"
    when: "Both clients query their connection list AND the directory is queried independently"
    then: >
      A sees `{ connection_id, counterparty_pubkey: B_pubkey, status: 'active' }`;
      B sees `{ connection_id, counterparty_pubkey: A_pubkey, status: 'active' }`;
      both connection_ids are identical;
      AND the directory's connection record for this connection_id names both pubkeys —
      three independent sources (A's process, B's process, directory process) hold the
      same connection_id, which is only possible if `connection_established` was delivered
      via the directory's signaling streams to both clients
    test_type: e2e
    component_under_test: client

  - id: AC-013
    given: "B has inference mode policy; A calls `cello_request_connection`; B calls `cello_request_more_disclosure`; `cello_request_connection` returns `{ result: 'disclosure_requested', ... }` unblocking A"
    when: "A calls `cello_respond_to_disclosure_request({ connection_request_id, include_endorsements: [...] })`"
    then: >
      The client constructs package_v2 and sends `disclosure_response` to the directory;
      the directory relays `disclosure_response_inbound` to B's signaling stream;
      B's client validates package_v2 and re-runs `evaluateConnectionPackage()`
    test_type: e2e
    component_under_test: client, directory

  - id: AC-014
    given: "A sends `disclosure_response` with an empty item set (declining to disclose further)"
    when: "B's client receives and evaluates the empty package_v2"
    then: >
      `evaluateConnectionPackage()` is called with only the pseudonym binding; the
      resulting ConnectionReport is queued for B's agent; B's agent can still call
      `cello_accept_connection` or `cello_reject_connection`
    test_type: e2e
    component_under_test: client

  - id: AC-015
    given: "The directory receives a `connection_response { verdict: 'accept' }` from B"
    when: "The directory creates the connection record"
    then: >
      The connection_id is exactly 16 bytes from a CSPRNG; querying the directory
      confirms `{ connection_id, participants: [A_pubkey, B_pubkey], status: 'active' }`
      indexed by both pubkeys
    test_type: unit
    component_under_test: directory

  - id: AC-016
    given: "256 simultaneous connection requests from distinct agents to agent B in rapid succession, all accepted"
    when: "All 256 connection records are created"
    then: "All 256 connection_ids are unique; each is exactly 16 bytes; no collisions"
    test_type: e2e
    component_under_test: directory

  - id: AC-017
    given: "B has inference mode policy; B's agent calls `cello_request_more_disclosure` (Round 2 begins); A's `cello_request_connection` has returned `{ result: 'disclosure_requested' }` but A's agent never calls `cello_respond_to_disclosure_request`"
    when: "2 minutes elapse from the moment B sent `disclosure_request` to the directory"
    then: >
      B's client sends `connection_response { verdict: 'reject', reason: 'disclosure_timeout' }`
      to the directory; the directory relays `connection_rejected { reason: 'disclosure_timeout' }`
      to A's signaling stream; no connection record is created; B fires `onConnectionResult`
      with the rejection; if A subsequently calls `cello_respond_to_disclosure_request`,
      the client returns an error (the request is no longer pending)
    test_type: e2e
    component_under_test: client, directory

# ─── Security Invariants ───────────────────────────────────
security_invariants:
  - id: SI-001
    statement: >
      The directory shall never modify the contents of a connection package during relay.
      Packages are opaque to the directory — every item is ML-DSA signed by the
      originator and independently verifiable by the receiver.
    adversarial_condition: >
      even when the directory could insert, remove, or reorder items — the receiver
      verifies each item's ML-DSA signature independently; any modification produces a
      signature failure.
    test_type: e2e
    component_under_test: directory

  - id: SI-002
    statement: >
      The directory shall never create a connection record without receiving an explicit
      `connection_response { verdict: 'accept' }` from the target client (or the
      whitelist fast-path producing the same frame). The directory does not evaluate
      policy itself.
    adversarial_condition: >
      even when the sender's request appears valid and the target's profile has an `open`
      policy — policy evaluation is client-side; the directory waits for the target
      client's verdict.
    test_type: e2e
    component_under_test: directory

  - id: SI-003
    statement: >
      The directory shall never relay `connection_request_inbound` to a target when the
      sender is not registered. Authentication (K_local challenge-response) alone is
      insufficient — registration (DKG completion) is also required.
    adversarial_condition: >
      even when the sender is authenticated but has not completed registration — both
      conditions are verified before any relay occurs.
    test_type: e2e
    component_under_test: directory

  - id: SI-004
    statement: >
      Connection IDs shall be 16 bytes from a CSPRNG and shall not collide with any
      existing active connection.
    adversarial_condition: >
      even under high-volume concurrent connection creation — 128 bits of entropy
      prevents guessing or collision.
    test_type: unit
    component_under_test: directory

  - id: SI-005
    statement: >
      The target client shall never permit a third `cello_request_more_disclosure` call
      on the same connection_request_id. Round 2 is the final round.
    adversarial_condition: >
      even when the agent calls `cello_request_more_disclosure` after already being in
      Round 2 — the client returns `{ error: 'max_rounds_reached' }` and sends nothing
      to the directory.
    test_type: unit
    component_under_test: client

# ─── Degraded Behavior ─────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While the target's signaling stream is disconnected when a connection request arrives"
    fallback: >
      The directory queues the request (up to 32 per target). On reconnect the target
      receives all queued requests in arrival order. If the queue bound is exceeded, the
      oldest request is dropped and the sender receives `target_unavailable`. No
      connection is created.
    test_type: e2e
    component_under_test: directory

  - id: DB-002
    condition: "While the sender's signaling stream disconnects after sending `connection_request` but before receiving the response"
    fallback: >
      The directory processes the request normally (relays to target, receives response).
      If the verdict is `accept`, the connection record is created — connection
      establishment is not conditioned on the sender being online for the response.
      `connection_established` is queued for delivery on the sender's next authenticated
      signaling stream (up to 32 pending events per client; if exceeded, oldest is
      dropped — the connection record still exists and `cello_list_connections` will
      show it on next query).
    test_type: e2e
    component_under_test: directory

  - id: DB-003
    condition: "While the directory is unreachable when the target client attempts to cross-check the sender's `ml_dsa_pubkey` against the directory profile during inbound request validation"
    fallback: >
      The target client accepts the pseudonym binding's embedded `ml_dsa_pubkey` as the
      verification key for this request without the cross-check. The connection is
      established with a `profile_unchecked: true` flag in the local record. On the next
      directory interaction the client performs the deferred cross-check; if the pubkey
      does not match the directory profile, the connection is flagged but not
      retroactively revoked (the ML-DSA signature on the pseudonym binding was valid at
      acceptance time).
    test_type: e2e
    component_under_test: client

