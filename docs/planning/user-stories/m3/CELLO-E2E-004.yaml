# ─── Identity ───────────────────────────────────────────────
id: CELLO-E2E-004
domain: End-to-End
actor: AGENT
priority: P0
components:
  - adapter-claude-code
  - client
  - directory
  - relay
  - crypto

# ─── Intent ─────────────────────────────────────────────────
story: >
  As a milestone sign-off,
  I want two real Claude Code agents — starting as complete strangers — to register
  with the directory, establish a connection, initiate a FROST-signed session,
  exchange messages through the relay, and seal the session — all as separate OS
  processes communicating over real network connections —
  so that M3 is provably done: the full connection-gated session flow works
  end-to-end with no shared memory shortcuts.

  This story is the M3 finish line. All M3 stories (REG-001, CONNPOL-001,
  CONNREQ-001, CONNREQ-002, SESSION-006, MCP-003, ADAPTER-003, CRYPTO-004)
  are prerequisites. M3 is not closed until this story's acceptance criteria
  are manually verified and signed off.

  **What's different from E2E-002 (M2):**
  - M2: Agents were pre-known to the directory; session establishment was the entry point
  - M3: Agents start unregistered; they must register (DKG), request and accept a
    connection, then initiate a session — the connection gate is the new boundary

  **Setup (all separate OS processes):**
  - Process 1: Relay node (`pnpm --filter @cello/relay run start`)
  - Process 2: Directory node (`pnpm --filter @cello/directory run start`)
  - Process 3: Agent A — Claude Code session with M3-aware `cello-mcp` binary
  - Process 4: Agent B — same setup, independent Claude Code session, distinct key file
  - Agents configured with `CELLO_DIRECTORY_MULTIADDR` pointing to Process 2
  - Relay configured with `CELLO_DIRECTORY_PUBKEY` pointing to directory's signing key

  **Flow being verified:**

  ```
  Agent A registers → DKG over /cello/frost/1.0.0 → primary_pubkey assigned
  Agent B registers → DKG over /cello/frost/1.0.0 → primary_pubkey assigned
  A requests connection with B → directory routes to B's signaling stream
  B accepts (open policy) → connection established
  A initiates session → FROST ceremony → session_id assigned
  B awaits session → receives SessionAssignment
  A sends message → relay notarizes → B receives
  B sends reply → relay notarizes → A receives
  A closes session → bilateral seal → FROST-signed sealed root
  ```

