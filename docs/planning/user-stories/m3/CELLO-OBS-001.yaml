references:
  depends_on:
    - CELLO-REG-001       # DKG ceremony events require real multi-round DKG
    - CELLO-CONNREQ-002   # Connection negotiation events
  protocol_map: "Observability"
  milestone_writeups:
    - "M1-session-layer"
    - "M2-frost-threshold-layer"
  notes: >
    This story has no dependency on CONNPOL-001, SESSION-006, MCP-003, or ADAPTER-003.
    It touches only the relay and directory node internals.
    Implementation order: directory startup + auth events first (smallest diff),
    then FROST events (requires real DKG from REG-001 to be observable), then
    connection events (requires CONNREQ-002), then relay lifecycle events.
    AC-011 depends on REG-001 and CONNREQ-002 being implemented and passing.
