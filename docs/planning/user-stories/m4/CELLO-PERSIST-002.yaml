# ─── Identity ───────────────────────────────────────────────
id: CELLO-PERSIST-002
domain: Persistence
milestone: M4
actor: DIR
priority: P0
components:
  - directory

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the Directory Node,
  I want a Docker Compose Postgres container and Flyway migration tooling
  that brings any environment to the correct schema state,
  so that the local development loop requires no cloud infrastructure
  and production RDS is always in identical schema state to local.

# ─── Architecture note: Flyway is infrastructure, not application code ──────
# Flyway runs as a Docker Compose service (local) or CodeBuild step (dev/prod).
# The directory process never shells out to Flyway. It cannot intercept Flyway's
# output and must not attempt to emit migration.applied / migration.skipped /
# migration.failed / migration.checksum.mismatch as CELLO Logger events —
# those belong to the CI/CD log stream (CodeBuild / CloudWatch), not the
# application observability path.
#
# The ops-critical alarm path is preserved differently: the directory process
# queries flyway_schema_history at startup and refuses to start against a stale
# schema (see AC-010 and migration.out.of.date below). A future /cello-review
# must not re-flag the four Flyway-internal events as missing from application
# code — they are deliberately out of scope here.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When a developer runs docker compose up"
    action: "a Postgres 18 container starts on port 5433 (to coexist with a
      local Postgres instance) with database cello_dev and is ready to accept
      connections within 10 seconds"

  - trigger: "When flyway migrate is run against the local container"
    action: "Flyway applies all pending versioned migration files from
      packages/directory/db/migrations/ in V{n}__{description}.sql order,
      records each in flyway_schema_history, and exits with code 0 on success
      or code 1 on failure; migration files live in the directory package
      because they define the directory schema"

  - trigger: "When the directory service starts with CELLO_ENV=local"
    action: "the service queries flyway_schema_history to determine the current
      applied schema version; if no migrations have been applied, or if the
      applied version is behind the latest migration file on disk, the service
      exits with code 1 and logs migration.out.of.date before accepting any
      connections"

  - trigger: "When a developer runs the seed script against the local container"
    action: "the database is wiped and restored to a known baseline state;
      the seed is gated on CELLO_ENV=local and exits 1 otherwise"

  - trigger: "When a test runs"
    action: "the test wraps its database operations in a transaction that rolls
      back on completion — it never relies on seed data and never leaves
      state in the database after the test"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "A developer machine with Docker installed"
    when: "docker compose up is run from the repo root"
    then: "a cello-postgres:18.4 container starts on port 5433, cello_dev
      database is created, and SELECT 1 returns successfully"
    test_type: integration
    component_under_test: directory

  - id: AC-002
    given: "The local Postgres container is running with an empty cello_dev
      database"
    when: "docker compose run --rm flyway is run"
    then: "all migration files in packages/directory/db/migrations/ are applied
      in version order; flyway_schema_history contains one SUCCESS row per
      migration file; the command exits with code 0"
    test_type: integration
    component_under_test: directory

  - id: AC-003
    given: "flyway migrate has been run once successfully"
    when: "flyway migrate is run again with no new migration files"
    then: "Flyway detects no pending migrations and exits with code 0 without
      modifying any table — idempotent; the row count in flyway_schema_history
      is unchanged"
    test_type: integration
    component_under_test: directory

  - id: AC-004
    given: "The local Postgres container is running with migrations applied"
    when: "a migration file on disk is modified after being applied"
    then: "flyway validate exits with code 1, indicating checksum mismatch —
      this is the mechanism by which tampered migrations are detected; the
      directory service's migration.out.of.date guard (AC-010) is a separate
      version-count check, not a checksum check; checksum enforcement is
      Flyway's responsibility"
    test_type: integration
    component_under_test: directory

  - id: AC-005
    given: "N/A — deferred"
    when: "N/A"
    then: "Seed data baseline scenarios (registered operator, unregistered
      operator, active session, sealed session) are deferred to PERSIST-003
      because the required tables (agents, sessions, hash_chain, conversation_seals)
      do not exist until that story's migrations are applied. AC-005 is
      explicitly out of scope for PERSIST-002 and will be implemented as part
      of PERSIST-003."
    test_type: integration
    component_under_test: directory

  - id: AC-006
    given: "A Vitest test opens a database connection and inserts a row"
    when: "the test completes (pass or fail)"
    then: "the inserted row is not present in the database after the test —
      verified by a subsequent query in a separate connection outside the
      test transaction"
    test_type: integration
    component_under_test: directory

  - id: AC-007
    given: "The local Postgres container is running with migrations applied"
    when: "flyway validate is run"
    then: "Flyway reports all applied migrations as valid — their checksums
      match the files on disk"
    test_type: integration
    component_under_test: directory

  - id: AC-008
    given: "A developer runs pnpm run db:migrate in the directory package"
    when: "the command completes"
    then: "it produces the same result as running docker compose run --rm flyway
      directly — the package.json script is the single entry point developers
      use; verified by asserting the script value in package.json equals
      'docker compose run --rm flyway'"
    test_type: unit
    component_under_test: directory

  - id: AC-009
    given: "The docker-compose.yml for the local Postgres container"
    when: "the container starts"
    then: "pgaudit is loaded via shared_preload_libraries='pgaudit' and
      pgaudit.log='all'; verified by SHOW shared_preload_libraries returning
      a value containing 'pgaudit', and by SELECT extname FROM pg_extension
      WHERE extname='pgaudit' returning a row — extension presence confirms
      the audit hook is registered; container log inspection is not required
      for this AC"
    test_type: integration
    component_under_test: directory

  - id: AC-010
    given: "CELLO_ENV=local and the Docker Compose Postgres container is running"
    when: "the directory service starts"
    then: "the service queries flyway_schema_history for the maximum
      installed_rank; if no rows exist (migrations never run) or if the
      installed_rank is less than the number of migration files on disk, the
      service logs migration.out.of.date at ERROR with { appliedVersion,
      expectedVersion, env } and exits with code 1 before accepting any
      connections"
    test_type: integration
    component_under_test: directory

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "Migration files shall never be modified after they have been
      applied to any environment"
    adversarial_condition: "even to fix a bug in an already-applied migration —
      a new migration file must be written instead; Flyway's checksum validation
      shall detect any modification to an applied file and refuse to proceed"
    test_type: integration
    component_under_test: directory

  - id: SI-002
    statement: "The seed script shall only be runnable against CELLO_ENV=local"
    adversarial_condition: "even when pointed at a cloud or production connection
      string — the seed script shall check CELLO_ENV and exit with code 1 if
      it is not 'local'"
    test_type: unit
    component_under_test: directory

# ─── Observability ──────────────────────────────────────────
# NOTE: migration.applied, migration.skipped, migration.failed, and
# migration.checksum.mismatch are deliberately NOT emitted by the directory
# process. Flyway runs as infrastructure (Docker Compose locally, CodeBuild in
# dev/prod). Its output belongs to the CI/CD log stream, not the CELLO Logger.
# The ops-critical alarm path is covered by migration.out.of.date below.
observability:
  error_events:
    - name: migration.out.of.date
      level: error
      trigger: "the directory service detects at startup that the applied schema
        version is behind the expected version"
      context_fields: [appliedVersion, expectedVersion, env]

  alarms:
    - condition: "migration.out.of.date fires at any time"
      fires_to: ops-critical

