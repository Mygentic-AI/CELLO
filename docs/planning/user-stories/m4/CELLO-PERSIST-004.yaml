# ─── Identity ───────────────────────────────────────────────
id: CELLO-PERSIST-004
domain: Persistence
milestone: M4
actor: DIR
priority: P0
components:
  - directory

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the Directory Node,
  I want every INSERT into a protected table to extend a running SHA-256
  hash chain,
  so that any modification, deletion, or insertion gap is cryptographically
  detectable — even by a database superuser — independent of RLS enforcement.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When the directory service performs an INSERT into any
      hash-chained table"
    action: "the directory service shall fetch the chain_hash of the most
      recent row in that table, compute chain_hash = SHA-256(record_contents
      || previous_chain_hash), and include the computed chain_hash in the
      INSERT — the chain computation is application-layer logic, not a
      database trigger"

  - trigger: "When the first row is inserted into a hash-chained table"
    action: "the previous_chain_hash is the well-known genesis value
      SHA-256(b'CELLO_CHAIN_GENESIS') — the same constant for all tables
      and all environments"

  - trigger: "When a chain verification pass is run against a table"
    action: "the verifier shall fetch all rows ordered by insertion sequence,
      recompute each chain_hash from scratch using record_contents and the
      previous row's chain_hash, and report any row where the stored
      chain_hash does not match the recomputed value"

  - trigger: "If a row is modified, deleted, or inserted out of sequence by
      any means (including superuser)"
    action: "the chain verification pass shall detect and report the break at
      the first diverging row"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "An empty hash-chained table with no rows"
    when: "the first row is inserted"
    then: "the row's chain_hash equals SHA-256(serialize(row_contents) ||
      SHA-256(b'CELLO_CHAIN_GENESIS')); verified by recomputing the value
      independently in the test and asserting equality"
    test_type: unit
    component_under_test: directory

  - id: AC-002
    given: "A hash-chained table with N rows"
    when: "a new row is inserted"
    then: "the new row's chain_hash equals SHA-256(serialize(row_contents) ||
      chain_hash_of_row_N); the chain_hash of row N is unchanged"
    test_type: unit
    component_under_test: directory

  - id: AC-003
    given: "A hash-chained table with 10 rows, all with correct chain_hashes"
    when: "the chain verification pass is run"
    then: "the verifier reports 0 breaks and exits with code 0"
    test_type: integration
    component_under_test: directory

  - id: AC-004
    given: "A hash-chained table with 10 rows where row 5's record_contents
      has been modified directly via a superuser UPDATE"
    when: "the chain verification pass is run"
    then: "the verifier reports a break at row 5 — the stored chain_hash of
      row 5 no longer matches the recomputed value — and reports all
      subsequent rows as unverifiable; the verifier exits with code 1"
    test_type: integration
    component_under_test: directory

  - id: AC-005
    given: "A hash-chained table with 10 rows where row 7 has been deleted
      directly via a superuser DELETE"
    when: "the chain verification pass is run"
    then: "the verifier detects the sequence gap at position 7 and reports
      a chain break; it exits with code 1"
    test_type: integration
    component_under_test: directory

  - id: AC-006
    given: "Two separate directory service instances connected to the same
      database"
    when: "both attempt to INSERT a row into the same hash-chained table
      concurrently"
    then: "both INSERTs succeed and the chain is never forked; the
      serialization mechanism is pg_advisory_xact_lock(hashtext(tableName))
      acquired inside a transaction before reading the previous chain_hash —
      SELECT FOR UPDATE cannot be used because cello_service has only
      INSERT+SELECT privileges and FOR UPDATE requires UPDATE privilege which
      RLS blocks; whichever instance acquires the advisory lock first reads
      the current chain tip and inserts its row; the second instance waits
      on the lock, then reads the updated chain tip after the first commits,
      and inserts its row in turn; the final table state has exactly two new
      rows in the correct chain order with no forked hashes"
    test_type: integration
    component_under_test: directory

  - id: AC-007
    given: "The directory service is running"
    when: "a chain verification pass is triggered (at startup or on demand)"
    then: "db.chain.verified is logged at INFO with { tableName, rowCount,
      durationMs }; if a break is found, db.chain.break.detected is logged
      at ERROR with { tableName, breakAtSequence, storedHash, recomputedHash }"
    test_type: unit
    component_under_test: directory

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The chain_hash computation shall use SHA-256 with domain
      separation — the genesis constant and the concatenation order
      (record_contents || previous_hash) are fixed and not configurable"
    adversarial_condition: "even when a developer attempts to change the
      hash order or genesis constant to fix a test — any such change breaks
      chain compatibility with all existing rows and must be rejected"
    test_type: unit
    component_under_test: directory

  - id: SI-002
    statement: "The chain_hash of an inserted row shall never be accepted
      from an external caller — it is always computed by the directory
      service at INSERT time"
    adversarial_condition: "even when an API caller includes a chain_hash
      field in their request payload — the directory service ignores it
      and recomputes from the previous row"
    test_type: unit
    component_under_test: directory

  - id: SI-003
    statement: "Concurrent INSERTs shall never produce a forked chain —
      two rows with the same previous_chain_hash"
    adversarial_condition: "even under high concurrency with multiple
      directory service instances writing to the same table"
    test_type: integration
    component_under_test: directory

# ─── Degraded Behavior ──────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While the chain verification pass detects a break"
    fallback: "the directory shall log db.chain.break.detected at ERROR,
      fire the ops-critical alarm, and continue serving read requests —
      it shall not halt or refuse writes, as halting would deny service
      based on a potentially stale or partial verification; investigation
      is an operator responsibility"
    test_type: integration
    component_under_test: directory

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: db.chain.verified
      level: info
      trigger: "a chain verification pass completes with no breaks found"
      context_fields: [tableName, rowCount, durationMs]
      correlationId: false

  error_events:
    - name: db.chain.break.detected
      level: error
      trigger: "a chain verification pass finds a break"
      context_fields: [tableName, breakAtSequence, storedHash, recomputedHash]

  alarms:
    - condition: "db.chain.break.detected fires at any time"
      fires_to: ops-critical

