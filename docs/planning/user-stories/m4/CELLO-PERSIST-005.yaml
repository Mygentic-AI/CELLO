# ─── Identity ───────────────────────────────────────────────
id: CELLO-PERSIST-005
domain: Persistence
milestone: M4
actor: DIR
priority: P0
components:
  - directory

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the Directory Node,
  I want K_server_X shares encrypted at rest using envelope encryption
  via the EnvelopeKeyProvider interface,
  so that a compromised database does not expose any agent's server-side
  key share, and the KMS master key is only ever held in memory.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When the directory service starts"
    action: "the composition root shall invoke EnvelopeKeyProvider to unwrap
      the master key into memory; the unwrapped key is held in process memory
      only and is never written to disk, logged, or returned in any response"

  - trigger: "When a new K_server_X share is created for an agent"
    action: "the directory service shall invoke EnvelopeKeyProvider.encrypt()
      with the share bytes before any database INSERT; only the ciphertext is
      written to the agent_key_shares table"

  - trigger: "When the directory service needs to use a K_server_X share"
    action: "the directory service shall invoke EnvelopeKeyProvider.decrypt()
      on the ciphertext retrieved from the database; the plaintext share is
      used in-process and not persisted"

  - trigger: "When CELLO_ENV=local"
    action: "LocalEnvelopeKeyProvider performs AES-256-GCM encryption and
      decryption in-process using the key from DEV_ENVELOPE_KEY; no KMS
      call is made"

  - trigger: "When CELLO_ENV=dev"
    action: "KmsEnvelopeKeyProvider wraps and unwraps using the AWS KMS dev
      master key ARN from Secrets Manager; the KMS key never leaves AWS"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "CELLO_ENV=local and DEV_ENVELOPE_KEY is set"
    when: "EnvelopeKeyProvider.encrypt() is called with 32 bytes of share
      material and a keyId"
    then: "the returned ciphertext is not equal to the plaintext, is at least
      32 bytes long, and EnvelopeKeyProvider.decrypt(ciphertext, keyId)
      returns the original 32 bytes exactly"
    test_type: unit
    component_under_test: directory

  - id: AC-002
    given: "A K_server_X share has been encrypted and stored in agent_key_shares"
    when: "the raw bytes in agent_key_shares.encrypted_share are inspected
      directly via a database query"
    then: "the bytes do not match the original plaintext share — the stored
      value is ciphertext, not plaintext"
    test_type: integration
    component_under_test: directory

  - id: AC-003
    given: "A K_server_X share has been encrypted and stored"
    when: "the directory service retrieves and decrypts the share via
      EnvelopeKeyProvider.decrypt()"
    then: "the decrypted bytes equal the original plaintext share exactly"
    test_type: integration
    component_under_test: directory

  - id: AC-004
    given: "A K_server_X share ciphertext is in the database"
    when: "decryption is attempted with a different keyId"
    then: "EnvelopeKeyProvider.decrypt() throws a decryption error and does
      not return any bytes — wrong key produces no partial plaintext"
    test_type: unit
    component_under_test: directory

  - id: AC-005
    given: "The directory service is running with CELLO_ENV=local"
    when: "the service handles an agent registration that creates a K_server_X
      share"
    then: "key.encrypted is logged at INFO with { keyId, agentId } — no share
      bytes, no key material appears in any log output during or after the
      operation"
    test_type: integration
    component_under_test: directory

  - id: AC-006
    given: "CELLO_ENV=local and DEV_ENVELOPE_KEY is not set"
    when: "the directory service starts"
    then: "the process exits with code 1 and logs adapter.config.missing with
      { missingKey: 'DEV_ENVELOPE_KEY', env: 'local' } before accepting any
      connections — no fallback to a hardcoded key"
    test_type: unit
    component_under_test: directory

  - id: AC-007
    given: "The EnvelopeKeyProvider interface is defined in packages/interfaces/;
      it includes a rotate(keyId: string): Promise<void> method alongside
      encrypt() and decrypt(); LocalEnvelopeKeyProvider retains the old key
      version in memory during a rotation window to allow decryption of
      shares written under the old key"
    when: "EnvelopeKeyProvider.rotate() is called and then decrypt() is called
      with a ciphertext encrypted under the old key"
    then: "key.rotation.initiated is logged at INFO with { keyId }; decrypt()
      returns the correct plaintext — the rotation window allows coexistence
      of old and new key versions; a new encrypt() call uses the new key;
      the model is dual-key coexistence, not immediate re-encryption of
      existing shares"
    test_type: unit
    component_under_test: directory

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "K_server_X share plaintext shall never be written to the
      database, any log output, any error message, or any network response"
    adversarial_condition: "even when the directory service encounters an error
      during encryption — it shall log the error event with keyId only, never
      with the plaintext share bytes"
    test_type: unit
    component_under_test: directory

  - id: SI-002
    statement: "The unwrapped master key shall never be written to disk,
      included in a log event, or returned in any response"
    adversarial_condition: "even when an unhandled exception occurs after the
      key is unwrapped at startup — the exception handler must not serialize
      process memory or the key object into logs"
    test_type: unit
    component_under_test: directory

  - id: SI-003
    statement: "An INSERT into agent_key_shares shall be rejected if the
      ciphertext output fails a structural validity check — the directory
      service shall verify that encryption produced output of the expected
      length (plaintext_length + 28 bytes for a 12-byte nonce + 16-byte
      AES-256-GCM auth tag) and that the output is not the zero-length
      empty buffer"
    adversarial_condition: "even when EnvelopeKeyProvider.encrypt() returns
      a no-op implementation that outputs garbage or an empty buffer — the
      structural length check catches a broken provider before any INSERT;
      note: AES-256-GCM output is structurally longer than input by exactly
      nonce_length + tag_length (28 bytes), so an equality check against the
      plaintext is structurally impossible and must not be used as the guard"
    test_type: unit
    component_under_test: directory

  - id: SI-004
    statement: "The LocalEnvelopeKeyProvider shall use AES-256-GCM with a
      random nonce per encryption — it shall not use a fixed nonce or ECB mode"
    adversarial_condition: "even under test conditions where deterministic
      output might seem convenient — a fixed nonce leaks plaintext patterns
      across multiple encryptions of the same data"
    test_type: unit
    component_under_test: directory

# ─── Degraded Behavior ──────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While the KMS service is unavailable at directory startup
      (CELLO_ENV=dev)"
    fallback: "the directory shall refuse to start and log key.unwrap.failed
      with { reason, keyId }; it shall not start with unencrypted shares or
      a cached key from a previous run — fail hard, not silently"
    test_type: integration
    component_under_test: directory

  - id: DB-002
    condition: "While the KMS service becomes unavailable mid-operation after
      successful startup"
    fallback: "operations that require decrypting a K_server_X share shall
      fail with a retryable error; the directory shall log key.decrypted.failed
      with { reason, keyId, agentId } and return a SERVICE_TEMPORARILY_UNAVAILABLE
      response to the caller — it shall not return a partial result"
    test_type: integration
    component_under_test: directory

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: key.encrypted
      level: info
      trigger: "a K_server_X share is successfully encrypted before INSERT"
      context_fields: [keyId, agentId]
      correlationId: true

    - name: key.decrypted
      level: info
      trigger: "a K_server_X share is successfully decrypted for use"
      context_fields: [keyId, agentId]
      correlationId: true

    - name: key.rotation.initiated
      level: info
      trigger: "key rotation is triggered for a keyId"
      context_fields: [keyId]
      correlationId: false

  error_events:
    - name: key.encrypted.failed
      level: error
      trigger: "EnvelopeKeyProvider.encrypt() throws or returns invalid output"
      context_fields: [keyId, agentId, reason]

    - name: key.decrypted.failed
      level: error
      trigger: "EnvelopeKeyProvider.decrypt() throws"
      context_fields: [keyId, agentId, reason]

    - name: key.unwrap.failed
      level: error
      trigger: "master key unwrap fails at startup"
      context_fields: [reason, keyId]

  alarms:
    - condition: "key.unwrap.failed fires at any time"
      fires_to: ops-critical
    - condition: "key.encrypted.failed fires at any time"
      fires_to: ops-critical
    - condition: "key.decrypted.failed rate > 0 over 1 minute"
      fires_to: ops-warning

