# ─── Identity ───────────────────────────────────────────────
id: CELLO-PERSIST-011
domain: Persistence
milestone: M4
actor: CLIENT
priority: P1
components:
  - client

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO Client,
  I want the full local data store encrypted and uploaded to
  user-configured cloud storage,
  so that the agent can recover its conversation history and keys after
  device loss, while the cloud provider sees only ciphertext and learns
  nothing about the agent's activity.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When a backup is triggered"
    action: "the client shall derive backup_key = HKDF-SHA256(ikm=identity_key,
      info='backup-key' || agent_id, length=32), encrypt the full SQLCipher
      database file with AES-256-GCM using backup_key and a random nonce,
      and upload the ciphertext to the configured cloud storage destination"

  - trigger: "When a backup upload completes"
    action: "the client shall record the backup timestamp, destination URL,
      and a SHA-256 checksum of the ciphertext in the local store — sufficient
      to verify the upload was not corrupted"

  - trigger: "When a restore is triggered with a valid backup_key"
    action: "the client shall download the ciphertext, verify the SHA-256
      checksum, decrypt with backup_key, and replace the local SQLCipher
      database file — after restore the client opens the database with db_key
      and verifies it is readable before declaring restore complete; the
      restore flow requires the identity_key to be available before the
      database is restored, because backup_key and db_key are both derived
      from identity_key; the identity_key is held by the SigningKeyProvider
      (EncryptedFileSigningKeyProvider or KeychainSigningKeyProvider from
      PERSIST-010) which is initialized from a separately-stored key file
      or OS keychain entry — not from the SQLCipher database — and therefore
      survives device loss if the signing key file or keychain entry is
      independently backed up by the operator"

  - trigger: "When the operator has lost their device and needs to restore"
    action: "the operator must first restore their signing key (from the
      encrypted key file backup or OS keychain export) to initialize the
      SigningKeyProvider; only then can backup_key be derived and the
      SQLCipher database restored; the signing key recovery path is outside
      the scope of this story but must be documented in operator runbooks"

  - trigger: "When backup or restore involves cloud storage"
    action: "all cloud storage access goes through a CloudStorageProvider
      interface defined in packages/interfaces/; M4 provides a local stub
      (LocalCloudStorageProvider) that writes to a configured local directory;
      the production S3 implementation is added in M5; this interface is added
      to PERSIST-001's interface inventory as part of this story's implementation"

  - trigger: "When the operator has not configured a cloud storage destination"
    action: "backup operations are skipped with client.backup.not.configured
      logged at WARN — no error, no halt; backup is optional infrastructure"

  - trigger: "Ubiquitous"
    action: "the backup_key is derived independently of db_key — losing one
      does not compromise the other; both are derived from identity_key but
      with distinct info strings"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "An identity_key and agent_id"
    when: "backup_key is derived"
    then: "backup_key = HKDF-SHA256(ikm=identity_key, salt=none,
      info='backup-key' || agent_id, length=32); the same inputs always
      produce the same backup_key; backup_key != db_key for the same
      identity_key — verified by asserting inequality"
    test_type: unit
    component_under_test: client

  - id: AC-002
    given: "A local SQLCipher database file and a backup_key"
    when: "the backup is encrypted"
    then: "the resulting ciphertext is not equal to the plaintext file;
      decrypting with the same backup_key returns bytes identical to the
      original file; decrypting with a different key fails — verified
      without uploading to any cloud service"
    test_type: unit
    component_under_test: client

  - id: AC-003
    given: "A backup has been uploaded and the local database file is deleted;
      the identity_key is available via the SigningKeyProvider (i.e. the
      signing key file or keychain entry has been independently restored or
      is on the new device — this is the prerequisite for restore)"
    when: "restore is triggered"
    then: "backup_key is derived from identity_key; the ciphertext is
      downloaded, checksum verified, decrypted, and written to the local path;
      the client opens the restored database with db_key and all previously
      written records are present — verified by reading each record and
      asserting field equality against the pre-deletion values"
    test_type: integration
    component_under_test: client

  - id: AC-004
    given: "A backup upload completes"
    when: "the backup metadata is read from the local store"
    then: "it contains: timestamp, destination URL, and SHA-256 checksum of
      the uploaded ciphertext — sufficient for an operator to verify the
      backup independently"
    test_type: integration
    component_under_test: client

  - id: AC-005
    given: "No cloud storage destination is configured"
    when: "backup is triggered"
    then: "client.backup.not.configured is logged at WARN with { agentId };
      the operation exits without error; the local database is unaffected"
    test_type: unit
    component_under_test: client

  - id: AC-006
    given: "A backup ciphertext has been corrupted in transit"
    when: "restore is triggered"
    then: "the SHA-256 checksum verification fails; client.backup.restore.failed
      is logged at ERROR with { reason: 'checksum_mismatch', agentId };
      the local database file is not overwritten — the corrupt download is
      discarded"
    test_type: unit
    component_under_test: client

  - id: AC-007
    given: "The operator is shown the backup configuration screen"
    when: "they read the backup documentation"
    then: "it explicitly states: 'Conversation Merkle trees are the only data
      that cannot be reconstructed from the directory. If you lose your local
      database and have no backup, you lose the ability to substantiate any
      dispute about those conversations.' — this warning is present in the
      operator-facing documentation, not just in code comments"
    test_type: unit
    component_under_test: client

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The backup_key shall never be uploaded to cloud storage,
      stored in the backup metadata, or included in any log event"
    adversarial_condition: "even when the backup upload fails and the error
      is logged — client.backup.upload.failed shall contain { reason, agentId }
      only"
    test_type: unit
    component_under_test: client

  - id: SI-002
    statement: "The backup shall use AES-256-GCM with a random nonce per
      backup — it shall never reuse a nonce"
    adversarial_condition: "even across multiple backups of the same database
      file — each backup generates a fresh nonce; nonce reuse with GCM leaks
      both the key and plaintext"
    test_type: unit
    component_under_test: client

  - id: SI-003
    statement: "A restore operation shall never overwrite the local database
      until the downloaded ciphertext passes checksum verification"
    adversarial_condition: "even when the cloud storage provider returns a
      truncated or corrupted file — write the restored file to a temporary
      path, verify the checksum, then atomically replace the live database
      only on success"
    test_type: unit
    component_under_test: client

# ─── Degraded Behavior ──────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While the cloud storage upload fails (network error, auth
      failure, quota exceeded)"
    fallback: "client.backup.upload.failed is logged at ERROR with { reason,
      agentId }; the local database is unaffected; the next triggered backup
      retries the full upload — no partial uploads are left in cloud storage
      as the primary backup"
    test_type: integration
    component_under_test: client

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: client.backup.completed
      level: info
      trigger: "a backup upload completes successfully"
      context_fields: [agentId, destinationType, ciphertextBytes, durationMs]
      correlationId: false

    - name: client.backup.restore.completed
      level: info
      trigger: "a restore completes successfully"
      context_fields: [agentId, sourceUrl, durationMs]
      correlationId: false

  error_events:
    - name: client.backup.upload.failed
      level: error
      trigger: "backup upload fails"
      context_fields: [reason, agentId]

    - name: client.backup.restore.failed
      level: error
      trigger: "restore fails (checksum mismatch, decrypt error, download
        failure)"
      context_fields: [reason, agentId]

    - name: client.backup.not.configured
      level: warn
      trigger: "backup triggered but no destination configured"
      context_fields: [agentId]

    - name: client.backup.restore.not.configured
      level: warn
      trigger: "restore triggered but no cloud storage destination configured"
      context_fields: [agentId]

    - name: client.backup.restore.no.metadata
      level: warn
      trigger: "restore proceeds without stored metadata for checksum
        verification (new-device restore scenario where metadata was not
        separately backed up)"
      context_fields: [agentId, checksumComputed]

  alarms:
    - condition: "client.backup.upload.failed fires 3 times consecutively"
      fires_to: ops-warning

