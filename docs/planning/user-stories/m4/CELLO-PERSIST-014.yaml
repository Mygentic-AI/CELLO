# ─── Identity ───────────────────────────────────────────────
id: CELLO-PERSIST-014
domain: Persistence
milestone: M4
actor: DIR
priority: P0
components:
  - directory
  - relay
  - client

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the Directory Node,
  I want to detect a tree mismatch when both parties attempt to seal,
  return each party's sequence number, and allow the behind party to
  request missing leaves from the relay WAL and retry,
  so that a one-sided delivery failure resolves without operator
  intervention and the seal proceeds with a consistent final root.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When both parties submit seal attempts with differing reported
      Merkle roots"
    action: "the directory shall reject the seal with SEAL_REJECTED_TREE_MISMATCH
      and return both parties' reported sequence numbers in the response"

  - trigger: "When the behind party receives SEAL_REJECTED_TREE_MISMATCH"
    action: "the behind party shall compute the gap as (ahead_sequence -
      behind_sequence), request the missing leaves from the relay WAL for
      that range, verify each leaf against the sender's signature and the
      hash chain, advance its Merkle tree, and resubmit the seal attempt"

  - trigger: "When the relay receives a gap-fill request"
    action: "the relay shall serve only leaves with sequence numbers strictly
      greater than the last agreed sequence number — it shall not serve any
      leaf at or below the agreed checkpoint"

  - trigger: "When both parties resubmit seal attempts with matching roots"
    action: "the directory shall confirm the seal and record the final root
      in conversation_seals"

  - trigger: "When a gap-fill leaf fails signature verification"
    action: "the behind party shall reject the leaf, log
      session.gap.fill.leaf.invalid at WARN, and halt reconciliation —
      a leaf that cannot be verified cannot be trusted to advance the tree"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "Agent A has sent 10 leaves, Agent B has received and sequenced
      only 8; both agents submit seal attempts as separate OS processes"
    when: "the directory receives both seal attempts"
    then: "the directory returns SEAL_REJECTED_TREE_MISMATCH to both parties
      with { partyASequence: 10, partyBSequence: 8 } — verified by asserting
      both parties receive the response with the correct sequence numbers"
    test_type: e2e
    component_under_test: directory

  - id: AC-002
    given: "Agent B has received SEAL_REJECTED_TREE_MISMATCH with
      partyASequence=10 and partyBSequence=8"
    when: "Agent B requests leaves 9–10 from the relay WAL"
    then: "the relay returns exactly 2 leaves with sequence numbers 9 and 10;
      it does not return leaves 1–8; the leaves are the same bytes the relay
      originally sequenced — verified by comparing against the relay's
      internal WAL state"
    test_type: e2e
    component_under_test: relay

  - id: AC-003
    given: "Agent B has received and verified gap-fill leaves 9–10"
    when: "Agent B advances its Merkle tree with the two leaves"
    then: "Agent B's Merkle root matches Agent A's Merkle root — verified
      by both parties resubmitting seal attempts that the directory accepts
      with a single confirmed root in conversation_seals"
    test_type: e2e
    component_under_test: client

  - id: AC-004
    given: "A gap-fill leaf is delivered with a tampered sender signature"
    when: "the behind party verifies the leaf"
    then: "signature verification fails; session.gap.fill.leaf.invalid is
      logged at WARN with { sessionId, sequenceNumber, reason: 'invalid_signature' };
      reconciliation halts; the behind party does not advance its tree with
      the tampered leaf"
    test_type: integration
    component_under_test: client

  - id: AC-005
    given: "The relay WAL for the session is unavailable when a gap-fill
      is requested"
    when: "the relay receives the gap-fill request"
    then: "the relay returns RELAY_SESSION_UNRECOVERABLE; the behind party
      logs session.gap.fill.failed at ERROR with { sessionId, reason:
      'wal_unavailable' } and surfaces the failure to the operator —
      gap-fill cannot proceed without the WAL"
    test_type: integration
    component_under_test: relay

  - id: AC-006
    given: "The gap-fill and retry succeed"
    when: "the seal is confirmed"
    then: "session.reconciliation.completed is logged at INFO with
      { sessionId, gapSize, durationMs, correlationId } on the behind
      party's client"
    test_type: integration
    component_under_test: client

  - id: AC-007
    given: "Both parties have identical sequence numbers when they submit
      seal attempts"
    when: "the directory receives both seal attempts"
    then: "the directory confirms the seal immediately without returning
      SEAL_REJECTED_TREE_MISMATCH — reconciliation is only triggered when
      a mismatch exists"
    test_type: e2e
    component_under_test: directory

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "Gap-fill leaves shall only be served for sequence numbers
      strictly above the last agreed sequence number"
    adversarial_condition: "even when the behind party requests leaves below
      the agreed checkpoint — the relay checks the requested range against
      the agreed sequence number and truncates the response"
    test_type: integration
    component_under_test: relay

  - id: SI-002
    statement: "The behind party shall verify every gap-fill leaf against
      the sender's Ed25519 signature before advancing its Merkle tree"
    adversarial_condition: "even when the relay is trusted infrastructure —
      the relay could be compromised; leaf authenticity is verified against
      the sender's registered public key, not the relay's identity"
    test_type: integration
    component_under_test: client

  - id: SI-003
    statement: "The directory shall not confirm a seal where the two parties'
      reported roots differ — a matching root is required even after
      reconciliation"
    adversarial_condition: "even when one party claims reconciliation is
      complete — both parties must independently submit matching roots in
      their retry attempts"
    test_type: e2e
    component_under_test: directory

# ─── Degraded Behavior ──────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While the relay WAL is unavailable for gap-fill"
    fallback: "the behind party may re-submit hashes from its local hash
      queue to a new relay (per PERSIST-012); if the hash queue is also
      empty or incomplete, the session cannot be reconciled and the operator
      must decide whether to proceed with SEAL_UNILATERAL (PERSIST-015)"
    test_type: integration
    component_under_test: client

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: session.reconciliation.started
      level: info
      trigger: "behind party begins gap-fill reconciliation"
      context_fields: [sessionId, gapSize, fromSequence, toSequence,
        correlationId]
      correlationId: true

    - name: session.reconciliation.completed
      level: info
      trigger: "reconciliation succeeds and seal retry is submitted"
      context_fields: [sessionId, gapSize, durationMs, correlationId]
      correlationId: true

  error_events:
    - name: session.gap.fill.leaf.invalid
      level: warn
      trigger: "a gap-fill leaf fails signature verification"
      context_fields: [sessionId, sequenceNumber, reason]

    - name: session.gap.fill.failed
      level: error
      trigger: "gap-fill cannot proceed (WAL unavailable, relay error)"
      context_fields: [sessionId, reason, correlationId]

  alarms:
    - condition: "session.gap.fill.failed fires more than 5 times in
        10 minutes"
      fires_to: ops-warning

