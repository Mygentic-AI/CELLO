# ─── Identity ───────────────────────────────────────────────
id: CELLO-PERSIST-016
domain: Persistence
milestone: M4
actor: DIR
priority: P0
components:
  - directory

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the Directory Node,
  I want a schema completeness test that fails if any table referenced
  by PgDirectoryStore is missing from the Flyway migration set,
  so that silent adapter.write.failed errors caused by missing migrations
  are caught at test time rather than discovered during live sessions.

# ─── Background ─────────────────────────────────────────────
background: >
  During M4 live testing, three tables referenced by PgDirectoryStore
  (agent_profiles, notification_queue, connections) had no corresponding
  Flyway migrations. PgDirectoryStore uses fire-and-forget writes (#fire),
  so missing tables produced silent adapter.write.failed log events at
  runtime — no exception was raised, no test failed, and no CI gate caught
  the gap. The problem was only discovered during a live two-agent session.

  A fourth table (pending_connection_requests) was also missing.
  Seal_notarizations was also missing.

  This story adds a static analysis test and an integration test that
  together guarantee every table referenced by PgDirectoryStore has a
  corresponding Flyway migration AND exists in the live database schema.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When the schema completeness test runs"
    action: "it shall extract every table name from PgDirectoryStore SQL
      strings, cross-reference against the Flyway migration files, and
      fail with a list of missing tables if any referenced table has no
      corresponding CREATE TABLE statement in any migration file"

  - trigger: "When the schema completeness integration test runs against
      a live Postgres instance (CELLO_ENV=local)"
    action: "it shall query information_schema.tables for every table
      referenced by PgDirectoryStore and fail if any table does not exist
      in the database"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "The PgDirectoryStore source file contains SQL strings referencing
      table names via INSERT INTO, SELECT FROM, UPDATE, DELETE FROM"
    when: "the static analysis test runs"
    then: "the Vitest test file packages/directory/src/__tests__/schema-completeness.test.ts
      reads the PgDirectoryStore source file via Node.js fs.readFileSync;
      all table names are extracted from SQL strings in PgDirectoryStore;
      each table name is cross-referenced against CREATE TABLE statements
      in packages/directory/db/migrations/*.sql; the test fails with a
      clear list of any referenced tables not found in any migration file"
    test_type: unit
    component_under_test: directory

  - id: AC-002
    given: "CELLO_ENV=local and a running Postgres instance with all
      Flyway migrations applied"
    when: "the integration test runs"
    then: "the test opens a live TCP connection to localhost:5432 via the
      real pg npm package (no mock or in-memory substitute is wired for
      this test); for each table referenced by PgDirectoryStore, a SELECT
      from information_schema.tables confirms the table exists; the test
      fails with a list of any missing tables; if CELLO_ENV != local the
      test skips with a clear skip message; if CELLO_ENV=local and the
      pg.connect() call fails (connection refused), the test fails — not
      skips — because the developer explicitly requested a live check"
    test_type: integration
    component_under_test: directory

  - id: AC-003
    given: "A new table is referenced in a PgDirectoryStore SQL string
      but has no migration file"
    when: "the static analysis test runs"
    then: "the test fails and names the missing table — the developer
      cannot merge code that references a table without a migration;
      this test runs in the standard pnpm run test suite so CI enforces
      the merge gate without requiring a live Postgres instance"
    test_type: unit
    component_under_test: directory

  - id: AC-004
    given: "All tables referenced by PgDirectoryStore have corresponding
      CREATE TABLE statements in migration files AND exist in the live database"
    when: "the integration test runs (CELLO_ENV=local, Postgres reachable)"
    then: "the integration test passes and records the exact set of verified
      table names in its output (e.g. 'verified N tables: [agent_profiles, ...]')
      — a verifiable assertion that the full expected set was checked, not
      merely that no error was thrown"
    test_type: integration
    component_under_test: directory

  - id: AC-005
    given: "The HASH_CHAINED_TABLES constant in the test file lists the tables
      that receive hash-chain enforcement"
    when: "the static analysis test runs"
    then: "each table name in HASH_CHAINED_TABLES is cross-checked against the
      set of tables found in migration files; the test fails with a clear list
      of any HASH_CHAINED_TABLES entry that has no corresponding CREATE TABLE
      in any migration file — ensuring the constant and the migration set
      cannot silently diverge; HASH_CHAINED_TABLES is a constant defined at
      the top of packages/directory/src/__tests__/schema-completeness.test.ts
      and is the developer's responsibility to update when a new table receives
      hash-chain enforcement"
    test_type: unit
    component_under_test: directory

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "No PgDirectoryStore SQL operation shall silently fail
      due to a missing table — adapter.write.failed must be detectable
      at test time, not only at runtime; this guarantee applies to
      statically-expressible table references; dynamic table names
      constructed via template literals must be registered in the
      KNOWN_DYNAMIC_TABLES allowlist in the test file"
    adversarial_condition: "even when an attacker (or developer) merges
      a change to PgDirectoryStore that references a non-existent table
      — at runtime this causes silent adapter.write.failed events with
      no protocol-visible signal, meaning data writes are dropped without
      any observable error; the static analysis test acts as the CI gate
      that catches this before deployment"
    test_type: unit
    component_under_test: directory

# ─── Degraded Behavior ──────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While the static analysis cannot parse a SQL string
      (e.g. dynamic table name via template literal)"
    fallback: "the test logs a warning identifying the unparseable
      SQL string and fails — dynamic table names require explicit
      registration in KNOWN_DYNAMIC_TABLES, a constant defined at
      the top of the test file listing every table name referenced
      via template literals in PgDirectoryStore"

  - id: DB-002
    condition: "While CELLO_ENV != local or the Postgres instance is
      unreachable when the integration test runs (AC-002, AC-004)"
    fallback: "the integration test skips with a human-readable skip
      message (e.g. 'skipping: CELLO_ENV is not local or Postgres
      is unreachable') — it does not fail; the static analysis test
      (AC-001, AC-003) still runs and enforces the merge gate in all
      environments without requiring a live database"

# ─── Observability ──────────────────────────────────────────
# NOTE: schema.completeness.verified and schema.completeness.failed are
# test-output events emitted by the test runner, not production Logger
# events. They do not fire through the Logger interface in production code.
# They are documented here for taxonomy completeness and cross-referenced
# in the canonical event taxonomy in
# docs/planning/discussion_logs/2026-05-16_0753_development-pipeline-and-local-iteration.md.
# See the notes section below for the full description.
#
# Runtime failure mode: when a fire() write fails at runtime due to a
# missing table, the existing adapter.write.failed event fires. This story
# requires that event to carry a tableName context field so operators can
# distinguish a missing-table failure from a connection failure or a
# constraint violation. The existing adapter.write.failed alarm threshold
# (defined in the monitoring baseline) covers this failure mode — no new
# alarm is introduced by PERSIST-016.
observability:
  runtime_events:
    - name: adapter.write.failed
      level: error
      trigger: "a PgDirectoryStore fire() write fails due to a missing table at runtime"
      context_fields: [adapterName, reason, tableName]
      # tableName is required — without it, operators cannot distinguish
      # a missing-table failure from a connection failure or constraint violation
      correlationId: false
      note: "This event is defined in the existing taxonomy. PERSIST-016
        requires that tableName be present in the context when reason is
        table_not_found. No new alarm is added — the existing adapter.write.failed
        alarm threshold covers this failure mode."

# ─── Implementation notes ────────────────────────────────────
notes: >
  The static analysis test (AC-001, AC-003, AC-005) should:
  1. Read pg-directory-store.ts source
  2. Extract all string literals containing "INSERT INTO", "SELECT.*FROM",
     "UPDATE", "DELETE FROM" and parse the table name that follows
  3. Read all .sql files in packages/directory/db/migrations/
  4. For each referenced table, check that at least one migration contains
     "CREATE TABLE" with that table name
  5. Cross-check the HASH_CHAINED_TABLES constant against the migration set
  6. Fail if any table is unaccounted for

  The KNOWN_DYNAMIC_TABLES constant (DB-001, SI-001) is defined at the top
  of the test file and lists every table name referenced via template literals
  in PgDirectoryStore. Any dynamic table name not in this allowlist causes the
  test to fail with a clear error identifying the unparseable SQL string.

  The integration test (AC-002, AC-004) should:
  1. Skip (not fail) when CELLO_ENV != local or Postgres is unreachable (DB-002)
  2. Connect to Postgres as superuser
  3. Query information_schema.tables WHERE table_schema = 'public'
  4. For each table referenced by PgDirectoryStore, assert it exists
  5. Fail with a list of missing tables if any are absent

  Tables currently referenced by PgDirectoryStore that need migrations
  (as of M4 post-live-session audit):
  - seal_notarizations (PERSIST-018)
  - notification_queue + pending_connection_requests (PERSIST-019)
  - connections (PERSIST-020)
  (agent_profiles already addressed by V9 migration)
  Note: PERSIST-017 is the MMR checkpoint story (cello_get_inclusion_proof /
  checkpoint_pending status); PERSIST-018/019/020 are the three missing-table
  migration stories; PERSIST-021 is the adapter boundary audit story.

  Test-output observability events (not production Logger events):
  These events are emitted by the test runner for diagnostic output and are
  recorded in the canonical taxonomy for completeness. They do not fire
  through the Logger interface in any production code path.

  - schema.completeness.verified
      level: info
      trigger: all referenced tables confirmed present in migrations and database
      context_fields: [tableCount, migrationCount]
      correlationId: false

  - schema.completeness.failed
      level: error
      trigger: one or more referenced tables missing from migrations or database
      context_fields: [missingTables, checkedTableCount]
      correlationId: false

