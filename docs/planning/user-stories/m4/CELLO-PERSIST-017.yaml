# ─── Identity ───────────────────────────────────────────────
id: CELLO-PERSIST-017
domain: Persistence
milestone: M4
actor: CLIENT
priority: P0
components:
  - directory
  - client
  - adapter-claude-code  # cello_close_session, cello_get_sealed_receipt, cello_get_inclusion_proof MCP tools

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO Client,
  I want to know when my sealed conversation has been included in the
  global MMR checkpoint so I can obtain a third-party-verifiable inclusion
  proof — and I want cello_close_session to surface checkpoint_pending
  status when the FROST seal is complete but the MMR has not yet committed
  my sealed_root,
  so that agents are not left with a sealed conversation they cannot prove
  to any third party.

# ─── Background ─────────────────────────────────────────────
background: >
  Discovered during the first live M4 agent-to-agent session (2026-05-18).
  When Agent A called cello_close_session, the response contained
  mmr_peak: null and sealed_root: 9e31a4fe... The FROST signature was
  complete — both parties hold a cryptographically valid receipt. But
  no third party can verify it: the sealed_root is staged in
  conversation_seal_staging, waiting for the next MMR checkpoint to run.

  The checkpoint runs on the analytics JobScheduler cadence — currently
  opportunistic with no SLA. Agents have no way to know when their
  inclusion proof becomes available. cello_get_sealed_receipt returns
  attestation_self: PENDING with no indication of when that changes.

  This gap means the FROST seal closes the conversation between the two
  parties, but the protocol's promise — that a sealed conversation is
  independently verifiable by anyone — is not fulfilled until the checkpoint
  runs. The window is unbounded and invisible.

  Agent B's description of the fix during the live session:
  "cello_close_session should return checkpoint_pending status, and
  cello_get_inclusion_proof should return either the proof or a
  pending/eta response. Without this, the FROST seal is a receipt only
  you can read, not a proof the protocol can assert to the world."

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When cello_close_session completes the FROST seal ceremony"
    action: "the response shall include a checkpoint_status field:
      'confirmed' if the MMR checkpoint has already committed the
      sealed_root, or 'pending' if the sealed_root is staged but not
      yet checkpointed"

  - trigger: "When the client calls cello_get_inclusion_proof after seal
      but before the MMR checkpoint has run"
    action: "the tool shall return { status: 'pending', staged_at: <unix_ms> }
      rather than an error — staged_at is Unix epoch milliseconds; the
      sealed_root is staged and the proof will be available once the
      checkpoint runs"

  - trigger: "When the client calls cello_get_inclusion_proof after the
      MMR checkpoint has committed the sealed_root"
    action: "the tool shall return the full MMR inclusion proof including
      the checkpoint peak hash, leaf index, and sibling path — sufficient
      for a third party to independently verify inclusion without further
      directory queries"

  - trigger: "When the MMR checkpoint runs and commits a staged sealed_root"
    action: "the directory shall update the session's mmr_peak field in the
      database and emit the mmr.session.checkpointed log event; client
      notification (polling or push) is out of scope for this story —
      clients poll cello_get_sealed_receipt or cello_get_inclusion_proof
      to discover the confirmed state"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "Agent A calls cello_close_session and the FROST ceremony
      completes, but no MMR checkpoint has run yet for this session;
      the directory's SealNotarization handler is called to notarize
      the seal and returns checkpoint_status based on querying
      conversation_seal_staging for the staged_root — the client's
      seal handler reads this field from the SealNotarization response
      and surfaces it in the cello_close_session return value"
    when: "cello_close_session returns"
    then: "the response includes status: 'sealed', sealed_root: <hex>,
      and checkpoint_status: 'pending'; session_mmr_peak is null;
      verified by asserting the directory's SealNotarization handler
      was invoked (confirmed via mmr.checkpoint.pending log event
      emitted by the directory) — a test that stubs the SealNotarization
      response without calling the real directory does NOT satisfy this AC"
    test_type: integration
    component_under_test: client

  - id: AC-002
    given: "A session has been sealed and the sealed_root is staged in
      conversation_seal_staging; the test uses a real directory (not a stub)
      so the checkpoint_status field is read from the actual database row"
    when: "the client calls cello_get_sealed_receipt"
    then: "the response includes checkpoint_status: 'pending' and a
      staged_at Unix epoch milliseconds timestamp indicating when the
      seal was committed to staging (not ISO 8601 — all protocol
      timestamps are Unix milliseconds); attestation_self is 'PENDING'
      with a human-readable reason: 'MMR checkpoint not yet written';
      verified by confirming conversation_seal_staging contains the
      staged_root row (via the directory's log event or a direct query)
      — a hardcoded response returning checkpoint_status: 'pending' does
      NOT satisfy this AC"
    test_type: integration
    component_under_test: client

  - id: AC-003
    given: "A session has been sealed but the MMR checkpoint has not run;
      the test uses a real directory so staged_at is read from the actual
      conversation_seal_staging row — not a hardcoded stub response"
    when: "the client calls cello_get_inclusion_proof for this session"
    then: "the tool returns { status: 'pending', staged_at: <unix_ms>,
      message: 'sealed_root staged; inclusion proof available after next
      MMR checkpoint' } — not an error; the agent can retry later;
      staged_at is Unix epoch milliseconds (not ISO 8601) to match the
      rest of the protocol timestamp format; a stub returning { status: 'pending' }
      unconditionally does NOT satisfy this AC — staged_at must originate
      from a real database row in conversation_seal_staging"
    test_type: integration
    component_under_test: client

  - id: AC-003a
    given: "A session is active (not yet sealed — cello_close_session has
      not been called); the test uses a real directory so the absence of a
      sealed_root is determined by querying the database, not by a stub"
    when: "the client calls cello_get_inclusion_proof for this session"
    then: "the tool returns an error (not a pending response): the session
      has no sealed_root and therefore no inclusion proof can exist;
      the error clearly distinguishes 'not yet sealed' from 'sealed but
      pending checkpoint'; verified by asserting the directory was contacted
      (no stub that hardcodes an error response satisfies this AC)"
    test_type: integration
    component_under_test: client

  - id: AC-004
    given: "A session has been sealed AND the MMR checkpoint has run,
      committing the sealed_root to the global proof ledger"
    when: "the client calls cello_get_inclusion_proof"
    then: "the tool returns { status: 'confirmed', leaf_index: N,
      checkpoint_peak_hash: <hex>, sibling_hashes: [<hex>, ...],
      checkpoint_id: <uuid> }; verified using real nodes with no mocks —
      two CELLO clients and a real directory in separate OS processes;
      a third-party verifier process (no shared memory, no directory
      connection, no network access) receives only checkpoint_peak_hash
      and sibling_hashes and executes the MMR path-recomputation algorithm,
      asserting the result equals checkpoint_peak_hash; the test fails if
      the verification algorithm is not invoked or completes without the
      directory being unreachable from the verifier process"
    test_type: e2e
    component_under_test: directory

  - id: AC-005a
    given: "A session's sealed_root has been committed to the MMR checkpoint;
      the test triggers the checkpoint via the real JobScheduler analytics
      entry point (not by setting a flag) and waits for mmr.session.checkpointed
      to be emitted before calling cello_close_session"
    when: "the client calls cello_close_session on a session that was
      previously sealed (idempotent call)"
    then: "the response includes checkpoint_status: 'confirmed',
      session_mmr_peak: <hex> (the checkpoint peak hash), and leaf_index: N;
      verified by asserting mmr.session.checkpointed was logged by the
      directory before this call was made — confirming the checkpoint ran
      via the real code path"
    test_type: integration
    component_under_test: client

  - id: AC-005b
    given: "A session's sealed_root has been committed to the MMR checkpoint;
      the checkpoint was triggered via the real JobScheduler analytics
      entry point and mmr.session.checkpointed was emitted by the directory"
    when: "the client calls cello_get_sealed_receipt for that session"
    then: "the response includes checkpoint_status: 'confirmed',
      session_mmr_peak: <hex> (the checkpoint peak hash), and leaf_index: N;
      verified by asserting the confirmed checkpoint state was read from
      the directory's database (not from in-memory state) — confirmed
      via mmr.session.checkpointed log event prior to this call"
    test_type: integration
    component_under_test: client

  - id: AC-006
    given: "A session's sealed_root is staged in conversation_seal_staging
      but no checkpoint has run yet"
    when: "the test polls cello_get_sealed_receipt, then triggers the
      checkpoint by calling the JobScheduler's analytics job entry point
      directly (not by setting a flag) — simulating the same code path
      used in production — then polls cello_get_sealed_receipt again"
    then: "the test shall first assert checkpoint_status: 'pending' in the
      initial response; then trigger a checkpoint; then assert
      checkpoint_status: 'confirmed' in the subsequent response —
      both states must be observed in sequence; the checkpoint trigger
      is verified by asserting mmr.session.checkpointed was emitted by
      the directory between the two polls; a test that only checks the
      final confirmed state does not satisfy this AC"
    test_type: integration
    component_under_test: directory

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The inclusion proof returned by cello_get_inclusion_proof
      shall be verifiable by a third party using only the checkpoint
      peak hash and the proof path — no further directory query required"
    adversarial_condition: "even when the directory is offline after
      the proof is retrieved"
    verification: "A separate test process is spawned with no network
      access and no shared memory with the directory. It receives only
      checkpoint_peak_hash and sibling_hashes. It executes the MMR
      path-recomputation algorithm and asserts the result equals
      checkpoint_peak_hash. The test fails if the verification algorithm
      is not invoked, or if the verifier process can reach the directory
      (confirming the directory was taken offline before verification ran)."
    test_type: e2e
    component_under_test: directory

  - id: SI-002
    statement: "cello_get_inclusion_proof shall never return a proof
      for a session whose sealed_root is not yet in a confirmed checkpoint"
    adversarial_condition: "even if any future in-memory caching layer is
      added to the directory — the proof-eligibility check must always
      resolve against the committed checkpoints table row, not against
      any in-memory representation; tested by asserting the directory's
      DirectoryStore proof-eligibility method is called (via log event or
      spy) during cello_get_inclusion_proof, confirming the check is
      database-backed and not bypassed by any local state"
    test_type: integration
    component_under_test: directory

# ─── Degraded Behavior ──────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While the MMR checkpoint has not run within a configurable
      max_staging_age (default: 1 hour)"
    fallback: "the overdue detector — a scheduled check registered with
      JobScheduler in the directory's composition root, running on the
      same cadence as the analytics job — calls MmrCheckpointService.forceFlush
      for all staged sealed_roots older than max_staging_age; agents polling
      cello_get_sealed_receipt will see checkpoint_status transition from
      'pending' to 'confirmed' within max_staging_age"
    acceptance_criteria: "given a staged sealed_root older than max_staging_age,
      when the JobScheduler overdue check fires (triggered directly via the
      JobScheduler entry point in the test), then mmr.checkpoint.overdue is
      emitted, a forced checkpoint is triggered, mmr.session.checkpointed
      is emitted per session, and the session's checkpoint_status transitions
      to 'confirmed' — verified by asserting both log events were emitted and
      cello_get_sealed_receipt returns checkpoint_status: 'confirmed'"

  - id: DB-002
    condition: "While the client is offline when the checkpoint runs"
    fallback: "the proof remains queryable via cello_get_inclusion_proof
      indefinitely — the client can retrieve it on reconnect"

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: mmr.checkpoint.pending
      level: info
      trigger: "cello_close_session returns with checkpoint_status: pending"
      context_fields: [sessionId, sealedRoot, stagedAt, correlationId]
      correlationId: true
      # correlationId is required: this event fires at the terminal step of
      # a FROST seal ceremony, which has a session-scoped correlationId
      # threaded from ceremony initiation. Breaking the correlation chain
      # here makes debugging seal-to-checkpoint transitions impossible.

    - name: mmr.session.checkpointed
      level: info
      trigger: "a session's sealed_root enters a confirmed checkpoint —
        fires per-session when the checkpoint run commits this session's
        staged_root; distinct from mmr.checkpoint.confirmed (PERSIST-007)
        which fires once per checkpoint at the checkpoint level with
        aggregate fields {checkpointId, leafCount, peakHash, stagedSealCount}"
      context_fields: [sessionId, checkpointId, leafIndex, peakHash, correlationId]
      correlationId: true
      correlationId_source: "The correlationId is the seal-ceremony correlationId
        persisted in conversation_seal_staging.correlation_id at seal time
        (this column is added to the staging schema as part of this story).
        The checkpoint job reads it from the staging row and threads it into
        this event. If the column is absent, the checkpoint job logs without
        a correlationId — this is a blocking gap, not a graceful degradation."
      schema_change: "conversation_seal_staging gains a correlation_id column
        (nullable text) as part of this story; the SealNotarization handler
        writes the active correlationId into this column; the checkpoint job
        reads it when emitting mmr.session.checkpointed"

  error_events:
    - name: mmr.checkpoint.overdue
      level: warn
      trigger: "staged sealed_root has been pending longer than max_staging_age"
      context_fields: [sessionId, stagedAt, maxStagingAgeMs]
      correlationId: false
      # correlationId is false: the overdue detection fires from a scheduler
      # context (no session correlationId in scope at trigger time)

  alarms:
    - condition: "mmr.checkpoint.overdue fires"
      fires_to: ops-warning

# ─── Implementation Notes ───────────────────────────────────
implementation_notes:
  - "All staged_at timestamps are Unix epoch milliseconds throughout this
    story — not ISO 8601 strings. This matches the rest of the protocol's
    timestamp format (Structure 1 TBS, Structure 2 TBS, etc.)."
  - "PERSIST-E2E-001 AC-009 should eventually be extended to assert the
    pre-checkpoint pending state: first call cello_get_sealed_receipt after
    seal but before triggering the checkpoint, assert checkpoint_status:
    'pending', then trigger the checkpoint and assert 'confirmed'. The current
    AC-009 only validates the confirmed end-state."

