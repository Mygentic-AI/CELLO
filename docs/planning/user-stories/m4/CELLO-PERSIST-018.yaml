# ─── Identity ───────────────────────────────────────────────
id: CELLO-PERSIST-018
domain: Persistence
milestone: M4
actor: DIR
priority: P0
components:
  - directory

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the Directory Node,
  I want a seal_notarizations table with a Flyway migration, RLS, and a
  hash chain so that the FROST threshold signature for each sealed session
  is durably stored and independently retrievable,
  so that getNotarization() returns real data instead of undefined and any
  third party can verify the FROST co-signature without querying application
  state.

# ─── Background ─────────────────────────────────────────────
background: >
  Discovered during the first live M4 agent-to-agent session (2026-05-18).
  After [SEAL] Sealed was logged, recordNotarization() wrote to
  seal_notarizations — a table that had no Flyway migration. The INSERT
  produced a silent adapter.write.failed log event. getNotarization()
  continued to return undefined because no row was ever committed.

  conversation_seals (PERSIST-007) already holds the sealed Merkle root
  and the bilateral seal metadata. seal_notarizations adds the FROST
  threshold signature that co-signs the seal ceremony. Together, the two
  tables allow a third party to verify both the Merkle integrity (via
  sealed_root in conversation_seals) and the FROST threshold co-signature
  (via frost_signature in seal_notarizations) without any further
  directory query.

  A session can only be sealed once, so this table is append-only with a
  UNIQUE constraint on session_id. chain_hash enforcement (PERSIST-004)
  applies — this is a tamper-evident audit record.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When Flyway migrations are applied to a fresh database"
    action: "the seal_notarizations table shall exist with columns
      id (BIGSERIAL PRIMARY KEY), session_id (TEXT NOT NULL UNIQUE),
      sealed_root (TEXT NOT NULL), participant_a_pubkey (TEXT NOT NULL),
      participant_b_pubkey (TEXT NOT NULL), close_timestamp (BIGINT NOT NULL),
      frost_signature (TEXT NOT NULL), chain_hash (TEXT NOT NULL);
      RLS shall be enabled with INSERT and
      SELECT policies for cello_service; no UPDATE or DELETE policy shall
      exist for cello_service"

  - trigger: "When the directory calls recordNotarization() after the FROST
      seal ceremony completes"
    action: "the directory shall INSERT one row into seal_notarizations
      containing the session_id, sealed_root, participant pubkeys,
      close_timestamp, and frost_signature; it shall compute and store
      chain_hash per the hash chain protocol (PERSIST-004)"

  - trigger: "When the directory calls getNotarization(sessionId)"
    action: "the directory shall SELECT the row from seal_notarizations
      matching session_id and return the full SealNotarization record;
      if no row exists, it shall return undefined"

  - trigger: "When the cello_service role attempts an UPDATE or DELETE on
      seal_notarizations"
    action: "PostgreSQL shall reject the operation with permission denied —
      seal notarizations are permanent once written"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "Flyway migrations have been applied to a local Postgres container
      (CELLO_ENV=local); the test opens a live TCP connection to localhost:5432
      via the real pg package (no mock or in-memory substitute); if CELLO_ENV=local
      and pg.connect() fails, the test fails — not skips"
    when: "information_schema.tables is queried"
    then: "seal_notarizations exists in schema public with all required
      columns; relrowsecurity=true confirmed via pg_catalog.pg_class;
      exactly two policies visible to cello_service (insert_only, select_all)
      confirmed via pg_catalog.pg_policy WHERE tablename='seal_notarizations'
      (query issued after SET ROLE cello_service); cello_service has no
      UPDATE or DELETE privilege confirmed via information_schema.role_table_grants"
    test_type: integration
    component_under_test: directory

  - id: AC-002
    given: "The seal_notarizations table exists and is empty (CELLO_ENV=local);
      the test uses a real Postgres instance — a stub returning a canned row
      does NOT satisfy this AC"
    when: "recordNotarization() is called with a valid SealNotarization"
    then: "the row is persisted; getNotarization(sessionId) returns the
      same SealNotarization with matching session_id, sealed_root,
      participant_a_pubkey, participant_b_pubkey, close_timestamp, and
      frost_signature; chain_hash is present, non-null, and equals the
      server-computed value — verified by the test recomputing the expected
      chain_hash from the record contents and the genesis chain_hash and
      asserting equality; getNotarization() no longer returns undefined;
      the INSERT and SELECT both executed against a live connection"
    test_type: integration
    component_under_test: directory

  - id: AC-003
    given: "A SealNotarization has been persisted in a real Postgres instance
      (CELLO_ENV=local)"
    when: "recordNotarization() is called again with the same session_id"
    then: "the INSERT fails with a unique constraint violation; the existing
      row is unchanged; the directory logs notarization.duplicate.rejected
      at WARN with { sessionId } — a session can only be sealed once;
      verified by asserting the row count in seal_notarizations remains 1"
    test_type: integration
    component_under_test: directory

  - id: AC-004
    given: "A row has been inserted into seal_notarizations by cello_service
      in a real Postgres instance (CELLO_ENV=local)"
    when: "cello_service attempts UPDATE seal_notarizations"
    then: "PostgreSQL rejects the operation with 'ERROR: permission denied
      for table seal_notarizations'; the row is unchanged; the rejection
      originates from the RLS policy, not from application-layer guarding"
    test_type: integration
    component_under_test: directory

  - id: AC-005
    given: "Two rows exist in seal_notarizations in a real Postgres instance
      (CELLO_ENV=local)"
    when: "the chain verifier fetches all rows from seal_notarizations via
      a live SELECT issued to the real Postgres instance (ordered by ctid)
      and recomputes each chain_hash from scratch"
    then: "the verifier reports 0 chain breaks — the chain_hash column
      extends correctly from the genesis value through both rows;
      the verifier did not operate on cached rows — the fresh SELECT is
      itself the evidence (no prior in-memory state exists since the test
      instantiates a fresh verifier)"
    test_type: integration
    component_under_test: directory

  - id: AC-006
    given: "getNotarization() is called for a session_id that has no
      corresponding row in seal_notarizations (CELLO_ENV=local, real Postgres)"
    when: "the query executes"
    then: "getNotarization() returns undefined — it does not throw and
      does not log an error; absence of a notarization is not itself an
      error condition; verified by asserting the SELECT was issued to
      the real database (not short-circuited)"
    test_type: integration
    component_under_test: directory

  - id: AC-007
    given: "recordNotarization() is called against a real Postgres instance
      (CELLO_ENV=local)"
    when: "the INSERT commits successfully"
    then: "notarization.recorded is logged at INFO with
      { sessionId, sealedRoot, correlationId }; the logged correlationId
      equals the correlationId value passed to recordNotarization() without
      mutation — verified by passing a known correlationId to the store and
      asserting the exact same value appears in the log context; full
      cross-layer correlation (verifying correlationId originates from
      frost.ceremony.* events in directory-node.ts) is at the
      directory-node integration level and is not tested here"
    test_type: integration
    component_under_test: directory

  - id: AC-008
    given: "recordNotarization() is called but the Postgres connection fails
      transiently on the first attempt (CELLO_ENV=local; simulated by closing
      the connection pool before the first INSERT)"
    when: "the retry fires on the second attempt and also fails"
    then: "notarization.write.failed is logged at ERROR with
      { sessionId, reason, attempt: 1 } after the first failure and
      { sessionId, reason, attempt: 2 } after the retry failure; the alarm
      fires to ops-critical; the in-memory FROST signature is not lost —
      the directory returns an error to the caller rather than discarding
      the signature silently"
    test_type: integration
    component_under_test: directory

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The chain_hash field in seal_notarizations is always computed
      server-side by PgDirectoryStore and is never accepted from an external
      caller; the frost_signature field is stored exactly as supplied by the
      caller — enforcement that frost_signature originates from the FROST
      ceremony is structural at the directory-node.ts call site
      (processSeal() and processSealFrostSignature() are the only paths that
      call recordNotarization(), and they supply the frost_signature from the
      FROST ceremony result)"
    adversarial_condition: "even when a caller passes a crafted chain_hash
      value — PgDirectoryStore ignores it and computes chain_hash from the
      record contents; frost_signature source enforcement is structural:
      PgDirectoryStore.recordNotarization() is only reachable via
      processSeal() / processSealFrostSignature() in directory-node.ts,
      which supply frost_signature exclusively from the FROST ceremony"
    test_assertion: "An integration test passes a SealNotarization DTO with
      a crafted frost_signature (all-zeros bytes) to recordNotarization();
      the test reads the persisted row from the live database (CELLO_ENV=local)
      and asserts: (a) frost_signature is stored as all-zeros exactly as
      supplied — PgDirectoryStore does not recompute or replace it;
      (b) chain_hash is the server-computed SHA-256 value (not all-zeros and
      not any caller-supplied value) — verified by confirming chain_hash
      matches the expected hex pattern and is non-zero; frost_signature source
      enforcement is tested structurally: only processSeal() and
      processSealFrostSignature() in packages/directory/src/directory-node.ts
      call recordNotarization(), and those methods supply frost_signature from
      the FROST ceremony output"
    test_type: integration
    component_under_test: directory

  - id: SI-002
    statement: "A session's SealNotarization shall be written atomically with
      the FROST ceremony completion — the recordNotarization() call is issued
      within the same transaction scope as the conversation_seals write
      (PERSIST-007); it shall not be possible to have a confirmed sealed session
      row with no corresponding notarization row due to a partial write"
    adversarial_condition: "even when the Postgres connection is lost after
      the conversation_seals row is written but before the seal_notarizations
      INSERT commits — the outer transaction rolls back both writes, leaving
      no orphaned seal; crash recovery and orphan detection are deferred to
      a future milestone and are out of scope for PERSIST-018"
    test_assertion: "An integration test wraps recordNotarization() and the
      conversation_seals write in a transaction, then simulates connection loss
      (pg.Client.end() before COMMIT) after the conversation_seals INSERT but
      before the seal_notarizations INSERT; the test reconnects and asserts that
      conversation_seals has 0 rows for that sessionId AND seal_notarizations
      has 0 rows for that sessionId — both writes were rolled back atomically"
    test_type: integration
    component_under_test: directory

  - id: SI-003
    statement: "The chain_hash sequence in seal_notarizations shall not be
      forgeable — any modification of a persisted notarization row causes the
      hash chain verification to fail at that row"
    adversarial_condition: "even when a database superuser modifies a
      frost_signature or sealed_root value directly — the chain verification
      pass detects the break and fires db.chain.break.detected"
    test_type: integration
    component_under_test: directory

# ─── Degraded Behavior ──────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While the Postgres write fails transiently after the FROST
      ceremony has completed (e.g. connection pool exhausted)"
    fallback: "the directory logs notarization.write.failed at ERROR with
      { sessionId, reason }; the FROST signature is not lost — it is
      held in memory and the write is retried once; if the retry also fails,
      notarization.write.failed fires again with attempt: 2 and the operator
      is alerted; the session remains sealed regardless of the notarization
      write outcome — the write is a durability concern, not a seal validity
      concern"

  - id: DB-002
    condition: "While CELLO_ENV is not local or Postgres is unreachable when
      integration tests run"
    fallback: "all integration ACs in this story skip (not fail) with a clear
      skip message; the static analysis test (migration file existence) still
      runs in all environments"

# ─── Observability ──────────────────────────────────────────
observability:
  taxonomy_additions:
    - "notarization.recorded — added in PERSIST-018"
    - "notarization.write.failed — added in PERSIST-018"
    - "notarization.duplicate.rejected — added in PERSIST-018"
    # db.chain.break.detected is defined in PERSIST-004 observability section;
    # PERSIST-018 references it in SI-003 but does not own it.
  events:
    - name: notarization.recorded
      level: info
      trigger: "recordNotarization() commits successfully to seal_notarizations"
      context_fields: [sessionId, sealedRoot, correlationId]
      correlationId: true
      # correlationId is required: this event fires at the terminal step of
      # the FROST seal ceremony, which carries a session-scoped correlationId
      # minted at ceremony initiation; breaking the correlation chain here
      # makes seal debugging impossible.

  error_events:
    - name: notarization.write.failed
      level: error
      trigger: "recordNotarization() INSERT fails (transient or permanent)"
      context_fields: [sessionId, reason, attempt]

    - name: notarization.duplicate.rejected
      level: warn
      trigger: "recordNotarization() called for a session_id that already
        has a row — unique constraint violation"
      context_fields: [sessionId]

  alarms:
    - condition: "notarization.write.failed fires with attempt: 2 (all
        retries exhausted)"
      fires_to: ops-critical

