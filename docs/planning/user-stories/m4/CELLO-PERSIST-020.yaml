# ─── Identity ───────────────────────────────────────────────
id: CELLO-PERSIST-020
domain: Persistence
milestone: M4
actor: DIR
priority: P0
components:
  - directory

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the Directory Node,
  I want a connections table with a Flyway migration, RLS, and a hash chain
  so that established connection records survive directory restarts,
  so that hasConnection() stops returning null after a restart and agents
  do not lose their established connections every time the directory process
  exits.

# ─── Background ─────────────────────────────────────────────
background: >
  Discovered during the first live M4 agent-to-agent session (2026-05-18).
  After [CONN] Connection established was logged, the write to connections
  produced a silent adapter.write.failed event — the table had no Flyway
  migration. The directory held all connection state in memory only.
  On any directory restart, hasConnection() returned null for every pair,
  forcing agents to re-run cello_request_connection even though the
  connection had previously been accepted.

  A connection record is the outcome of the full CONNREQ-002 flow
  (connection_request → accept). It is a protocol event that must be
  tamper-evident. connections is therefore append-only with chain_hash
  enforcement (PERSIST-004). Status changes (revocation, expiry) are
  reserved for a future milestone and will be handled via a separate table,
  not via UPDATE.

  hasConnection(participantA, participantB) must be symmetric: a connection
  established by A requesting B is visible when querying (A, B) and also
  when querying (B, A). The implementation handles this by querying both
  orderings and returning the first match.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When Flyway migrations are applied to a fresh database"
    action: "the connections table shall exist with columns: connection_id
      (TEXT PRIMARY KEY), participant_a (TEXT NOT NULL), participant_b
      (TEXT NOT NULL), established_at (BIGINT NOT NULL), status (TEXT NOT NULL
      DEFAULT 'active'), chain_hash (TEXT NOT NULL); composite indexes shall
      exist on (participant_a, participant_b) and on (participant_b, participant_a)
      to support symmetric hasConnection() queries; RLS shall be enabled with
      INSERT and SELECT policies for cello_service; no UPDATE or DELETE policy
      shall exist for cello_service"

  - trigger: "When a connection is established between Agent A and Agent B"
    action: "the directory shall INSERT one row into connections with
      connection_id, participant_a (A's k_local_pubkey_hex), participant_b
      (B's k_local_pubkey_hex), established_at (Unix ms), status 'active',
      and a computed chain_hash per the hash chain protocol (PERSIST-004)"

  - trigger: "When the directory calls hasConnection(pubkeyA, pubkeyB)"
    action: "the directory shall SELECT from connections WHERE
      (participant_a = pubkeyA AND participant_b = pubkeyB)
      OR (participant_a = pubkeyB AND participant_b = pubkeyA)
      and return the first matching row, or null if none exists;
      the query uses both indexes to avoid a full table scan"

  - trigger: "When the directory calls getConnection(connectionId)"
    action: "the directory shall SELECT the row from connections WHERE
      connection_id = connectionId and return it, or null if not found"

  - trigger: "When the cello_service role attempts an UPDATE or DELETE on
      connections"
    action: "PostgreSQL shall reject the operation with permission denied —
      connection records are permanent once written; revocation is deferred
      to a future milestone"

  - trigger: "When the directory restarts and either agent calls an operation
      that gates on an established connection"
    action: "hasConnection() queries the database and returns the persisted
      row — connection state is not re-initialized from in-memory state on
      restart; the operation proceeds as if the directory had never restarted"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "Flyway migrations have been applied to a local Postgres container
      (CELLO_ENV=local); the test opens a live TCP connection to localhost:5432
      via the real pg package (no mock or in-memory substitute); if CELLO_ENV=local
      and pg.connect() fails, the test fails — not skips"
    when: "information_schema.tables is queried"
    then: "connections exists in schema public with all required columns;
      relrowsecurity=true confirmed via pg_catalog.pg_class; exactly two
      policies visible to cello_service (insert_only, select_all) confirmed
      via pg_catalog.pg_policy WHERE tablename='connections' (query issued
      after SET ROLE cello_service); cello_service has no UPDATE or DELETE
      privilege confirmed via information_schema.role_table_grants; indexes
      exist on (participant_a, participant_b) and (participant_b, participant_a)"
    test_type: integration
    component_under_test: directory

  - id: AC-002
    given: "The connections table is empty (CELLO_ENV=local, real Postgres —
      a stub returning a canned row does NOT satisfy this AC; each test runs
      inside a transaction that rolls back at completion to maintain isolation)"
    when: "a connection record is written via the directory store"
    then: "hasConnection(participantA, participantB) returns the connection
      record; hasConnection() no longer returns null after a write; the
      persisted row contains the correct connection_id, participant_a,
      participant_b, established_at, and status 'active'; verified by asserting
      the round-trip value was read back from the live database"
    test_type: integration
    component_under_test: directory

  - id: AC-003
    given: "A connection record has been written with participant_a=A and
      participant_b=B (CELLO_ENV=local, real Postgres)"
    when: "hasConnection(B, A) is called (reversed argument order)"
    then: "the same connection record is returned — hasConnection() is
      symmetric regardless of which agent initiated the original request;
      the implementation uses an OR query on both index orderings (not
      application-layer normalization); verified by inspecting the migration
      SQL to confirm both composite indexes are created AND by asserting the
      returned record's participant_a/participant_b values are unchanged from
      insertion (not swapped/normalized)"
    test_type: integration
    component_under_test: directory

  - id: AC-004
    given: "A connection record exists in the connections table (CELLO_ENV=local,
      real Postgres)"
    when: "the directory process is restarted (simulated by clearing all
      in-memory state and re-instantiating PgDirectoryStore with the same
      database connection)"
    then: "hasConnection(participantA, participantB) returns the persisted
      record — connection state survives the restart; the test asserts the
      connection record's connection_id matches the pre-restart record;
      the fresh PgDirectoryStore instance has no in-memory state at
      construction — re-instantiation is itself the evidence that the result
      came from a live SELECT, since a fresh instance has no cache to serve
      from"
    test_type: integration
    component_under_test: directory

  - id: AC-005
    given: "Two connection records exist in connections (CELLO_ENV=local,
      real Postgres)"
    when: "the chain verification pass (PERSIST-004) is run against connections"
    then: "the verifier reports 0 chain breaks — the chain_hash column
      extends correctly from the genesis value through both rows;
      the test instantiates a fresh verifier (no prior state) so the
      fresh SELECT to the live database is itself the evidence — no
      in-memory state exists to serve from"
    test_type: integration
    component_under_test: directory

  - id: AC-006
    given: "A row has been inserted into connections by cello_service
      (CELLO_ENV=local, real Postgres)"
    when: "cello_service attempts UPDATE connections"
    then: "PostgreSQL rejects the operation; the row is unchanged; because
      no UPDATE policy exists for cello_service, the rejection error is either
      'ERROR: permission denied for table connections' (if cello_service has no
      UPDATE grant) or 'ERROR: new row violates row-level security policy for
      table connections' (if cello_service has the grant but no permissive
      UPDATE policy exists); either rejection is acceptable — the test asserts
      the operation fails AND the row count is unchanged; the rejection must NOT
      originate from application-layer guarding (verified by issuing the UPDATE
      directly via pg.query() as cello_service, bypassing application code)"
    test_type: integration
    component_under_test: directory

  - id: AC-007
    given: "A connection is written via the directory store against a real
      Postgres instance (CELLO_ENV=local)"
    when: "the INSERT commits successfully"
    then: "connection.persisted is logged at INFO with
      { connectionId, participantA, participantB, correlationId }"
    test_type: integration
    component_under_test: directory

  - id: AC-008
    given: "getConnection(connectionId) is called for a connection_id that
      has no corresponding row (CELLO_ENV=local, real Postgres)"
    when: "the query executes"
    then: "getConnection() returns null — it does not throw; absence of a
      connection record is not itself an error; the fresh PgDirectoryStore
      instance has no in-memory cache, so a null result from a fresh instance
      against a known-empty table confirms the SELECT reached the real database"
    test_type: integration
    component_under_test: directory

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "A connection record shall only be written after the full
      CONNREQ-002 accept flow completes — the directory shall not persist a
      connection for a request that was rejected or never accepted;
      connection_id must match the connection_id issued by CONNREQ-002"
    adversarial_condition: "even when an API caller submits a connection_id
      that was not issued by the directory — the connection acceptance handler
      in PgDirectoryStore validates the connection_id against its own
      connection_requests records before calling the INSERT; if no matching
      pending request is found, the write is rejected before any database write
      occurs; tested by asserting that submitting an arbitrary connection_id
      with no matching request row returns an error and no row is inserted into
      the connections table (verified by asserting row count remains 0);
      NOTE: the connection_requests table is created by the CONNREQ domain
      migrations (M3) — PERSIST-020 depends on those migrations being present"
    test_type: integration
    component_under_test: directory

  - id: SI-002
    statement: "The chain_hash in connections shall be computed server-side
      at INSERT time and never accepted from an external caller — a caller
      cannot inject a pre-computed chain_hash to forge or break the chain"
    adversarial_condition: "even when a request payload includes a chain_hash
      field — the directory ignores it and recomputes from the previous row"
    test_type: unit
    component_under_test: directory

  - id: SI-003
    statement: "Any modification of a persisted connection record — whether
      by superuser UPDATE or by a deleted and re-inserted row — shall be
      detectable by the chain verification pass"
    adversarial_condition: "even when a database superuser modifies
      participant_a, participant_b, or established_at directly — the chain
      verification pass detects the break at the modified row and fires
      db.chain.break.detected"
    test_type: integration
    component_under_test: directory

# ─── Degraded Behavior ──────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While the Postgres write fails transiently when persisting
      a new connection (e.g. connection pool exhausted)"
    fallback: "the directory logs connection.persist.failed at ERROR with
      { connectionId, reason }; the connection establishment protocol event
      is not rolled back — the in-memory state is still updated; the write
      is retried once; if the retry fails, connection.persist.failed fires
      again with attempt: 2; the operator is alerted; a directory restart
      will lose the in-memory connection record — the operator must re-run
      the connection flow to recover"

  - id: DB-002
    condition: "While CELLO_ENV is not local or Postgres is unreachable when
      integration tests run"
    fallback: "all integration ACs in this story skip (not fail) with a clear
      skip message; the static analysis test (migration file existence,
      PERSIST-016) still runs in all environments"

# ─── Observability ──────────────────────────────────────────
observability:
  taxonomy_additions:
    - "connection.persisted — added in PERSIST-020"
    - "connection.persist.failed — added in PERSIST-020"
    # db.chain.break.detected is defined in PERSIST-004 observability section;
    # PERSIST-020 references it in SI-003 but does not own it.
  events:
    - name: connection.persisted
      level: info
      trigger: "a connection record is written to the connections table"
      context_fields: [connectionId, participantA, participantB, correlationId]
      correlationId: true
      # correlationId is required: this event fires at the terminal step of
      # the connection acceptance flow; it must carry the same correlationId
      # minted when the connection request was received so the full
      # request→accept→persist flow is traceable in one query.

  error_events:
    - name: connection.persist.failed
      level: error
      trigger: "the connections table INSERT fails (transient or permanent)"
      context_fields: [connectionId, reason, attempt]

  alarms:
    - condition: "connection.persist.failed fires with attempt: 2 (all
        retries exhausted)"
      fires_to: ops-critical

