# ─── Identity ───────────────────────────────────────────────
id: CELLO-PERSIST-021
domain: Persistence
milestone: M4
actor: DIR
priority: P0
components:
  - directory

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the Directory Node,
  I want every PgDirectoryStore method covered by a real-Postgres round-trip
  integration test, and BIGINT columns deserialized via an explicit per-table
  column type map rather than a runtime regex heuristic,
  so that the class of silent bugs discovered in the first live M4 session —
  BIGINT values silently returned as strings, silent RLS failures for missing
  tables, and schema drift invisible to the stub-based test suite — cannot
  recur after this story is closed.

# ─── Background ─────────────────────────────────────────────
background: >
  The first live M4 agent-to-agent session (2026-05-18) exposed 12 bugs that
  none of the existing integration tests caught. The root cause was not specific
  to the four missing tables (covered by PERSIST-018/019/020) — it was structural:
  every PgDirectoryStore method in PERSIST-001 through PERSIST-015 was tested via
  in-memory stubs. Stubs enforce the programmer's model of the database, not the
  database's actual behaviour.

  Two categories of real-Postgres divergence were confirmed in the live session:

  1. BIGINT-as-string coercion: the pg driver returns BIGINT/BIGSERIAL columns
     as JavaScript strings because int64 cannot be safely represented as float64.
     serializeRecord() applies a runtime regex (/^\d{10,}$/) to coerce suspicious
     values, but the regex is fragile — it misses values numerically valid but
     shorter than 10 digits, and fires on string fields that coincidentally match
     the pattern. The correct fix is a per-table column type map: a static record
     naming each BIGINT column for each table, consulted at read time to apply
     parseInt() only to the declared columns. Tables with BIGINT columns confirmed
     in migrations: conversation_proof_leaves (leaf_index, mmr_position),
     conversation_proof_mmr_nodes (mmr_position), directory_checkpoints
     (mmr_leaf_count), conversation_proof_leaf_checkpoints (leaf_id BIGINT FK),
     and all tables using BIGSERIAL for their id column.

  2. Missing round-trip coverage for pre-M4 tables: because no test exercised a
     real INSERT + SELECT against the actual schema for agent_registrations,
     conversation_seals, conversation_attestations, conversation_participation,
     conversation_proof_leaves, conversation_proof_mmr_nodes, or
     directory_checkpoints, those tables had no real-Postgres verification of type
     fidelity, RLS enforcement, or chain_hash continuity. PERSIST-018/019/020 add
     coverage for the four newly discovered tables. PERSIST-021 closes the gap for
     the pre-M4 tables and establishes CI coverage gates that prevent the pattern
     from recurring.

  The BIGINT column type map is a code change in PgDirectoryStore's
  deserialization layer. The round-trip tests verify it works. The static coverage
  gate fails the CI build if any PgDirectoryStore-owned table lacks write and read
  coverage against a live Postgres instance.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When PgDirectoryStore deserializes a row from any table"
    action: "the store shall consult a static BIGINT_COLUMNS map keyed by table
      name, apply parseInt() to each column listed for that table, and return
      the value as a JavaScript number — the runtime regex heuristic
      (/^\\d{10,}$/) shall not be the primary coercion mechanism"

  - trigger: "When PgDirectoryStore reads a row and encounters a BIGINT column
      whose table is not in BIGINT_COLUMNS"
    action: "the store leaves the value as-is (string); the AC-005 static
      analysis gate catches undeclared columns in CI before they reach
      production; a runtime TypeError was evaluated and rejected because
      the heuristic (/^\\d+$/) over-fires on legitimate all-digit TEXT fields —
      the static gate is the enforcement mechanism"

  - trigger: "When a round-trip integration test writes records to
      conversation_seals via PgDirectoryStore and reads them back"
    action: "the store shall return all BIGINT/BIGSERIAL fields as JavaScript
      numbers, all hex-encoded fields decoded as Uint8Array (merkle_root,
      chain_hash), and the chain_hash shall match the SHA-256 computation
      defined in PERSIST-004 for each row"

  - trigger: "When a round-trip integration test appends MMR leaves and
      requests an inclusion proof via PgDirectoryStore"
    action: "the store shall return a proof path whose sibling hashes
      independently verify against the stored MMR peak in a fresh store instance
      that reads only from the live database"

  - trigger: "When the CI schema-adapter coverage gate runs"
    action: "the gate shall parse the Flyway migration files to enumerate every
      table in STORE_TABLES, then assert that each table has at least one
      integration test that writes a row and reads it back from a live Postgres
      instance; the gate fails the CI build and lists uncovered tables if any
      table in STORE_TABLES lacks write or read coverage"

  - trigger: "When the CI BIGINT coverage gate runs"
    action: "the gate shall parse the Flyway migration files to enumerate every
      BIGINT and BIGSERIAL column in tables owned by PgDirectoryStore, then
      assert that each is declared in BIGINT_COLUMNS; the gate fails the CI build
      and lists undeclared columns if any BIGINT column is absent from the map"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "The BIGINT_COLUMNS map is defined in PgDirectoryStore (or a
      co-located constants module); CELLO_ENV=local; the test opens a live
      TCP connection to localhost:5432 via the real pg package — no mock
      or in-memory substitute; if CELLO_ENV=local and pg.connect() fails,
      the test fails — not skips"
    when: "a row is inserted into each table that has BIGINT or BIGSERIAL
      columns and read back via PgDirectoryStore"
    then: "every declared BIGINT column is returned as a JavaScript number
      (typeof value === 'number' asserted explicitly per column, not just
      truthy); no declared BIGINT column is returned as a string; the test
      names the BIGINT columns it checks for each table — for example:
      leaf_index and mmr_position in conversation_proof_leaves,
      mmr_position in conversation_proof_mmr_nodes,
      mmr_leaf_count in directory_checkpoints — so the assertion is auditable;
      a test that only checks typeof on an anonymous loop variable does NOT
      satisfy this AC"
    test_type: integration
    component_under_test: directory

  - id: AC-002
    given: "conversation_seals is empty for a fresh session UUID
      (CELLO_ENV=local, real Postgres — a stub returning a canned chain does
      NOT satisfy this AC; each test runs inside a transaction that rolls back
      at completion to maintain isolation)"
    when: "three seal records are written to conversation_seals via
      PgDirectoryStore and then read back via readSealChain() (or equivalent
      store method) from a fresh store instance"
    then: "the store returns exactly 3 rows in insertion order; each row's
      chain_hash equals SHA-256(record_contents || previous_chain_hash) where
      the genesis row uses the fixed genesis value defined in PERSIST-004;
      all BIGSERIAL id columns are JavaScript numbers; the chain_hash and
      merkle_root fields are decoded as Uint8Array (they are stored as hex TEXT
      in the schema and decoded at read time by the store); the test constructs
      a fresh PgDirectoryStore instance with no in-memory state for the read —
      the fresh instance having no cache is itself the evidence that the result
      came from a live SELECT"
    test_type: integration
    component_under_test: directory

  - id: AC-003
    given: "agent_registrations is empty for a fresh agent pubkey
      (CELLO_ENV=local, real Postgres; each test runs inside a transaction
      that rolls back at completion)"
    when: "a registration record is written via PgDirectoryStore and then read
      back from a fresh store instance"
    then: "the read-back record contains the correct pubkey_hex and chain_hash;
      chain_hash is a Uint8Array decoded from the TEXT hex stored in the schema;
      the fresh PgDirectoryStore instance has no in-memory state; a null result
      from a fresh instance against a row-containing table would require the
      SELECT to return 0 rows, which is impossible for the freshly inserted row —
      this is the evidence the SELECT reached the live database; verified by
      asserting the round-trip chain_hash bytes equal the bytes written
      (byte-for-byte comparison)"
    test_type: integration
    component_under_test: directory

  - id: AC-004
    given: "conversation_proof_leaves and directory_checkpoints are empty for a
      fresh session; conversation_proof_mmr_nodes is empty (CELLO_ENV=local,
      real Postgres; each test runs inside a transaction that rolls back at
      completion)"
    when: "three MMR leaves are appended via PgDirectoryStore, a checkpoint is
      committed to directory_checkpoints, and an inclusion proof is requested
      for leaf index 1 from a fresh store instance"
    then: "the proof path contains the expected sibling hashes from
      conversation_proof_mmr_nodes; the MMR verification algorithm — run in the
      fresh PgDirectoryStore instance with no in-memory state, reading only from
      the live database — confirms the leaf is included in the checkpoint's
      peak_hash from directory_checkpoints; the proof is verified without any
      further directory query after the initial getInclusionProof() call; all
      BIGINT columns in conversation_proof_leaves (leaf_index, mmr_position),
      conversation_proof_mmr_nodes (mmr_position), and directory_checkpoints
      (mmr_leaf_count) are JavaScript numbers in the returned proof"
    test_type: integration
    component_under_test: directory

  - id: AC-005
    given: "The Flyway migration files in packages/directory/db/migrations/
      have been applied (CELLO_ENV=local is NOT required — this is a static
      analysis test that runs in all environments)"
    when: "a static analysis pass enumerates all columns declared as BIGINT
      or BIGSERIAL across all migration files in tables present in STORE_TABLES,
      and compares them against the BIGINT_COLUMNS map in PgDirectoryStore"
    then: "every BIGINT/BIGSERIAL column in each STORE_TABLES-owned table is
      declared in BIGINT_COLUMNS; the test fails with a diff listing any
      BIGINT/BIGSERIAL column in the migrations that is absent from the map;
      tables not present in STORE_TABLES (e.g. tables owned by the CONNREQ
      domain migrations) are excluded from the diff — STORE_TABLES as defined
      in AC-006 is the authoritative scope boundary; this test runs in CI
      regardless of CELLO_ENV, catching new BIGINT columns from future migrations
      before they cause a production type error"
    test_type: integration
    component_under_test: directory
    notes: "Static coverage gate for the BIGINT type map — mirrors PERSIST-016's
      approach: parse the migration source files (the source of truth) and compare
      against the code. Gate fails on any divergence. Scope is defined by
      STORE_TABLES (AC-006) to avoid false-positive failures for tables owned
      by other domain migrations."

  - id: AC-006
    given: "PgDirectoryStore declares a static STORE_TABLES constant (or
      equivalent discoverable list) enumerating all table names it writes to,
      including the tables added by PERSIST-018/019/020
      (CELLO_ENV=local is NOT required — this is a static analysis test)"
    when: "a CI coverage gate reads STORE_TABLES and the integration test files
      and verifies each table has at least one test that (a) calls a
      PgDirectoryStore write method and (b) reads back the written row from a
      fresh store instance"
    then: "the gate reports a coverage map and fails if any table in STORE_TABLES
      is missing write coverage or read coverage; the gate output names uncovered
      tables explicitly; this gate runs in CI regardless of CELLO_ENV — it checks
      test file content statically (presence of write method call and fresh-
      instance read call per table), not by executing the tests; the scope of
      STORE_TABLES is limited to tables owned by the Persistence domain
      (PERSIST-* stories) — CONNREQ-domain tables that PgDirectoryStore may read
      are out of scope"
    test_type: integration
    component_under_test: directory
    notes: "Structural coverage gate that prevents recurrence of the M4 live-session
      failure pattern: a new table is added (migration + store method) but no
      integration test is written. The gate catches the gap in CI before the next
      live session exposes it in production."

  - id: AC-007
    given: "A row has been inserted into conversation_seals by cello_service
      (CELLO_ENV=local, real Postgres)"
    when: "cello_service attempts UPDATE conversation_seals directly via
      pg.query(), bypassing application code"
    then: "PostgreSQL rejects the operation with a permission denied error
      (ERROR: permission denied for table conversation_seals) because PERSIST-002
      issues REVOKE UPDATE, DELETE ON conversation_seals FROM cello_service;
      the row is unchanged; the rejection must NOT originate from application-layer
      guarding — verified by issuing the UPDATE directly as cello_service without
      going through any PgDirectoryStore method; the row count is asserted
      unchanged after the failed UPDATE"
    test_type: integration
    component_under_test: directory
    notes: "Extends PERSIST-003's RLS coverage to use real Postgres with the
      actual cello_service role executing a direct UPDATE. PERSIST-003's RLS
      setup creates the role and grants; PERSIST-002's V2 migration issues the
      REVOKE — this AC verifies both work together against a live database."

  - id: AC-008
    given: "Five rows are inserted into conversation_seals via PgDirectoryStore
      (CELLO_ENV=local, real Postgres); row 3's merkle_root is then modified
      directly via a superuser UPDATE without recomputing chain_hash"
    when: "the chain verification pass is run against conversation_seals from
      a fresh verifier instance"
    then: "the chain verification pass reports exactly one chain break at row 3;
      db.chain.break.detected is logged at ERROR with { tableName:
      'conversation_seals', breakAtSequence: 3, storedHash, recomputedHash }
      — field names must match the canonical PERSIST-004 definition exactly;
      the verifier reads only from the live database — a fresh instance with no
      in-memory state is itself the evidence that the chain break was detected
      via a real SELECT, not from cached state"
    test_type: integration
    component_under_test: directory

  - id: AC-009
    given: "A write to any PgDirectoryStore-owned table succeeds against a live
      Postgres instance (CELLO_ENV=local, real Postgres)"
    when: "the INSERT commits successfully"
    then: "adapter.persisted is logged at INFO with { tableName, rowCount: 1,
      durationMs, correlationId }; this event fires for all tables in STORE_TABLES
      including the pre-M4 tables (agent_registrations, conversation_seals,
      conversation_proof_leaves, directory_checkpoints); verified by asserting
      the event fires in the round-trip tests from AC-002, AC-003, and AC-004
      — each round-trip test installs a log spy and explicitly asserts
      adapter.persisted fires with tableName matching the table under test"
    test_type: integration
    component_under_test: directory

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "PgDirectoryStore shall never silently coerce a BIGINT column
      using a fragile runtime heuristic — declared BIGINT columns shall be
      coerced via the explicit BIGINT_COLUMNS map using parseInt(); undeclared
      columns are left as-is (string), and the AC-005 static gate catches them
      in CI; the runtime regex heuristic (/^\\d{10,}$/ or /^\\d+$/) is removed
      because it over-fires on legitimate all-digit TEXT fields and creates
      false-positive failures unrelated to BIGINT type safety"
    adversarial_condition: "even when a new migration adds a BIGINT column to
      an existing table and the developer omits it from BIGINT_COLUMNS — the
      AC-005 static gate will fail CI before the change reaches production;
      the correct BIGINT values for declared columns are coerced to number
      via parseInt() at read time, not via a heuristic that cannot distinguish
      BIGINT columns from TEXT columns storing numeric content"
    test_assertion: "A test temporarily removes a known BIGINT column (e.g.
      agent_registrations.id) from BIGINT_COLUMNS, inserts a row, and reads it
      back via deserializeRow. The test asserts the column value is returned as
      a string (the undeclared column is left as-is). The test then restores the
      column in BIGINT_COLUMNS and asserts the read returns typeof === 'number'.
      Verified against a live Postgres instance (CELLO_ENV=local, real pg package)."
    test_type: integration
    component_under_test: directory

  - id: SI-002
    statement: "The chain_hash on any append-only table shall never be
      accepted from an external caller — it is always computed server-side
      from the PERSIST-004 hash formula at INSERT time, using the previous row
      read from the live database"
    adversarial_condition: "even when a write request payload includes a
      chain_hash field — the store ignores the caller-supplied value and
      recomputes from the previous row read from the live database; this
      extends PERSIST-004 SI-002 (which specifies the invariant) by adding
      real-Postgres verification — PERSIST-004's SI-002 is unit-test-level
      only and does not verify the behavior against the actual schema"
    test_assertion: "A test writes a record to conversation_seals via
      PgDirectoryStore with an explicit crafted chain_hash in the payload
      (set to 32 bytes of 0xFF to be obviously wrong). The test reads back
      the row from the live database and asserts: (a) the stored chain_hash
      does NOT match the crafted value, and (b) the stored chain_hash DOES
      match SHA-256(record_contents || previous_chain_hash) computed using the
      previous row from the live database. Verified against a live Postgres
      instance (CELLO_ENV=local)."
    test_type: integration
    component_under_test: directory

# ─── Degraded Behavior ──────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While CELLO_ENV is not local or Postgres is unreachable when
      integration tests run"
    fallback: "all integration ACs in this story that require a live Postgres
      connection skip (not fail) with a clear skip message naming the missing
      environment; AC-005 and AC-006 (static analysis gates) run in all
      environments regardless of CELLO_ENV because they do not require a live
      database connection; if CELLO_ENV=local and pg.connect() fails,
      the integration tests fail — not skip — because the developer explicitly
      requested a live check"
    test_type: integration
    component_under_test: directory

  - id: DB-002
    condition: "While the BIGINT_COLUMNS map is incomplete (a new migration
      adds a BIGINT column not yet declared in the map)"
    fallback: "the undeclared column is returned as a string by PgDirectoryStore
      (no runtime TypeError — the heuristic was removed to prevent false-positive
      failures on legitimate all-digit TEXT fields); the AC-005 static analysis
      gate catches the missing declaration in CI before it reaches production;
      developers are expected to run the CI gate locally before merging migrations"
    test_type: integration
    component_under_test: directory

# ─── Observability ──────────────────────────────────────────
observability:
  taxonomy_additions:
    - "adapter.persisted — added in PERSIST-021; success-path complement to adapter.write.failed (PERSIST-016)"
    - "adapter.bigint.type.error — proposed in PERSIST-021 but NOT implemented; runtime TypeError enforcement was removed in favour of the AC-005 static gate to avoid false-positive failures on all-digit TEXT columns"
  events:
    - name: adapter.persisted
      level: info
      trigger: "any PgDirectoryStore INSERT commits successfully against the live database"
      context_fields: [tableName, rowCount, durationMs, correlationId]
      correlationId: true
      notes: "correlationId threads through from the calling operation (session
        lifecycle, connection flow, etc.) — not minted by the adapter. If no
        correlationId is present in calling context, the field is omitted rather
        than minted at the adapter layer."

  error_events:
    - name: adapter.bigint.type.error
      level: error
      trigger: "PgDirectoryStore encounters a BIGINT column not declared in
        BIGINT_COLUMNS during row deserialization"
      context_fields: [tableName, columnName, value, correlationId]
      correlationId: true
      notes: "Fires before the TypeError is thrown — the log provides context
        for diagnosing which migration added the undeclared column. value is
        the raw string returned by the pg driver, not a parsed number.
        correlationId is threaded from the calling context if present, omitted
        if not — the same rule as adapter.persisted."

  alarms:
    - condition: "adapter.bigint.type.error fires at any time"
      fires_to: ops-critical
      notes: "A BIGINT type error in production means a migration added a new
        column without updating BIGINT_COLUMNS — data reads are broken for that
        table. Immediate response required."
    - condition: "adapter.persisted is absent for conversation_seals for > 5
        minutes during an active session (inferred from session.started firing
        but no adapter.persisted for conversation_seals within the window)"
      fires_to: ops-warning
      notes: "A prolonged gap between session start and first seal write indicates
        a silent write failure not caught by adapter.write.failed."

