# ─── Identity ───────────────────────────────────────────────
id: CELLO-REDACT-001
domain: Redaction & Governance
actor: CLIENT
priority: P0
components:
  - client

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO Client,
  I want to run all outbound messages that pass Layer 3 through a three-module
  redaction pipeline — secret redaction first, PII redaction second, then
  notification delivery — before any message leaves the system
  so that API keys, personal email addresses, phone numbers, and dollar amounts
  are replaced with placeholders and never appear in delivered content.

  Execution order is an invariant: secret redaction runs before PII redaction.
  This prevents PII patterns from matching inside already-redacted secret
  placeholders (e.g., a PII pattern that matches inside '[REDACTED_SECRET]' would
  produce confusing double-redaction output if PII ran first).

# ─── Behavior (EARS) ───────────────────────────────────────
behavior:
  - trigger: "When Layer 3 passes an outbound message to Layer 4"
    action: "the client shall run the three redaction modules in strict order:
      (1) secret redaction, then (2) PII redaction, then (3) hand off to the
      notification delivery path"

  - trigger: "When secret redaction runs"
    action: "the client shall match and replace secrets across the following formats:
      OpenAI-style API keys (sk-...), Google API keys (AIza...), Slack bot tokens
      (xoxb-...), Slack user tokens (xoxp-...), GitHub personal access tokens
      (ghp_... and classic formats), Telegram bot tokens (digits:alphanum),
      generic Bearer tokens, and any other credential format in the configured
      secret pattern set; each match is replaced with the placeholder
      '[REDACTED_SECRET]'"

  - trigger: "When PII redaction runs"
    action: "the client shall match and replace: personal email addresses (matched
      against a maintained list of personal email providers including gmail, yahoo,
      hotmail, outlook, icloud, and equivalent — work-domain addresses pass
      unchanged), phone numbers in international and local formats, and dollar
      amounts; each match is replaced with the appropriate placeholder
      ('[REDACTED_EMAIL]', '[REDACTED_PHONE]', '[REDACTED_AMOUNT]')"

  - trigger: "When the personal email provider list is evaluated"
    action: "the client shall match the domain portion of email addresses against
      the maintained provider list; work-domain email addresses (non-personal
      domains not on the list) shall pass through unchanged; the provider list
      is a maintained artifact, not a static hardcoded set"

  - trigger: "When the redaction pipeline completes"
    action: "the client shall hand the redacted text to the notification delivery
      path; the original unredacted text shall not be retained beyond the pipeline
      execution scope"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "An outbound message containing an OpenAI API key (sk-...)"
    when: "Secret redaction runs"
    then: "The key is replaced with '[REDACTED_SECRET]'; no characters of the
      original key remain in the output"
    test_type: unit
    component_under_test: client

  - id: AC-002
    given: "An outbound message containing a GitHub personal access token (ghp_...)"
    when: "Secret redaction runs"
    then: "The token is replaced with '[REDACTED_SECRET]'"
    test_type: unit
    component_under_test: client

  - id: AC-003
    given: "An outbound message containing a personal email address
      (e.g., user@gmail.com)"
    when: "PII redaction runs"
    then: "The personal email address is replaced with '[REDACTED_EMAIL]'"
    test_type: unit
    component_under_test: client

  - id: AC-004
    given: "An outbound message containing a work-domain email address
      (e.g., user@example-corp.com, a domain not on the personal provider list)"
    when: "PII redaction runs"
    then: "The work-domain address passes through unchanged"
    test_type: unit
    component_under_test: client

  - id: AC-005
    given: "An outbound message containing a phone number in international format
      (e.g., +1-555-123-4567)"
    when: "PII redaction runs"
    then: "The phone number is replaced with '[REDACTED_PHONE]'"
    test_type: unit
    component_under_test: client

  - id: AC-006
    given: "An outbound message containing a dollar amount (e.g., '$42,000')"
    when: "PII redaction runs"
    then: "The dollar amount is replaced with '[REDACTED_AMOUNT]'"
    test_type: unit
    component_under_test: client

  - id: AC-007
    given: "An outbound message containing a secret placeholder '[REDACTED_SECRET]'
      that also contains character sequences that would match a PII pattern if
      evaluated on the placeholder string itself"
    when: "Secret redaction runs first, then PII redaction runs second"
    then: "The PII pattern does not match inside the placeholder; the output
      contains '[REDACTED_SECRET]' without double-redaction artifacts"
    test_type: unit
    component_under_test: client

  - id: AC-008
    given: "An outbound message containing both a secret and a personal email
      address"
    when: "Both redaction modules run in order"
    then: "The output contains both '[REDACTED_SECRET]' and '[REDACTED_EMAIL]';
      both substitutions are correct and non-overlapping"
    test_type: unit
    component_under_test: client

  - id: AC-009
    given: "An outbound message with no secrets or PII"
    when: "The redaction pipeline runs"
    then: "The message passes through unchanged; no placeholder substitutions
      are made"
    test_type: unit
    component_under_test: client

# ─── Security Invariants ───────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "Secret redaction shall always run before PII redaction"
    adversarial_condition: "even when a developer refactors the pipeline and
      reorders the modules — the execution order is an invariant enforced by the
      pipeline structure, not convention"
    test_type: unit
    component_under_test: client

  - id: SI-002
    statement: "The personal email provider list shall not be a static hardcoded
      set in the source code"
    adversarial_condition: "even when the list is initialized from a constant at
      startup — the list must be a maintained configuration artifact so that new
      personal email providers can be added without a code change"
    test_type: unit
    component_under_test: client

