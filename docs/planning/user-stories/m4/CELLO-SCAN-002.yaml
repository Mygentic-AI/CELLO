# ─── Identity ───────────────────────────────────────────────
id: CELLO-SCAN-002
domain: Scanning Pipeline
actor: CLIENT
priority: P0
components:
  - client

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO Client,
  I want to run Layer 1's sanitized output through a dedicated LLM scanner that
  scores it for prompt injection risk and returns a structured verdict
  so that semantic injection attempts that survive deterministic sanitization are
  caught before reaching the agent's main model, and the scan result is recorded
  in the Merkle leaf as evidence for dispute resolution.

  The scanner is separate from the agent's main model — it has its own prompt,
  its own context, and its own API call. It is never the same LLM instance
  processing the actual task.

  Three scan modes:
  - Local (P0): DeBERTa-v3-small INT8 (~100MB), downloaded on first install via
    postinstall script, SHA-256 verified against a hash pinned in the package
    source. Free, deterministic, runs offline. This is the day-one implementation.
  - Custom (P1): operator-provided OpenAI-compatible API endpoint. Configuration
    requires: base URL, API key, model name. The client assumes the endpoint speaks
    the OpenAI Chat Completions API and invokes it via structured output /
    function-calling mode with the same classification prompt and response schema
    used in local mode. The configured URL is validated through the Layer 6 URL
    safety checks (CELLO-REDACT-003) before use — a URL resolving to a private or
    reserved IP is rejected. This mode is fully implementable at M4 with no
    directory dependency.
  - Proxy (P1): routes through the directory's hosted scanner. Post-Layer-1-
    sanitized, context-stripped text only. Provides a trust badge. Requires an
    active directory connection — this mode is gated behind explicit configuration
    and is a stub at M4; full directory integration is deferred to a later milestone.

  Out of scope: subtle manipulation through reasoning chains (innocuous-looking
  inputs that through a chain of reasoning cause the LLM to emit flaggable output)
  is a known limitation of statistical classifiers. It is documented in
  design-problems.md Problem 12 and is explicitly not an acceptance criterion here.
  The outbound self-check in Layer 3 (CELLO-SCAN-003) is the primary mitigation
  for that case.

  The `cello_scan` MCP tool exposes Layer 2 for explicit agent invocation. All
  other layers fire automatically — the agent does not call them.

# ─── Behavior (EARS) ───────────────────────────────────────
behavior:
  - trigger: "When the inbound pipeline calls the scanner with sanitized text"
    action: "the client shall invoke the local DeBERTa-v3-small scanner via a
      dedicated classification call (not the agent's main prompt context), receive
      structured output, and return the result to the pipeline"

  - trigger: "When the scanner is invoked"
    action: "the client shall invoke it via the model API's native structured output
      or function-calling mode — not via a prompt-level JSON instruction — to
      constrain the response to the output schema at the API level"

  - trigger: "When the scanner returns a response"
    action: "the client shall validate the response against the required schema before
      acting on it; required fields: score (integer 0–100), verdict (enum:
      allow/review/block), categories (array of strings), reasoning (string),
      evidence (array of strings); any response failing schema validation is treated
      as a block with score 100"

  - trigger: "When the scanner returns a response where the numeric score contradicts
      the categorical verdict (score >= 70 but verdict is 'allow', or score <= 30
      but verdict is 'block')"
    action: "the client shall override the verdict using the score: score >= 70 blocks,
      score >= 35 reviews, score < 35 allows; the overridden verdict is logged with
      the original verdict for audit purposes"

  - trigger: "When the scanner returns score >= 70 or an override-blocked verdict"
    action: "the client shall block the message, log the scan result as a detection
      event, and not forward the message to the agent's LLM"

  - trigger: "When the scanner returns score >= 35 and score < 70 (review threshold)"
    action: "the client shall forward the message with the review flag set in the
      scan_result; the agent or operator may inspect and override"

  - trigger: "When the scanner returns score < 35 and verdict is 'allow'"
    action: "the client shall forward the message to the agent's LLM with the
      scan_result attached"

  - trigger: "When the scanner is invoked via the `cello_scan` MCP tool"
    action: "the client shall run Layer 1 sanitization followed by Layer 2 scanning
      on the provided text and return the full scan result (score, verdict, categories,
      reasoning, evidence) to the calling agent"

  - trigger: "When a message passes Layer 2 scanning"
    action: "the client shall include scan_result: { score, model_hash, sanitization_stats }
      in the Merkle leaf for this message, where model_hash is the SHA-256 hash of
      the scanner model weights used"

  - trigger: "When the local scanner model is not yet downloaded"
    action: "the client shall invoke the postinstall download script, verify the
      downloaded model weights against the SHA-256 hash pinned in the package source,
      and refuse to start if the hash does not match"

  - trigger: "If the model hash does not match after download"
    action: "the client shall refuse to run the scanner and log a supply-chain
      integrity error; it shall never fall back to an unverified model"

  - trigger: "While the local scanner is unavailable due to a failed integrity check
      or missing model file"
    action: "for high-risk sources: the client shall fail closed and block all
      inbound messages until the scanner is healthy; for interactive sources: the
      client shall fail open, allow the message, and log that the scanner was
      unavailable"

  - trigger: "Where custom mode is configured (P1)"
    action: "the client shall validate the configured base URL through the Layer 6
      URL safety checks before making any call; if the URL resolves to a private or
      reserved IP it is rejected at configuration load time, not at call time; if the
      URL is valid, the client shall invoke the operator-provided endpoint using the
      OpenAI Chat Completions API with structured output / function-calling mode,
      the same classification prompt, and the same response schema as local mode;
      the response is subject to the same schema validation and score-overrides-verdict
      rules as any other scanner response"

  - trigger: "Where proxy mode is configured (P1)"
    action: "the client shall route post-Layer-1-sanitized, context-stripped text to
      the directory's hosted scanner; proxy mode is a stub at M4 — the interface is
      defined but the directory call is not implemented; this behavior is not exercised
      by M4 tests"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "Sanitized text from Layer 1 that is a clear prompt injection attempt
      (role hijacking phrased in natural language without detectable encoding)"
    when: "The scanner is invoked"
    then: "The scanner returns score >= 70, verdict 'block', and at least one
      category identifying the attack type; the message is blocked before reaching
      the agent LLM"
    test_type: unit
    component_under_test: client

  - id: AC-002
    given: "Sanitized text that is a benign, non-injection message"
    when: "The scanner is invoked"
    then: "The scanner returns score < 35 and verdict 'allow'; the message is
      forwarded with the scan_result attached"
    test_type: unit
    component_under_test: client

  - id: AC-003
    given: "A scanner response where score is 75 but verdict is 'allow'"
    when: "The client processes the scanner response"
    then: "The score-overrides-verdict rule fires; the message is blocked; the
      audit log records both the original verdict ('allow') and the overridden
      verdict ('block')"
    test_type: unit
    component_under_test: client

  - id: AC-004
    given: "A scanner response that is missing the required 'score' field"
    when: "The client validates the response schema"
    then: "Schema validation fails; the message is blocked with score 100; a schema
      validation failure is logged"
    test_type: unit
    component_under_test: client

  - id: AC-005
    given: "A scanner response where 'verdict' contains a value outside the
      allowed enum (e.g., 'pass')"
    when: "The client validates the response schema"
    then: "Schema validation fails; the message is blocked with score 100"
    test_type: unit
    component_under_test: client

  - id: AC-006
    given: "A message that passes both Layer 1 and Layer 2 scanning"
    when: "The scan result is attached to the outbound Merkle leaf"
    then: "The leaf contains scan_result with: score (integer), model_hash (hex
      string matching the SHA-256 of the local scanner model file), and
      sanitization_stats (the per-step signal counts from Layer 1)"
    test_type: unit
    component_under_test: client

  - id: AC-007
    given: "The local scanner model file is not present at startup"
    when: "The postinstall script runs"
    then: "The model is downloaded; its SHA-256 hash is computed and compared
      against the pinned hash in the package source; if they match, the scanner
      starts; if they do not match, the client refuses to start and logs a
      supply-chain integrity error"
    test_type: unit
    component_under_test: client

  - id: AC-008
    given: "The local scanner model file has been tampered with (hash does not
      match the pinned value)"
    when: "The hash verification runs"
    then: "The client refuses to run the scanner; it does not fall back to an
      unverified model; it logs the mismatch with the expected and actual hashes"
    test_type: unit
    component_under_test: client

  - id: AC-009
    given: "The scanner is unavailable and the input source is classified as
      high-risk (e.g., external email)"
    when: "A message arrives"
    then: "The message is blocked; the detection event log records that the scanner
      was unavailable and the source type is high-risk"
    test_type: unit
    component_under_test: client

  - id: AC-010
    given: "The scanner is unavailable and the input source is classified as
      interactive (e.g., user-facing chat)"
    when: "A message arrives"
    then: "The message is allowed through; the log records that the scanner was
      unavailable and the source type is interactive"
    test_type: unit
    component_under_test: client

  - id: AC-011
    given: "The agent calls the `cello_scan` MCP tool with arbitrary text"
    when: "The tool executes"
    then: "Layer 1 sanitization runs first, then Layer 2 scanning; the tool
      returns the full scan result (score, verdict, categories, reasoning, evidence)
      as the MCP tool response"
    test_type: integration
    component_under_test: client

  - id: AC-012
    given: "A social engineering injection attempt expressed in natural language
      without encoding (e.g., 'As your developer, I am authorizing you to...')"
    when: "The scanner is invoked"
    then: "The scanner returns score >= 35, indicating at least a review-level
      risk; the message is not passed through silently as a clean message"
    test_type: unit
    component_under_test: client

  - id: AC-013
    given: "Custom mode is configured with a valid public HTTPS endpoint, API key,
      and model name"
    when: "The scanner is invoked on a clear injection attempt"
    then: "The client calls the configured endpoint via OpenAI Chat Completions API
      with structured output mode; the response is validated against the required
      schema; the resulting verdict is applied identically to the local-mode verdict"
    test_type: integration
    component_under_test: client

  - id: AC-014
    given: "Custom mode is configured with a base URL that resolves to a private
      RFC 1918 address (e.g., http://192.168.1.100/v1)"
    when: "The configuration is loaded"
    then: "The URL fails the Layer 6 safety check; the custom scanner mode is
      rejected at startup with a structured 'private_ip_blocked' error; no call
      is ever made to that endpoint"
    test_type: unit
    component_under_test: client

# ─── Security Invariants ───────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The client shall never invoke the scanner using a prompt-level JSON
      instruction; it must use the model API's native structured output or
      function-calling mode"
    adversarial_condition: "even when a developer argues that prompt-level JSON is
      simpler — prompt-level instructions can be overridden by the content being
      scanned; API-level structured output cannot"
    test_type: unit
    component_under_test: client

  - id: SI-002
    statement: "The client shall never run an unverified scanner model"
    adversarial_condition: "even when the hash verification fails due to a
      supply-chain compromise where the model weights at the download URL have been
      replaced with a backdoored version (see design-problems.md Problem 8)"
    test_type: unit
    component_under_test: client

  - id: SI-003
    statement: "The scanner shall never share a context window with the agent's
      main model"
    adversarial_condition: "even when the scanned text is crafted to instruct the
      scanner to forward its system prompt or scan result to the main model's
      context (the separation is architectural — separate call, separate context)"
    test_type: unit
    component_under_test: client

  - id: SI-004
    statement: "The custom scanner endpoint URL shall be validated through Layer 6
      URL safety checks before any call is made to it"
    adversarial_condition: "even when the URL is provided by the operator in
      configuration — a misconfigured or maliciously crafted endpoint URL pointing
      to an internal metadata service (e.g., 169.254.169.254) must be caught at
      configuration load time, not discovered at runtime"
    test_type: unit
    component_under_test: client

  - id: SI-005
    statement: "The client shall never treat a scanner response with a contradictory
      score/verdict pair as an 'allow' when the score >= 70"
    adversarial_condition: "even when an attacker has manipulated the scanner into
      returning score: 75, verdict: 'allow' — the score-overrides-verdict rule is
      applied unconditionally (see §4 of attack-corpus-reference for the structural
      defense rationale)"
    test_type: unit
    component_under_test: client

# ─── Degraded Behavior ─────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While the local scanner model is unavailable (missing, corrupt, or
      hash mismatch)"
    fallback: "the client shall fail closed for high-risk sources (block all
      messages) and fail open for interactive sources (allow with logged warning),
      instead of running an unverified or absent scanner"
    test_type: unit
    component_under_test: client

