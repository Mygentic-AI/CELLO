# ─── Identity ───────────────────────────────────────────────
id: CELLO-PERSIST-023
domain: Persistence
milestone: M5
actor: DIR
priority: P1
components:
  - directory

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO Directory Node,
  I want notification delivery backed by the pending_notifications
  database table so that SEAL_UNILATERAL notifications survive
  directory restarts and are delivered reliably when the absent
  party reconnects, regardless of which directory node they connect to.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When a SEAL_UNILATERAL notification is queued for
      an absent party"
    action: "the directory writes one row to pending_notifications
      with: notification_id UUID, recipient_agent_id, notification_type,
      payload JSONB, created_at, delivered_at NULL; the row replicates
      to all three directory nodes via logical replication; the
      notification is not lost if the directory process restarts
      before the absent party reconnects"

  - trigger: "When the absent party connects to any directory node"
    action: "the directory queries pending_notifications for all
      undelivered rows where recipient_agent_id matches and
      delivered_at IS NULL; it delivers each notification to the
      agent over the established signaling stream; on delivery
      acknowledgement from the agent, the directory sets
      delivered_at = now() on that row"

  - trigger: "When a notification is acknowledged by the recipient"
    action: "the directory deletes the pending_notifications row;
      subsequent reconnects by the same agent find no row for that
      notification_id; the row deletion is the canonical signal
      that delivery is complete — consistent with PERSIST-015's
      'append-only, deleted on acknowledgement' model"

  - trigger: "When the absent party connects to a different
      directory node than the one that queued the notification"
    action: "the connecting node queries its own pending_notifications
      table (which holds the replicated row); it delivers the
      notification from its local replica; no cross-node RPC
      is required for notification delivery — replication
      makes the notification available on all nodes"

  - trigger: "When CELLO_ENV=local"
    action: "InMemoryNotificationQueue is used (M4 implementation);
      the database-backed PgNotificationQueue is not instantiated;
      the in-memory queue does not survive process restarts"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "No pending_notifications table exists in M4 migrations
      (PERSIST-015 described it as a future M5 table — it was not
      created in any M4 migration file)"
    when: "the V20 migration is applied"
    then: "the pending_notifications table is created with columns:
      notification_id UUID NOT NULL UNIQUE, recipient_agent_id TEXT
      NOT NULL, notification_type TEXT NOT NULL, payload JSONB NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(); an index exists on
      (recipient_agent_id) for efficient undelivered query; RLS is enabled
      with insert_only and select_all policies; cello_service has
      INSERT, SELECT, and DELETE — no UPDATE is permitted; DELETE is
      required for acknowledged-row cleanup (rows are deleted on
      acknowledgement, not retained) — verified by querying
      information_schema.columns, pg_indexes, and pg_policies from a
      separate database connection; attempting UPDATE returns permission
      denied"
    test_type: integration
    component_under_test: directory

  - id: AC-002
    given: "A SEAL_UNILATERAL notification is queued for agent B
      while agent B is offline"
    when: "the directory process is restarted"
    then: "after restart, querying pending_notifications from a
      separate database connection returns the notification row
      with delivered_at IS NULL — the notification was not lost
      during the restart"
    test_type: integration
    component_under_test: directory

  - id: AC-003
    given: "A SEAL_UNILATERAL notification is written on node-1
      (us-east-1) while agent B is offline"
    when: "agent B reconnects to node-2 (eu-central-1)"
    then: "node-2's pending_notifications table contains the
      replicated notification row; node-2 delivers the notification
      to agent B over the established stream; no RPC to node-1
      is required — verified by stopping node-1 after the
      notification is written and confirming delivery from node-2
      as a separate OS process"
    test_type: e2e
    component_under_test: directory

  - id: AC-004
    given: "Agent B receives the SEAL_UNILATERAL notification
      and sends an acknowledgement"
    when: "the acknowledgement is processed by the directory"
    then: "the pending_notifications row for that notification_id
      is deleted from the table; a subsequent query for that
      notification_id from a separate database connection returns
      no row; a subsequent reconnect by agent B returns no
      undelivered notifications — verified by querying
      pending_notifications from a separate database connection
      after the acknowledgement and asserting the row count
      decreased"
    test_type: integration
    component_under_test: directory

  - id: AC-005
    given: "The NotificationQueue interface is defined in
      packages/interfaces/ (M4)"
    when: "PgNotificationQueue is inspected"
    then: "it implements NotificationQueue with enqueue(agentId,
      notification) and drainUndelivered(agentId) methods;
      drainUndelivered returns all unacknowledged rows for that
      agentId; acknowledge(notificationId) deletes the row —
      consistent with PERSIST-015's 'deleted on acknowledgement'
      model — verified by reading the implementation and running
      unit tests"
    test_type: unit
    component_under_test: directory

  - id: AC-006
    given: "Agent B has two pending notifications and reconnects"
    when: "drainUndelivered is called for agent B's agent_id"
    then: "both notifications are returned in created_at ASC
      order; after both are acknowledged, a second call to
      drainUndelivered returns an empty array — verified by
      a unit test with a real Postgres connection (not an
      in-memory stub)"
    test_type: integration
    component_under_test: directory

  - id: AC-007
    given: "CELLO_ENV=local"
    when: "a notification is queued and the process restarts"
    then: "the InMemoryNotificationQueue (M4) is used; the
      notification is lost on restart; this is the documented
      and expected behaviour for local development — verified
      by asserting the composition root selects InMemoryNotificationQueue
      when CELLO_ENV=local"
    test_type: unit
    component_under_test: directory

  - id: AC-008-idempotency
    given: "The V20 pending_notifications schema migration has been
      applied once to a database that already has V1–V19 applied"
    when: "flyway migrate is run a second time against the same database"
    then: "flyway exits 0 with no new rows in flyway_schema_history;
      the CREATE TABLE for pending_notifications uses IF NOT EXISTS;
      the CREATE INDEX uses IF NOT EXISTS; running V20 twice is safe —
      verified by applying V20 twice and asserting flyway_schema_history
      row count does not change on the second run"
    test_type: integration
    component_under_test: directory

  - id: AC-009-table-extra-excluded
    given: "A pending_notifications row is inserted via
      PgNotificationQueue.enqueue() without a delivered_at value
      (delivered_at is nullable — it is only set when the notification
      is delivered, not at enqueue time; per V20 schema, the column
      definition should omit delivered_at entirely since rows are
      deleted on acknowledgement — but if delivered_at is retained as
      a nullable tracking column, this AC applies)"
    when: "the row is read back via a fresh PgNotificationQueue instance
      and any chain verification or round-trip integrity check runs"
    then: "if delivered_at or any other nullable column is present in
      the schema but NOT set at enqueue() time, it must be declared in
      TABLE_EXTRA_EXCLUDED for pending_notifications in PgNotificationQueue
      (or PgDirectoryStore, whichever holds the map); an integration test
      with CELLO_ENV=local against a real Postgres instance confirms the
      round-trip reads back correctly without a NULL-induced hash
      mismatch; a stub returning a canned row does NOT satisfy this AC
      (lesson from M4 bug #7: nullable columns absent at INSERT time
      appear in SELECT as NULL and silently break chain hash verification
      if not excluded from record_contents)"
    test_type: integration
    component_under_test: directory

  - id: AC-010-dist-freshness
    given: "pnpm run typecheck has been run from the repo root
      (this rebuilds dist/ via tsc --build)"
    when: "dist/server.js is grepped for any notification-related
      handler or tool name that PgNotificationQueue introduces in
      the directory server"
    then: "every expected name is present in dist/server.js;
      absence is a blocking failure — the registration is missing
      or dist was not rebuilt; this check must be in the completion
      gate before any smoke test; vitest transpiles source on the fly
      and never reads dist/ (lesson from M4 addendum 3)"
    test_type: integration
    component_under_test: directory

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "A pending_notifications row shall only be deleted
      upon explicit acknowledgement from the recipient agent —
      the directory service is the only caller of acknowledge();
      no background cleanup or TTL process deletes unacknowledged rows"
    adversarial_condition: "even when the notification queue grows
      large — unacknowledged rows are never automatically deleted;
      cello_service has INSERT, SELECT, and DELETE (DELETE is required
      for acknowledged-row cleanup); no UPDATE is needed or permitted"
    test_type: integration
    component_under_test: directory

  - id: SI-002
    statement: "The receiving agent shall validate a delivered
      SEAL_UNILATERAL notification payload against its own local
      session state before taking any action"
    adversarial_condition: "even when the directory delivers a
      well-formed notification — a compromised cello_service role
      could INSERT a fabricated SEAL_UNILATERAL notification with
      an arbitrary sessionId; the receiving agent verifies the
      sealedRoot in the notification matches the root it would
      compute from its own local Merkle state; a mismatch is logged
      at WARN with session.unilateral.mismatch but no further
      protocol action is taken — the session is already closed"
    test_type: integration
    component_under_test: directory

  - id: SI-003
    statement: "A notification shall be delivered at most once —
      acknowledge() deletes the row; drainUndelivered returns only
      rows still present in the table; acknowledged notifications
      are not re-delivered on subsequent reconnects"
    adversarial_condition: "even when the agent reconnects
      multiple times — the deletion ensures idempotent delivery;
      the acknowledge call is idempotent (deleting a non-existent
      row is a no-op)"
    test_type: unit
    component_under_test: directory

# ─── Degraded Behavior ──────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While the absent party never reconnects after
      a unilateral seal"
    fallback: "the pending_notifications row remains unacknowledged
      indefinitely; no follow-up action is required; the session is
      closed regardless of whether the notification is ever delivered;
      the 24-hour ops-warning alarm gives operators visibility into
      long-undelivered notifications"
    test_type: unit
    component_under_test: directory

  - id: DB-002
    condition: "While the directory is restarted between
      delivering the notification and receiving the acknowledgement"
    fallback: "on the next reconnect by the agent, drainUndelivered
      returns the same notification again (delivered_at IS still
      NULL); the agent receives a duplicate notification and
      must handle idempotent re-delivery; the directory sends
      the notification again and waits for acknowledgement"
    test_type: integration
    component_under_test: directory

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: pending_notification.queued
      level: info
      trigger: "a notification is written to pending_notifications"
      context_fields: [notificationId, recipientAgentId,
        notificationType]
      correlationId: false
      notes: "Distinct from notification.queued (PERSIST-019), which is
        emitted by the general DirectoryNotification queue (notification_queue
        table) with fields [pubkeyHex, notificationType, correlationId].
        These are different tables, different implementations, and different
        field shapes — using the same event name would break any alert or
        dashboard that watches notification.queued."

    - name: notification.delivered
      level: info
      trigger: "a notification is delivered and acknowledged
        by the recipient"
      context_fields: [notificationId, recipientAgentId,
        notificationType, deliveryLatencyMs]
      correlationId: false

  error_events:
    - name: notification.delivery.failed
      level: warn
      trigger: "directory fails to deliver a notification over
        the established stream"
      context_fields: [notificationId, recipientAgentId, reason]

  alarms:
    - condition: "pending_notifications rows with delivered_at
        IS NULL and created_at older than 24 hours — indicates
        an agent that has not reconnected after a unilateral seal"
      fires_to: ops-warning

