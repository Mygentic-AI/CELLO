# ─── Identity ───────────────────────────────────────────────
id: CELLO-RELAY-001
domain: Relay
milestone: M5
actor: DIR
priority: P0
components:
  - directory
  - relay

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO Directory Node,
  I want to manage a signed relay pool manifest with continuous health
  checks and latency-based session assignment,
  so that agents are always assigned to a verified, reachable relay
  and degraded relays are automatically excluded from new sessions.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When a directory node starts"
    action: "the directory reads the relay pool manifest from the
      S3 bucket cello-relay-manifest-{env}-{region}; it verifies
      the Ed25519 signature on the manifest using the registered
      public key of the node_id named in the manifest's signer
      field; if verification fails, the directory logs
      relay.manifest.invalid at ERROR with { reason, signerNodeId }
      and halts — it does not accept session assignments with an
      unverified manifest"

  - trigger: "When the relay pool manifest is loaded and verified"
    action: "the directory begins pinging each relay in the manifest
      on a 30-second interval; each ping is a lightweight HTTP GET
      to the relay's health check endpoint at port 4000 inside the
      VPC (GET http://{relay-private-ip}:4000/health); the relay
      responds with HTTP 200 and { relayId, status: 'ok' }; the
      directory records the relay's consecutive failure count and
      last known latency"

  - trigger: "When a relay fails 3 consecutive health check pings"
    action: "the directory marks the relay as unavailable in its
      in-memory relay pool state; relay.health.check.failed is logged
      at WARN with { relayId, consecutiveFailures: 3, reason };
      the relay is excluded from session assignment until it recovers"

  - trigger: "When a relay that was unavailable passes 3 consecutive
      health check pings"
    action: "the directory marks the relay as available again;
      relay.pool.recovered is logged at INFO with { relayId,
      downtimeDurationMs }; the relay becomes eligible for new
      session assignments"

  - trigger: "When a client requests session establishment and
      provides its RTT measurements to known relays"
    action: "the directory assigns the session to the available relay
      with the lowest RTT as reported by the client; if the client
      provides no RTT measurements, the directory assigns the relay
      with the lowest consecutive failure count; if all relays are
      unavailable, the directory returns RELAY_UNAVAILABLE and the
      client retries on a backoff schedule"

  - trigger: "When the relay pool manifest is updated (new relay
      added or removed)"
    action: "the operator uploads a new signed manifest to S3;
      the directory picks up the new manifest on its next startup
      (ECS task restart); the manifest version field increments
      monotonically; a manifest with a lower version than the
      currently loaded manifest is rejected; an in-process reload
      trigger without a restart is deferred to a future milestone —
      at M5 the operator triggers a manifest reload by performing
      a rolling ECS service update"

# ─── Manifest Schema ───────────────────────────────────────
# Canonical relay pool manifest JSON structure.
# See 2026-05-21_1400_m5-infrastructure-decisions Decision 7.
manifest_schema:
  structure: |
    {
      "version": <int, monotonically increasing>,
      "signedBy": "<node_id of signing directory node — lowest node_id>",
      "signature": "<Ed25519 signature hex over canonical JSON of body>",
      "updatedAt": "<ISO 8601 UTC timestamp>",
      "relays": [
        {
          "relayId": "<Ed25519 public key hex>",
          "endpoint": "<WebSocket URL>",
          "region": "<AWS region>",
          "status": "active" | "draining"
        }
      ]
    }
  signing_rules:
    - "signature covers canonical JSON of { version, updatedAt, relays }"
    - "canonical JSON: sorted keys, no whitespace, UTF-8 encoded"
    - "signedBy and signature fields are excluded from the signed payload"
    - "signing key is the node-private-key of the lowest node_id directory node"
    - "clients verify against the signing node's registered public key"
  version_rules:
    - "version is a monotonically increasing integer"
    - "a manifest with version <= currently loaded version is rejected"
    - "no rollback — fix-forward only"
  status_values:
    active: "relay is eligible for new session assignments"
    draining: "relay is excluded from new assignments but continues serving existing sessions"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "A relay pool manifest is stored in S3 signed by the
      directory node with the lowest node_id using its
      node-private-key"
    when: "a directory node starts and loads the manifest"
    then: "the directory verifies the Ed25519 signature against
      the signing node's registered public key; relay.manifest.loaded
      is logged at INFO with { signerNodeId, relayCount,
      manifestVersion }; health check pings begin within 30 seconds
      of startup — verified by inspecting the directory CloudWatch
      logs from a separate process"
    test_type: integration
    component_under_test: directory

  - id: AC-002
    given: "A relay pool manifest with a corrupted signature is
      stored in S3"
    when: "a directory node starts and loads the manifest"
    then: "the directory logs relay.manifest.invalid at ERROR with
      { reason: 'signature_verification_failed', signerNodeId };
      the process exits non-zero; no session assignments are accepted —
      verified by providing a tampered manifest and asserting the
      directory ECS task fails its health check"
    test_type: integration
    component_under_test: directory

  - id: AC-003
    given: "A relay node is running and healthy"
    when: "30 seconds elapse"
    then: "the directory has sent at least one health check ping
      to the relay's health check endpoint; relay.health.check.passed
      is logged at INFO with { relayId, latencyMs }; the relay's
      consecutive failure count is 0 — verified by inspecting
      directory logs from a separate monitoring process"
    test_type: integration
    component_under_test: directory

  - id: AC-004
    given: "A relay node's process is killed"
    when: "3 consecutive health check intervals elapse (≥90 seconds)"
    then: "relay.health.check.failed is logged at WARN with
      { relayId, consecutiveFailures: 3, reason }; the relay is
      marked unavailable in the directory's pool state; a new
      session establishment request returns an assignment that
      does not include the failed relay — verified by attempting
      session establishment from a client process after the relay
      is marked unavailable"
    test_type: e2e
    component_under_test: directory

  - id: AC-005
    given: "A relay that was marked unavailable restarts and passes
      its health check"
    when: "3 consecutive health check pings succeed"
    then: "relay.pool.recovered is logged at INFO with { relayId,
      downtimeDurationMs }; the relay is marked available; the next
      session establishment request may assign the recovered relay —
      verified by confirming the relay appears in session assignments
      from a client process after recovery"
    test_type: e2e
    component_under_test: directory

  - id: AC-006
    given: "All relays in the pool are marked unavailable"
    when: "a client requests session establishment"
    then: "the directory returns RELAY_UNAVAILABLE; relay.pool.unavailable
      is logged at ERROR with { totalRelays, availableCount: 0 };
      the ops-critical alarm fires — verified from a client process
      separate from the directory"
    test_type: integration
    component_under_test: directory

  - id: AC-007
    given: "A client reports RTT measurements of 15ms to relay-A
      and 80ms to relay-B; both relays are available"
    when: "the directory assigns a relay for the session"
    then: "relay-A is assigned (lowest RTT); the assignment is
      returned to the client in the session establishment response —
      verified by the client process asserting the assigned relayId
      matches relay-A's relayId"
    test_type: unit
    component_under_test: directory

  - id: AC-008
    given: "A manifest with version=2 is loaded; the operator
      uploads a manifest with version=1 to S3"
    when: "the directory processes a reload trigger"
    then: "the directory rejects the manifest with
      relay.manifest.version.stale logged at WARN with
      { currentVersion: 2, receivedVersion: 1 }; the existing
      manifest (version=2) remains active"
    test_type: unit
    component_under_test: directory

  - id: AC-009
    given: "relay-X has a valid row in relay_registrations (public
      key registered) but is NOT listed in the current signed relay
      pool manifest; relay-X passes all health checks"
    when: "a client requests session establishment"
    then: "relay-X is never assigned to the session — only relays
      present in the verified manifest are eligible for assignment;
      relay registration alone is not sufficient; verified by
      attempting session establishment and asserting the assigned
      relayId is never relay-X's relayId across 20 consecutive
      session requests from a separate client process"
    test_type: integration
    component_under_test: directory

  - id: AC-010
    given: "infra/sign-manifest.sh is invoked with Environment=dev,
      Region=us-east-1, and a relay definitions JSON file containing
      one active relay entry; no manifest currently exists in the
      cello-relay-manifest-dev-us-east-1 S3 bucket"
    when: "the script completes successfully"
    then: "the S3 bucket contains a new object at the manifest key
      with version=1; the object's signature field verifies using
      Ed25519.verify(signingNodePublicKey, canonicalJSON({ version,
      updatedAt, relays })) — verified by reading the manifest from
      S3 in a separate process, fetching the signing node's public
      key from Secrets Manager under
      cello/dev/directory/node-private-key, deriving the public key
      via @noble/ed25519, and running signature verification; the
      script prints the manifest version and S3 key to stdout on
      success; the script prints a rolling ECS service update command
      that the operator can use to trigger a directory reload"
    test_type: integration
    component_under_test: directory

  - id: AC-011
    given: "a manifest with version=2 is already stored in the S3
      bucket"
    when: "sign-manifest.sh is invoked and produces a new manifest"
    then: "the resulting manifest has version=3 (increments by
      exactly 1 from the current version); if sign-manifest.sh is
      invoked a second time without changes to relay definitions,
      the resulting manifest has a new updatedAt timestamp and
      version=4 — versioning is monotonic and every invocation
      increments the version regardless of whether relay definitions
      changed"
    test_type: integration
    component_under_test: directory

  - id: AC-012
    given: "sign-manifest.sh is invoked with a relay definitions
      file that marks an existing relay as status=draining"
    when: "the resulting manifest is uploaded to S3 and the
      directory reloads (via rolling ECS service update)"
    then: "the directory excludes the draining relay from new
      session assignments while it continues serving existing
      sessions; the draining relay's status is visible in the
      in-memory pool state — verified by the AC-009 mechanism:
      a relay with status draining in the manifest is never
      assigned to new sessions across 20 consecutive session
      establishment requests from a separate client process"
    test_type: integration
    component_under_test: directory

  - id: AC-013
    given: "the signing node's private key secret exists in
      Secrets Manager at cello/{env}/directory/node-private-key
      but its value is an empty placeholder (as created by
      deploy.sh before the operator populates it)"
    when: "sign-manifest.sh is invoked"
    then: "the script exits non-zero with the error message:
      'Signing key is empty — populate
      cello/{env}/directory/node-private-key in Secrets Manager
      before signing the manifest'; no manifest object is uploaded
      to S3 — verified by asserting the S3 object is absent or
      unchanged after the failed invocation"
    test_type: unit
    component_under_test: directory

  - id: AC-014
    given: "infra/scripts/sign-ed25519.js exists in the repository
      and is invoked with a known Ed25519 private key (32-byte hex)
      and a known UTF-8 message string as arguments"
    when: "the script completes"
    then: "it outputs the Ed25519 signature as a lowercase hex
      string to stdout; the signature verifies using
      Ed25519.verify with the public key derived from the private
      key via @noble/ed25519; the script is deterministic — given
      the same private key and message it always produces the same
      signature — verified by running sign-ed25519.js with a fixed
      test key pair and asserting the output matches the expected
      signature value"
    test_type: unit
    component_under_test: directory

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The relay pool manifest shall never be accepted
      without a verified Ed25519 signature from the lowest node_id
      directory node's registered public key"
    adversarial_condition: "even when the manifest contents are
      otherwise valid and the S3 object is present — an invalid
      or missing signature causes the directory to halt rather
      than fall back to an unverified manifest"
    test_type: integration
    component_under_test: directory

  - id: SI-002
    statement: "A relay shall only be assigned to a session if
      it is present in the current verified manifest AND passes
      health checks — being registered in relay_registrations
      alone is not sufficient for session assignment"
    adversarial_condition: "even when a relay has a valid
      registered public key in the directory — it must also
      appear in the signed manifest and be currently available
      to receive new sessions"
    test_type: integration
    component_under_test: directory

  - id: SI-003
    statement: "The manifest version shall never decrease —
      a manifest with a lower version than the currently loaded
      manifest is rejected"
    adversarial_condition: "even when an operator accidentally
      uploads an older manifest version — the directory detects
      the rollback attempt and retains the higher-version manifest"
    test_type: unit
    component_under_test: directory

# ─── Degraded Behavior ──────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While S3 is temporarily unavailable at directory
      startup and the manifest cannot be loaded"
    fallback: "the directory retries the S3 read on a backoff
      schedule; relay.manifest.load.failed is logged at ERROR
      with { reason, attempt }; the directory does not start
      accepting session assignments until the manifest is
      successfully loaded and verified"
    test_type: integration
    component_under_test: directory

  - id: DB-002
    condition: "While all relays are unavailable"
    fallback: "the directory returns RELAY_UNAVAILABLE on all
      session establishment requests; relay.pool.unavailable
      is logged at ERROR; the ops-critical alarm fires; health
      check pings continue on the 30-second interval so the
      directory detects relay recovery automatically"
    test_type: integration
    component_under_test: directory

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: relay.manifest.loaded
      level: info
      trigger: "directory successfully loads and verifies the
        relay pool manifest at startup"
      context_fields: [signerNodeId, relayCount, manifestVersion]
      correlationId: false

    - name: relay.health.check.passed
      level: info
      trigger: "a relay passes a health check ping"
      context_fields: [relayId, latencyMs]
      correlationId: false

    - name: relay.pool.recovered
      level: info
      trigger: "a previously unavailable relay passes 3 consecutive
        health checks"
      context_fields: [relayId, downtimeDurationMs]
      correlationId: false

  error_events:
    - name: relay.manifest.invalid
      level: error
      trigger: "manifest signature verification fails at startup"
      context_fields: [reason, signerNodeId]

    - name: relay.manifest.load.failed
      level: error
      trigger: "directory cannot read manifest from S3 at startup"
      context_fields: [reason, attempt]

    - name: relay.manifest.version.stale
      level: warn
      trigger: "incoming manifest version is lower than current"
      context_fields: [currentVersion, receivedVersion]

    - name: relay.health.check.failed
      level: warn
      trigger: "a relay fails a health check ping"
      context_fields: [relayId, consecutiveFailures, reason]

    - name: relay.pool.unavailable
      level: error
      trigger: "all relays in the pool are marked unavailable"
      context_fields: [totalRelays, availableCount]

  alarms:
    - condition: "relay.manifest.invalid fires at any time"
      fires_to: ops-critical
    - condition: "relay.pool.unavailable fires at any time"
      fires_to: ops-critical

