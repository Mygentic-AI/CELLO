# ─── Identity ───────────────────────────────────────────────
id: CELLO-DEMO-001
domain: DEMO
milestone: M6
actor: CLIENT
priority: P0
components:
  - demo-agent

# ─── Intent ─────────────────────────────────────────────────
story: >
  As a stranger evaluating CELLO,
  I want a demo agent already registered on the network that
  responds to my messages,
  so that I can verify the protocol works end-to-end without
  needing a second party or running my own second agent.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When a registered CELLO agent sends a message to
      the demo agent's AgentID"
    action: "the demo agent receives the message via cello_receive
      and responds with the next message in the per-session sequence
      (tracked by session_id); each new session starts at message 1;
      the sequence is four hardcoded messages delivered one per inbound
      message received; after message 4 (sign-off) the session is closed
      via cello_close_session"

  - trigger: "When the first message in a session is received"
    action: "the demo agent sends: 'Welcome to CELLO. I am the demo
      agent — a simple Node.js process with no LLM attached. Each message
      you send will trigger the next response in a hardcoded sequence of 4.
      This sequence is designed to let you verify the protocol end-to-end.
      Send your next message to continue.'"

  - trigger: "When the second message in a session is received"
    action: "the demo agent sends: 'Message 2 of 4. Your messages arrive
      end-to-end encrypted — I never see them in plaintext, only that a
      message was received. The protocol uses Noise XX for encryption and
      a tamper-evident hash chain links every message in this session.
      Send your next message to continue.'"

  - trigger: "When the third message in a session is received"
    action: "the demo agent sends: 'Message 3 of 4. This conversation
      has been building a cryptographic audit trail since your first message.
      Each message hash is linked to the previous one. When we close, you
      will be able to retrieve a sealed receipt — a tamper-evident proof
      of everything exchanged. Send your final message to trigger sign-off.'"

  - trigger: "When the fourth message in a session is received"
    action: "the demo agent sends: 'Message 4 of 4 — sign-off. The demo
      is complete. Call cello_get_sealed_receipt() to retrieve the
      cryptographic proof of this conversation. The receipt contains your
      message hashes, the Merkle root, and a directory-signed checkpoint.
      Welcome to CELLO.' then calls cello_close_session to seal the session"

  - trigger: "When a fifth or subsequent message arrives in an already
      signed-off session"
    action: "the demo agent sends: 'This session has completed the demo
      sequence and been sealed. Start a new session to run the demo again.'"

  - trigger: "When a connection request is received"
    action: "the demo agent accepts all incoming connection requests
      automatically (no manual approval required for the demo)"

  - trigger: "When the demo agent starts"
    action: "it loads its identity from a key file, connects to the
      CELLO network via @cello-protocol/connect using HTTPS (443) to reach
      the production directory ALB and relay circuit relay path,
      begins listening for inbound sessions, and logs demo.started
      at INFO once the connection is established"

  - trigger: "When the demo agent identity does not exist or has been lost"
    action: "the demo agent operator (Mygentic team) goes through the
      standard Telegram registration ceremony: messages the production
      bot, completes phone + email verification, receives a pre-auth
      token, sets CELLO_REGISTRATION_TOKEN, and calls cello_register(token);
      the resulting identity key file is stored securely and backed up;
      this proves the demo agent registration path exercises the same
      code path as any stranger's registration"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-000
    given: "The production CELLO network with OPS-AGENT-005B deployed
      (pre-auth token flow active)"
    when: "the Mygentic team registers the demo agent via the Telegram bot"
    then: "the full registration ceremony completes: phone verified,
      email OTP verified, pre-auth token delivered; cello_register(token)
      is called from the EC2 instance; FROST DKG completes; cello_status
      returns { registered: true, agentId: '<hex>' }; the identity key
      file is stored at the configured path; this AgentID is published
      in the CELLO README quick-start docs"
    test_type: manual
    component_under_test: demo-agent
    notes: "The demo agent registers via the same path as any stranger.
      If the key is lost, re-registration via the bot is the recovery path.
      Back up the key file immediately after registration."

  - id: AC-001
    given: "An EC2 instance with @cello-protocol/connect installed and a
      registered agent identity"
    when: "the demo agent process starts"
    then: "cello_status returns { registered: true, agentId: '<hex>' };
      AND a query to the production directory agent-lookup endpoint
      confirms the demo agent's AgentID is present and marked reachable;
      demo.connection.failed has not been logged"
    test_type: integration
    component_under_test: demo-agent
    notes: "Transport-level observable: the directory agent-lookup
      confirms the agent registered over the real network, not just
      that a local process returned a value."

  - id: AC-002
    given: "The demo agent is running and reachable on the network"
    when: "another registered CELLO agent sends four sequential messages
      in the same session"
    then: "the demo agent responds with the correct message for each
      position in the sequence (1 through 4); message 1 explains the
      demo and its hardcoded nature; message 4 is the sign-off and
      triggers cello_close_session; demo.message.received and
      demo.response.sent are logged at INFO for each exchange;
      all four responses are delivered to the sender via cello_receive"
    test_type: integration
    component_under_test: demo-agent

  - id: AC-002b
    given: "Two separate sessions open simultaneously with the demo agent"
    when: "each session sends messages independently"
    then: "each session tracks its own position in the sequence
      independently — session A receiving its 3rd message gets message
      3 of 4 regardless of what position session B is at; per-session
      state is keyed by session_id; no cross-session contamination"
    test_type: unit
    component_under_test: demo-agent

  - id: AC-002c
    given: "A session that has received the sign-off (message 4)"
    when: "a fifth message arrives in that session"
    then: "the demo agent responds explaining the session is sealed
      and a new session should be started; cello_close_session is
      not called a second time"
    test_type: unit
    component_under_test: demo-agent

  - id: AC-003
    given: "The demo agent is running"
    when: "a connection request arrives from any registered agent"
    then: "the request is accepted automatically; the session is
      established with a non-null session_id; cello_status on the
      connecting agent shows the session_id matching what the demo
      agent sees; messages can flow in both directions"
    test_type: integration
    component_under_test: demo-agent

  - id: AC-004
    given: "The EC2 instance security group"
    when: "network rules are inspected"
    then: "inbound: SSH from a management IP only (for deployment);
      outbound: HTTPS (443) to 0.0.0.0/0 only — all CELLO connectivity
      (directory ALB, relay via circuit relay path) goes over HTTPS;
      no outbound port 4000 (that is the relay's internal VPC health
      check port, not accessible from EC2 outside the VPC)"
    test_type: manual
    component_under_test: demo-agent
    notes: "The demo agent on EC2 reaches the relay via the libp2p
      circuit relay path through the directory ALB over HTTPS (443).
      Port 4000 is internal VPC only per CONTEXT.md."

  - id: AC-004b
    given: "The demo agent EC2 instance with only HTTPS (443) outbound"
    when: "npx @cello-protocol/connect is started and cello_status is called"
    then: "cello_status returns directory_reachable: true; the libp2p
      connection from the EC2 instance to the directory ALB succeeds
      via WebSocket over HTTPS (443); if this fails with connection
      refused or timeout, the transport path from external clients to
      the directory is broken — the directory ALB must support WebSocket
      upgrade, and the directory must listen on a WebSocket multiaddr;
      additionally, when cello_send is called, the message reaches the
      relay (relay.message.forwarded visible in the relay's CloudWatch
      logs within 10 seconds) — confirming the full data path from
      external client → directory → relay works"
    test_type: integration
    component_under_test: demo-agent
    notes: "This is the transport path verification that catches the Gap 1
      finding: all M0-M4 tests run in-process or on localhost. This AC is
      the first time an external client exercises the real VPC network
      topology. If it fails, the REPOSPLIT-002 transport_path_prerequisite
      note describes the resolution options. This AC MUST pass before
      M6-E2E-001 begins — discovering a broken transport path at the E2E
      gate is too late."

  - id: AC-005
    given: "The demo agent code"
    when: "inspected for external dependencies"
    then: "no LLM backend (no Bedrock, no OpenAI, no Anthropic API);
      no HTTP server exposed; no database; the only dependencies are
      @cello-protocol/connect and Node.js standard library; the response is a
      hardcoded string constant"
    test_type: manual
    component_under_test: demo-agent

  - id: AC-006
    given: "The demo agent process"
    when: "it crashes or is killed"
    then: "a systemd unit file exists at /etc/systemd/system/cello-demo.service
      and is enabled (systemctl is-enabled returns enabled); systemd
      restarts the process automatically; the agent reconnects to the
      CELLO network; demo.connection.failed followed by demo.started
      is observable in journalctl"
    test_type: manual
    component_under_test: demo-agent
    notes: "The systemd unit is provisioned by the EC2 user-data script
      or an Ansible playbook — not a manual step. Verified by:
      sudo systemctl kill cello-demo && sleep 5 && systemctl is-active
      cello-demo (should return 'active')."

  - id: AC-007
    given: "The demo agent's AgentID published in README or quick-start docs"
    when: "a stranger who just installed @cello-protocol/connect sends a message"
    then: "the stranger's agent receives the canned response, proving
      the full protocol works; this AC is verified as part of M6-E2E-001;
      DEMO-001 cannot be marked closed until M6-E2E-001 passes"
    test_type: integration
    component_under_test: demo-agent

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The demo agent's private key material must not be
      extractable from the EC2 instance by an external attacker"
    adversarial_condition: "even when the demo agent's AgentID is
      public and its EC2 instance IP is discoverable, the key file
      is readable only by the demo-agent system user (chmod 600)
      and the instance has no inbound service ports open"
    test_type: manual
    component_under_test: demo-agent

  - id: SI-002
    statement: "The demo agent must not store or log message content
      from conversations"
    adversarial_condition: "even when hundreds of strangers message
      the demo agent, no message content persists on disk or appears
      in logs; only the sequence position (an integer) and session_id
      are tracked in memory; the hardcoded responses are selected by
      position, not by inspecting message content; verified by asserting
      the receive handler does not pass message content to any logger
      or file write"
    test_type: unit
    component_under_test: demo-agent

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: demo.started
      level: info
      trigger: "Demo agent successfully connects to the CELLO network and begins listening"
      context_fields: [agentId, directoryUrl]
      correlationId: false
      notes: "Logged once on startup after cello_status confirms registered=true."

    - name: demo.message.received
      level: info
      trigger: "Inbound message received from any agent"
      context_fields: [senderAgentId, sessionId]
      correlationId: false
      notes: "Message content is never logged. Add to canonical event
        taxonomy in the pipeline discussion log at story close."

    - name: demo.response.sent
      level: info
      trigger: "Canned response sent"
      context_fields: [recipientAgentId, sessionId]
      correlationId: false
      notes: "Add to canonical event taxonomy at story close."

  error_events:
    - name: demo.connection.failed
      level: error
      trigger: "Failed to connect to CELLO network on startup"
      context_fields: [reason, directoryUrl, relayMultiaddr]
      notes: "Add to canonical event taxonomy at story close."

  alarms: []
  notes: "Demo agent is a best-effort service. No pager-level alarms.
    Monitor via periodic health check from a cron job."

# ─── References ─────────────────────────────────────────────
references:
  milestone: M6
  discussion_logs:
    - "2026-05-25_0900_m6-beta-launch-planning"
  depends_on:
    - CELLO-REPOSPLIT-002
    - CELLO-OPS-AGENT-005B
  blocks:
    - CELLO-M6-E2E-001
  notes: "The demo agent code (AC-001 through AC-007) depends only on
    REPOSPLIT-002 and can be implemented immediately. However, AC-000
    (registration of the demo agent identity) requires OPS-AGENT-005B
    to be deployed — the pre-auth token flow must be live before the
    demo agent can register. DEMO-001 cannot close until both the code
    is complete and the demo agent is registered on the production network.
    The EC2 instance is manually provisioned (not IaC) — acceptable for M6
    given single-purpose, low-criticality. Document the provisioning steps
    in a runbook (user-data script or Ansible playbook) so re-creation
    is repeatable without institutional knowledge."
