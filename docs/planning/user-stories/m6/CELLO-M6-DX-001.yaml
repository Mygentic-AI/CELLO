    Note on AC-007a/b agent-lookup endpoint: check whether GET /agent-lookup exists
    in the directory HTTP server. If not, implement it as part of this story since
    directory is in components. The endpoint takes ?agent_id=<32hex> and returns
    { k_local_pubkey: '<64hex>' } or 404.
