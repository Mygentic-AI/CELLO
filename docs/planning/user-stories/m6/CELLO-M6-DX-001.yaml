  notes: >
    Implementation lives in cello-client repo (core/client/, core/adapter-claude-code/)
    and trustless-cello repo (packages/directory/) for AC-010, AC-011, and AC-007a/b.

    Findings addressed:
      F-001: phone_stub removed from cello_register (→ AC-006)
      F-004: unregistered tools return guidance (→ AC-004)
      F-006: cello_setup_guidance tool (→ AC-005)
