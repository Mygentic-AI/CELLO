# ─── Identity ───────────────────────────────────────────────
id: CELLO-M6-DX-001
domain: MCP Tool Surface
milestone: M6
actor: AGENT
priority: P0
components:
  - client
  - adapter-claude-code
  - directory

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the AI agent using CELLO MCP tools,
  I want every tool to give me clear feedback about what is happening,
  guide me through setup when I haven't registered yet, and complete
  operations without silent hangs or opaque timeouts,
  so that I can use CELLO correctly the first time without prior knowledge
  of the protocol.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When cello-mcp starts and the MCP server is initializing"
    action: "the process writes one startup progress line per step to stderr;
      each line is written BEFORE the step begins (announcing intent) and then
      the same line is updated with the outcome suffix ' ok' or ' failed: <reason>'
      on completion; the steps in order are:
      'cello: starting...',
      'cello: opening database... ok' or 'cello: opening database... failed: <reason>',
      'cello: fetching directory address... ok (<peerId[:16]>...)' or
        'cello: fetching directory address... failed: <reason>',
      'cello: loading agent state...',
      'cello: connecting to directory... ok' or
        'cello: connecting to directory... failed: <reason>',
      'cello: ready (not registered — call cello_setup_guidance for setup)' or
        'cello: ready (registered as <agent_id>)'"

  - trigger: "When cello-mcp starts and the process stdin is a TTY
      (i.e. the binary is run directly in a terminal rather than as an
      MCP subprocess)"
    action: "the process prints an install instruction message to stdout
      and exits with code 0 without attempting to start the MCP server"

  - trigger: "When cello-mcp starts and CELLO_DIRECTORY_MULTIADDR is not set"
    action: "the client fetches GET /bootstrap from CELLO_DIRECTORY_URL before
      starting the libp2p node; if the fetch succeeds it uses the returned
      multiaddr; if the fetch fails it emits 'cello: fetching directory address...
      failed: <reason>' to stderr and continues without threshold signing"

  - trigger: "When cello-mcp starts and a FROST key share exists in the local
      SQLCipher database for this agent"
    action: "loadPersistedState() reconstructs a FrostThresholdSigner with
      directoryNodes populated from the current directoryEndpoint (not undefined);
      the reconstructed signer can participate in FROST signing ceremonies with
      the directory without performing a new DKG ceremony; client.frost.share.loaded
      is emitted with { agentPubkey, epochId, threshold, participants }"

  - trigger: "When any MCP tool that requires registration is called and the
      agent is not registered (cello_send, cello_receive, cello_receive_session,
      cello_request_connection, cello_initiate_session, cello_close_session,
      cello_get_sealed_receipt, cello_list_sessions, cello_list_connections,
      cello_await_session, cello_await_connection_request, cello_backup,
      cello_restore, cello_get_inclusion_proof, cello_set_policy, cello_get_policy,
      cello_accept_connection, cello_reject_connection,
      cello_request_more_disclosure, cello_respond_to_disclosure_request)"
    action: "the tool returns a structured error with error.reason = 'not_registered'
      and error.message explaining that registration is required, how to obtain a
      token from @CelloConnectStagingBot, and that cello_setup_guidance() provides
      the full setup guide; the tool does not hang or throw"

  - trigger: "When cello_setup_guidance is called"
    action: "the tool returns the full 6-step CELLO setup guide (all steps always
      shown regardless of current state) followed by a 'Your current status'
      section showing the agent's registration state, connection count, session
      count, and directory reachability, plus a pointer to the next required step"

  - trigger: "When cello_register is called"
    action: "the tool accepts a single required parameter 'token' (the
      pre-authorization token from the Telegram bot, format CELLO-<33 base58 chars>
      or DEV-<...> in local env); phone_stub is not a user-facing parameter;
      internally the client sends empty string '' for phone_stub in the
      register_request frame to satisfy the directory's non-empty check"

  - trigger: "When cello_request_connection or cello_initiate_session is called
      with a target_agent_id parameter (exactly 32 hex chars)"
    action: "the client calls GET /agent-lookup?agent_id=<hex> on the directory's
      public HTTP endpoint to resolve the agent_id to a k_local_pubkey; if the
      lookup succeeds the resolved pubkey is used for the operation; if the lookup
      fails (404 or network error) the tool returns an error naming the agent_id
      that was not found"

  - trigger: "When cello_request_connection is waiting for the target agent to respond"
    action: "the client applies per-stage timeouts and returns immediately on
      timeout with a specific error message for each stage:
      stage 1 — dial directory: 10s, error 'Could not reach directory. Check your
        network connection.',
      stage 2 — send connection request: 10s, error 'Connection request not
        delivered to directory.',
      stage 3 — wait for target to respond: 90s, error 'Target agent did not
        respond within 90s. The agent may be offline. Try again with
        cello_request_connection.'
      On success the tool returns immediately without waiting for any timeout"

  - trigger: "When cello-mcp starts"
    action: "the MCP server registers all cello_* tools and begins accepting tool
      calls within 2 seconds of process start; directory connection (bootstrap
      fetch + libp2p dial) happens in a background task; tools that require the
      directory await the background connection for up to 10 seconds before
      returning directory_unreachable; cello_status and cello_setup_guidance
      respond immediately regardless of directory connection state"

  - trigger: "When the directory starts and agent_profiles rows exist in the database"
    action: "PgDirectoryStore.loadProfiles() reads all active agent_profiles rows
      and populates the in-memory profilesByLocalKey and profilesByPrimaryKey maps;
      adapter.profiles.loaded is emitted with { count }; connection pre-checks
      (hasProfile) succeed for agents that registered before this directory
      instance started"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "cello-mcp starts with no prior state and a valid CELLO_DIRECTORY_URL"
    when: "the process starts"
    then: "stderr emits exactly one line per startup step in this order and format:
      'cello: starting...',
      'cello: opening database... ok (V2, 18 tables)' (on success) or
        'cello: opening database... failed: <reason>' (on failure),
      'cello: fetching directory address... ok (12D3KooW...)' (on success) or
        'cello: fetching directory address... failed: <reason>' (on failure),
      'cello: loading agent state...',
      'cello: connecting to directory... ok' (on success) or
        'cello: connecting to directory... failed: <reason>' (on failure),
      'cello: ready (not registered — call cello_setup_guidance for setup)'
        (when unregistered) or
      'cello: ready (registered as <agent_id>)' (when registered);
      each step line is emitted as a single complete line (not two lines);
      note: loading agent state precedes connecting to directory because
      setDirectoryEndpoint must be called before loadPersistedState() to
      correctly populate directoryNodeStubs in the reconstructed FrostThresholdSigner
      (AC-003 requirement)"
    test_type: unit
    component_under_test: adapter-claude-code
    notes: >
      Unit test: mock the directory connection and DB open calls; capture
      process.stderr output; assert each line is present in order and matches
      the exact format. Test both the success and failed outcome variants for
      at least the bootstrap fetch step.

  - id: AC-002
    given: "cello-mcp binary is invoked directly in a TTY (process.stdin.isTTY === true)"
    when: "the process starts"
    then: "stdout contains the install instruction message including the string
      'claude mcp add cello npx @cello-protocol/connect'; the process exits with
      code 0; no MCP server is started; no network connection is attempted"
    test_type: unit
    component_under_test: adapter-claude-code
    notes: "Mock process.stdin.isTTY = true in test."

  - id: AC-003
    given: "A registered agent whose FROST share is persisted in the local SQLCipher
      database (written by the registration DKG ceremony in process A)"
    when: "process A is killed; process B starts fresh from the same key file
      and DB path (no in-memory state transfer)"
    then: "in process B: loadPersistedState() loads the FROST share from DB and
      constructs a FrostThresholdSigner with directoryNodes set to a
      NetworkDirectoryNode pointing at the current directoryEndpoint (directoryNodes
      is not undefined or null); client.frost.share.loaded is emitted with
      { agentPubkey, epochId, threshold, participants };
      getRegistrationState() returns non-null (confirming registration state
      survived the restart)"
    test_type: unit
    component_under_test: client
    notes: >
      Unit test verifies in-process signer reconstruction and directoryNodeStubs
      wiring. The test uses trustedDealer to write a FROST share to the SQLCipher
      DB, then reconstructs a CelloClientImpl from scratch (key file + DB path
      only, no in-memory state transfer) and calls loadPersistedState(). Verified
      by: client.frost.share.loaded emission with non-null epochId, and
      getRegistrationState() returning non-null.

      Transport-observable (FROST Ceremony begin in live directory logs) is
      verified by M6-E2E-001 AC-003.

      Root cause: loadPersistedState() in client.ts constructs FrostThresholdSigner
      with directoryNodes: undefined. Fix: pass directoryNodes populated from
      this.#directoryEndpoint.
      MANDATORY: --pool-options.threads.maxThreads=1

  - id: AC-004
    given: "An unregistered agent (no registration_state row in DB)"
    when: "any of the following tools is called: cello_send, cello_receive,
      cello_receive_session, cello_request_connection, cello_initiate_session,
      cello_close_session, cello_get_sealed_receipt, cello_list_sessions,
      cello_list_connections, cello_await_session, cello_await_connection_request,
      cello_backup, cello_restore, cello_get_inclusion_proof, cello_set_policy,
      cello_get_policy, cello_accept_connection, cello_reject_connection,
      cello_request_more_disclosure, cello_respond_to_disclosure_request"
    then: "the tool returns { error: { reason: 'not_registered', message: '<string>' } }
      where message contains the words 'cello_setup_guidance' and
      '@CelloConnectStagingBot'; the tool returns without hanging or throwing;
      cello_status and cello_setup_guidance are NOT in this list and respond
      normally regardless of registration state"
    test_type: unit
    component_under_test: adapter-claude-code
    notes: "One unit test per tool in the list above. All tests mock registered=false
      via the client stub."

  - id: AC-005
    given: "An agent in any registration state"
    when: "cello_setup_guidance is called"
    then: "the response contains all 6 steps of the setup guide in order
      (Steps 1-6 always present, never omitted based on current state) AND a
      'Your current status' section containing: registration state (YES/NO + agent_id
      if registered), connection count, active session count, directory reachability,
      and a '→ You are at Step N. Call <tool_name> to proceed.' pointer;
      the guide text contains the string 'CELLO_DEMO_AGENT_ID' resolved to the
      configured demo agent ID (from CELLO_DEMO_AGENT_ID env var or the default
      constant defined in adapter-claude-code, currently a2c55e2721f45cfa86cb3417a76e3f7b)"
    test_type: unit
    component_under_test: adapter-claude-code
    notes: >
      The demo agent ID must NOT be hardcoded as a string literal in the tool
      implementation. It must be a named constant (e.g. DEFAULT_DEMO_AGENT_ID)
      in adapter-claude-code, overridable via CELLO_DEMO_AGENT_ID env var.
      This allows future demo agent re-registration without a code change.
      Current value: a2c55e2721f45cfa86cb3417a76e3f7b

  - id: AC-006
    given: "cello_register is called with only { token: 'DEV-test-token' } in
      CELLO_ENV=local against a running local directory"
    when: "the tool processes the call"
    then: "the tool accepts the call without requiring phone_stub; registration
      completes end-to-end (DKG ceremony runs, register_success frame received);
      cello_status returns { registered: true, agent_id: '<hex>' };
      the register_request frame sent on the signaling stream contains
      phone_stub = '' (empty string, confirmed via directory logs or wire capture)"
    test_type: integration
    component_under_test: adapter-claude-code
    notes: >
      The tool schema change: phone_stub is removed from the MCP input schema.
      The parameter formerly named pre_auth_token is renamed to token.
      Internally phone_stub = '' (empty string) is sent in the register_request frame.

      The directory fix is TWO PARTS — both required:

      PART 1: In #processRegisterRequest (directory-node.ts), when
      #pendingPreAuthData has an entry for frame.k_local_pubkey (i.e., a valid
      pre_auth_token was consumed in DKG round 1), bypass the
      frame.phone_stub.length === 0 check entirely.

      PART 2: In the same function, when #pendingPreAuthData exists for the key,
      set phoneStubHash = preAuthData.phoneStubHash BEFORE the hasPhoneStubHash
      duplicate check at Step 3 (line 1417), not only before the AgentProfile
      field assignment at line 1510. Using SHA-256('') for every pre_auth_token
      registration would store the same phone_stub_hash for all of them; the
      first registration would store SHA-256(''), and the second registration's
      Step 3 check would find that hash already claimed, returning phone_already_claimed.
      Setting phoneStubHash from preAuthData before Step 3 ensures each agent's
      real phone hash (from the token) is used for the uniqueness check.

      Result: phone_stub is a legacy field in the wire format. When a pre_auth_token
      was consumed (the M6+ path), phone_stub_hash always comes from the token,
      never from the client-supplied phone_stub value. The client sends '' as a
      no-op wire value.

  - id: AC-007a
    given: "A registered agent"
    when: "cello_request_connection is called with
      { target_agent_id: 'a2c55e2721f45cfa86cb3417a76e3f7b' } (32 hex chars)"
    then: "the client calls GET /agent-lookup?agent_id=a2c55e2721f45cfa86cb3417a76e3f7b
      on the directory HTTP endpoint; the resolved k_local_pubkey is used for the
      connection request; if the same target is also reachable via raw pubkey,
      the result of cello_request_connection({ target_agent_id: '...' }) is
      functionally identical to cello_request_connection({ target_pubkey: '<resolved>' })"
    test_type: integration
    component_under_test: adapter-claude-code
    notes: >
      The /agent-lookup endpoint does NOT currently exist in the directory.
      It must be added to the health server (health-server.ts, port 9090) as part
      of this story — NOT to the libp2p WebSocket server on port 8080 (which only
      accepts WebSocket upgrades). The endpoint is a plain HTTP GET, reachable via
      the ALB on port 80 with a path rule for /agent-lookup.
      IaC: add an ALB listener rule for /agent-lookup → BootstrapTargetGroup
      (same target group as /bootstrap, already routes to port 9090).
      Detection by length: 32 hex chars = agent_id (lookup required),
      64 hex chars = raw pubkey (used directly, no lookup).
      Both formats must be accepted by cello_request_connection and
      cello_initiate_session.

  - id: AC-007b
    given: "A registered agent"
    when: "cello_initiate_session is called with
      { target_agent_id: '<32 hex chars>' }"
    then: "the client resolves the agent_id to a k_local_pubkey via the same
      GET /agent-lookup mechanism as AC-007a; the session initiation proceeds
      using the resolved pubkey; if the lookup fails, the tool returns
      { ok: false, reason: 'agent_not_found', agent_id: '<the id that was looked up>' }"
    test_type: integration
    component_under_test: adapter-claude-code

  - id: AC-008
    given: "cello_request_connection is called with a valid target"
    when: "each stage of the operation runs and times out"
    then: "per-stage behavior:
      (a) if directory is unreachable and dial times out after 10s: tool returns
        { error: { reason: 'directory_unreachable_timeout', message: 'Could not
        reach directory. Check your network connection.' } }
      (b) if connection request frame is not delivered after 10s: tool returns
        { error: { reason: 'request_delivery_timeout', message: 'Connection
        request not delivered to directory.' } }
      (c) if target does not respond after 90s: tool returns
        { error: { reason: 'target_response_timeout', message: 'Target agent did
        not respond within 90s. The agent may be offline. Try again with
        cello_request_connection.' } }
      (d) on success: tool returns result immediately without waiting for any timeout;
      total worst-case duration: 110s (10 + 10 + 90)"
    test_type: unit
    component_under_test: adapter-claude-code
    notes: >
      Unit test: mock each stage to time out (one test per stage) and assert the
      exact error reason and message. The 300s monolithic timeout in client.ts
      is replaced by these per-stage timeouts.

  - id: AC-009
    given: "cello-mcp starts for the first time (no cached directory connection)"
    when: "the process starts and the MCP server initializes"
    then: "all cello_* tools are registered and visible to the MCP client within
      2 seconds of process start, regardless of whether the directory connection
      or SQLCipher DB initialization has completed; a tool call to cello_status
      made before the background directory connection completes returns
      { transport_started: true, directory_reachable: false } without blocking;
      a tool call to cello_status made after the directory connection completes
      returns { directory_reachable: true }"
    test_type: integration
    component_under_test: adapter-claude-code
    notes: >
      Lazy startup: SQLCipher DB open, client.loadPersistedState(), bootstrap fetch,
      directory dial, and FROST bootstrap ALL move to background tasks. The MCP
      server must register tools and respond to the initial tool-list request
      before any of these complete. The 2-second target requires that no blocking
      I/O runs on the main thread before server.connect() is called.

      Coordination with AC-003: since loadPersistedState() moves to background,
      the FROST signer restoration (AC-003's fix) happens asynchronously. Tools
      that require the FROST signer (cello_initiate_session) must await the
      background ready signal before proceeding, up to 10 seconds.

      Test: spawn cello-mcp as a subprocess, connect an MCP client via stdio,
      send tools/list request, assert response arrives within 2s, assert
      cello_status.transport_started = true.

  - id: AC-010
    given: "The directory starts with agent_profiles rows in the PostgreSQL database
      from agents that registered in a prior directory instance"
    when: "the directory process starts and PgDirectoryStore.loadProfiles() runs"
    then: "adapter.profiles.loaded is emitted with count > 0 (for a database with
      prior registrations); hasProfile(k_local_pubkey) returns true for each
      loaded agent without that agent needing to re-register; a connection request
      from a loaded agent to another loaded agent is routed correctly (the
      target_not_found pre-check passes)"
    test_type: integration
    component_under_test: directory
    notes: >
      This AC covers the F-011 hotfix (directory loses profiles on restart).
      Test: register two agents in directory instance A; stop A; start directory
      instance B from scratch; verify both agents are findable via hasProfile()
      in B without re-registration.
      MANDATORY: --pool-options.threads.maxThreads=1

  - id: AC-011
    given: "The directory starts and V27 migration has been applied
      (agent_profiles.agent_id column exists)"
    when: "a new agent registers"
    then: "the agent_profiles INSERT includes a non-null agent_id value (32 hex chars);
      a subsequent restart of the directory loads the agent_id from the database
      (not a derived fallback); the loaded agent_id matches the value assigned
      at registration"
    test_type: integration
    component_under_test: directory
    notes: >
      This AC covers the F-012 hotfix (agent_id not persisted to agent_profiles).
      The V27 migration adds the agent_id column as nullable (existing rows have
      agent_id = NULL; loadProfiles() derives a stable 32-char stand-in via
      SHA-256(k_local_pubkey)[:32] for null rows). New registrations write the
      actual randomly-generated agent_id. This AC verifies new registrations.

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The registration token (parameter 'token') MUST NOT appear in any
      log event, error message, stderr progress line, or MCP tool response"
    adversarial_condition: "even when the token is passed to cello_register and
      the registration fails with an error from the directory"
    test_type: unit
    component_under_test: adapter-claude-code
    notes: "The token is a single-use credential. Its presence in any log or
      chat transcript exposes it. Grep test: assert no test run's captured stderr
      or tool output contains the test token string."

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: client.startup.progress
      level: info
      trigger: "Each named startup step in cello-mcp (database open, bootstrap
        fetch, directory dial, state load, ready)"
      context_fields: [step, outcome, durationMs]
      correlationId: false
      notes: "Written to stderr as human-readable lines (not structured JSON).
        Format: 'cello: <step>... <outcome>'. See AC-001 for exact format."

    - name: client.frost.share.loaded
      level: info
      trigger: "FROST share loaded from DB and FrostThresholdSigner reconstructed
        with directoryNodes populated (not undefined) on startup"
      context_fields: [agentPubkey, epochId, threshold, participants]
      correlationId: false
      notes: "Defined in PERSIST-024. This story requires directoryNodes to be
        non-null in the reconstructed signer — the event emission does not change
        but the implementation of loadPersistedState() changes. Verified by AC-003."

    - name: adapter.profiles.loaded
      level: info
      trigger: "PgDirectoryStore.loadProfiles() completes on directory startup"
      context_fields: [count]
      correlationId: false
      notes: "Defined and deployed as part of the F-011 hotfix. AC-010 verifies
        count > 0 for a non-empty database."

  error_events:
    - name: client.bootstrap.fetch.failed
      level: warn
      trigger: "GET /bootstrap from directory URL fails or times out"
      context_fields: [directoryUrl, reason, durationMs]

    - name: client.connection.request.stage.timeout
      level: warn
      trigger: "A per-stage timeout fires during cello_request_connection"
      context_fields: [stage, timeoutMs, targetPubkeyOrAgentId]

    - name: client.directory.agent_lookup.failed
      level: warn
      trigger: "GET /agent-lookup returns non-200 or network error during
        agent_id resolution in cello_request_connection or cello_initiate_session"
      context_fields: [agentId, endpoint, httpStatus, reason, durationMs]

  alarms: []
  notes: >
    The following events are new and MUST be added to the canonical event taxonomy
    in docs/planning/discussion_logs/2026-05-16_0753_development-pipeline-and-local-iteration.md
    before the story is marked done:
    client.startup.progress, client.bootstrap.fetch.failed,
    client.connection.request.stage.timeout, client.directory.agent_lookup.failed.
    Verify client.frost.share.loaded and adapter.profiles.loaded are already in
    the taxonomy (from PERSIST-024 and F-011 hotfix respectively); add them if not.

# ─── References ─────────────────────────────────────────────
