# ─── Identity ───────────────────────────────────────────────
id: CELLO-OPS-AGENT-000
domain: OPS-AGENT
milestone: M6
actor: DIR
priority: P0
components:
  - interfaces
  - directory

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO development team,
  I want all registration interface contracts, TypeScript types,
  local stubs, and the complete database schema design for the
  Operations Agent registration state machine produced and
  reviewed before any parallel implementation begins,
  so that OPS-AGENT-001 through 005B can implement against
  stable interfaces with reserved migration version numbers,
  eliminating the mid-milestone migration renumbering cascade
  experienced in M4/M5.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When OPS-AGENT-000 is merged to main"
    action: "the following TypeScript interfaces exist in
      packages/interfaces/src/ with full type definitions:
      MessagingChannel, OtpDeliveryProvider, TokenValidator,
      PreAuthorizationClient, SecurityAlertProvider; each has a
      corresponding local stub in packages/interfaces/src/stubs/"

  - trigger: "When OPS-AGENT-000 is merged to main"
    action: "the pre-authorization token schema is defined as
      a TypeScript type in packages/interfaces/src/ including:
      token format (string prefix + random bytes), TTL (24 hours),
      single-use semantics, consumption timestamp, issuing
      phone_stub_hash and email_domain"

  - trigger: "When OPS-AGENT-000 is merged to main"
    action: "the registration state machine states are defined
      as a TypeScript discriminated union type: INITIAL,
      AWAITING_CONTACT, PHONE_CONFIRMED, AWAITING_EMAIL,
      AWAITING_EMAIL_OTP, EMAIL_CONFIRMED, PRE_AUTH_TOKEN_ISSUED,
      EXPIRED, FAILED"

  - trigger: "When OPS-AGENT-000 is merged to main"
    action: "complete SQL migration files exist for all tables
      the registration state machine requires, with Flyway
      version numbers V24+ explicitly assigned; no downstream
      story may add a migration not designed here"

# ─── Schema Assessment (Architecture Phase) ────────────────
# This section documents the complete schema design reasoning
# per the M5 retrospective rule: "thoroughly assess schema
# requirements before writing the migration."
schema_assessment:
  tables:
    - name: registrations
      purpose: "Stores in-flight and completed registration state machine records"
      columns:
        - "id UUID PRIMARY KEY DEFAULT gen_random_uuid()"
        - "phone_stub_hash TEXT NOT NULL"
        - "channel TEXT NOT NULL CHECK (channel IN ('telegram', 'whatsapp', 'cli'))"
        - "channel_user_id TEXT NOT NULL"
        - "state TEXT NOT NULL"
        - "state_data JSONB NOT NULL DEFAULT '{}'"
        - "email_domain TEXT"
        - "otp_hash TEXT"
        - "otp_salt TEXT"
        - "otp_expires_at TIMESTAMPTZ"
        - "otp_attempt_count INTEGER NOT NULL DEFAULT 0"
        - "created_at TIMESTAMPTZ NOT NULL DEFAULT now()"
        - "updated_at TIMESTAMPTZ NOT NULL DEFAULT now()"
        - "expires_at TIMESTAMPTZ NOT NULL"
        - "chain_hash TEXT NOT NULL — SHA-256(previous_chain_hash || id || state || updated_at); root is SHA-256(id); allows post-hoc verification that state history was not tampered with"
      uniqueness:
        - "UNIQUE (phone_stub_hash) WHERE state NOT IN ('EXPIRED', 'FAILED', 'PRE_AUTH_TOKEN_ISSUED')"
        - "Conflict scenario: operator restarts registration — old record must be in terminal state before new one is created"
      indexes:
        - "idx_registrations_phone_stub_hash ON registrations(phone_stub_hash)"
        - "idx_registrations_state_expires ON registrations(state, expires_at) WHERE state NOT IN ('EXPIRED', 'FAILED', 'PRE_AUTH_TOKEN_ISSUED')"
        - "idx_registrations_channel_user ON registrations(channel, channel_user_id)"
      rls: "cello_service: INSERT, SELECT, UPDATE; no DELETE"
      replication_safety: >
        UNIQUE (phone_stub_hash) partial index is safe ONLY because the Operations
        Agent is deployed as a single instance in us-east-1. Partial unique indexes
        are enforced locally per-node in logical replication — they do NOT prevent
        cross-region duplicates. If multi-region Ops Agent deployment is ever
        required, this constraint must be replaced with either: (1) an
        application-level pre-INSERT query across all regions, or (2) a
        registrations table sharded by owning_region (analogous to session
        ownership in FEDERATION-001). DO NOT deploy Ops Agent writers to multiple
        regions without addressing this. Same class as M5 BIGSERIAL collision.
      query_patterns:
        - "SELECT by phone_stub_hash WHERE state NOT IN terminal — resume flow"
        - "SELECT by channel + channel_user_id — match inbound message to record"
        - "SELECT WHERE state NOT IN terminal AND expires_at < now() — expiry cleanup"
        - "INSERT on new registration"
        - "UPDATE SET state, state_data, updated_at, otp_hash, otp_salt, otp_expires_at, otp_attempt_count, email_domain WHERE id = $1 — state transitions; no DELETE ever"

    - name: pre_authorization_tokens
      purpose: "Stores issued pre-auth tokens awaiting agent presentation during FROST DKG"
      columns:
        - "id UUID PRIMARY KEY DEFAULT gen_random_uuid()"
        - "token TEXT NOT NULL UNIQUE"
        - "phone_stub_hash TEXT NOT NULL"
        - "email_domain TEXT NOT NULL"
        - "registration_id UUID NOT NULL REFERENCES registrations(id)"
        - "issued_at TIMESTAMPTZ NOT NULL DEFAULT now()"
        - "expires_at TIMESTAMPTZ NOT NULL"
        - "consumed_at TIMESTAMPTZ"
        - "chain_hash TEXT NOT NULL — SHA-256(previous_chain_hash || id || token || issued_at); root is SHA-256(id); same scheme as registrations table"
      uniqueness:
        - "UNIQUE (token) — ensures single-use via UPDATE ... WHERE consumed_at IS NULL returning rowCount"
        - "Conflict scenario: two agents present same token concurrently — only one UPDATE returns rowCount=1"
      indexes:
        - "idx_pre_auth_tokens_token ON pre_authorization_tokens(token)"
        - "idx_pre_auth_tokens_expires ON pre_authorization_tokens(expires_at) WHERE consumed_at IS NULL"
      rls: "cello_service: INSERT, SELECT, UPDATE (consumed_at only); no DELETE"
      fk: "registration_id → registrations(id)"
      query_patterns:
        - "SELECT by token WHERE consumed_at IS NULL AND expires_at > now() — validate"
        - "UPDATE SET consumed_at = now() WHERE token = $1 AND consumed_at IS NULL — atomic consume"
        - "SELECT WHERE expires_at < now() AND consumed_at IS NULL — cleanup expired"

  database_roles:
    - name: cello_ops_agent
      purpose: "Dedicated PostgreSQL role for the Operations Agent ECS task.
        Scoped to registration tables only — the Operations Agent must never
        have access to agent_profiles, sessions, conversation_chains,
        checkpoints, or any key material table."
      grants:
        - "GRANT INSERT, SELECT, UPDATE ON registrations TO cello_ops_agent"
        - "GRANT INSERT, SELECT, UPDATE ON pre_authorization_tokens TO cello_ops_agent"
      explicit_denials:
        - "No GRANT on agent_profiles, sessions, conversation_chains,
          checkpoint_node_signatures, directory_checkpoints, or any other table"
        - "No DELETE on any table — same no-DELETE semantics as cello_service"
      rls_note: "RLS policies on registrations and pre_authorization_tokens
        must explicitly list cello_ops_agent alongside cello_service as
        permitted roles. The existing cello_service grants do not carry over."
      migration_note: "CREATE ROLE cello_ops_agent WITH LOGIN must be in the
        migration SQL. The password is set by the rotation Lambda using the
        same pattern as cello_service. A new secret
        cello/{env}/ops-agent/rds-credentials is provisioned in OPS-AGENT-005A."
      verification: "After migration: attempt SELECT 1 FROM agent_profiles as
        cello_ops_agent — must return permission denied. SELECT 1 FROM
        registrations as cello_ops_agent — must succeed."

  notes: >
    OTP rate limiting is in-memory per-process (not Postgres-backed).
    A process restart resets the rate limit counter — acceptable for
    registration rate limiting where the window is 1 hour and restarts
    are infrequent. No table required.

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "The packages/interfaces/src/ directory after merge"
    when: "MessagingChannel interface is imported by a consumer"
    then: "the interface exports send(to: string, message: string): Promise<void>,
      onMessage(handler: (from: string, message: string) => void): void, and
      resolveIdentity(from: string): Promise<ChannelIdentity>; ChannelIdentity
      is a discriminated union with channel field ('telegram' | 'whatsapp' | 'cli'),
      optional phoneNumber, and required channelUserId"
    test_type: unit
    component_under_test: interfaces

  - id: AC-002
    given: "The packages/interfaces/src/ directory after merge"
    when: "OtpDeliveryProvider interface is imported"
    then: "the interface exports sendOtp(emailAddress: string, otp: string): Promise<void>
      and a local stub ConsoleOtpDeliveryProvider that prints to stdout"
    test_type: unit
    component_under_test: interfaces

  - id: AC-003
    given: "The packages/interfaces/src/ directory after merge"
    when: "TokenValidator interface is imported"
    then: "the interface exports validateToken(token: string): Promise<TokenValidationResult>
      where TokenValidationResult is { valid: true, phoneStubHash: string, emailDomain: string }
      | { valid: false, reason: string }; a local stub DevTokenValidator accepts any
      token prefixed with 'DEV-' and returns a fixed principal"
    test_type: unit
    component_under_test: interfaces

  - id: AC-003b
    given: "The packages/interfaces/src/ directory after merge"
    when: "PreAuthorizationClient interface is imported"
    then: "the interface exports requestToken(phoneStubHash: string, emailDomain: string):
      Promise<{ token: string }>; a local stub LocalPreAuthorizationClient returns a
      token in the format 'DEV-CELLO-' + 16 hex chars; the stub requires no network
      connection or configuration"
    test_type: unit
    component_under_test: interfaces

  - id: AC-004
    given: "The packages/interfaces/src/ directory after merge"
    when: "SecurityAlertProvider interface is imported"
    then: "the interface exports sendAlert(accountId: string, alert: SecurityAlert): Promise<void>
      where SecurityAlert is a discriminated union with at minimum variants
      FALLBACK_CANARY and REGISTRATION_COMPLETE; a local stub
      ConsoleSecurityAlertProvider logs to stdout"
    test_type: unit
    component_under_test: interfaces

  - id: AC-005
    given: "The pre-authorization token type definition"
    when: "imported by OPS-AGENT-001 or OPS-AGENT-002"
    then: "PreAuthorizationToken type includes: token (string, format 'CELLO-' + 33 random
      base58 chars, yielding >= 193 bits of entropy), phoneStubHash (string),
      emailDomain (string), issuedAt (Date), expiresAt (Date, 24h TTL),
      consumedAt (Date | null); PreAuthorizationTokenRow includes the same plus
      id (UUID) and registrationId (UUID) for database storage"
    test_type: unit
    component_under_test: interfaces

  - id: AC-006
    given: "The registration state machine type definition"
    when: "imported by OPS-AGENT-002"
    then: "RegistrationState is a discriminated union on a 'state' field with values:
      INITIAL, AWAITING_CONTACT, PHONE_CONFIRMED, AWAITING_EMAIL, AWAITING_EMAIL_OTP,
      EMAIL_CONFIRMED, PRE_AUTH_TOKEN_ISSUED, EXPIRED, FAILED; each variant carries
      the fields relevant to that state (e.g. AWAITING_EMAIL_OTP carries otpHash,
      otpExpiresAt, attemptCount); RegistrationRecord wraps the state with id,
      phoneStubHash, channel, channelUserId, createdAt, updatedAt, expiresAt"
    test_type: unit
    component_under_test: interfaces

  - id: AC-006b
    given: "The chain_hash column definition and the TypeScript state machine code"
    when: "a registration transitions through two states"
    then: "chain_hash on the second UPDATE equals SHA-256(prior_chain_hash || id || new_state ||
      new_updated_at); the root record's chain_hash equals SHA-256(id); the migration SQL includes
      a trigger or application-layer note specifying the computation; an investigator can recompute
      the hash from the database row values and confirm they match"
    test_type: unit
    component_under_test: operations-agent
    notes: "chain_hash is tamper-evidence for registration records — not the full CELLO hash chain
      protocol. Extends the append-only audit trail to state history. A manual UPDATE to the state
      column breaks chain integrity, detectable by any verifier."

  - id: AC-007
    given: "The migration SQL files produced by this story"
    when: "applied to a local PostgreSQL instance that already has V1 through V23 applied"
    then: "all tables specified in the schema_assessment section exist with correct
      columns, constraints, RLS policies, and indexes verifiable via information_schema
      and pg_indexes queries; the version numbers are V24 and above; no existing
      migration file (V1 through V23) has been modified — Flyway reports zero
      checksum errors on all prior migrations"
    test_type: integration
    component_under_test: directory

  - id: AC-007b
    given: "The migration SQL files after being applied to a local PostgreSQL instance"
    when: "the cello_ops_agent role is exercised"
    then: "SELECT 1 FROM registrations as cello_ops_agent succeeds;
      SELECT 1 FROM pre_authorization_tokens as cello_ops_agent succeeds;
      SELECT 1 FROM agent_profiles as cello_ops_agent returns permission denied;
      SELECT 1 FROM sessions as cello_ops_agent returns permission denied;
      DELETE FROM registrations WHERE false as cello_ops_agent returns
      permission denied (no-DELETE enforced)"
    test_type: integration
    component_under_test: directory
    notes: "This AC exists because the Operations Agent will have a real
      database credential in production. The scope boundary must be
      enforced at the database level, not just assumed from application code."

  - id: AC-008
    given: "The migration SQL files and the M6 COORDINATION.md"
    when: "OPS-AGENT-000 closes"
    then: "the Migration Version Registry table in docs/planning/user-stories/m6/COORDINATION.md
      is populated with every migration version number, its story assignment, and
      table/purpose; this is the authoritative registry — no story may claim a
      version not listed here"
    test_type: manual
    component_under_test: directory

  - id: AC-009
    given: "All local stubs (CliAdapter, ConsoleOtpDeliveryProvider, DevTokenValidator,
      LocalPreAuthorizationClient, ConsoleSecurityAlertProvider)"
    when: "a consumer instantiates each stub with no configuration"
    then: "each stub implements its interface with zero external dependencies; the
      composition root can wire all stubs for CELLO_ENV=local without any secrets,
      network connections, or AWS credentials"
    test_type: unit
    component_under_test: interfaces

  - id: AC-011
    given: "The trustless-cello monorepo"
    when: "OPS-AGENT-000 is merged"
    then: "packages/operations-agent/ exists with: package.json (name:
      @cello/operations-agent, dependencies on @cello/interfaces),
      tsconfig.json (project references to ../interfaces), vitest.config.ts,
      and a src/index.ts stub that exports nothing; the package is registered
      in pnpm-workspace.yaml; pnpm install at the repo root resolves it;
      pnpm --filter @cello/operations-agent run typecheck exits 0;
      OPS-AGENT-002/003/004 implementors have a ready package to write into"
    test_type: integration
    component_under_test: operations-agent
    notes: "Without this, the first coder to implement OPS-AGENT-002 creates
      the package structure ad hoc. Parallel stories (003, 004) may create
      conflicting structures. 005B expects a specific Dockerfile and pipeline
      that nobody explicitly designed. This AC prevents that."

  - id: AC-012
    given: "setup-replication.sh in infra/"
    when: "OPS-AGENT-000 is merged"
    then: "the PUBLICATION_TABLES variable in setup-replication.sh includes
      registrations and pre_authorization_tokens; the GRANT SELECT section
      includes both tables for the cello_replication role; when
      setup-replication.sh is run against a database with V24+ applied,
      ALTER PUBLICATION cello_pub ADD TABLE and GRANT SELECT execute
      without error"
    test_type: integration
    component_under_test: directory
    notes: "The story that creates the tables must also update the replication
      tooling. This is design-time work (updating the script). Execution on
      live nodes happens in OPS-AGENT-005B AC-007b deployment sequence.
      Without this, 005B discovers the missing publication update at deploy
      time — same as M5 FEDERATION-001 shipping incomplete V18."

  - id: AC-010-integration-gate
    given: "All interface files, type definitions, stubs, migration SQL files,
      and the packages/operations-agent/ scaffold produced by this story"
    when: "pnpm run typecheck is run across the workspace AND the migration SQL
      files are applied to a local PostgreSQL instance that already has V1–V23 applied"
    then: "zero type errors across the workspace; Flyway reports zero checksum errors
      on V1–V23; V24+ migrations apply cleanly on top; no migration version number
      V24+ exists in any file outside this story's changes; the COORDINATION.md
      migration registry is populated; cello_ops_agent role exists with correct grants
      (AC-007b passes); no downstream OPS-AGENT story may begin implementation until
      this AC is verified and the story is merged"
    test_type: integration
    component_under_test: directory

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The pre-authorization token format must be unguessable —
      minimum 192 bits of entropy in the random portion (33 base58 chars
      yields ~193 bits)"
    adversarial_condition: "even when an attacker can observe token format
      and timing of issuance, brute-forcing a valid token within the 24h TTL
      must be computationally infeasible"
    test_type: unit
    component_under_test: interfaces

  - id: SI-002
    statement: "Migration SQL must enforce RLS with no-DELETE semantics and
      a scoped cello_ops_agent role. cello_ops_agent has INSERT, SELECT, and
      UPDATE on registrations and pre_authorization_tokens only — no access
      to agent_profiles, sessions, conversation_chains, checkpoints, or any
      key material table. cello_service retains its existing grants."
    adversarial_condition: "even if the Operations Agent container is
      compromised, the attacker's database credential (cello_ops_agent) cannot
      read or write agent_profiles, sessions, or key material; cannot delete
      any row; cannot escalate to cello_service permissions. Verified by
      AC-007b permission-denied assertions."
    test_type: integration
    component_under_test: directory

