# ─── Identity ───────────────────────────────────────────────
id: CELLO-OPS-AGENT-001
domain: OPS-AGENT
milestone: M6
actor: DIR
priority: P0
components:
  - directory

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO Directory,
  I want an internal pre-authorization API that issues single-use
  tokens after the Operations Agent confirms phone and email
  verification, and a token consumption check in the FROST DKG
  Round 1 handler,
  so that agents can present a token during DKG to prove a real
  human authorized the registration, without the Operations Agent
  ever touching key material.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When the Operations Agent calls POST /internal/pre-authorize
      with a valid internal API key, phone_stub_hash, and email_domain"
    action: "the directory generates a pre-authorization token (format:
      'CELLO-' + 33 base58 random characters, >= 193 bits entropy),
      stores it in the pre_authorization_tokens table with issued_at,
      expires_at (24h TTL), phone_stub_hash, email_domain, registration_id,
      and consumed_at = NULL; returns the token string to the caller"

  - trigger: "When an agent sends a FROST DKG Round 1 frame with a
      preAuthToken field populated"
    action: "the directory's FrostDirectoryHandler validates the token
      as its first operation before any crypto computation: queries
      pre_authorization_tokens WHERE token = $1 AND consumed_at IS NULL
      AND expires_at > now(); if valid, executes UPDATE SET consumed_at = now()
      WHERE token = $1 AND consumed_at IS NULL (atomic, returns rowCount);
      if rowCount = 1, proceeds with DKG Round 1; links resulting
      agent_profile to the account identified by phone_stub_hash"

  - trigger: "When an agent presents a token that has already been consumed
      (rowCount = 0 on the UPDATE)"
    action: "the directory rejects the DKG Round 1 frame with error
      PRE_AUTH_TOKEN_CONSUMED; no crypto computation occurs"

  - trigger: "When an agent presents a token that has expired"
    action: "the directory rejects the DKG Round 1 frame with error
      PRE_AUTH_TOKEN_EXPIRED; no crypto computation occurs"

  - trigger: "When POST /internal/pre-authorize is called without a valid
      internal API key"
    action: "the directory returns HTTP 401 Unauthorized; no token is issued"

  - trigger: "When a DKG Round 1 frame arrives without a preAuthToken field"
    action: "the directory rejects with PRE_AUTH_TOKEN_MISSING; this makes
      pre-authorization mandatory for all new registrations after M6 deploys"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "The directory is running locally with CELLO_ENV=local and a
      valid internal API key configured"
    when: "POST /internal/pre-authorize is called with phone_stub_hash
      and email_domain"
    then: "a 200 response is returned with JSON body { token: '<CELLO-...>',
      expiresAt: '<ISO-8601>' }; the token matches 'CELLO-' + 33 base58
      characters; a row exists in pre_authorization_tokens with
      consumed_at = NULL"
    test_type: integration
    component_under_test: directory

  - id: AC-002
    given: "A valid unconsumed token exists in the database"
    when: "a FROST DKG Round 1 frame is sent over the /cello/frost/1.0.0
      libp2p stream with preAuthToken = that token"
    then: "the FrostDirectoryHandler consumes the token (consumed_at set),
      proceeds with DKG Round 1 crypto, and returns a valid Round 1 response;
      preauth.token.consumed is logged at INFO with { tokenId, agentId,
      correlationId }"
    test_type: integration
    component_under_test: directory

  - id: AC-003
    given: "A token that was consumed in AC-002"
    when: "the same token is sent in a second DKG Round 1 frame"
    then: "DKG is rejected with PRE_AUTH_TOKEN_CONSUMED error; no crypto
      computation occurs; preauth.token.reuse.rejected is logged at WARN
      with { tokenId, correlationId }"
    test_type: integration
    component_under_test: directory

  - id: AC-004
    given: "A token issued 25 hours ago (past 24h TTL)"
    when: "the token is sent in a DKG Round 1 frame"
    then: "DKG is rejected with PRE_AUTH_TOKEN_EXPIRED error; no crypto
      computation occurs; preauth.token.expired is logged at WARN with
      { tokenId, correlationId }"
    test_type: integration
    component_under_test: directory

  - id: AC-005
    given: "POST /internal/pre-authorize is called with no API key
      or an invalid API key"
    when: "the request reaches the directory"
    then: "HTTP 401 is returned; no token row is created;
      preauth.auth.failed is logged at WARN with { remoteAddr,
      correlationId }"
    test_type: integration
    component_under_test: directory

  - id: AC-006
    given: "A token is consumed on presentation (consumed_at set as the
      first operation in the Round 1 handler)"
    when: "the DKG fails after token consumption (injected via a stubbed
      FrostDirectoryHandler that returns an error after the token
      consumption call succeeds)"
    then: "the token remains consumed; a new Round 1 frame with the same
      token returns PRE_AUTH_TOKEN_CONSUMED; the operator must request a
      new token via the bot"
    test_type: integration
    component_under_test: directory
    notes: "Failure injection: stub the crypto computation after token
      consumption to return { ok: false, reason: 'DKG_ROUND1_FAILED' }.
      This verifies consumption-on-presentation, not consumption-on-success."

  - id: AC-007
    given: "A DKG Round 1 frame arrives without a preAuthToken field"
    when: "the FrostDirectoryHandler processes the frame"
    then: "the frame is rejected with PRE_AUTH_TOKEN_MISSING error;
      no agent is registered; preauth.token.missing is logged at WARN"
    test_type: integration
    component_under_test: directory

  - id: AC-008-integration-gate
    given: "The directory running locally with all M6 migrations applied
      (V1–V23 pre-applied, then V24+ from OPS-AGENT-000 applied on top)"
    when: "the full pre-authorization flow is exercised: issue token,
      consume via Round 1 frame, attempt reuse, attempt expired token,
      attempt missing token"
    then: "all five operations produce correct results; Flyway reports
      zero checksum errors on all migrations V1 through the version
      claimed by this story; no downstream story may begin implementation
      until this story's integration gate AC is verified and merged"
    test_type: integration
    component_under_test: directory

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The /internal/pre-authorize endpoint must not be
      reachable from the public internet — enforced at the application
      layer by API key validation and at the infrastructure layer by
      ALB listener rules (deployed in OPS-AGENT-005A)"
    adversarial_condition: "even when an attacker sends a request to
      /internal/pre-authorize without a valid API key, the directory
      returns 401 and creates no token; the ALB routing rule (005A)
      provides defense-in-depth by rejecting /internal/* paths before
      they reach the application"
    test_type: integration
    component_under_test: directory
    notes: "Application-layer API key check tested here. ALB routing
      rule tested in OPS-AGENT-005A."

  - id: SI-002
    statement: "Token consumption is atomic — no race condition can
      allow two concurrent DKG initiations to both consume the same token"
    adversarial_condition: "even when two agents present the same token
      within milliseconds, the database UPDATE ... WHERE consumed_at IS NULL
      returns rowCount=1 for exactly one caller and rowCount=0 for the other"
    test_type: integration
    component_under_test: directory

  - id: SI-003
    statement: "The pre-authorization token never contains or encodes
      the phone number, email address, or any PII — only the phone_stub_hash
      and email_domain are stored alongside it"
    adversarial_condition: "even when an attacker obtains a valid token string,
      they cannot derive the operator's phone number or full email address"
    test_type: unit
    component_under_test: directory

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: preauth.token.issued
      level: info
      trigger: "POST /internal/pre-authorize succeeds"
      context_fields: [tokenId, phoneStubHashPrefix, emailDomain, correlationId]
      correlationId: true
      notes: "phoneStubHashPrefix = first 8 hex characters of the hash"

    - name: preauth.token.consumed
      level: info
      trigger: "Token consumed during FROST DKG Round 1"
      context_fields: [tokenId, agentId, correlationId]
      correlationId: true

  error_events:
    - name: preauth.token.reuse.rejected
      level: warn
      trigger: "Already-consumed token presented in Round 1 frame"
      context_fields: [tokenId, correlationId]

    - name: preauth.token.expired
      level: warn
      trigger: "Expired token presented in Round 1 frame"
      context_fields: [tokenId, correlationId]

    - name: preauth.token.missing
      level: warn
      trigger: "DKG Round 1 frame without preAuthToken field"
      context_fields: [remoteAgentId, correlationId]

    - name: preauth.auth.failed
      level: warn
      trigger: "Invalid or missing API key on /internal/pre-authorize"
      context_fields: [remoteAddr, correlationId]

    - name: preauth.token.issue.failed
      level: error
      trigger: "Token generation or database insert failed"
      context_fields: [reason, correlationId]

  alarms:
    - condition: "preauth.auth.failed rate > 10 per minute"
      fires_to: ops-critical
      notes: "Potential brute-force attempt against internal API"

