# ─── Identity ───────────────────────────────────────────────
id: CELLO-OPS-AGENT-003
domain: OPS-AGENT
milestone: M6
actor: OPS
priority: P0
components:
  - operations-agent

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO Operations Agent,
  I want a TelegramAdapter implementing the MessagingChannel interface
  that handles Telegram Bot API interactions including phone verification
  via contact.user_id,
  so that the registration state machine can drive a real Telegram
  conversation without knowing Telegram-specific details.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When the TelegramAdapter is instantiated with a bot token"
    action: "it connects to the Telegram Bot API via long-polling
      (getUpdates) and begins receiving messages; logs
      telegram.polling.started at INFO with { botUsername }"

  - trigger: "When an inbound message arrives from a Telegram user"
    action: "the adapter normalizes it to the MessagingChannel
      onMessage callback format: from = Telegram user ID (string),
      message = message text"

  - trigger: "When send() is called with a text message"
    action: "the adapter calls sendMessage on the Telegram Bot API;
      for the AWAITING_CONTACT state, it sends a ReplyKeyboardMarkup
      with a request_contact button"

  - trigger: "When a contact sharing event is received"
    action: "resolveIdentity() returns a ChannelIdentity with
      channel = 'telegram', phoneNumber = contact.phone_number
      (if contact.user_id matches message.from.id), and
      channelUserId = message.from.id as string"

  - trigger: "When contact.user_id does not match message.from.id
      (user shared someone else's contact)"
    action: "resolveIdentity() returns a ChannelIdentity with
      phoneNumber = undefined; the state machine treats this as
      a failed verification and re-prompts"

  - trigger: "When the Telegram Bot API returns an error"
    action: "the adapter logs telegram.api.error at WARN with
      { method, errorCode, description } and propagates the error
      to the caller; the polling loop continues on the next cycle"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "A TelegramAdapter configured with the staging bot token
      (@CelloConnectStagingBot, standard api.telegram.org endpoint)"
    when: "a test user sends /start to the staging bot"
    then: "the onMessage callback fires with from = test user's ID and
      message = '/start'; the adapter's internal HTTP client made a
      getUpdates call to api.telegram.org that returned an update with
      a Telegram-assigned update_id (integer > 0); telegram.message.received
      is logged at DEBUG with { fromId, messageLength }"
    test_type: integration
    component_under_test: operations-agent
    notes: "Transport-level observable: the update_id in the getUpdates
      response is a Telegram-assigned integer that cannot be synthesized
      by a local stub. Staging bot is isolated from production users."

  - id: AC-002
    given: "The state machine has sent a request_contact keyboard via
      the staging bot"
    when: "the test user taps the contact sharing button"
    then: "a contact event is received via getUpdates containing a
      'contact' field with user_id set by Telegram server-side;
      resolveIdentity() returns channel = 'telegram',
      phoneNumber = the test user's phone, channelUserId = test user's ID;
      the contact event's update_id is a Telegram-assigned sequential
      integer following the prior update; telegram.contact.verified is
      logged at INFO with { fromId, correlationId }"
    test_type: integration
    component_under_test: operations-agent
    notes: "Transport-level observable: contact.user_id is set server-side
      by Telegram — a local stub cannot produce a valid contact event
      with matching user_id unless it controls the Telegram API."

  - id: AC-003
    given: "The state machine calls send() with a text reply"
    when: "the Telegram Bot API processes the sendMessage call"
    then: "the sendMessage HTTP POST returns a Telegram message_id
      (integer > 0) in the response; the adapter resolves the send()
      promise with the message_id; the test user receives the message
      via the staging bot"
    test_type: integration
    component_under_test: operations-agent

  - id: AC-004
    given: "A contact event where contact.user_id != message.from.id"
    when: "resolveIdentity() is called"
    then: "phoneNumber is undefined in the returned ChannelIdentity;
      the state machine does not advance past AWAITING_CONTACT;
      telegram.contact.mismatch is logged at WARN with
      { fromId, contactUserId, correlationId }"
    test_type: unit
    component_under_test: operations-agent
    notes: "Unit test: constructs a Telegram update object where
      contact.user_id = 9999 and message.from.id = 1234. Verifies
      the adapter returns phoneNumber = undefined."

  - id: AC-005
    given: "The Telegram Bot API is unreachable (mocked HTTP client
      returns connection refused)"
    when: "send() is called"
    then: "the promise rejects with a descriptive error; the state
      machine does not transition; telegram.api.error is logged at
      WARN with { method: 'sendMessage', errorCode: 'ECONNREFUSED',
      description, correlationId }"
    test_type: unit
    component_under_test: operations-agent

  - id: AC-006
    given: "The TelegramAdapter using the staging bot (@CelloConnectStagingBot),
      connected to real local PostgreSQL with M6 migrations applied"
    when: "a full registration flow is driven from /start through
      phone verification to the email prompt via the staging bot"
    then: "the state machine advances from INITIAL → AWAITING_CONTACT
      → PHONE_CONFIRMED → AWAITING_EMAIL; at least 2 sendMessage HTTP
      calls were made to api.telegram.org (verified via adapter
      instrumentation); at least 2 getUpdates responses contained
      Telegram-assigned update_ids; the database row reflects
      state = AWAITING_EMAIL with phone_stub_hash populated"
    test_type: integration
    component_under_test: operations-agent
    notes: "This is the partial E2E flow for this story's boundary.
      Transport-level observables: sendMessage call count and
      update_id presence confirm the real Telegram API was used."

  - id: AC-007-integration-gate
    given: "The Operations Agent running with TelegramAdapter against
      the staging bot (@CelloConnectStagingBot), real local PostgreSQL
      with V1–V23 pre-applied then V24+ applied on top"
    when: "a registration is driven from /start through phone
      verification to AWAITING_EMAIL state via the staging bot"
    then: "the state machine state is persisted in Postgres;
      the TelegramAdapter made real HTTP calls to api.telegram.org
      (verified by adapter call count instrumentation returning >= 4
      total HTTP calls: getUpdates + sendMessage pairs); Flyway
      reports zero checksum errors on all migrations V1 through the
      version claimed by this story; no downstream story may begin
      implementation until this AC is verified and merged"
    test_type: integration
    component_under_test: operations-agent

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The adapter does not trust the phone number string in
      a contact event unless contact.user_id equals message.from.id"
    adversarial_condition: "a test constructs a contact update where
      contact.user_id = 9999 and message.from.id = 1234 with a phone
      number present; the adapter must return phoneNumber = undefined
      and the state machine must not advance past AWAITING_CONTACT"
    test_type: unit
    component_under_test: operations-agent
    notes: "This is the adapter-testable portion of the phone verification
      invariant. Telegram's server-side guarantee that user_id is unforgeable
      is a platform property we rely on but cannot independently test."

  - id: SI-002
    statement: "The bot token is never logged, included in error
      messages, or exposed in any observable event"
    adversarial_condition: "even when telegram.api.error events are
      shipped to CloudWatch, the bot token is not present in any
      context field — verified by scanning all log calls in the adapter
      for the token string pattern"
    test_type: unit
    component_under_test: operations-agent

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: telegram.polling.started
      level: info
      trigger: "TelegramAdapter successfully begins getUpdates polling"
      context_fields: [botUsername]
      correlationId: false

    - name: telegram.message.received
      level: debug
      trigger: "Inbound message from Telegram user"
      context_fields: [fromId, messageLength, correlationId]
      correlationId: true
      notes: "Message content never logged — only length"

    - name: telegram.contact.verified
      level: info
      trigger: "contact.user_id matches message.from.id"
      context_fields: [fromId, correlationId]
      correlationId: true

  error_events:
    - name: telegram.contact.mismatch
      level: warn
      trigger: "contact.user_id does not match message.from.id"
      context_fields: [fromId, contactUserId, correlationId]

    - name: telegram.api.error
      level: warn
      trigger: "Telegram Bot API returns an error response"
      context_fields: [method, errorCode, description, correlationId]

  alarms:
    - condition: "telegram.api.error count > 50 per 5 minutes"
      fires_to: ops-warning
      notes: "Telegram API may be rate-limiting or experiencing outage"

