# ─── Identity ───────────────────────────────────────────────
id: CELLO-OPS-AGENT-005A
domain: OPS-AGENT
milestone: M6
actor: INFRA
priority: P0
components:
  - infrastructure

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO infrastructure operator,
  I want the Operations Agent deployment infrastructure (ECR repo,
  ECS task definition, Secrets Manager wiring, security groups,
  IAM roles) proven with a stub container returning HTTP 200,
  so that the deployment path is verified before any application
  code touches it — separating "infra works" from "code works"
  and eliminating the DEPLOY-003 fix-loop pattern.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When deploy.sh is run for the Operations Agent stack"
    action: "CloudFormation creates the ECS service with the existing
      shared stub container (from infra/stub/, pushed via build-stubs.sh);
      the service reaches STABLE state; the ALB health check passes"

  - trigger: "When the stub container is running"
    action: "the ECS task has access to all required secrets via
      Secrets Manager (Telegram bot token, SES credentials, directory
      API key) — verified by the task starting without
      ResourceNotFoundException"

  - trigger: "When the Operations Agent security group is created"
    action: "outbound allows HTTPS (443) to 0.0.0.0/0 (Telegram API
      and SES endpoints); port 8080 to the directory service security
      group (internal pre-authorize endpoint); port 5432 to the RDS
      security group (direct database access for registrations and
      pre_authorization_tokens via cello_ops_agent role); no other egress"

  - trigger: "When the Operations Agent ECS task is placed"
    action: "it is placed in a public subnet with AssignPublicIp: ENABLED,
      giving it a direct route to the public internet for Telegram Bot API
      (api.telegram.org) and SES calls; no inbound security group rules
      exist so the public IP creates no new attack surface; private subnets
      have no NAT gateway by design (cello-vpc.yaml) so a public subnet
      is required for external HTTP egress"

  - trigger: "When the Operations Agent ECS service is deployed or updated"
    action: "ECS uses DeploymentConfiguration MinimumHealthyPercent=0,
      MaximumPercent=100, stopping the old task before starting the new
      one — enforcing at-most-one active getUpdates poller per bot token
      at all times; a 30-second gap during deploys is acceptable for a
      registration bot"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "The cello-ecs-operations-agent.yaml CloudFormation template
      added to deploy.sh as Step 9a (after cello-ecs-directory, before
      cello-waf)"
    when: "deploy.sh runs the full sequence in us-east-1"
    then: "the Operations Agent stack reaches CREATE_COMPLETE; the ECS
      service has desiredCount=1 and runningCount=1; the task is HEALTHY;
      the stack consumes VPC/subnet exports from cello-vpc, the task role
      from cello-iam, and the ECR repo URI from cello-ecr; the ECS service
      NetworkConfiguration.AwsvpcConfiguration uses a public subnet (one of
      the existing ALB public subnets from cello-vpc) and AssignPublicIp: ENABLED;
      DeploymentConfiguration has MinimumHealthyPercent=0 and MaximumPercent=100"
    test_type: integration
    component_under_test: infrastructure
    notes: "Step 9a position: after directory (which provides the internal
      endpoint the Ops Agent calls) and before WAF/relay (no dependency).
      Public subnet required for Telegram/SES egress — no NAT gateway exists
      in cello-vpc by design."

  - id: AC-002
    given: "The existing shared stub image from infra/stub/"
    when: "build-stubs.sh is extended with a 'cello-operations-agent' target"
    then: "build-stubs.sh pushes the shared stub image to the
      cello-operations-agent ECR repo with tag 'stub' using
      --platform linux/amd64; the ECS task definition references
      this image; no new Dockerfile is created for the stub"
    test_type: integration
    component_under_test: infrastructure
    notes: "Reuses the existing stub pattern. Never docker push from local.
      build-stubs.sh is the only mechanism for stub image pushes."

  - id: AC-003
    given: "The ECS task definition references secrets from Secrets Manager"
    when: "the task launches"
    then: "all secret ARNs resolve without ResourceNotFoundException:
      cello/{env}/ops-agent/telegram-bot-token,
      cello/{env}/ops-agent/ses-credentials,
      cello/{env}/ops-agent/directory-api-key,
      cello/{env}/ops-agent/rds-credentials (the cello_ops_agent database
      role credential — INSERT/SELECT/UPDATE on registrations and
      pre_authorization_tokens only, not the cello_service role);
      the task role IAM policy grants secretsmanager:GetSecretValue
      on exactly these four ARNs (no wildcards)"
    test_type: integration
    component_under_test: infrastructure

  - id: AC-004
    given: "bootstrap.sh"
    when: "run in a new region"
    then: "bootstrap.sh provisions all four Operations Agent secrets
      (telegram-bot-token, ses-credentials, directory-api-key,
      rds-credentials) as PLACEHOLDER values under the path convention
      cello/{env}/ops-agent/{secret-name}; existing secret handling
      for directory/relay is unchanged; the put_secret_if_empty function
      treats PLACEHOLDER_POPULATE_VIA_CLI as empty (existing fix);
      the rds-credentials secret is populated by the same rotation Lambda
      pattern used for cello_service (OPS-AGENT-000 schema_assessment
      defines the cello_ops_agent role)"
    test_type: integration
    component_under_test: infrastructure

  - id: AC-004b
    given: "The ECS task running in a public subnet with AssignPublicIp: ENABLED"
    when: "the stub container starts and the health check runs"
    then: "the ECS task has a routable path to api.telegram.org — confirmed
      by curl https://api.telegram.org (or equivalent) returning HTTP 200
      from within the task; this is the internet egress smoke test that
      validates the public subnet + public IP routing path before app code
      is wired in OPS-AGENT-005B"
    test_type: integration
    component_under_test: infrastructure
    notes: "Verify via ECS Exec: aws ecs execute-command --command 'curl -s
      https://api.telegram.org' — must return a non-connection-error response.
      Without this, OPS-AGENT-003 TelegramAdapter will fail silently at
      the TCP layer."

  - id: AC-004c
    given: "The ECS service definition in cello-ecs-operations-agent.yaml"
    when: "the DeploymentConfiguration is inspected"
    then: "MinimumHealthyPercent=0 and MaximumPercent=100; the service
      description returned by aws ecs describe-services confirms these values;
      during a service update, ECS stops the running task before starting
      the new one (verified by observing task count = 0 briefly in CloudWatch
      metrics during a test deploy)"
    test_type: integration
    component_under_test: infrastructure
    notes: "At-most-one constraint for Telegram long-polling. Two simultaneous
      pollers on the same bot token cause undefined behavior (updates delivered
      to one task at random, some dropped or duplicated). Standard ECS pattern
      for single-instance workers."

  - id: AC-005
    given: "The Operations Agent security group"
    when: "egress rules are inspected"
    then: "outbound is restricted to: HTTPS (443) to 0.0.0.0/0
      (Telegram API and SES endpoints are distributed); port 8080 to
      the directory service security group (internal pre-authorize
      endpoint); port 5432 to the RDS security group (cello_ops_agent
      database credential for registrations and pre_authorization_tokens);
      no other egress is permitted; no inbound rules exist"
    test_type: integration
    component_under_test: infrastructure
    notes: "Telegram and SES IPs are not enumerable; HTTPS egress
      to 0.0.0.0/0 is acceptable. Application code constrains usage.
      Port 5432 egress uses the same RDS security group reference pattern
      as cello-ecs-directory.yaml."

  - id: AC-006
    given: "The cello-ecs-operations-agent.yaml template and cello-iam.yaml"
    when: "reviewed for IAM permissions"
    then: "the Operations Agent task role (added to cello-iam.yaml following
      the existing pattern for directory/relay task roles) has ONLY:
      secretsmanager:GetSecretValue on the four enumerated secret ARNs
      (telegram-bot-token, ses-credentials, directory-api-key, rds-credentials),
      logs:CreateLogStream + logs:PutLogEvents on the log group, and
      ecs:ExecuteCommand for debugging; no S3, no KMS, no IAM,
      no access to directory/relay secret ARNs"
    test_type: manual
    component_under_test: infrastructure
    notes: "Task role lives in cello-iam.yaml (centralized pattern).
      Exported for cross-stack reference by cello-ecs-operations-agent.yaml.
      The rds-credentials secret stores the cello_ops_agent PostgreSQL role
      password — not the cello_service password."

  - id: AC-007
    given: "deploy.sh with the Operations Agent stack added"
    when: "deploy.sh is run in a new region (eu-central-1) after
      bootstrap.sh has been run in that region"
    then: "the stack creates successfully on first attempt with no
      manual intervention; bootstrap.sh provisioned all three secrets;
      the region-expansion-in-one-variable goal is maintained"
    test_type: integration
    component_under_test: infrastructure

  - id: AC-008
    given: "infra/STATE.md"
    when: "the Operations Agent stack is deployed (AC-001 passes)"
    then: "STATE.md is updated with the new stack name, status,
      deployment date, and key resource identifiers (ECS service ARN,
      ECR repo URI, security group ID); this update happens immediately
      after 005A, not deferred to 005B"
    test_type: manual
    component_under_test: infrastructure

  - id: AC-009
    given: "cello-cloudwatch.yaml"
    when: "the CloudWatch stack is redeployed after the Operations Agent
      ECS service exists"
    then: "a new alarm 'cello-operations-agent-ecs-task-count-{env}'
      is created; fires to ops-critical when runningCount < 1"
    test_type: integration
    component_under_test: infrastructure

  - id: AC-009b
    given: "The Ops Agent ECS task running (stub or real image) and the
      directory ECS task running in the same VPC"
    when: "ECS Exec is used to run curl http://<directory-task-ip>:8080/internal/pre-authorize
      from the Ops Agent task"
    then: "HTTP 401 Unauthorized is returned (no API key provided);
      this confirms: (1) the directory security group allows inbound on
      port 8080 from the Ops Agent security group, (2) the directory HTTP
      server routes /internal/pre-authorize on port 8080, (3) VPC routing
      between the Ops Agent subnet and directory subnet works; if the
      response is connection timeout or connection refused, the SG inbound
      rule or VPC routing is wrong — fix before 005B begins"
    test_type: integration
    component_under_test: infrastructure
    notes: "Requires adding an inbound rule to the directory security group:
      port 8080 from the Ops Agent security group. This is a cross-stack
      reference: cello-ecs-operations-agent.yaml exports the Ops Agent SG,
      cello-ecs-directory.yaml (or cello-vpc.yaml) imports it and adds the
      inbound rule. Same pattern as directory → RDS inbound."

  - id: AC-009c
    given: "cello-rotation.yaml"
    when: "the rotation Lambda configuration is inspected"
    then: "a second RotationSchedule resource exists targeting
      cello/{env}/ops-agent/rds-credentials for the cello_ops_agent role;
      the handler.py reads ROLE_NAME from the secret JSON 'username' field
      (not hardcoded); verified by: triggering a manual rotation via
      aws secretsmanager rotate-secret and confirming the Ops Agent task
      can still connect to PostgreSQL after the password change"
    test_type: integration
    component_under_test: infrastructure
    notes: "The rotation Lambda must support multiple database roles.
      OPS-AGENT-000 migration_note already specifies: 'The password is
      set by the rotation Lambda using the same pattern as cello_service.'
      This AC makes that requirement testable."

  - id: AC-010-integration-gate
    given: "The Operations Agent ECS service running with the stub container
      in us-east-1, all secrets resolving, health check passing"
    when: "the deployment is verified"
    then: "ECS service is STABLE with runningCount=1; STATE.md is updated;
      CloudWatch alarm exists; bootstrap.sh handles the new secrets in
      a fresh region; this AC is blocking — OPS-AGENT-005B may not begin
      until this is verified and merged"
    test_type: integration
    component_under_test: infrastructure
    notes: "This is the Mitigation A gate. Infra is proven; 005B wires app code."

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The Operations Agent task role must not have access
      to any CELLO key material (node private keys, envelope keys,
      FROST shares)"
    adversarial_condition: "even if the Operations Agent container is
      compromised, the attacker cannot read directory or relay private
      keys from Secrets Manager because the IAM policy does not grant
      access to those secret ARNs"
    test_type: manual
    component_under_test: infrastructure

  - id: SI-002
    statement: "The Operations Agent database role (cello_ops_agent) has
      access ONLY to the registrations and pre_authorization_tokens tables —
      no access to agent_profiles, sessions, conversation_chains,
      checkpoints, or any key material table"
    adversarial_condition: "even if the Operations Agent container is
      compromised, the attacker's database credential (cello_ops_agent) cannot
      read or write agent_profiles, sessions, or key material; cannot delete
      any row (no-DELETE semantics enforced by RLS); cannot escalate to
      cello_service permissions; verified by: SELECT 1 FROM agent_profiles
      as cello_ops_agent — must return permission denied (AC-007b in
      OPS-AGENT-000 is the authoritative test)"
    test_type: manual
    component_under_test: infrastructure

# ─── Observability ──────────────────────────────────────────
observability:
  events: []
  error_events: []
  alarms:
    - condition: "ECS runningCount < 1 for cello-operations-agent service"
      fires_to: ops-critical
      notes: "Added to cello-cloudwatch.yaml in AC-009"
  notes: "005A is infrastructure-only. Application observability events
    are defined in OPS-AGENT-001 through 004 and wired in 005B."

