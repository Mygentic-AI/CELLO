# ─── Identity ───────────────────────────────────────────────
id: CELLO-REPOSPLIT-001
domain: REPOSPLIT
milestone: M6
actor: CLIENT
priority: P0
components:
  - client
  - crypto
  - transport
  - protocol-types
  - adapter-claude-code

# ─── Intent ─────────────────────────────────────────────────
story: >
  As a CELLO user,
  I want to install @cello/connect from npm and have my agent
  connected to the live CELLO network without cloning a repo or
  running infrastructure,
  so that adoption requires a single command: claude mcp add cello
  npx @cello/connect.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When a user runs npm install @cello/connect"
    action: "the package installs with all dependencies resolved;
      no postinstall scripts; no native compilation required; the
      production directory and relay endpoints are baked into the
      package as defaults"

  - trigger: "When a user runs npx @cello/connect"
    action: "the MCP server starts and exposes all CELLO tools
      (cello_register, cello_send, cello_receive, etc.) over the
      MCP stdio transport; no configuration required for connecting
      to the live network"

  - trigger: "When the package is inspected by an AI investigator
      reading AUDIT-ME.md"
    action: "each privacy claim in AUDIT-ME.md names specific files
      and code paths; an investigator can verify every claim by
      reading the named files without prior knowledge of the codebase"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "The cello-client repository (github.com/Mygentic-AI/cello-client)"
    when: "the extraction is complete and pnpm run build is executed
      from scratch (rm -rf dist/ in all packages first)"
    then: "all five packages compile without error from a clean slate;
      TypeScript project references are correctly wired — verified by
      tsc --build succeeding with zero cached outputs"
    test_type: integration
    component_under_test: client

  - id: AC-002
    given: "The cello-client repository"
    when: "pnpm run build is executed at the root"
    then: "all five packages compile without error; dist/ directories
      are populated; no dependency on packages that stayed in
      trustless-cello (directory, relay, e2e-tests) — verified by
      pnpm why @cello/directory returning 'not found'"
    test_type: integration
    component_under_test: client

  - id: AC-003
    given: "The cello-client repository"
    when: "pnpm run test is executed at the root"
    then: "all existing unit tests pass; no test depends on directory
      or relay packages; no test requires AWS credentials or a running
      database"
    test_type: integration
    component_under_test: client

  - id: AC-004
    given: "The adapter-claude-code package"
    when: "the production endpoint configuration is inspected"
    then: "CELLO_DIRECTORY_URL defaults to the production directory
      ALB endpoint (known after M5 closes and STATE.md is finalized);
      CELLO_RELAY_MULTIADDR defaults to the production relay multiaddr;
      these are compile-time constants overridable by environment variables"
    test_type: unit
    component_under_test: adapter-claude-code
    notes: "AC-004 requires M5 to be closed and STATE.md finalized to
      know the real endpoint values. Final sync from trustless-cello HEAD
      happens just before publish."

  - id: AC-005
    given: "The package.json#files field (or .npmignore) in the
      adapter-claude-code package"
    when: "npm pack --dry-run is run"
    then: "the tarball manifest contains no files from packages/directory,
      packages/relay, infra/, or any .env file; the package.json#files
      field is the enforcement mechanism; CI runs this check on every PR"
    test_type: integration
    component_under_test: adapter-claude-code
    notes: "CI step: npm pack --dry-run | grep -E 'directory|relay|infra|.env'
      must return exit code 1 (no matches). This is a CI shell step,
      not a Vitest test."

  - id: AC-006
    given: "The cello-client repository CI pipeline (GitHub Actions)"
    when: "a push to main occurs"
    then: "CI runs: pnpm install → build → typecheck → test → tarball check
      (AC-005); the publish step only executes if all prior steps succeed
      (non-zero exit on any failure prevents publish); publish runs only
      on tagged releases using NPM_TOKEN from GitHub secrets"
    test_type: integration
    component_under_test: client

  - id: AC-007
    given: "AUDIT-ME.md in the cello-client repository root"
    when: "an AI investigator reads it"
    then: "at minimum these three claims are present with exact file pointers:
      (1) The relay never sees message content in plaintext — names the Noise
      encryption setup file and circuit relay fallback code path;
      (2) K_local never leaves the client process — names key generation
      and FROST DKG client code;
      (3) No telemetry, analytics, or phone-home behavior — names the
      absence of any outbound HTTP calls not to directory/relay;
      each claim has a 'Verify:' subsection naming 2-4 specific files
      that exist at the stated paths"
    test_type: manual
    component_under_test: client
    notes: "Verification: open AUDIT-ME.md, confirm each claim has a
      Verify: subsection with 2+ file paths. Confirm each named file
      exists at the stated path in the repo."

  - id: AC-008
    given: "The cello-client repository README.md"
    when: "a stranger reads it"
    then: "it contains: one-line install command, what CELLO is (2-3
      sentences), quick start (register + send a message), link to
      AUDIT-ME.md, link to the main CELLO docs; no jargon unexplained;
      no reference to the trustless-cello monorepo"
    test_type: manual
    component_under_test: client
    notes: "Verification: read README cold with no prior CELLO knowledge.
      Can you complete the quick start in under 5 minutes?"

  - id: AC-009
    given: "A git diff between the extracted packages and their
      trustless-cello source at the same HEAD"
    when: "the diff is inspected AND the full test suite from
      trustless-cello is run against the extracted code"
    then: "only structural changes exist (import paths, package.json
      names, tsconfig references); no behavioral code changes; the
      test suite from trustless-cello runs without regressions when
      pointed at the extracted code"
    test_type: manual
    component_under_test: client

  - id: AC-010
    given: "@cello/connect@beta published on npm"
    when: "npm install @cello/connect@beta is run in a fresh directory
      (manually, after publish)"
    then: "the package installs successfully; npx @cello/connect starts
      the MCP server; the package is published under the @cello scope
      with the 'beta' dist-tag (not 'latest')"
    test_type: manual
    component_under_test: adapter-claude-code
    notes: "Mitigation D: beta tag only. Promoted to latest in M6-E2E-001.
      This is a post-publish manual verification, not a CI step."

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The published package must not contain any server-side
      code, IaC templates, deployment scripts, or AWS credentials;
      enforced via package.json#files allowlist in adapter-claude-code"
    adversarial_condition: "when npm pack --dry-run is run in CI and
      the output is scanned for forbidden paths (directory, relay, infra,
      .env), zero matches are returned; the package.json#files field
      explicitly allowlists only the dist/ directory and package.json"
    test_type: integration
    component_under_test: adapter-claude-code
    notes: "Enforcement mechanism: package.json#files allowlist.
      Test: CI shell step (npm pack --dry-run | grep), not Vitest."

  - id: SI-002
    statement: "The published package must not contain test fixtures
      that embed real keys, tokens, or secret material"
    adversarial_condition: "when npm pack --dry-run output is inspected,
      no file in the tarball contains the pattern '-----BEGIN PRIVATE KEY-----'
      or any FROST share JSON structure matching { share: { index:, value: } };
      the package.json#files allowlist ensures test fixtures are excluded"
    test_type: integration
    component_under_test: client
    notes: "Test: extend the CI npm pack --dry-run grep to also scan
      for private key header patterns."

# ─── Observability ──────────────────────────────────────────
observability:
  events: []
  error_events: []
  alarms: []
  notes: "REPOSPLIT-001 is a packaging and publishing story — no
    runtime observability beyond what the client packages already emit.
    Client-side events are defined in existing M0-M4 stories."

