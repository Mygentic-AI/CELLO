# ─── Identity ───────────────────────────────────────────────
id: CELLO-REPOSPLIT-001
domain: REPOSPLIT
milestone: M6
actor: CLIENT
priority: P0
components:
  - adapter-claude-code

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO development team,
  I want the cello-client repository scaffolded with a working
  CI pipeline, operator-facing documentation, and the npm publish
  path cleared before any package code moves,
  so that REPOSPLIT-002 (extraction and publish) has no structural
  surprises and the documentation is written against real M6
  development decisions as they happen rather than reconstructed
  after the fact.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When a push is made to the cello-client repository"
    action: "GitHub Actions CI runs pnpm install → build → typecheck
      → test → tarball check; the publish step only executes on tagged
      releases and requires all prior steps to pass"

  - trigger: "When an AI investigator reads AUDIT-ME.md in cello-client"
    action: "each privacy claim names specific files and code paths that
      an investigator can verify by reading the named files without prior
      knowledge of the codebase"

  - trigger: "When a stranger reads the cello-client README"
    action: "they can complete the install and quick start in under
      5 minutes with no prior CELLO knowledge"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "The cello-client repository"
    when: "the tsconfig prerequisite fix is committed to trustless-cello"
    then: "packages/adapter-claude-code/tsconfig.json no longer references
      { path: '../relay' } or { path: '../directory' }; 'exclude':
      ['src/__tests__'] is present; pnpm run build in trustless-cello
      still succeeds with zero errors after the change; additionally,
      packages/interfaces/package.json has 'private' removed and a
      'files' allowlist (['dist/', 'package.json']) added; npm pack
      --dry-run in packages/interfaces/ produces a valid tarball"
    test_type: integration
    component_under_test: adapter-claude-code
    notes: "This commit lands in trustless-cello, not cello-client.
      It is the first commit of this story. Must precede all extraction
      work so the monorepo CI stays green throughout. The @cello/interfaces
      prep (removing private, adding files allowlist) is a prerequisite
      for REPOSPLIT-002 — cello-client will consume it as a pinned npm
      dependency."

  - id: AC-002
    given: "The cello-client repository after scaffolding"
    when: "pnpm install is run at the root"
    then: "the workspace resolves cleanly; pnpm-workspace.yaml references
      core/*; root tsconfig.json references all five core/ package paths;
      vitest.workspace.ts references all five core/ package paths;
      no package code exists yet — core/ directories contain only
      package.json and tsconfig.json stubs"
    test_type: integration
    component_under_test: client

  - id: AC-003
    given: "The GitHub Actions CI pipeline (.github/workflows/ci.yml)"
    when: "a push to main occurs with no package code present"
    then: "CI runs to completion: pnpm install → build → typecheck →
      test → tarball check; each step exits 0 on an empty workspace;
      the publish step is present but gated on tags only and does not
      run on a plain push; NPM_TOKEN is wired in GitHub secrets"
    test_type: integration
    component_under_test: client
    notes: "CI must be green on a skeleton repo before any code moves.
      This proves the pipeline works independently of extraction."

  - id: AC-004
    given: "AUDIT-ME.md in the cello-client repository root"
    when: "an AI investigator reads it"
    then: "at minimum these three claims are present with exact file
      pointers that will be valid after REPOSPLIT-002 extracts the
      packages: (1) The relay never sees message content in plaintext
      — names the Noise encryption setup file and circuit relay fallback
      code path; (2) K_local never leaves the client process — names key
      generation and FROST DKG client code; (3) No telemetry, analytics,
      or phone-home behavior — names the absence of any outbound HTTP
      calls not to directory/relay; each claim has a Verify: subsection
      naming 2-4 specific files at paths they will occupy in cello-client"
    test_type: manual
    component_under_test: client
    notes: "File paths reference the cello-client layout (core/crypto,
      core/transport, etc.) even though the code has not moved yet.
      AUDIT-ME.md is a living document — update it as M6 decisions
      are made. Final verification that named files exist happens in
      REPOSPLIT-002."

  - id: AC-005
    given: "SKILL.md in packages/adapter-claude-code/ (updated in-place
      in trustless-cello, then copied to cello-client root during
      REPOSPLIT-002)"
    when: "an agent reads it"
    then: "the install command is correct (claude mcp add cello npx
      @cello/connect); the package name is @cello/connect; tool usage
      examples are present and accurate for M6 (cello_register,
      cello_send, cello_receive, cello_status); content is sufficient
      for an agent to get connected — final polish deferred to later
      milestones"
    test_type: manual
    component_under_test: adapter-claude-code

  - id: AC-006
    given: "The cello-client repository README.md"
    when: "a stranger reads it with no prior CELLO knowledge"
    then: "it contains: one-line install command, what CELLO is (2-3
      sentences), quick start (register + send a message), link to
      AUDIT-ME.md; no jargon unexplained; no reference to the
      trustless-cello monorepo"
    test_type: manual
    component_under_test: client
    notes: "Verification: read README cold. Can you complete the quick
      start in under 5 minutes?"

  - id: AC-007
    given: "The production directory ALB (cello-dir-dev-*.elb.amazonaws.com)
      and a client machine outside the VPC (developer laptop or demo EC2)"
    when: "a libp2p WebSocket dial is attempted from outside the VPC to
      the directory ALB on port 443 (or 80)"
    then: "the connection succeeds; the libp2p handshake (Noise XX) completes;
      the client can open a stream on /cello/frost/1.0.0 or /cello/session/1.0.0;
      the directory responds to protocol frames; this confirms the full
      transport path: external client → ALB → directory container (WebSocket);
      the deliverable is a working CELLO_DIRECTORY_URL (ALB hostname) that
      REPOSPLIT-002 AC-003 can bake in as the production endpoint"
    test_type: integration
    component_under_test: transport
    notes: "This resolves the transport_path_prerequisite documented in
      REPOSPLIT-002. The current directory listens on TCP:4000 (libp2p) which
      is NOT ALB-accessible. To pass this AC, the directory must be configured
      to listen on a WebSocket multiaddr that the ALB can forward to.

      Implementation options (choose one):
      (1) Directory adds a /ws listener on port 8080 alongside the health server.
          ALB already forwards port 80 → 8080. WebSocket upgrade goes through the
          existing HTTP listener. Client dials /dns4/<alb>/tcp/80/ws/p2p/<peerID>.
      (2) Second ALB listener on port 443 (HTTPS) with WebSocket support, forwarding
          to a new container port (e.g. 4000/ws). Client uses wss://.
      (3) Separate relay ALB exposing the relay's libp2p port. Client dials relay
          directly, bypasses circuit relay entirely.

      Option (1) is simplest — reuses existing ALB, existing port mapping, existing
      security group rules. The relay remains VPC-internal; the directory acts as
      circuit relay (already configured via circuitRelayServer() in transport/node.ts).

      This AC blocks REPOSPLIT-002 AC-003, DEMO-001 AC-004b, and M6-E2E-001.
      Must complete before any of those stories can pass."

# ─── Security Invariants ────────────────────────────────────
security_invariants: []

