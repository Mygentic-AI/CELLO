  alarms: []
  notes: "REPOSPLIT-001 is scaffolding only — no runtime code ships."

# ─── Implementation Notes ───────────────────────────────────
implementation_notes:
  prerequisite_first_commit: >
    First commit of this story must be the tsconfig fix in trustless-cello
    (AC-001). Everything else in this story lives in cello-client. Do not
    begin cello-client work until the tsconfig fix is merged and the
    trustless-cello CI is green.

  ci_design: >
    Node 24 LTS. pnpm 10.33.2 (pin to match trustless-cello buildspec.yml).
    Pipeline: pnpm install → tsc --build → pnpm test (--pool-options.threads.maxThreads=1)
    → tarball check → publish (tags only). Two tarball CI checks:
    (1) npm pack --dry-run | grep -E 'directory|relay|infra|.env' exits 1;
    (2) npm pack --dry-run | grep 'SKILL.md' exits 0.

  audit_me_is_living: >
    AUDIT-ME.md is written now but will be updated as M6 progresses.
    When cello_register ships (OPS-AGENT chain), update the K_local claim
    to name the registration code path. By the time REPOSPLIT-002 runs,
    AUDIT-ME.md should require no rewrites — only final verification
    that named files exist at the stated paths.

