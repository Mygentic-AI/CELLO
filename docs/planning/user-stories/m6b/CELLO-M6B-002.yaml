---
name: CELLO-M6B-002
type: user-story
date: 2026-06-03
topics: [frost, error-propagation, dx, debugging, directory, client, pre-m7]
status: draft
description: >
  Propagate distinct FROST ceremony failure reasons through the session request
  wire protocol instead of collapsing all failures into directory_below_threshold.
  Adds ceremony_timeout and ceremony_exhausted as distinct SessionRequestErrorReason
  values, and maps ThresholdSignature error reasons to the appropriate wire reason
  in directory-node.ts. Dramatically reduces debugging time when FROST ceremonies
  fail — the operator knows immediately whether the directory stream is down,
  the ceremony timed out, or the agent is not bootstrapped.
---
# ─── Identity ───────────────────────────────────────────────
id: CELLO-M6B-002
domain: PREP
milestone: M6B
actor: DEV
priority: P0
components:
  - directory
  - client
  - adapter-claude-code
  - infra

# ─── Intent ─────────────────────────────────────────────────
story: >
  As a CELLO operator debugging a failed session initiation,
  I want the session_request_error reason to reflect the actual FROST ceremony
  failure (ceremony_timeout, ceremony_exhausted, or directory_below_threshold)
  instead of always returning directory_below_threshold,
  so that I can distinguish between a timed-out ceremony, a not-bootstrapped
  agent, and a broken directory connection without reading ECS logs.

# ─── Context ────────────────────────────────────────────────
# Current bug (packages/directory/src/directory-node.ts lines 1986-1989,
# trustless-cello repo):
#
#   const result = await signer.participateInCeremony(...)
#   if (!result.ok) {
#     this.#sendFrame(stream, encodeSessionRequestError({
#       type: "session_request_error", reason: "directory_below_threshold"
#     }));
#     return;
#   }
#
# ThresholdSignatureError.error.reason (from packages/crypto/src/frost/types.ts
# lines 36-44, trustless-cello repo) has THREE distinct values, all collapsed
# to one wire reason. ClientDelegatedSigner is at
# packages/directory/src/directory-node.ts line 2784 (trustless-cello repo):
#
#   "DIRECTORY_BELOW_THRESHOLD" — ClientDelegatedSigner: #streams is null or
#     the agent is not in the #streams map, or stream.send threw (lines 2823-2851).
#     Means the directory-side ceremony delegation mechanism is broken.
#     True "below threshold."
#
#   "CEREMONY_TIMEOUT" — ClientDelegatedSigner line 2858: the 30-second timer fired
#     waiting for ceremony_result from the client. Means the client-side cello-mcp
#     is unresponsive or the ceremony hung.
#
#   "CEREMONY_EXHAUSTED" — ClientDelegatedSigner line 2875: resolveFromClient was
#     called with null, meaning the client ran the FROST ceremony but returned no
#     signature. This happens when the directory's frost-handler returns
#     AGENT_NOT_BOOTSTRAPPED (no share for this agent) or EPOCH_EXPIRED —
#     the client's FrostThresholdSigner fails and sends ceremony_result with
#     signature: null. Effectively means "agent not bootstrapped."
#
# The cost: every FROST failure returns directory_below_threshold. In production
# debugging, the operator cannot tell whether to:
#   - Check if the directory is running (DIRECTORY_BELOW_THRESHOLD)
#   - Check if the agent completed DKG registration (CEREMONY_EXHAUSTED)
#   - Check if the client process is responsive (CEREMONY_TIMEOUT)
# All three surface identically. This has burned significant debugging time across
# every milestone since M3.
#
# The fix touches 6 files across 2 repos:
#   1. packages/directory/src/directory-types.ts — add 2 new SessionRequestErrorReason values
#   2. packages/directory/src/directory-node.ts — map result.error.reason to wire reason
#   3. cello-client/core/client/src/types.ts — add 2 new InitiateSessionResult failure reasons
#   4. cello-client/core/client/src/client.ts — add 2 new if-branches at lines 5360-5369
#   5. cello-client/core/client/src/mcp-server.ts line 479 — add per-reason message fields
#   6. infra/cloudformation/cello-cloudwatch.yaml — new frost failure alarm
#
# NOTE: ceremony_exhausted is still coarser than ideal — it collapses
# AGENT_NOT_BOOTSTRAPPED, EPOCH_EXPIRED, and share_verification_failed into one
# reason. A future story could propagate the specific frost-handler reason through
# the ceremony_result message, but that requires a protocol change. This story
# achieves 80% of the debugging value with zero protocol changes.
#
# PRE-EXISTING OUT-OF-SCOPE GAP: the existing client.ts switch at line 5360-5369
# does not handle "not_registered", "peer_not_registered" separately — they fall
# through to "directory_unreachable". This is known but out of scope for this story.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When participateInCeremony returns { ok: false, error: { reason:
    'CEREMONY_TIMEOUT' } } during session request handling"
    action: "the directory sends session_request_error with reason: 'ceremony_timeout';
      frost.ceremony.failed is logged at WARN with agentId (first 16 chars of hex),
      reason: 'ceremony_timeout', and ceremonyId (first 16 chars)"

  - trigger: "When participateInCeremony returns { ok: false, error: { reason:
    'CEREMONY_EXHAUSTED' } } during session request handling"
    action: "the directory sends session_request_error with reason: 'ceremony_exhausted';
      frost.ceremony.failed is logged at WARN with agentId, reason: 'ceremony_exhausted',
      and ceremonyId"

  - trigger: "When participateInCeremony returns { ok: false, error: { reason:
    'DIRECTORY_BELOW_THRESHOLD' } } during session request handling"
    action: "the directory sends session_request_error with reason: 'directory_below_threshold'
      (unchanged from current behavior); frost.ceremony.failed is logged at WARN with
      agentId, reason: 'directory_below_threshold', and ceremonyId"

  - trigger: "When the client receives a session_request_error with reason
    'ceremony_timeout'"
    action: "initiateSession resolves with { ok: false, reason: 'ceremony_timeout' };
      the cello_initiate_session tool (which calls initiateSession) returns a JSON
      response with reason: 'ceremony_timeout' and a message field describing the
      timeout and suggesting the operator verify the agent's MCP process is responsive"

  - trigger: "When the client receives a session_request_error with reason
    'ceremony_exhausted'"
    action: "initiateSession resolves with { ok: false, reason: 'ceremony_exhausted' };
      the cello_initiate_session tool returns a JSON response with reason:
      'ceremony_exhausted' and a message field indicating the agent may not be
      bootstrapped and suggesting cello_register be called if registration was not
      completed"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "A session request handler that calls a stub IThresholdSigner returning
      { ok: false, error: { reason: 'CEREMONY_TIMEOUT' } }"
    when: "the handler processes the session request"
    then: "encodeSessionRequestError is called with reason: 'ceremony_timeout'
      (not 'directory_below_threshold'); the frost.ceremony.failed WARN event is
      logged with reason: 'ceremony_timeout'"
    test_type: unit
    component_under_test: directory

  - id: AC-002
    given: "A session request handler that calls a stub IThresholdSigner returning
      { ok: false, error: { reason: 'CEREMONY_EXHAUSTED' } }"
    when: "the handler processes the session request"
    then: "encodeSessionRequestError is called with reason: 'ceremony_exhausted';
      frost.ceremony.failed is logged at WARN with reason: 'ceremony_exhausted'"
    test_type: unit
    component_under_test: directory

  - id: AC-003
    given: "A session request handler that calls a stub IThresholdSigner returning
      { ok: false, error: { reason: 'DIRECTORY_BELOW_THRESHOLD' } }"
    when: "the handler processes the session request"
    then: "encodeSessionRequestError is called with reason: 'directory_below_threshold'
      (backward-compatible — this case is unchanged); frost.ceremony.failed is logged
      at WARN with reason: 'directory_below_threshold'"
    test_type: unit
    component_under_test: directory

  - id: AC-004
    given: "The updated packages/directory/src/directory-types.ts with two new
      SessionRequestErrorReason members ('ceremony_timeout', 'ceremony_exhausted')"
    when: "the TypeScript compiler processes a file that passes the string literal
      'ceremony_timeout' to the mapCeremonyFailure function return-typed as
      SessionRequestErrorReason"
    then: "compilation succeeds without error; conversely, if the two new members
      are temporarily removed from SessionRequestErrorReason, the mapCeremonyFailure
      switch statement's return types fail to satisfy the declared return type
      (TypeScript exhaustiveness check produces a compile error) — verified by
      a test that runs tsc with the new members present (must pass) and confirms
      the type union is correct by attempting a type assignment of each new member
      to a SessionRequestErrorReason variable"
    test_type: unit
    component_under_test: directory

  - id: AC-005
    given: "The updated core/client/src/client.ts in cello-client"
    when: "a session_request_error frame arrives with reason: 'ceremony_timeout'"
    then: "initiateSession returns { ok: false, reason: 'ceremony_timeout' };
      the reason string 'ceremony_timeout' appears verbatim in the return value
      (not mapped to 'directory_unreachable' or any other existing reason)"
    test_type: unit
    component_under_test: client

  - id: AC-006
    given: "The updated core/client/src/client.ts in cello-client"
    when: "a session_request_error frame arrives with reason: 'ceremony_exhausted'"
    then: "initiateSession returns { ok: false, reason: 'ceremony_exhausted' };
      the reason string 'ceremony_exhausted' appears verbatim in the return value"
    test_type: unit
    component_under_test: client

  - id: AC-007
    given: "The updated core/client/src/types.ts in cello-client"
    when: "the InitiateSessionResult type is inspected"
    then: "the failure union includes 'ceremony_timeout' and 'ceremony_exhausted'
      as members alongside the existing members; a TypeScript variable declared as
      InitiateSessionResult assigned the value { ok: false, reason: 'ceremony_exhausted' }
      compiles without error"
    test_type: unit
    component_under_test: client

  - id: AC-008
    given: "A DirectoryNode constructed via createDirectoryNode with a stub
      IThresholdSigner (injected via the thresholdSigners registration path) that
      returns { ok: false, error: { reason: 'CEREMONY_EXHAUSTED' } }"
    when: "a CelloClient dials the directory, authenticates the signaling stream,
      and sends a session_request frame — following the pattern in
      packages/directory/src/__tests__/session004.test.ts (real libp2p streams,
      no NODE_ENV=test shortcut, stub IThresholdSigner injected via the
      registerThresholdSigner path)"
    then: "the decoded CBOR frame from the directory has reason: 'ceremony_exhausted'
      (NOT 'directory_below_threshold') — verified using the raw StreamReader pattern
      from session004.test.ts: send a session_request frame over the authenticated
      stream, read the response with `await reader.readDecoded()`, assert
      `response['reason'] === 'ceremony_exhausted'`"
    test_type: integration
    component_under_test: directory
    notes: "Follow packages/directory/src/__tests__/session004.test.ts: createNode()
      for client, createDirectoryNode() for directory, real TCP dial + authenticate
      + session_request frame exchange using StreamReader. The IThresholdSigner stub
      must be registered on the directory (via registerThresholdSigner) before the
      client sends peer_info_announce. Assert the raw decoded frame reason directly —
      the higher-level client.initiateSession return value is covered by AC-005 and
      AC-006 (unit tests) and does not need to be verified here."

  - id: AC-009
    given: "The updated core/client/src/mcp-server.ts where cello_initiate_session
      at line 479 currently returns jsonText({ ok: false, reason: result.reason })"
    when: "initiateSession returns { ok: false, reason: 'ceremony_timeout' }"
    then: "the tool JSON response includes reason: 'ceremony_timeout' AND a
      message field with text about the timeout (e.g. 'The FROST signing ceremony
      timed out. Verify the agent MCP process is responsive and retry.'); it does
      NOT say 'below threshold' or 'directory unavailable'; verified by a unit test
      that mocks client.initiateSession to return ceremony_timeout and asserts the
      JSON response shape"
    test_type: unit
    component_under_test: client
    notes: "Target file: cello-client/core/client/src/mcp-server.ts line 479.
      The current code is a bare passthrough: return jsonText({ ok: false, reason: result.reason }).
      This story requires adding a per-reason message field for the two new reasons,
      following the pattern at mcp-server.ts:1309-1315 where cello_request_connection
      returns stage-specific error messages."

  - id: AC-010
    given: "The updated core/client/src/mcp-server.ts"
    when: "initiateSession returns { ok: false, reason: 'ceremony_exhausted' }"
    then: "the tool JSON response includes reason: 'ceremony_exhausted' AND a
      message field containing the exact 4-step re-registration recipe:
        'FROST ceremony exhausted — K_server share mismatch or missing. To fix:
        1. DELETE FROM agent_key_shares WHERE agent_id=<your-pubkey> (in directory DB)
        2. DELETE FROM agent_profiles WHERE k_local_pubkey LIKE <your-pubkey-prefix>%
        3. Restart the directory ECS task (aws ecs stop-task) to flush in-memory share cache
        4. pkill -f cello-mcp, rm ~/.cello/client.db, get a fresh token from Telegram, call cello_register'
      The message must NOT say 'below threshold'; verified by a unit test that mocks
      client.initiateSession to return ceremony_exhausted and asserts the JSON
      response shape includes all four numbered steps"
    test_type: unit
    component_under_test: client
    notes: "This is the recipe that currently takes 4+ hours to rediscover from scratch
      each time it's needed. Having it in the tool output means the operator never
      has to debug it again — they just follow the steps. The exact SQL and CLI
      commands must be in the message, not vague guidance."

  - id: AC-011
    given: "The implementation is complete"
    when: "the implementer reviews docs/planning/discussion_logs/2026-05-16_0753_development-pipeline-and-local-iteration.md"
    then: "frost.ceremony.failed appears in the canonical event taxonomy with
      level: warn, context_fields: [agentId, reason, ceremonyId], and trigger
      description matching the observability section of this story"
    test_type: unit
    component_under_test: directory
    notes: "This is a documentation gate, not a runtime test. The implementer
      must add the event to the taxonomy file before closing the story."

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The frost.ceremony.failed log event must not include the FROST share
      bytes, partial signatures, or any key material — only the agentId prefix,
      reason string, and ceremonyId prefix"
    adversarial_condition: "an attacker who can read CloudWatch logs must not learn
      any K_server_X share material from ceremony failure logs; verified by
      asserting that the Logger.warn call site for frost.ceremony.failed passes
      only { agentId: initiatorHex.slice(0, 16), reason: wireReason, ceremonyId:
      ceremonyId.slice(0, 16) } — a test audits the call site and asserts that no
      additional context fields exist, and that neither share bytes nor partial
      signature bytes appear in any passed context value"
    test_type: unit
    component_under_test: directory

# ─── Observability ──────────────────────────────────────────
observability:
  events: []
  error_events:
    - name: frost.ceremony.failed
      level: warn
      trigger: "When participateInCeremony returns ok: false during session request
        handling (any reason)"
      context_fields: [agentId, reason, ceremonyId]
      correlationId: false
  notes: >
    frost.ceremony.failed replaces the existing protocolLog("SESS", ...) call at
    directory-node.ts line 1987 for the failure path. The existing call goes to
    process.stdout (not the structured Logger) and does not carry a machine-readable
    reason field. The new event goes through the injected Logger so it lands in
    CloudWatch with a queryable `reason` field.

    frost.ceremony.failed must be added to the canonical event taxonomy in
    docs/planning/discussion_logs/2026-05-16_0753_development-pipeline-and-local-iteration.md
    by the implementer of this story. AC-011 gates on this.
  alarms:
    - condition: "frost.ceremony.failed with reason: 'ceremony_exhausted' fires
        more than 3 times in 5 minutes (aggregate across all agents)"
      fires_to: "cello-directory-frost-failure CloudWatch alarm (new alarm, same
        pattern as existing directory alarms in cello-cloudwatch.yaml)"
      notes: >
        Three or more ceremony_exhausted failures in 5 minutes (aggregate) indicates
        a sustained FROST coordination problem affecting multiple agents or a single
        agent repeatedly failing. Per-agent dimensional alarming would require
        publishing metrics with agentId dimensions or CloudWatch Logs Insights
        queries, which adds significant complexity for marginal value. The aggregate
        alarm is sufficient to surface that FROST ceremony failures are occurring at
        an actionable rate. Operators can then investigate CloudWatch Logs to
        identify which specific agents are affected.

# ─── Implementation Notes ───────────────────────────────────
implementation_notes: >
  This story touches TWO repos. All changes must ship in the same release
  (cello-client version bump + trustless-cello deploy):

  1. packages/directory/src/directory-types.ts (trustless-cello)
     Add to SessionRequestErrorReason union:
       | "ceremony_timeout"    // CLIENT_DELEGATED: 30s timer fired waiting for ceremony_result
       | "ceremony_exhausted"  // CLIENT_DELEGATED: ceremony ran but returned null (agent not bootstrapped)

  2. packages/directory/src/directory-node.ts (trustless-cello)
     Replace lines 1986-1989:
       if (!result.ok) {
         protocolLog("SESS", `Request failed — agent ..., reason: directory_below_threshold`);
         this.#sendFrame(stream, encodeSessionRequestError({
           type: "session_request_error", reason: "directory_below_threshold"
         }));
         return;
       }
     With:
       if (!result.ok) {
         const wireReason = mapCeremonyFailure(result.error.reason);
         this.#logger?.warn("frost.ceremony.failed", {
           agentId: initiatorHex.slice(0, 16),
           reason: wireReason,
           ceremonyId: ceremonyId.slice(0, 16),
         });
         protocolLog("SESS", `Request failed — agent ${truncHex(initiatorHex)}, reason: ${wireReason}`);
         this.#sendFrame(stream, encodeSessionRequestError({
           type: "session_request_error", reason: wireReason
         }));
         return;
       }

     Add module-level helper (near the bottom of directory-node.ts with the other helpers):
       function mapCeremonyFailure(
         reason: "DIRECTORY_BELOW_THRESHOLD" | "CEREMONY_TIMEOUT" | "CEREMONY_EXHAUSTED"
       ): SessionRequestErrorReason {
         switch (reason) {
           case "CEREMONY_TIMEOUT": return "ceremony_timeout";
           case "CEREMONY_EXHAUSTED": return "ceremony_exhausted";
           case "DIRECTORY_BELOW_THRESHOLD": return "directory_below_threshold";
         }
       }
     The exhaustive switch means any future ThresholdSignatureError reason
     addition will produce a compile error — the new case must be mapped.

  3. cello-client/core/client/src/types.ts (cello-client)
     Add to InitiateSessionResult failure union (line 199):
       | "ceremony_timeout"
       | "ceremony_exhausted"

  4. cello-client/core/client/src/client.ts (cello-client)
     At line 5365, after the existing `directory_below_threshold` branch, add:
       if (reason === "ceremony_timeout") return { ok: false, reason: "ceremony_timeout" };
       if (reason === "ceremony_exhausted") return { ok: false, reason: "ceremony_exhausted" };

  5. cello-client/core/client/src/mcp-server.ts line 479 (cello-client)
     The current code is:
       return jsonText({ ok: false, reason: result.reason });
     Replace with a per-reason switch so the two new errors carry human-readable
     messages (following the pattern at mcp-server.ts:1309-1315 where
     cello_request_connection returns stage-specific error messages):
       if (result.reason === "ceremony_timeout") {
         return jsonText({ ok: false, reason: result.reason,
           message: "The FROST signing ceremony timed out. Verify the agent MCP process is responsive and retry." });
       }
       if (result.reason === "ceremony_exhausted") {
         return jsonText({ ok: false, reason: result.reason,
           message: "FROST ceremony exhausted — K_server share mismatch or missing. To fix:\n1. DELETE FROM agent_key_shares WHERE agent_id='<your-pubkey>' (in directory DB)\n2. DELETE FROM agent_profiles WHERE k_local_pubkey LIKE '<pubkey-prefix>%'\n3. Restart the directory ECS task (aws ecs stop-task) to flush in-memory share cache\n4. pkill -f cello-mcp, rm ~/.cello/client.db, get a fresh token from Telegram, call cello_register" });
       }
       return jsonText({ ok: false, reason: result.reason });

  6. Add cello-directory-frost-failure metric filter and alarm to
     infra/cloudformation/cello-cloudwatch.yaml. Alarming on a structured log
     field requires TWO resources (not the same as existing ECS/RDS metric alarms):

     a. AWS::Logs::MetricFilter pointing at the directory ECS log group
        (/ecs/cello-directory-${Environment}):
          FilterPattern: '{ $.event = "frost.ceremony.failed" && $.reason = "ceremony_exhausted" }'
          MetricTransformations: namespace=CelloDirectory, name=FrostCeremonyExhausted, value=1

     b. AWS::CloudWatch::Alarm against the FrostCeremonyExhausted custom metric:
          Threshold: 3, Period: 300, EvaluationPeriods: 1, ComparisonOperator: GreaterThanThreshold
          AlarmActions: [!Ref ExistingAlarmTopic or SNS ARN from parameter]

  7. Add frost.ceremony.failed to the canonical event taxonomy in
     docs/planning/discussion_logs/2026-05-16_0753_development-pipeline-and-local-iteration.md.
     AC-011 gates on this.

  Version bump required: changes to cello-client affect the npm package.
  Follow the full version bump procedure in CLAUDE.md:
  bump client → bump connect → git tag → CI publishes to beta.
  Do NOT npm publish manually.

