topics: [relay, websocket, alb, infrastructure, iac, route53, pre-m7, networking]
status: draft
description: >
  Adds a public-facing WebSocket ALB for the relay so external agents can complete
  session initiation (dial wss://relay-us1.cello.mygentic.ai). Also deploys the
  port-4001 SG fix (committed in cello-vpc.yaml commit 40543d5) to eu-central-1
  and ap-northeast-1, which were only updated in us-east-1. Blocks M6-E2E-001
  AC-006 (external client → relay WebSocket).
---
# ─── Identity ───────────────────────────────────────────────
id: CELLO-M6B-007
domain: PREP
milestone: M6B
actor: OPS
priority: P0
components:
  - relay
  - infra

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO operator,
  I want the relay to have a public-facing WebSocket ALB with a stable DNS name
  in every region, so that external clients (agents on developer laptops or
  third-party servers) can connect to the relay after receiving a session
  assignment, and I want the port-4001 security group rule deployed to all
  three regions so the directory can reach the relay's libp2p TCP listener
  everywhere.

# ─── Context ────────────────────────────────────────────────
# Current gaps (from M6-beta-launch.md lines 924-925):
#
# 1. Relay has no public WebSocket endpoint.
#    The relay binary supports CELLO_RELAY_WS_LISTEN_ADDR (added in commit
#    9beed74, packages/relay/src/bin/relay.ts line 60,227). When set, the
#    relay listens on that multiaddr in addition to the libp2p TCP address.
#    However:
#      - CELLO_RELAY_WS_LISTEN_ADDR is not in cello-ecs-relay.yaml
#      - There is no ALB for the relay
#      - There is no Route53 record (relay-us1/eu1/ap1.cello.mygentic.ai)
#    External clients receive a session assignment with the relay's endpoint
#    from the relay manifest. The manifest currently has placeholder or stale
#    endpoints — clients cannot reach the relay from outside the VPC.
#
#    RELAY ALB PATTERN: follow the directory ALB pattern exactly.
#    The directory ALB uses HTTP on port 80 (cello-ecs-directory.yaml line 243).
#    TLS is terminated at the WAF layer; the ALB-to-container path is HTTP.
#    The relay ALB will also use HTTP on port 80. No CertificateArn import in
#    the relay ECS template — this avoids the chicken-and-egg problem where
#    cello-ecs-relay requires an ACM cert export that cello-route53-relay creates.
#
# 2. Port-4001 SG fix only deployed to us-east-1.
#    The IaC fix (commit 40543d5, cello-vpc.yaml) adding port 4001 ingress to
#    EcsRelaySecurityGroup from EcsDirectorySecurityGroup was committed and
#    deployed to us-east-1. eu-central-1 and ap-northeast-1 still have the
#    old rules. As a result, in secondary regions the directory cannot dial
#    the relay on port 4001 for the /cello/directory-relay/1.0.0 protocol.
#    This story closes the gap by deploying the vpc stack to all three regions.
#
# 3. Relay manifest S3 JSON update.
#    The relay manifest is a static S3 JSON file (RelayPoolManifest) consumed
#    by RelayPoolManager in packages/directory/src/relay-pool-manager.ts.
#    RelayManifestEntry has an `endpoint` field (WebSocket URL, e.g.
#    wss://relay-us1.cello.mygentic.ai) and a `multiaddrs` field (libp2p
#    multiaddrs for client connection). These must be updated after the relay
#    ALB and DNS are deployed so clients receive the correct WebSocket URL
#    in their session assignment. This is an operator step (run sign-manifest.sh
#    with updated JSON), not a code change.
#
# Architecture:
#   External client → ws://relay-us1.cello.mygentic.ai (port 80) →
#   ALB (HTTP forward) → relay ECS task port 4002 (WS listener)
#
#   The relay's WebSocket listener runs on /ip4/0.0.0.0/tcp/4002/ws.
#   CELLO_RELAY_WS_LISTEN_ADDR="/ip4/0.0.0.0/tcp/4002/ws" in the task def.
#
#   NOTE: wss:// (WSS) requires TLS termination at the ALB, which requires
#   an ACM certificate. The directory ALB uses plain ws:// for the same
#   reason. Until TLS is added (future story), the relay endpoint in the
#   manifest must use ws:// not wss://.
#   NOTE: cello-route53.yaml always provisions an ACM Certificate resource.
#   When deployed for the relay subdomain, this creates a certificate for
#   relay-us1.cello.mygentic.ai that is DNS-validated but not yet attached
#   to any ALB listener. This is intentional — the future TLS story can
#   attach the existing cert ARN to an HTTPS listener without re-issuing.
#
# The relay manifest endpoint and multiaddrs update is an operator step,
# not automated by relay_register. The relay_register frame carries only
# relayId, publicKeyHex, region, timestamp, and signature — it does not
# carry the WebSocket URL. The manifest is re-signed via sign-manifest.sh
# (as established in PREP-003); the operator updates the manifest JSON and
# re-signs before pushing to S3.
#
# SOVEREIGN NODE CONSTRAINT: every IaC change must work identically across all
# three deployment regions (us-east-1, eu-central-1, ap-northeast-1) with zero
# manual steps. The relay subdomain is region-specific (relay-us1, relay-eu1,
# relay-ap1) — deploy.sh must be updated to set RELAY_SUBDOMAIN per region.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When cello-ecs-relay.yaml is deployed to any region"
    action: "an internet-facing ALB exists for the relay; port 80 HTTP listener
      forwards to a target group on container port 4002; ALB idle timeout is
      300 seconds (prevents silent WebSocket drops on idle connections);
      the relay ECS task SG accepts inbound TCP 4002 from the ALB SG;
      the ECS service LoadBalancers block includes a ContainerPort 4002 entry
      so ECS auto-registers tasks on deploy/restart"

  - trigger: "When a relay ECS task starts"
    action: "CELLO_RELAY_WS_LISTEN_ADDR=/ip4/0.0.0.0/tcp/4002/ws is set from the
      task definition; createRelayNode receives [listenAddr, wsListenAddr] as
      listenAddresses and the relay binds on both port 4001 (TCP) and port 4002
      (WebSocket)"

  - trigger: "When an external client dials ws://relay-us1.cello.mygentic.ai"
    action: "the ALB forwards the WebSocket upgrade to the relay container on
      port 4002; the relay completes the libp2p WebSocket handshake; the client
      can submit relay leaves and participate in sessions"

  - trigger: "When cello-vpc.yaml is deployed to eu-central-1 or ap-northeast-1"
    action: "the EcsRelaySecurityGroup has port 4001 ingress from EcsDirectorySecurityGroup
      (identical to us-east-1 after commit 40543d5); the directory can dial the
      relay on port 4001 for /cello/directory-relay/1.0.0 in all three regions"

  - trigger: "When cello-route53.yaml is deployed for a relay subdomain
    (relay-us1, relay-eu1, relay-ap1)"
    action: "an ACM certificate is issued for relay-{region}.cello.mygentic.ai
      DNS-validated against the hosted zone; an A record ALIAS to the relay ALB
      exists at relay-{region}.cello.mygentic.ai"

  - trigger: "After the relay ALB and DNS are deployed"
    action: "the operator updates the relay manifest JSON (S3 bucket
      cello-relay-manifest-{env}-{region}) with the correct endpoint:
      ws://relay-{region}.cello.mygentic.ai and the libp2p multiaddr
      /dns4/relay-{region}.cello.mygentic.ai/tcp/80/ws/p2p/{relay-peer-id};
      sign-manifest.sh is run to re-sign and upload; PREP-004's poll loop
      picks up the new manifest within 2 minutes"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "The updated cello-ecs-relay.yaml CloudFormation template"
    when: "the template is validated with aws cloudformation validate-template"
    then: "validation succeeds; the template contains:
      (1) a RelayAlb resource (internet-facing, HTTP, idle_timeout 300s);
      (2) a RelayTargetGroup on port 4002, health check on /health port 4000;
      (3) an HTTP listener on port 80 forwarding to RelayTargetGroup;
      (4) the ECS Service LoadBalancers block includes ContainerPort 4002
      targeting RelayTargetGroup;
      (5) CELLO_RELAY_WS_LISTEN_ADDR=/ip4/0.0.0.0/tcp/4002/ws in the
      container Environment block;
      (6) port 4002 in the container PortMappings"
    test_type: unit
    component_under_test: infra

  - id: AC-002
    given: "The updated cello-vpc.yaml CloudFormation template"
    when: "the template is validated"
    then: "EcsRelaySecurityGroup has:
      port 4000 from EcsDirectorySecurityGroup (unchanged — directory health polling),
      port 4001 from EcsDirectorySecurityGroup (exists since commit 40543d5),
      port 4002 from AlbSecurityGroup (new — ALB WebSocket forwarding),
      port 4000 from AlbSecurityGroup (new — ALB health checks on Fargate awsvpc
        mode originate from ALB IPs and require this rule; without it the ALB
        marks tasks unhealthy and returns 502 for all WebSocket connections);
      no direct internet ingress on port 4002 (SI-001)"
    test_type: unit
    component_under_test: infra

  - id: AC-003
    given: "The updated deploy.sh"
    when: "the script is read"
    then: "a RELAY_SUBDOMAIN variable is set per region alongside SUBDOMAIN:
        us-east-1 → relay-us1
        eu-central-1 → relay-eu1
        ap-northeast-1 → relay-ap1;
      cello-route53.yaml is invoked a second time per region as stack
      cello-route53-relay-${ENVIRONMENT} with Subdomain=${RELAY_SUBDOMAIN}
      and AlbDnsName/AlbHostedZoneId from the cello-ecs-relay stack outputs;
      the cello-route53-relay stack is deployed AFTER cello-ecs-relay so the
      relay ALB exists before the DNS record is created;
      STACK_COUNT is incremented by 1 to account for the new relay route53 stack"
    test_type: unit
    component_under_test: infra

  - id: AC-004
    given: "cello-ecs-relay.yaml deployed to dev us-east-1 via the relay pipeline"
    when: "the stack update completes (rolloutState COMPLETED)"
    then: "aws elbv2 describe-load-balancers shows a relay ALB for the dev stack
      with SchemeType internet-facing;
      aws elbv2 describe-target-groups shows a target group with port 4002;
      the relay ECS service reports runningCount 1 with the new task definition;
      a WebSocket connection attempt to ws://relay-us1.cello.mygentic.ai
      (after cello-route53-relay is deployed) completes without a connection
      refused or HTTP 502 — verified by running `wscat -c ws://relay-us1.cello.mygentic.ai`
      and confirming connection (protocol handshake begins, not rejected)"
    test_type: integration
    component_under_test: infra
    notes: "Run manually post-deployment. wscat is available via npm install -g wscat."

  - id: AC-005
    given: "cello-vpc.yaml deployed to dev eu-central-1 and ap-northeast-1"
    when: "aws ec2 describe-security-groups for the relay SG in each secondary region"
    then: "each region's EcsRelaySecurityGroup has three inbound rules covering
      ports 4000, 4001 (from EcsDirectorySecurityGroup) and 4002 (from AlbSecurityGroup);
      confirmed by running:
        aws ec2 describe-security-groups --region eu-central-1 \
          --filters Name=group-name,Values=cello-ecs-relay-sg-dev
        aws ec2 describe-security-groups --region ap-northeast-1 \
          --filters Name=group-name,Values=cello-ecs-relay-sg-dev"
    test_type: integration
    component_under_test: infra
    notes: "This closes the secondary-region port-4001 deployment gap.
      Relay tasks in eu-central-1 and ap-northeast-1 are unreachable by the
      directory on port 4001 until this is deployed."

  - id: AC-006
    given: "After relay ALB + DNS deployed to dev us-east-1, operator updates
      the relay manifest JSON in S3 bucket cello-relay-manifest-dev-us-east-1
      with endpoint: ws://relay-us1.cello.mygentic.ai and multiaddrs including
      /dns4/relay-us1.cello.mygentic.ai/tcp/80/ws/p2p/{relay-peer-id},
      then runs sign-manifest.sh to re-sign and upload"
    when: "an external CelloClient (running outside the VPC, e.g. on a developer
      laptop) receives a session assignment and reads the relay endpoint"
    then: "the session assignment relay_endpoint contains ws://relay-us1.cello.mygentic.ai
      (not a private 10.x.x.x IP); the external client successfully connects
      to the relay via the WebSocket URL and the session handshake completes
      — verified by running the E2E smoke test from a laptop (not from within
      the dev VPC)"
    test_type: integration
    component_under_test: relay
    notes: "The manifest endpoint and multiaddrs update is an operator step, not
      a code change. sign-manifest.sh must use the shallow sort (top-level keys only:
      relays, updatedAt, version — per PREP-003 AC-007b). The relay-peer-id in the
      multiaddr must match the CELLO_RELAY_TRANSPORT_KEY_HEX-derived peer ID (stable
      since PREP-003). Run this after AC-004 passes."

  - id: AC-007
    given: "The implementation is complete"
    when: "infra/cloudformation/cello-cloudwatch.yaml is reviewed"
    then: "a CloudWatch alarm exists for the relay ALB 5xx error rate
      (cello-relay-alb-5xx-${Environment}); the alarm fires when the ALB
      5xx rate exceeds 5% over a 5-minute period; pattern follows existing
      ALB alarms in the file"
    test_type: unit
    component_under_test: infra

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The relay WebSocket container port (4002) must not be directly
      reachable from the public internet — only the ALB SG may send traffic to
      port 4002"
    adversarial_condition: "an attacker who knows the relay task IP must not be
      able to bypass the ALB by dialing the task IP on port 4002 directly;
      verified by asserting EcsRelaySecurityGroup port 4002 ingress uses
      SourceSecurityGroupId: AlbSecurityGroup (not CidrIp 0.0.0.0/0 or
      the VPC CIDR block); AC-002 verifies this at template level"
    test_type: unit
    component_under_test: infra

# ─── Observability ──────────────────────────────────────────
observability:
  events: []
  error_events: []
  notes: >
    No new application log events. This story is IaC-only from the application
    perspective. The relay's existing relay.service.started log includes
    listenAddresses — after this story, the log will show two addresses (TCP + WS).
    No event taxonomy update needed for this story.
  alarms:
    - condition: "Relay ALB 5xx error rate > 5% over 5 minutes"
      fires_to: "cello-relay-alb-5xx-${Environment} alarm in cello-cloudwatch.yaml"
      notes: >
        A relay ALB 5xx rate spike indicates the relay container is not
        accepting WebSocket connections. Unlike the existing relay health alarms
        (which monitor the relay process itself), this alarm monitors the
        external-client access path. AC-007 gates on this alarm being present.

# ─── Implementation Notes ───────────────────────────────────
implementation_notes: >
  DEPLOYMENT ORDER (sovereign + cross-stack dependency):
    1. cello-vpc (all 3 regions) — adds port 4002 SG rule; also deploys port-4001
       fix to eu-central-1 and ap-northeast-1 for the first time
    2. cello-ecs-relay (all 3 regions) — creates ALB, TG, WS env var
    3. cello-route53-relay (all 3 regions) — creates DNS A record aliasing to relay ALB
    Order matters: route53-relay is deployed AFTER ecs-relay so the ALB DNS name
    is available for the ALIAS record. Do NOT deploy route53-relay before ecs-relay.

  1. cello-ecs-relay.yaml additions:
     a. New parameters:
          RelaySubdomain: String (e.g. relay-us1) — passed by deploy.sh per region

     b. New RelayAlb resource (internet-facing, HTTP):
        Copy the Alb resource from cello-ecs-directory.yaml as a template.
        Key differences from directory:
          - Same SecurityGroups: !ImportValue "cello-${Environment}-alb-sg"
          - Same public Subnets: cello-${Environment}-public-subnet-a/b
        LoadBalancerAttributes: MUST include idle_timeout.timeout_seconds: 300
        (same as directory ALB — prevents silent WebSocket drops on idle connections)

     c. New RelayTargetGroup: port 4002, protocol HTTP, type ip.
        Health check: path /health, port 4000 (relay health server on port 4000,
        not 4002 — 4002 is the WS listener only).

     d. New RelayAlbListener: port 80, HTTP, DefaultAction forward to RelayTargetGroup.
        (HTTP not HTTPS — mirrors directory ALB pattern; TLS is a future story)

     e. Update ECS Service LoadBalancers block to add:
          - ContainerName: relay
            ContainerPort: 4002
            TargetGroupArn: !Ref RelayTargetGroup
        Note: port 4000 is NOT in the LoadBalancers block because it is the health
        server, not a load-balanced service port. Only 4002 is load-balanced.

     f. Add CELLO_RELAY_WS_LISTEN_ADDR to container Environment:
          - Name: CELLO_RELAY_WS_LISTEN_ADDR
            Value: /ip4/0.0.0.0/tcp/4002/ws

     g. Add port 4002 to TaskDefinition PortMappings:
          - ContainerPort: 4002
            Protocol: tcp

     h. Outputs for deploy.sh:
          RelayAlbDnsName: !GetAtt RelayAlb.DNSName
          RelayAlbHostedZoneId: !GetAtt RelayAlb.CanonicalHostedZoneID

  2. cello-vpc.yaml:
     Add port 4002 ingress to EcsRelaySecurityGroup:
       - IpProtocol: tcp
         FromPort: 4002
         ToPort: 4002
         SourceSecurityGroupId: !Ref AlbSecurityGroup
     Port 4001 from EcsDirectorySecurityGroup already exists in the template
     (since commit 40543d5). Just deploying the vpc stack to all three regions
     will close the secondary-region port-4001 gap.
     Also add port 4000 ingress to EcsRelaySecurityGroup from AlbSecurityGroup:
       - IpProtocol: tcp
         FromPort: 4000
         ToPort: 4000
         SourceSecurityGroupId: !Ref AlbSecurityGroup
     On Fargate/awsvpc mode, ALB health checks originate from the ALB's IPs
     (not from within the VPC CIDR), so the AlbSecurityGroup source rule is
     required for the health check path. Without it, the ALB marks tasks
     unhealthy and all WebSocket connections return 502.

  3. cello-route53.yaml is reused as-is (no changes needed).
     deploy.sh invokes it a second time per region with the relay subdomain.

  4. deploy.sh additions:
     After the SUBDOMAIN= case block (line 82-87), add:
       case "${REGION}" in
         us-east-1)      RELAY_SUBDOMAIN="relay-us1" ;;
         eu-central-1)   RELAY_SUBDOMAIN="relay-eu1" ;;
         ap-northeast-1) RELAY_SUBDOMAIN="relay-ap1" ;;
         *)              RELAY_SUBDOMAIN="relay-${REGION}" ;;
       esac

     After the directory cello-route53 deploy step (line 529-538), add:
       RELAY_ALB_DNS=$(aws cloudformation describe-stacks \
         --stack-name cello-ecs-relay-${ENVIRONMENT} ... query RelayAlbDnsName)
       RELAY_ALB_ZONE=$(aws cloudformation describe-stacks \
         --stack-name cello-ecs-relay-${ENVIRONMENT} ... query RelayAlbHostedZoneId)
       deploy_stack "cello-route53-relay-${ENVIRONMENT}" "cello-route53.yaml" \
         "Environment=${ENVIRONMENT}" \
         "DomainName=${DOMAIN_NAME}" \
         "HostedZoneId=${HOSTED_ZONE_ID}" \
         "AlbDnsName=${RELAY_ALB_DNS}" \
         "AlbHostedZoneId=${RELAY_ALB_ZONE}" \
         "Subdomain=${RELAY_SUBDOMAIN}"
     Increment STACK_COUNT by 1 for the new relay route53 stack.

  5. cello-cloudwatch.yaml:
     Add cello-relay-alb-5xx-${Environment} alarm targeting the relay ALB's
     HTTPCode_ELB_5XX_Count metric, threshold 5% over 5 minutes.
     Follow the pattern of existing ALB alarms in the file.

  6. Relay manifest update (operator step, not a code change):
     After relay ALB and DNS are live:
     a. Download current manifest from s3://cello-relay-manifest-{env}-{region}/manifest.json
     b. Update the relay entry:
          endpoint: "ws://relay-{region}.cello.mygentic.ai"
          multiaddrs: ["/dns4/relay-{region}.cello.mygentic.ai/tcp/80/ws/p2p/{relay-peer-id}"]
          health_check_url: "http://relay-{region}.cello.mygentic.ai/health"
     c. Run sign-manifest.sh to re-sign with the directory signing key
     d. The PREP-004 poll loop picks up the new manifest within 2 minutes
     The relay-peer-id comes from CELLO_RELAY_TRANSPORT_KEY_HEX (stable since PREP-003).

