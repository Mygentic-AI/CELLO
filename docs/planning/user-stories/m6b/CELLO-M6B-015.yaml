## Pre-Deploy Audit Checklist

Run through these before executing Phase 4:

- [ ] `grep -r "operations-agent\|ops-agent\|OpsAgent\|ops_agent\|OPS_AGENT\|cello_ops_agent" packages/ infra/` returns zero hits in code (SQL migration V26 is the only exception — it must NOT be modified)
- [ ] New SSM parameter `/cello/dev/portal-backend/expected-migration-version` exists and has the correct value
- [ ] All 4 new Secrets Manager paths exist with correct values
- [ ] Stub image pushed to `cello-portal-backend` ECR repo (or repo will be created by CFN and stub pushed immediately after)
- [ ] `pipeline-mappings.json` updated to `packages/portal-backend/`
- [ ] New Flyway migration file exists with the next sequential version number
- [ ] `cello-ssm-parameters.yaml` default for expected migration version updated to new version number
- [ ] `infra/STATE.md` updated with new resource names and paths

## Post-Deploy Verification

- [ ] `aws ecs describe-services --cluster cello-dev --services cello-portal-backend-dev` shows `runningCount: 1` and `desiredCount: 1`
- [ ] Telegram bot responds to a `/start` message
- [ ] `aws logs tail /ecs/cello-portal-backend-dev --since 5m` shows `portal_backend.started` event (not `ops_agent.started`)
- [ ] `aws codepipeline list-pipelines` shows `cello-portal-backend-pipeline` and no `cello-operations-agent-pipeline`
- [ ] A push to `packages/portal-backend/` triggers the pipeline (verify via a trivial whitespace commit)
- [ ] `infra/STATE.md` updated with all new resource ARNs and confirmed status

---

## Sequencing Warnings (do not skip)

**W-1 — V26 migration: NEVER modify.** It is applied. Modifying it causes Flyway
checksum errors on every future `flyway migrate` run. Use a new version number.

**W-2 — SSM and Secrets Manager paths must exist before deploy.sh runs.** The
CFN templates reference the new paths. If the paths don't exist when ECS launches
the new task, the task crashes at startup. Phase 2 must complete before Phase 4.

**W-3 — ECR repo loses all images on rename.** The old `cello-operations-agent`
repo is deleted by CFN. A stub image must be available in the new
`cello-portal-backend` repo before ECS can start a task. Phase 3 before Phase 4.

**W-4 — Cross-stack CFN exports must all update in one deploy.sh run.** If any
consumer stack imports an old export name that has been removed from a producer
stack, the deploy fails mid-way. All 10 CFN templates must be updated before
running deploy.sh — never deploy partial template updates.

**W-5 — deploy-lambdas.sh after pipeline-mappings.json.** The path-based CI
filter Lambda reads from `pipeline-mappings.json`. Until `deploy-lambdas.sh dev
filter` runs, pushes to `packages/portal-backend/` will not trigger the pipeline.

