### Phase 2 — Remove secrets from CFN management and pre-create at new paths

**The critical sequencing constraint:** CFN manages the ops-agent secrets as
`AWS::SecretsManager::Secret` resources in `cello-secrets.yaml`. If Phase 1
renames the logical resource IDs AND the secret Name paths, CFN on the next
deploy will DELETE the old secrets and CREATE new ones. If you pre-create the
new secrets manually before that deploy, CFN will fail with `ResourceAlreadyExists`.

**The solution: remove the 4 ops-agent secrets from CFN management entirely.**
They were never a good fit for CFN (they hold runtime values populated by the
rotation Lambda). Manage them outside CFN going forward.

Steps:

```bash
ENVIRONMENT=dev

# 1. Read current values before CFN deletes them
for secret in telegram-bot-token ses-credentials directory-api-key rds-credentials; do
  OLD="cello/${ENVIRONMENT}/ops-agent/${secret}"
  VALUE=$(aws secretsmanager get-secret-value --secret-id "$OLD" \
    --query SecretString --output text)
  echo "${secret}: ${VALUE}" >> /tmp/secret-backup.txt
done

# 2. Remove the 4 ops-agent Secret resources from cello-secrets.yaml
#    (delete the AWS::SecretsManager::Secret blocks for all 4 ops-agent secrets
#    and their corresponding Outputs/Exports — do this as part of Phase 1 Step 5)

# 3. Run deploy.sh — CFN removes its management of the old secrets but does NOT
#    delete them (secrets are retained on stack removal when DeletionPolicy is
#    Retain, OR when removed from the template while the stack update succeeds).
#    IMPORTANT: Before running deploy.sh, add DeletionPolicy: Retain to all 4
#    ops-agent secret resources in cello-secrets.yaml, commit, deploy ONCE to
#    set the retention policy, THEN remove the resources in a second deploy.
#    This two-step prevents CFN from deleting the secrets on removal.

# 4. Create new secrets at portal-backend paths
for secret in telegram-bot-token ses-credentials directory-api-key rds-credentials; do
  OLD="cello/${ENVIRONMENT}/ops-agent/${secret}"
  NEW="cello/${ENVIRONMENT}/portal-backend/${secret}"
  VALUE=$(aws secretsmanager get-secret-value --secret-id "$OLD" \
    --query SecretString --output text)
  aws secretsmanager create-secret --name "$NEW" --secret-string "$VALUE"
done
```

**CFN export names for these secrets** are also consumed by `cello-ecs-portal-backend.yaml`
(the ECS task mounts them). After removing them from `cello-secrets.yaml`, the
ECS task definition must reference the secret ARNs directly (hardcoded or via
SSM parameter) rather than via `Fn::ImportValue`. Update accordingly in the
ECS template.

**Copy SSM parameter:**
```bash
OLD_VAL=$(aws ssm get-parameter \
  --name "/cello/${ENVIRONMENT}/ops-agent/expected-migration-version" \
  --query Parameter.Value --output text)
aws ssm put-parameter \
  --name "/cello/${ENVIRONMENT}/portal-backend/expected-migration-version" \
  --value "$OLD_VAL" --type String
```

