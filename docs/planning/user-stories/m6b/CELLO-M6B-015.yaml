### Phase 3 — ECR stub image (before deploy)

The new ECR repo `cello-portal-backend` will be created by CFN on deploy.
ECS needs a valid image to start. Two options:

**Option A** — Run build-stubs.sh after the ECR repo is created:
The `cello-ecr` stack deploys first in deploy.sh — once it completes, push
the stub immediately before ECS stack deploys.

**Option B** — Pre-create the ECR repo and push stub manually:
```bash
aws ecr create-repository --repository-name cello-portal-backend --region us-east-1
# Tag and push existing ops-agent image as the stub
docker pull ${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/cello-operations-agent:latest
docker tag ... ${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/cello-portal-backend:stub
docker push ${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/cello-portal-backend:stub
```

Option B is safer as it decouples the stub push from the deploy timing.

---

### Phase 4 — Deploy

```bash
./infra/deploy.sh dev
```

All CFN stacks deploy in one run. The cross-stack export renames are handled
atomically by deploy.sh updating all templates together.

**What deploy.sh destroys and recreates:**
- ECR repo `cello-operations-agent` (images lost — stub in new repo covers this)
- ECS service, task definition family, log group
- IAM execution and task roles
- CodePipeline, CodeBuild projects
- CloudWatch alarm
- Security group (same rules, new name)

**What deploy.sh updates in-place:**
- SSM parameters (new path already populated in Phase 2)

**Secrets Manager:** After Phase 2, secrets are managed outside CFN. The ECS
task definition references them directly. No CFN action on secrets during this deploy.

---

### Phase 5 — Post-deploy cleanup

After confirming the portal-backend ECS task is healthy:

```bash
# Delete old secret paths (with 7-day recovery window)
for secret in telegram-bot-token ses-credentials directory-api-key rds-credentials; do
  aws secretsmanager delete-secret \
    --secret-id "cello/dev/ops-agent/${secret}" \
    --recovery-window-in-days 7
done

# Delete old SSM parameter
aws ssm delete-parameter \
  --name "/cello/dev/ops-agent/expected-migration-version"
```

Update `infra/STATE.md` immediately after each step above.

---

### Phase 6 — Lambda filter update

```bash
./infra/deploy-lambdas.sh dev filter
```

Required after `pipeline-mappings.json` path change (as per CLAUDE.md rule).

