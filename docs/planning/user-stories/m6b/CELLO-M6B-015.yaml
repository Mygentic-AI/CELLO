### Phase 2 — AWS secret migration (before deploy)

The running ECS task reads secrets and SSM at launch. Renaming paths in CFN
without first populating the new paths causes the next task launch to fail.

**CRITICAL: Do this before running deploy.sh.**

```bash
# For each secret, copy value to new path then delete old path AFTER deploy confirms healthy
ENVIRONMENT=dev

for secret in telegram-bot-token ses-credentials directory-api-key rds-credentials; do
  OLD="cello/${ENVIRONMENT}/ops-agent/${secret}"
  NEW="cello/${ENVIRONMENT}/portal-backend/${secret}"
  VALUE=$(aws secretsmanager get-secret-value --secret-id "$OLD" --query SecretString --output text)
  aws secretsmanager create-secret --name "$NEW" --secret-string "$VALUE"
done

# Copy SSM parameter
OLD_VAL=$(aws ssm get-parameter --name "/cello/${ENVIRONMENT}/ops-agent/expected-migration-version" --query Parameter.Value --output text)
aws ssm put-parameter --name "/cello/${ENVIRONMENT}/portal-backend/expected-migration-version" --value "$OLD_VAL" --type String
```

---

### Phase 3 — ECR stub image (before deploy)

The new ECR repo `cello-portal-backend` will be created by CFN on deploy, but
ECS needs a valid image to start. Push a stub before deploying.

```bash
# After deploy.sh creates the new ECR repo (or create it manually first):
./infra/build-stubs.sh dev
```

Alternatively: manually tag and push the existing `cello-operations-agent:latest`
to `cello-portal-backend:stub` before the deploy run.

---

### Phase 4 — Deploy

```bash
./infra/deploy.sh dev
```

All CFN stacks deploy in one run. The cross-stack export renames are handled
atomically by deploy.sh updating all templates together.

**What deploy.sh destroys and recreates:**
- ECR repo `cello-operations-agent` (images lost — stub covers this)
- ECS service, task definition family, log group
- IAM execution and task roles
- CodePipeline, CodeBuild projects
- CloudWatch alarm
- Security group (same rules, new name)

**What deploy.sh updates in-place:**
- SSM parameters (new path already populated in Phase 2)
- Secrets Manager (new paths already populated in Phase 2)

---

### Phase 5 — Post-deploy cleanup

After confirming the portal-backend ECS task is healthy:

```bash
# Delete old secret paths
for secret in telegram-bot-token ses-credentials directory-api-key rds-credentials; do
  aws secretsmanager delete-secret \
    --secret-id "cello/dev/ops-agent/${secret}" \
    --recovery-window-in-days 7
done

# Delete old SSM parameter
aws ssm delete-parameter \
  --name "/cello/dev/ops-agent/expected-migration-version"
```

Update `infra/STATE.md` immediately after each step above.

---

### Phase 6 — Lambda filter update

```bash
./infra/deploy-lambdas.sh dev filter
```

Required after `pipeline-mappings.json` path change (as per CLAUDE.md rule).

