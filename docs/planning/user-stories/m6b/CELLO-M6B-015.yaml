## Sequencing Warnings (do not skip)

**W-1 — V26 migration: NEVER modify.** It is applied. Modifying it causes Flyway
checksum errors on every future `flyway migrate` run. Use V31 for the role rename.

**W-2 — Secrets must NOT be pre-created before CFN removes them.** Pre-creating
secrets at the new paths before CFN drops the old logical resources causes
`ResourceAlreadyExists` and rolls back the `cello-secrets` stack. Follow the
two-deploy DeletionPolicy approach in Phase 2.

**W-3 — ECR repo loses all images on rename.** The old `cello-operations-agent`
repo is deleted by CFN. A stub image must be available in the new
`cello-portal-backend` repo before ECS can start a task. Phase 3 before Phase 4.

**W-4 — Cross-stack CFN exports must all update in one deploy.sh run.** If any
consumer stack imports an old export name that has been removed from a producer
stack, the deploy fails mid-way. All 10 CFN templates must be updated before
running deploy.sh — never deploy partial template updates.

**W-5 — deploy-lambdas.sh after pipeline-mappings.json.** The path-based CI
filter Lambda reads from `pipeline-mappings.json`. Until `deploy-lambdas.sh dev
filter` runs, pushes to `packages/portal-backend/` will not trigger the pipeline.

**W-6 — rds-credentials secret JSON must be updated after V31 applies.** The
rotation Lambda reads `"username"` from the secret JSON. After `ALTER ROLE
cello_ops_agent RENAME TO cello_portal_backend` runs, update the secret value
to `{"username":"cello_portal_backend",...}` or rotation will fail with a
PostgreSQL authentication error.

**W-7 — Direct ARN constructions in cello-ecs-directory.yaml and cello-iam.yaml.**
These are `!Sub`-constructed ARNs, not `Fn::ImportValue`. They will not be caught
by searching for `ImportValue` — grep specifically for `ops-agent` in all CFN
templates after Phase 1 to confirm zero hits.

