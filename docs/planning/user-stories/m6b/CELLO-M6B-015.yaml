   - `infra/buildspecs/smoke-test-operations-agent.yml` → `infra/buildspecs/smoke-test-portal-backend.yml`
   - `packages/portal-backend/buildspec.yml` — update `pnpm filter` reference from `@cello-protocol/operations-agent` to `@cello-protocol/portal-backend`

