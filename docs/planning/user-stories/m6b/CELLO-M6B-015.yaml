# M6B-015 — Rename operations-agent → portal-backend

## Why

The component was named "operations-agent" by an AI coder early in M6 without
a deliberate design decision. The planning documents (`frontend.md`,
`end-to-end-flow.md`) consistently describe this component as the "signup portal
backend" — the single service that holds all owner PII, handles registration
ceremonies, and routes out-of-band notifications. The name will become actively
misleading once M7 adds a web portal surface to the same service.

Rename now, before M7 stories are written, so M7 implementation starts with the
correct name throughout.

## Scope

Pure rename. No behavior changes, no API changes, no protocol changes.

---

## Execution Steps (in order)

### Phase 1 — Code and IaC changes (all in one commit)

These are string replacements that must all land atomically before any deploy.

1. **Rename package directory**
   - `packages/operations-agent/` → `packages/portal-backend/`
   - Update `package.json` name field: `@cello-protocol/operations-agent` → `@cello-protocol/portal-backend`
   - Update `pnpm-workspace.yaml` if it lists the directory explicitly
   - Run `pnpm install` to update `pnpm-lock.yaml`

2. **Rename CloudFormation template file**
   - `infra/cloudformation/cello-ecs-operations-agent.yaml` → `infra/cloudformation/cello-ecs-portal-backend.yaml`

3. **Rename buildspec files**
