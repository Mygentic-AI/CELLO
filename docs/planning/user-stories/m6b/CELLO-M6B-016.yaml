## Security Invariants

- id: SI-001
  statement: "channel_user_id (Telegram/WhatsApp user ID) is never sent to the directory"
  adversarial_condition: "an attacker with read access to directory tables cannot retrieve
    any user's Telegram user ID — it is not present in any directory table or pre-auth
    token payload; verified by asserting that `channel_user_id` does not appear in the
    JSON body of any request from ops-agent to `POST /internal/pre-authorize`"

- id: SI-002
  statement: "email continuity is enforced by hash comparison, not by trusting user input"
  adversarial_condition: "a user who knows another user's Telegram account sends CONFIRM
    and submits a different email — the hash comparison against the stored
    `expectedEmailStubHash` from the prior completed registration rejects the attempt;
    the re-registration flow does not advance"

- id: SI-003
  statement: "channel_identities rows cannot be deleted by the ops-agent database role"
  adversarial_condition: "a SQL injection vulnerability in the ops-agent cannot be used to
    delete rows from channel_identities — REVOKE DELETE is enforced at the database level;
    verified by asserting the cello_ops_agent role has no DELETE privilege on
    channel_identities in pg_class/pg_acl"

