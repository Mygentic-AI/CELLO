## Code changes

### 1. Email hashing utility (`state-machine.ts` or shared utils)

Add `hashEmail(email: string): string`:
- Normalize: `email.trim().toLowerCase()`
- Hash: `SHA-256` of normalized UTF-8 bytes
- Return: hex string (same format as `phone_stub_hash`)

Do NOT store or log the pre-hash email anywhere after this function returns.

### 2. `state-machine.ts` — email handling in `#handleAwaitingEmail`

`extractEmailDomain(email)` is retained for the in-memory rate limiter only
(keyed per-domain, never persisted). For persistence, replace with `hashEmail(email)`.

Store `emailStubHash` (not `emailDomain`) in the `AWAITING_EMAIL_OTP` transition:
```typescript
const emailDomain = extractEmailDomain(email);  // retained for rate limiter only
const emailStubHash = hashEmail(email);          // stored in DB

const updated = await repository.transition(record.id, "AWAITING_EMAIL_OTP", {
  emailStubHash,
  otpHash,
  otpSalt: salt,
  otpExpiresAt,
  otpAttemptCount: 0,
});
```

Delete `extractEmailDomain` from all other call sites — it must not appear
in any DB write or API call after this story.

### 3. `state-machine.ts` — new `handleExistingUser()` method

Add as a distinct method, never modify `handleNewUser()`:

```typescript
async handleExistingUser(
  channelUserId: string,
  channel: "telegram" | "whatsapp" | "cli",
  phoneStubHash: string,
  expectedEmailStubHash: string | null,  // null for pre-V30 completed rows
): Promise<RegistrationRecord>
```

This method:
1. Creates a new registration record (same as `handleNewUser`)
2. Stores `expectedEmailStubHash` on the record so it can be enforced when
   the user submits their email in step 3 of the re-registration flow
3. When the user submits their email OTP and it verifies:
   - If `expectedEmailStubHash` is **null** (pre-V30 completed row with no
     stored hash): skip continuity enforcement, proceed normally. The new
     completed row will have `email_stub_hash` populated for future re-registrations.
   - If `expectedEmailStubHash` is **non-null**: compare `hashEmail(submittedEmail)`
     against it — if they differ, reject with: "You must use the same email
     address as your original registration. Please try again."

The `expectedEmailStubHash` comes from the `completed` row found in
`engine.ts` (`findCompletedByChannelUser`). The `registrations` table has
the `completed` row's `email_stub_hash` after this story lands (NULL for
rows created before V30 was applied).

### 4. `engine.ts` — call `handleExistingUser` on CONFIRM

Replace:
```typescript
record = await this.#stateMachine.handleNewUser(from, this.#opts.channelType, phoneStubHash);
```

With:
```typescript
record = await this.#stateMachine.handleExistingUser(
  from,
  this.#opts.channelType,
  phoneStubHash,
  completed.emailStubHash,   // from the completed row
);
```

### 5. `engine.ts` — fix bot message copy bug

Replace the re-registration warning message:
```
"You already have a CELLO pre-authorization token. If you want to re-register
(you will get a new token and your existing agent registration will remain active
until it reconnects), reply CONFIRM. Otherwise, ignore this message."
```

With:
```
"You already have a CELLO agent registered to this number. Both agents will work
independently under the same account. To register an additional agent, reply CONFIRM.
Otherwise, ignore this message."
```

### 6. `repository.ts` — add `email_stub_hash` mapping

Update `RegistrationRecord` type and all `transition()` calls to use
`emailStubHash` instead of `emailDomain`. Update row mapper to read
`row.email_stub_hash`.

Update `findCompletedByChannelUser`:
- SQL must explicitly SELECT `email_stub_hash`: `SELECT id, created_at, email_stub_hash FROM registrations WHERE ...`
- Return type must include `emailStubHash: string | null` (null for pre-V30 rows)

### 7. `repository.ts` — add `upsertChannelIdentity()`

New method called from `state-machine.ts` when a registration reaches
`PRE_AUTH_TOKEN_ISSUED`:

```typescript
async upsertChannelIdentity(
  phoneStubHash: string,
  channel: string,
  channelUserId: string,
): Promise<void>
```

Uses `INSERT ... ON CONFLICT (phone_stub_hash, channel) DO UPDATE SET
channel_user_id = EXCLUDED.channel_user_id, updated_at = now()`.

### 8. `directory-pre-auth-client.ts` — update payload

Change `requestToken()` signature from `(phoneStubHash, emailDomain, registrationId)`
to `(phoneStubHash, emailStubHash, registrationId)`.

Update body: `JSON.stringify({ phoneStubHash, emailStubHash, registrationId })`.

### 9. `packages/directory/src/internal-api-server.ts` and `pre-auth-token-repository.ts` — accept emailStubHash

Update the `/internal/pre-authorize` endpoint to accept `emailStubHash`
instead of `emailDomain`. Update validation check accordingly.

Also update `packages/directory/src/pre-auth-token-repository.ts` — it has
`emailDomain` in its interface and SQL (insert, select, and token-issue methods).
Replace all `emailDomain` references with `emailStubHash` to match the V30 schema.

### 10. Migration version SSM parameter

`deploy.sh` automatically computes the expected migration version by scanning
`V*.sql` files for the highest number and writes it to SSM via `aws ssm put-parameter`.
No manual template edit is needed — adding V30 as a migration file is sufficient.
The `cello-ssm-parameters.yaml` default (`"0"`) is intentionally ignored by deploy.sh.

