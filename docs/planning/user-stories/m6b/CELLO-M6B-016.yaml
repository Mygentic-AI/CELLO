# M6B-016 — Registration Data Integrity

## Why

Three gaps exist in the current registration implementation:

**Gap 1 — email_domain instead of email_stub_hash.** The registrations table
stores only the domain half of the verified email (`email_domain TEXT`). The
full email address is verified via OTP but the hash is never persisted. This
makes it impossible to enforce email continuity on re-registration — a user
could verify `alice@gmail.com` the first time and `attacker@gmail.com` the
second time and the system has no way to detect the mismatch.

**Gap 2 — no handleExistingUser code path.** When a user with a completed
registration sends CONFIRM, `engine.ts` calls `handleNewUser()` directly.
There is no distinct code path for returning users that enforces phone hash
AND email hash continuity. Adding a `handleExistingUser()` method keeps the
two paths cleanly separated and makes future per-path logic changes safe.

**Gap 3 — channel_user_id not persisted permanently.** Telegram user IDs are
stored in the `registrations` table (ceremony state only). Once the ceremony
completes they are never promoted to a permanent record. The ops-agent has no
way to contact a user for security alerts, key rotation notifications, or any
other out-of-band event after registration completes. A `channel_identities`
table fixes this.

**Gap 4 — bot message copy bug.** The re-registration warning says "your
existing agent registration will remain active until it reconnects" — implying
reconnection breaks the old agent. It does not. The old agent continues working
indefinitely. The message is factually wrong and will confuse users.

**Gap 5 — pre-auth token payload sends emailDomain not emailStubHash.**
`directory-pre-auth-client.ts` sends `{ phoneStubHash, emailDomain, registrationId }`
to the directory internal API. After this story it must send `emailStubHash`.

## Security context

The ops-agent database security posture is already solid: RLS enabled on all
tables, `cello_ops_agent` role scoped to only `registrations` and
`pre_authorization_tokens`, append-only semantics enforced via REVOKE DELETE,
OTP fields hashed with salt, chain hash for tamper evidence. This story extends
that posture to the new `channel_identities` table with the same RLS pattern.

The ops-agent is the signup portal backend — it is the only component that
holds owner PII (phone, email, channel IDs). The directory never receives PII;
it receives only hashes. This invariant must be preserved: `channel_user_id`
stays in the ops-agent database and is never forwarded to the directory.

