## Sequencing note

This story MUST be merged and deployed healthy (Telegram bot responds, V30 migration
applied, ECS task running `portal_backend.started` log event) BEFORE M6B-015
(the portal-backend rename) is executed. Introducing the rename while this story is
in flight would make it impossible to distinguish registration bugs from rename bugs.

