## Observability

events:
  - name: registration.email.hash_stored
    level: info
    trigger: "When email_stub_hash is written to the registrations row"
    context_fields: [registrationId, correlationId]
    correlationId: true
    notes: "Must NOT include the email address or hash value — only that it was stored"

  - name: registration.email.continuity_rejected
    level: warn
    trigger: "When handleExistingUser rejects a re-registration due to email hash mismatch"
    context_fields: [registrationId, channelUserId, correlationId]
    correlationId: true

  - name: registration.channel_identity.upserted
    level: info
    trigger: "When channel_identities is upserted on registration completion"
    context_fields: [registrationId, channel, correlationId]
    correlationId: true
    notes: "Must NOT include channel_user_id in log output"

error_events:
  - name: registration.channel_identity.upsert_failed
    level: error
    trigger: "When the channel_identities upsert throws"
    context_fields: [registrationId, channel, correlationId]
    correlationId: true

alarms: []
# No new alarms: email continuity rejection is a normal user-facing flow,
# not a server-health signal. channel_identity upsert failure is already
# covered by the existing ops-agent error rate alarm.

