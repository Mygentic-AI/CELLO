## Acceptance Criteria

- id: AC-001
  given: "A user completes a registration ceremony for the first time"
  when: "they submit their email address and the OTP verifies"
  then: "`SHA-256(normalize(email))` is stored in `registrations.email_stub_hash`;
    the `email_domain` column does not exist on the table (dropped in V30);
    the full email address does not appear in any database column or log line"
  test_type: integration
  component_under_test: operations-agent

- id: AC-002
  given: "A user with a prior completed registration (PRE_AUTH_TOKEN_ISSUED) sends CONFIRM"
  when: "they proceed through the re-registration flow and submit a DIFFERENT email address"
  then: "the OTP for the new email verifies correctly, but when `hashEmail(newEmail)` is
    compared against the `expectedEmailStubHash` from the prior completed row, they differ —
    the flow rejects with the continuity error message and the registration does NOT advance
    to PRE_AUTH_TOKEN_ISSUED"
  test_type: integration
  component_under_test: operations-agent

- id: AC-003
  given: "A user with a prior completed registration sends CONFIRM and uses the SAME email"
  when: "they submit the email OTP and it verifies"
  then: "`hashEmail(submittedEmail)` matches `expectedEmailStubHash`; the flow
    proceeds normally to PRE_AUTH_TOKEN_ISSUED; a new pre-auth token is issued"
  test_type: integration
  component_under_test: operations-agent

- id: AC-004
  given: "A registration completes successfully (reaches PRE_AUTH_TOKEN_ISSUED)"
  when: "the state machine writes the final state transition"
  then: "a row is UPSERTED into `channel_identities` with the correct
    `phone_stub_hash`, `channel`, and `channel_user_id`; if a row already
    existed for that (phone_stub_hash, channel) pair it is updated, not duplicated"
  test_type: integration
  component_under_test: operations-agent

- id: AC-005
  given: "A user re-registers (CONFIRM flow) after a prior completed registration"
  when: "the new registration reaches PRE_AUTH_TOKEN_ISSUED"
  then: "`channel_identities` has exactly one row for this (phone_stub_hash, channel)
    pair — the `channel_user_id` matches the current registration's `channel_user_id`"
  test_type: integration
  component_under_test: operations-agent

- id: AC-006
  given: "A user with a prior completed registration is shown the re-registration warning"
  when: "the bot message is sent"
  then: "the message text does NOT contain the phrase 'until it reconnects'; it correctly
    states both agents will work independently under the same account"
  test_type: unit
  component_under_test: operations-agent

- id: AC-007
  given: "A registration completes and a pre-auth token is issued"
  when: "the ops-agent calls the directory internal pre-authorize API"
  then: "the request body contains `emailStubHash` (not `emailDomain`); the directory
    internal API accepts the request and returns a token"
  test_type: integration
  component_under_test: operations-agent

- id: AC-008-integration-gate
  given: "The V30 migration SQL"
  when: "applied to a local PostgreSQL instance that already has V1 through V29 applied"
  then: "Flyway reports zero checksum errors on all prior migrations; V30 applies cleanly;
    `registrations.email_domain` column does NOT exist; `registrations.email_stub_hash TEXT` exists;
    `pre_authorization_tokens.email_domain` column does NOT exist; `pre_authorization_tokens.email_stub_hash TEXT` exists;
    `channel_identities` table exists with UNIQUE index on (phone_stub_hash, channel);
    RLS enabled on `channel_identities`; `cello_ops_agent` has INSERT/SELECT/UPDATE
    on `channel_identities` and NOT DELETE"
  test_type: integration
  component_under_test: directory

