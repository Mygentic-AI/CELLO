# ─── Security Invariants ───────────────────────────────
security_invariants:
  - id: SI-001
    statement: >
      The refactored code shall never expose manager class internals through the public
      createClient() return type — managers are not importable, not constructable, and
      not accessible from outside the client package
    adversarial_condition: >
      even when a consumer imports from @cello-protocol/client and attempts to access
      internal classes by name or via the returned object's prototype chain
    test_type: unit
    component_under_test: client

  - id: SI-002
    statement: >
      No process.stderr.write or console.log call shall exist in any implementation file
      after the refactor — all diagnostic output goes through the injected Logger interface
    adversarial_condition: >
      verified by grep across all .ts files in core/client/src/ excluding __tests__/;
      zero hits for process.stderr.write and console.log
    test_type: unit
    component_under_test: client

# ─── Observability ─────────────────────────────────────
observability:
  events:
    - name: signaling.stream.frame.received
      level: debug
      trigger: "When the persistent signaling reader decodes a valid frame from the directory"
      context_fields: [frameType]
      correlationId: false
    - name: signaling.stream.iter.error
      level: debug
      trigger: "When iter.next() throws inside the signaling reader loop"
      context_fields: [error]
      correlationId: false
    - name: signaling.stream.decode.error
      level: debug
      trigger: "When CBOR decode fails on a signaling stream frame"
      context_fields: [error]
      correlationId: false
    - name: signaling.stream.closed
      level: debug
      trigger: "When the persistent signaling reader loop exits (stream closed or error)"
      context_fields: [pendingSessionRequest, pendingRegister, pendingDkgReady, pendingConnectionResolvers]
      correlationId: false
  error_events: []
  alarms: [] # no alarm: these are debug-level forensic events; visible only with debug logger injected
  notes: >
    These events replace the ~15 process.stderr.write('[SIGREAD-DEBUG]...') calls that
    bypass the logger interface. Same diagnostic content, correct mechanism. Debug level
    means they are silent in production unless a debug-enabled logger is injected.

