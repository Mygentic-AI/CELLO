# ─── Intent ─────────────────────────────────────────────
story: >
  As the CELLO Client,
  I want my implementation split into focused manager classes behind a thin facade
  so that implementers can reason about one domain at a time without navigating a
  6,198-line monolith, and so that future stories (M6B-018 signaling reconnect,
  M7 multi-agent) can modify one domain without risk of unintended side effects
  in another.

# ─── Behavior (EARS) ───────────────────────────────────────
behavior:
  - trigger: "When createClient() is called with the same parameters as before the refactor"
    action: >
      the client package shall return an object with the identical public CelloClient
      interface AND the identical extended return type (escape hatches, composition root
      setters, connection protocol methods) — same method names, same signatures, same
      observable behavior for every call
  - trigger: "When any test file in core/client/src/__tests__/ runs against the refactored code"
    action: >
      the test shall pass without any modification to the test file — the refactored
      code is a drop-in replacement for the monolith with zero test-visible behavioral
      changes
  - trigger: "When the persistent signaling stream reader receives a frame from the directory"
    action: >
      the signaling manager shall emit a structured Logger event at debug level
      (signaling.stream.frame.received) with frameType context field instead of writing
      raw strings to process.stderr — all forensic observability is preserved via the
      correct mechanism
  - trigger: "When any manager class needs state owned by another manager"
    action: >
      communication shall go through a narrow typed interface (not direct field access)
      so that each manager's internal state is encapsulated and the dependency direction
      is explicit

# ─── Acceptance Criteria ────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "The refactored code is built and the full test suite is run"
    when: "pnpm run test --pool-options.threads.maxThreads=1 executes in core/client/"
    then: >
      Every test in core/client/src/__tests__/ passes — zero failures, zero test file
      modifications. The test files are byte-for-byte identical to their pre-refactor state.
    test_type: unit
    component_under_test: client
    notes: >
      This is the primary acceptance gate. The refactor is successful if and only if all
      existing tests pass against it without modification. A test that is rewritten to
      accommodate the refactor is a refactor failure, not a test improvement. test_type is
      'unit' because this is a regression gate verifying behavioral equivalence, not a
      cross-component integration test.

  - id: AC-002
