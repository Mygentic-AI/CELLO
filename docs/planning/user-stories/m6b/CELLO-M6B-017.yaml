# ─── Implementation Notes ──────────────────────────────
implementation_notes: |
  ## Architecture: Facade + Manager Classes

  CelloClientImpl becomes a thin facade (~400 lines) that:
  1. Owns shared infrastructure: #node, #keyProvider, #myPubkeyHex, #logger, #persistence
  2. Owns the M0 peer-to-peer path: #peers, #receiveQueues, #arrivalLog, send(), receive(), peekAll()
  3. Delegates all domain methods to the appropriate manager
  4. Keeps all escape hatch methods (injectTestSession, injectDirectoryFrame, etc.) as one-line
     delegations to the manager that owns the logic — this is what allows zero test modifications

  ## Proposed File Layout

  ```
  core/client/src/
  ├── client.ts               (~400 lines — facade + M0 peer path + factory + error helpers)
  ├── session-manager.ts      (~650 lines — SESSION-002, MSG-004 send/receive, SESSION-007)
  ├── seal-manager.ts         (~600 lines — SESSION-003/005, FROST ceremony, seal lifecycle)
  ├── relay-stream-manager.ts (~600 lines — relay reader, reconnect, cross-check, content handler)
  ├── registration-manager.ts (~360 lines — REG-001, ML-DSA keygen, DKG)
  ├── connection-manager.ts   (~870 lines — CONNREQ-002/003, A-side + B-side)
  ├── signaling-manager.ts    (~460 lines — ADAPTER-003, persistent stream, frame router)
  ├── client-context.ts       (~30 lines — shared dependency interface)
  └── types.ts                (UNCHANGED)
  ```

  ## ClientContext Interface

  ```typescript
  export interface ClientContext {
    readonly node: CelloNode;
    readonly keyProvider: KeyProvider;
    readonly logger: Logger;
    readonly persistence: ClientStatePersistence | null;
    getMyPubkeyHex(): string | null;
    setMyPubkeyHex(hex: string): void;
  }
  ```

  ## Cross-Manager Communication Pattern

  Managers do NOT import each other's classes. Dependencies flow through interfaces:

  - SealManager receives a SessionStateProvider interface (getSession, setSessionStatus,
    enqueueSessionSealedEvent) — implemented by SessionManager
  - RelayStreamManager receives a MessageEnqueuer interface (enqueueVerifiedMessage,
    wakeReceiveWaiters) — implemented by SessionManager
  - SignalingManager receives a FrameDispatcher interface (routeSessionAssignment,
    routeSealFrame, routeRegistrationFrame, routeConnectionFrame) — implemented by the facade

  ## Signaling Reader Extraction

  The #runPersistentSignalingReader method is the central frame router (~350 lines). After
  extraction into SignalingManager, the frame dispatch uses the FrameDispatcher interface:

  ```typescript
  interface FrameDispatcher {
    routeSessionAssignment(frame: Record<string, unknown>): void;
    routeSessionRequestResponse(frame: Record<string, unknown>): void;
    routeSealFrame(sessionIdHex: string, frame: Record<string, unknown>): void;
    routeRegistrationFrame(frame: Record<string, unknown>): void;
    routeConnectionFrame(frame: Record<string, unknown>): void;
    routeConnectionRequestInbound(frame: Record<string, unknown>): void;
    routeCeremonyRequest(stream: Stream, frame: Record<string, unknown>): void;
  }
  ```

  The facade implements FrameDispatcher and calls into the appropriate manager.

  ## Escape Hatch Preservation Strategy

  Every escape hatch method stays on CelloClientImpl (the facade) as a one-line delegation:

  ```typescript
  injectTestSession(...args) { this.#sessionManager.injectTestSession(...args); }
  injectDirectoryFrame(...args) { this.#sealManager.injectDirectoryFrame(...args); }
  injectLeafDeliver(...args) { this.#relayStreamManager.injectLeafDeliver(...args); }
  injectRelayDisconnect(...args) { this.#relayStreamManager.injectRelayDisconnect(...args); }
  _injectPendingConnectionRequest(...args) { this.#connectionManager._injectPendingConnectionRequest(...args); }
  _injectConnectionFrame(...args) { this.#connectionManager._injectConnectionFrame(...args); }
  ```

  Tests call these on the facade via `createClient(...) as unknown as TestClient`. The cast
  resolves because the methods exist on the facade. The delegation is transparent.

  ## Vitest Memory Constraint

  ONE vitest worker only. Always:
  ```
  pnpm run test --pool-options.threads.maxThreads=1
  ```
  Each worker needs ~4.5GB. Docker is 8GB. Never run with more than 1 worker.

  ## What This Story Does NOT Do (deferred to follow-up)

  - Remove dead M0 peer-to-peer path (send/receive/peekAll) — needs verification of usage
  - Remove dead per-session directory streams (#directoryStreams) — needs confirmation
  - Remove unused escape hatches (_injectPendingConnectionRequest, _injectConnectionFrame)
  - Consolidate the two-phase init pattern (setDirectoryEndpoint/setPersistence/setThresholdSigner)
  - Resolve #myPubkeyHex once at init instead of lazy-resolving in 4 places
  - Remove dead forensic debug writes (they are CONVERTED to Logger events, not removed)
