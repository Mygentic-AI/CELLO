# ─── Implementation notes ───────────────────────────────────
implementation_notes: >
  SCOPE / what already exists. The per-agent signaling path already exists in daemon.ts
  (`getAgentSignaling`) and wires six handlers per agent (session ceremony, seal ceremony,
  session_sealed, unilateral-confirmed, unilateral-upgrade, session-offer). The refactor is
  mostly DELETION + UNIFICATION, not greenfield:
   - Remove the primary special-case in getAgentSignaling (lines ~591-593) so EVERY agent
     gets its own dedicated SignalingManager; delete `primaryAgent`, the keystone
     `getAuthIdentity`, `wireKeystonePrimary`, `keystoneDispose`, and the shared keystone
     `signalingManager` as an agent-authed connection.
   - SPINE-5 closure (the one genuinely new wiring): the inbound `session_assignment`
     handlers currently attached only to the keystone `signalingManager` (daemon.ts
     ~lines 2777, 3147, 3274) must move into per-agent wiring so each agent receives its
     own inbound sessions. Some hold daemon-global session state — thread agent identity
     carefully (Architecture phase).
   - Manifest poll: replace the keystone signaling `dispatchManifestPoll` with an HTTP poll
     scheduler that GETs `/manifest` from the directory's bootstrap HTTP base URL (the
     daemon already discovers that host for /bootstrap auto-discovery — reuse it), verifies
     via `verifyManifest` (RFC 8032 threshold) against locally-pinned root keys, and updates
     the SAME shared manifestProvider/cache the startup load + challengeVerifier read. Runs
     daemon-level, even with zero agents.
   - Directory: add a GET /manifest handler to health-server.ts serving
     `directoryManifestStore.getCurrentManifest()` (the store is ALREADY injected into
     DirectoryNode; thread it into createHealthServer). 503 if no store / no manifest yet.
     Keep the signaling `manifest_poll_request` handler in place for backward compat during
     the deploy window (old clients) — the new client just stops using it.
  ZERO-AGENT correctness: with no agents there are simply no directory signaling
  connections (correct); the HTTP manifest poll still runs. This is the property the
  keystone could never provide.
  INVARIANT (SI-002, locked): nothing agent-specific ever goes in the consortium manifest.
  The HTTP move is safe ONLY because the manifest is public, self-authenticating data with
  a locally-pinned trust root. Any future per-agent field in the manifest reverses this.
  TEST INFRA: extend `packages/e2e-tests/src/session-fixture.ts` (the J-CONN journey) — no
  new makeFixture(). The Demo1 repro (AC-001) + non-primary inbound (AC-002) are the new
  live journey J-CONN.
  TRAP NOTES: the new HTTP-poll catch path gets its own distinct reason (DB-001
  `manifest_http_unreachable`), kept separate from agent-connection failures (INV-6). The
  manifest endpoint is a new dialed address with exactly one consumer (the client HTTP
  poll) — AC-003/AC-008 cover producer + consumer.
