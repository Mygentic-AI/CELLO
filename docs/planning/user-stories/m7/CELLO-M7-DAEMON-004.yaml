description: >
  The production foundation the four postmortem stories were silently built on top of.
  Today the daemon's session-tool routing (cello_send / cello_receive) and the
  active-session seal (cello_close_session for active sessions) both return
  not_implemented, and the daemon "does not maintain the session Merkle tree — the
  client supplies it" (daemon.ts:568). The live send + tree + active-seal logic exists
  ONLY in core/client (session-manager.ts, seal-manager.ts) — the legacy in-process
  CelloClient stack, which NO production binary instantiates. This story implements
  Option A: the daemon becomes the live session node that OWNS the per-session Merkle
  tree, sends and receives content through its own SessionNodeManager sessions, and
  initiates the active-session seal over its own tree root. It re-homes the
  content/seal/tree orchestration out of the dead CelloClient stack into the daemon.
  Every client-side AC in MSG-001 / SESSION-002 / SESSION-003 / SESSION-004 depends on
  this foundation; without it those stories build on code that never runs in production.
