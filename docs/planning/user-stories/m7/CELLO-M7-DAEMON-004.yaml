    - CELLO-M7-DAEMON-003    # retry_queue (DB-001 reuse) + nonce dedup
    - CELLO-M7-WIRE-001      # SessionAssignment (session node Peer IDs the send path uses)
    - CELLO-M7-SESSION-001   # interrupted-seal FROST coordination plumbing the active seal reuses
  blocks:
    - CELLO-M7-MSG-001       # content ACK/park layers on top of this live send path + tree
    - CELLO-M7-SESSION-002   # unilateral notarization (client verification) seals via this path
    - CELLO-M7-SESSION-003   # liveness gates the ABSENT decision of this active seal
    - CELLO-M7-SESSION-004   # certificate legibility surfaces this seal's frontier/root
    - CELLO-M7-E2E-001       # AC-005 (cello_send → cello_receive) is made to pass by this story
  notes: >
    This is the Option-A foundation. It re-homes the active-session send + tree + seal
    out of the dead CelloClient stack into the daemon. The four postmortem stories keep
    their LIVE halves (relay store + retry_queue for MSG-001; directory notarization for
    SESSION-002/004; daemon-side liveness for SESSION-003) and re-home their client halves
    onto this foundation. Do not implement the four's client-side ACs against
    session-manager.ts / seal-manager.ts after this lands.

