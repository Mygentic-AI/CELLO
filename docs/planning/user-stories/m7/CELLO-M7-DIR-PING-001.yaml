---
name: CELLO-M7-DIR-PING-001
type: user-story
date: 2026-06-12
topics: [signaling, heartbeat, ping-pong, directory, resilience, m7]
status: draft
description: >
  Directory-side ping/pong handler for signaling heartbeat frames. The directory
  receives ping frames on authenticated signaling streams and responds with pong
  frames within 1 second. No state persistence, no blocking operations in the
  handler — pure responder. The client (SIGNAL-001) owns heartbeat detection
  logic; the directory only echoes back. Minimal observability (DEBUG level,
  fires every 15s per client). Completes the end-to-end heartbeat path started
  by SIGNAL-001.
---
# ─── Identity ───────────────────────────────────────────────
id: CELLO-M7-DIR-PING-001
domain: Directory
milestone: M7
actor: DIR
priority: P0
components:
  - directory

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the directory node,
  I want to respond to ping frames on authenticated signaling streams with pong
  frames within 1 second,
  so that clients can detect signaling stream liveness via heartbeat without
  requiring any state persistence or blocking operations in the directory's
  ping handler.

# ─── Context ────────────────────────────────────────────────
# SIGNAL-001 (cello-client) sends ping frames every 15s and expects pong within
# 15s. DIR-PING-001 (trustless-cello) delivers the directory-side handler that
# receives those pings and sends pongs. The directory does NOT own heartbeat
# detection logic — the client does. The directory is a pure responder.
#
# Frame format (defined by SIGNAL-001):
#   ping: { type: 'ping', ts: <monotonic counter> }
#   pong: { type: 'pong', ts: <same value> }
#
# The ts field is a monotonic counter (not Date.now() — avoids clock skew).
# The directory echoes back the same ts value it received.
#
# No state persistence: the directory does NOT persist ping timestamps, count
# pings, or maintain heartbeat state. It is a pure responder. The client owns
# heartbeat timeout detection logic.
#
# No blocking operations: the pong must be sent within 1 second of receiving
# the ping. Any operation that could block (DB query, external API call) is
# prohibited in the ping/pong path.
#
# Observability: ping/pong events at DEBUG level (not INFO — fires every 15s
# per connected client; INFO would spam logs). All events include clientPubkey
# (the agent's K_local pubkey hex) and streamId (signaling stream identifier).
#
# Composition root: the ping handler is registered in the directory's signaling
# stream protocol handler during createNode or directory startup. An AC verifies
# the handler is reachable from the directory binary entrypoint — unit tests of
# the handler in isolation are not sufficient.
#
# Error handling: if sending the pong fails (stream write error), log at DEBUG
# with error.message (never ${error} interpolation). Do NOT terminate the
# stream — the client's heartbeat timeout will detect the failure.

# ─── Sovereign Node Constraint ──────────────────────────────
# Directory nodes are sovereign and independent. Each directory node handles
# ping/pong for its own connected clients independently. No cross-node
# coordination or shared state. Three directory regions each respond to their
# own clients. No assumption of co-location, shared networking, or coordination
# between directory nodes.

# ─── Behavior ──────────────────────────────────────────────
behavior:
  - trigger: "When a ping frame arrives on an authenticated signaling stream"
    action: >
      The directory reads the ts field from the ping frame, constructs a pong
      frame { type: 'pong', ts: <same value> }, and sends it to the same
      signaling stream within 1 second. No blocking operations (DB query,
      external call) are executed in the handler. directory.signaling.ping.received
      is logged at DEBUG with clientPubkey and streamId.

  - trigger: "When the pong frame is successfully sent"
    action: >
      directory.signaling.pong.sent is logged at DEBUG with clientPubkey and
      streamId. No other action is taken — the directory maintains no heartbeat
      state.

  - trigger: "When sending the pong fails (stream write error)"
    action: >
      directory.signaling.pong.failed is logged at DEBUG with clientPubkey,
      streamId, and error (the actual error.message, never ${error}
      interpolation). The stream is NOT terminated by the directory — the
      client's heartbeat timeout will detect the missing pong and trigger
      reconnection.

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "A directory node with an authenticated signaling stream to a client"
    when: "a ping frame { type: 'ping', ts: 42 } is sent over the signaling stream"
    then: >
      The directory receives the ping, logs directory.signaling.ping.received
      at DEBUG with clientPubkey (non-empty hex string) and streamId (non-empty
      string), constructs { type: 'pong', ts: 42 }, sends it to the same
      stream, and logs directory.signaling.pong.sent at DEBUG with clientPubkey
      and streamId. The pong is sent within 1 second of receiving the ping
      (measured by test harness). The ts value in the pong matches the ts value
      from the ping exactly.
    test_type: integration
    component_under_test: directory

  - id: AC-002
    given: "A directory node with two authenticated signaling streams to different
      clients (Agent A with clientPubkey aaa..., Agent B with clientPubkey bbb...)"
    when: "Agent A sends ping { ts: 10 } and Agent B sends ping { ts: 20 }
      within the same 1-second window"
    then: >
      The directory sends pong { ts: 10 } to Agent A's stream and pong { ts: 20 }
      to Agent B's stream. The responses do NOT cross streams — A receives only
      its own pong, B receives only its own pong. directory.signaling.ping.received
      fires twice (once with clientPubkey aaa..., once with bbb...). Same for
      directory.signaling.pong.sent — twice with correct clientPubkey values.
    test_type: integration
    component_under_test: directory

  - id: AC-003
    given: "A directory node with an authenticated signaling stream"
    when: "the stream is killed at the OS level (TCP RST) immediately before the
      directory attempts to send a pong frame"
    then: >
      The stream write throws. The directory catches the error, logs
      directory.signaling.pong.failed at DEBUG with clientPubkey, streamId, and
      error (the actual error.message from the stream write failure — not
      '[object Object]', not ${error}), and does not crash. The directory does
      NOT terminate the stream itself (the stream is already dead from the
      client's perspective). directory.signaling.ping.received was logged before
      the write failure; directory.signaling.pong.sent does NOT fire (the send
      failed).
    test_type: integration
    component_under_test: directory

  - id: AC-004
    given: "A directory node with an authenticated signaling stream"
    when: "the client sends ping frames every 15 seconds for 2 minutes (8 pings)"
    then: >
      The directory responds with 8 pongs. directory.signaling.ping.received
      fires 8 times at DEBUG level. directory.signaling.pong.sent fires 8 times
      at DEBUG level. No other log events fire for routine ping/pong — no INFO,
      no WARN, no ERROR. The directory's log is not spammed by heartbeat frames.
    test_type: integration
    component_under_test: directory

  - id: AC-005
    given: "The directory binary's main entrypoint (packages/directory/src/index.ts
      or bin.ts)"
    when: "the directory starts via `node dist/index.js` (the command ECS runs)"
    then: >
      The ping handler is reachable from a real client. Verified by an integration
      test that: (a) spawns the directory process via child_process.spawn() running
      the actual binary, (b) establishes an authenticated signaling stream from a
      separate CelloClient, (c) sends a ping frame, (d) asserts a pong is received
      within 1 second. A test that calls `new DirectoryNode().start()` directly
      or imports the handler function for isolated unit testing does NOT satisfy
      this AC — the test must exercise the actual deployment artifact.
    test_type: integration
    component_under_test: directory
    notes: >
      Addresses M7 lesson L3 (composition root never wired). The handler can be
      implemented and unit-tested, but if the directory's entrypoint never
      registers it, it is dead code. This AC proves the handler is reachable
      from the running binary by spawning the actual binary that ECS deploys.

  - id: AC-006
    given: "All catch blocks in packages/directory/src/"
    when: "each catch block is reviewed"
    then: >
      No catch block interpolates the error object into a template string via
      ${error}. All error logging uses error.message explicitly:
      error instanceof Error ? error.message : String(error). The implementer
      scans EVERY catch block in EVERY file in packages/directory/src/ (not
      only files changed by this story, and not only catch blocks judged to
      be "signaling-related") and fixes or reports any that interpolate error
      objects directly. If a catch block is found that requires an interface
      change or touches significant pre-existing code, the implementer reports
      it as [high] and files a new story before milestone close.
    test_type: unit
    component_under_test: directory

  - id: AC-007
    given: "docs/planning/discussion_logs/2026-05-16_0753_development-pipeline-and-local-iteration.md
      (the canonical event taxonomy)"
    when: "the implementation is complete"
    then: >
      The three events (directory.signaling.ping.received,
      directory.signaling.pong.sent, directory.signaling.pong.failed) are added
      to the Observability Events section under a new "Directory Signaling (M7-DIR-PING-001)"
      subsection with: event name, level, context fields, correlationId: false,
      trigger description. The entries match the format of existing taxonomy
      entries (see SESSION-007 or FEDERATION-003 for examples).
    test_type: unit
    component_under_test: directory

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: >
      The directory shall never execute a blocking operation (DB query, external
      API call, file I/O) or hold a cross-stream lock in the ping handler. Each
      client's pong must be sent within 1 second of receiving the ping,
      regardless of burst load from other clients sharing the same directory node.
    adversarial_condition: >
      An attacker controls Client A and sends a burst of 100 ping frames within
      1 second to the directory. Simultaneously, legitimate Client B sends a
      single ping. The directory must respond to Client B's pong within 1 second
      — Client A's burst must not delay Client B's response. If the handler
      blocks on any operation or holds a serializing lock across streams, Client
      A's burst will delay Client B's pong beyond the 1-second budget, triggering
      a false-positive heartbeat timeout on the legitimate client. Verified by a
      load test that sends 100 pings from Client A and 1 ping from Client B
      concurrently, then asserts Client B's pong arrives within 1 second (Client
      A's 100 pongs may arrive within 2 seconds due to stream write serialization,
      but must not block Client B).
    test_type: integration
    component_under_test: directory

# ─── Degraded Behavior ──────────────────────────────────────
degraded_behavior: []
# No degraded behavior section — ping/pong is a pure in-memory operation with no
# external dependencies. The only failure mode (stream write error) is handled
# by logging and relying on the client's timeout detection.

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: directory.signaling.ping.received
      level: debug
      trigger: "When a ping frame is received on an authenticated signaling stream"
      context_fields: [clientPubkey, streamId]
      correlationId: false
    - name: directory.signaling.pong.sent
      level: debug
      trigger: "When a pong frame is successfully sent in response to a ping"
      context_fields: [clientPubkey, streamId]
      correlationId: false
  error_events:
    - name: directory.signaling.pong.failed
      level: debug
      trigger: "When sending a pong frame fails (stream write error)"
      context_fields: [clientPubkey, streamId, error]
      correlationId: false
  notes: >
    All three events are at DEBUG level (not INFO). Heartbeat fires every 15
    seconds per connected client. With 100 connected clients, INFO-level logging
    would generate 400 log lines per minute per directory node (ping + pong for
    each client). DEBUG is the correct level for routine keepalive chatter. The
    implementer must add all three events to the canonical event taxonomy in
    docs/planning/discussion_logs/2026-05-16_0753_development-pipeline-and-local-iteration.md.
    No console.log in implementation code — all events go through the injected
    Logger interface.
  alarms: []
  # No CloudWatch alarms for ping/pong events. If pong fails to send, the
  # client's heartbeat timeout (SIGNAL-001) detects the failure and triggers
  # reconnection. No alarm is needed at the directory level for individual pong
  # failures. Sustained pong failures across many clients would surface as
  # increased directory.signaling.disconnected rates in SIGNAL-001's client-side
  # logs — that alarm already exists.

# ─── Implementation Notes ────────────────────────────────────
implementation_notes:
  - >
    Frame routing: the ping handler is wired into the directory's existing
    authenticated signaling stream handler — the same handler that routes
    connection_request, disclosure_request, session_request, seal_verify,
    etc. (per DAEMON-001's authenticated stream model). The handler is a frame
    type case in a switch statement or a registered protocol handler for the
    /cello/signaling/1.0.0 stream. SIGNAL-001 defines the frame type; this
    story implements the directory-side response.
  - >
    Ping frame schema (authoritative from SIGNAL-001):
      { type: 'ping', ts: <number> }
    Pong frame schema (authoritative):
      { type: 'pong', ts: <same value> }
    The ts field is a monotonic counter (performance.now() or equivalent), not
    Date.now(). This avoids clock skew confusion if system time jumps.
  - >
    No state persistence: the directory does NOT write ping timestamps to
    Postgres, does NOT count pings, does NOT maintain any in-memory heartbeat
    state per client. The handler is entirely stateless — receive ts, echo ts.
  - >
    Error handling: if stream.write(pongFrame) throws, catch and log
    directory.signaling.pong.failed with error.message. Do NOT call
    stream.destroy() or stream.end() — the stream is already dead from the
    client's perspective. The catch is purely for logging; no recovery action
    is taken.
  - >
    Composition root: in packages/directory/src/directory-node.ts (or the
    equivalent binary entrypoint), the ping handler is registered during the
    signaling stream setup. If the directory uses a protocol router (e.g.
    registering handlers by frame type), add:
      signalingProtocol.registerHandler('ping', handlePing)
    If the directory uses a single onMessage handler with a switch, add:
      case 'ping': return handlePong(frame, stream)
    AC-006 verifies this wiring via an integration test that starts the
    directory binary and exercises the full path.
  - >
    Known limitation until SIGNAL-001 completes: heartbeat will not be
    functional end-to-end until SIGNAL-001 lands in cello-client. The client
    will send ping frames, but if DIR-PING-001 has not yet deployed, pongs
    will never arrive. The client will detect stream death after every 30-second
    window and enter the reconnect loop. This is expected behavior — DIR-PING-001
    unblocks the end-to-end path, but SIGNAL-001 must land first to initiate
    the pings.

# ─── Dependencies ────────────────────────────────────────────
dependencies:
  blocked_by:
    - CELLO-M7-SIGNAL-001  # ping/pong frame type defined in SIGNAL-001; DIR-PING-001 implements the server-side response
  blocks: []
  notes: >
    DIR-PING-001 depends on SIGNAL-001 (cello-client) because SIGNAL-001
    defines the ping/pong frame schema and the heartbeat interval. DIR-PING-001
    delivers the directory-side handler that responds to those frames.
    Implementation order: SIGNAL-001 lands in cello-client, then DIR-PING-001
    lands in trustless-cello. Until both are deployed, heartbeat will not
    function end-to-end — clients will send pings, directories will ignore them
    (no handler registered), and clients will detect stream death via timeout.

