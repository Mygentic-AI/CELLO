description: >
  Closes the M7 content-delivery gap (POSTMORTEM Part 4). Adds an unsigned,
  transport-authenticated delivery ACK (received → persisted ladder; the protocol
  acts on `persisted` only); a TTF-driven park-at-relay flush model plus a
  startup flush of locally-persisted un-acked content; a durable, recipient-keyed,
  WAL-backed relay-side store-and-forward queue holding ENCRYPTED content the relay
  cannot read (TTL 7 days, delete-on-pickup); resend-vs-replay dedup so a recovered
  or duplicated message is never double-counted in the Merkle tree; a deliberate
  1 MB content-size cap with a clear `content_too_large` error replacing the silent
  4 MB decode-failure → desync; and replacement of desync-on-missing-content with
  active recovery (ACK-driven resend from the sender, then pull from the relay
  queue). Desync now occurs ONLY on genuine tamper (content_hash mismatch).
  Cross-repo: cello-client (protocol-types, transport, client, daemon) and
  trustless-cello (relay, interfaces). The sender side EXTENDS DAEMON-003's durable
  `retry_queue`; the relay side EXTENDS the FileSessionWal adapter pattern + WAL_DIR.
