# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: >
      The remaining participant must never automatically initiate a seal ceremony
      upon receipt of a session_interrupted frame. The decision to seal or discard
      must be explicit and operator-driven.
    adversarial_condition: >
      A malicious relay injects a forged session_interrupted frame for an active
      session between A and B. B's daemon receives the frame. B must NOT trigger
      a FROST seal ceremony automatically — this would allow the relay to terminate
      sessions and consume FROST ceremony resources without operator consent. Verified
      by: (a) injecting a session_interrupted frame over a real relay stream for an
      active session; (b) asserting no session_sealed or seal-related events fire on
      B's daemon; (c) asserting B's session status transitions to 'interrupted' only;
      (d) asserting B's operator must call cello_close_session explicitly to initiate
      seal-interrupted. A daemon that auto-seals on frame receipt fails this invariant.
    test_type: integration
    component_under_test: daemon

  - id: SI-002
    statement: >
      The seal-interrupted flow must verify both sides' SEAL-INTERRUPTED leaf
      signatures before proceeding to the FROST ceremony. A forged or unsigned
      SEAL-INTERRUPTED leaf from the counterparty must cause the flow to abort.
    adversarial_condition: >
      An attacker intercepts the SEAL-INTERRUPTED leaf exchange and substitutes a
      leaf with a modified merkleRootAtInterruption (pointing to a different Merkle
      tree state). The initiating daemon must verify the counterparty's K_local
      signature on the SEAL-INTERRUPTED leaf before accepting it. If the signature
      does not verify, the flow must abort with a distinct error and the session
      must remain 'interrupted' (not transition to 'sealed'). Verified by: (a)
      constructing a SEAL-INTERRUPTED leaf with a tampered merkleRootAtInterruption;
      (b) having the initiator process it; (c) asserting the signature verification
      fails and the FROST ceremony does not run; (d) asserting the session status
      remains 'interrupted'.
    test_type: unit
    component_under_test: client

# ─── Degraded Behavior ──────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While the directory signaling stream is in 'reconnecting' state when
      the operator calls cello_close_session on an interrupted session"
    fallback: >
      The seal-interrupted flow returns { ok: false, reason: 'signaling_reconnecting',
      guidance: 'The directory signaling stream is reconnecting. Wait for
      directory_signaling to show connected in cello status before initiating
      seal-interrupted. The daemon reconnects automatically — no manual intervention
      required.' } The session status remains 'interrupted'. The operator retries
      after the signaling stream is restored.
    test_type: unit
    component_under_test: client
    notes: >
      Addresses M7 lesson L5 (send-path dead channel). The seal-interrupted
      flow must check directory_signaling status before attempting to send the
      SEAL-INTERRUPTED frame. A send over a dead channel must fail with a distinct
      error, not hang or crash.

  - id: DB-002
    condition: "While the relay is unreachable when the relay would emit a
      session_interrupted frame (relay crash scenario)"
    fallback: >
      The daemon detects the relay stream close (AC-005 path). The session is
      marked 'interrupted' with source: 'stream_close'. The behavior is identical
      to receiving a session_interrupted frame — the source field distinguishes
      which detection path fired. The operator sees the interrupted session on
      next login via interrupted_sessions in cello status.
    test_type: integration
    component_under_test: daemon

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: session.interrupted.detected
      level: warn
      trigger: "When the daemon receives a session_interrupted relay frame
        (source: 'relay_frame'), detects a relay stream close for an active session
        (source: 'stream_close'), or scans interrupted rows at login
        (source: 'daemon_restart' — emitted by DAEMON-002 for graceful/SIGKILL;
        SESSION-001 re-emits for relay-side detections). SESSION-001 owns the
        relay_frame and stream_close sources. DAEMON-002 owns daemon_restart."
      context_fields: [sessionId, agentName, source]
      correlationId: false
      notes: >
        source must be exactly one of: 'relay_frame', 'stream_close',
        'daemon_restart'. No other values are permitted.
    - name: session.interrupted.sealed
      level: info
      trigger: "When the seal-interrupted bilateral flow completes and the FROST
        seal notarization is received, transitioning the interrupted session to sealed"
      context_fields: [sessionId, agentName, leafCount]
      correlationId: true
      notes: >
        correlationId is minted at cello_close_session invocation and threaded
        through all seal-interrupted events for that flow (SEAL-INTERRUPTED frame
        send, leaf verification, FROST ceremony events, session.interrupted.sealed).
  error_events:
    - name: session.interrupted.seal.failed
      level: error
      trigger: "When the seal-interrupted flow fails at any step: counterparty
        unreachable, counterparty rejection, leaf signature verification failure,
        or FROST ceremony failure"
      context_fields: [sessionId, agentName, reason, error]
      correlationId: true
  notes: >
    These events extend the session.interrupted.* taxonomy introduced in DAEMON-002.
    The implementer must add session.interrupted.detected (relay_frame and
    stream_close sources), session.interrupted.sealed, and
    session.interrupted.seal.failed to the canonical event taxonomy in
    docs/planning/discussion_logs/2026-05-16_0753_development-pipeline-and-local-iteration.md.
    No console.log in implementation code — all events go through the injected
    Logger interface.
  alarms:
    - condition: "session.interrupted.detected fires more than 10 times in 5 minutes
        across all agents on a single daemon"
      fires_to: "daemon-health CloudWatch alarm — sustained interruption rate
        indicates relay instability or network degradation"
    - condition: "session.interrupted.seal.failed fires with reason:
        'seal_interrupted_counterparty_unavailable' more than 5 times in 1 hour
        for the same sessionId"
      fires_to: "operator notification — the counterparty has been unreachable
        for an extended period; the operator should decide whether to discard
        the session"

# ─── Implementation Notes ────────────────────────────────────
implementation_notes:
  - >
    session_interrupted frame type: add to packages/relay/src/ as a new control
    frame type alongside the existing seal-related frames. Wire the emit into the
    relay's participant disconnect handler. The frame schema:
    { type: 'session_interrupted', sessionId: string, reason: 'peer_disconnected' | 'timeout' }
    No signature, no Merkle root — this is a relay notification, not a
    cryptographic commitment.
  - >
    SEAL-INTERRUPTED control leaf: a new Merkle control leaf type (distinct from
    the existing SEAL leaf). Structure: { type: 'SEAL_INTERRUPTED', sessionId: string,
    leafCount: number, merkleRootAtInterruption: string, timestamp: number,
    signerPubkey: string }. Both sides produce one before the FROST ceremony.
    The FROST ceremony uses the normal 'cello-frost-seal-v1' context string with
    the merkleRootAtInterruption (which already includes the SEAL-INTERRUPTED
    leaf at the tip of the chain) as the sealed root.
  - >
    Directory signaling path for SEAL-INTERRUPTED delivery: the session node is
    torn down, so SEAL-INTERRUPTED coordination must route through the existing
    signaling stream (the same channel used for connection negotiation and session
    offers). The exact frame type for this coordination must be added to the
    directory signaling protocol spec. This does not require a new directory
    endpoint — it uses the existing bidirectional signaling stream.
  - >
    SQLite schema extension (if not already in DAEMON-002): the sessions table
    needs counterpartyPubkey, messageCount, and interruptedAt columns to support
    the login surfacing AC-006. If DAEMON-002's schema already captures them,
    SESSION-001 verifies they are populated. If not, SESSION-001 adds them via an
    inline ALTER TABLE (client-side SQLite uses inline migrations, not Flyway).
  - >
    DAEMON-002 scope: DAEMON-002 marks sessions interrupted on graceful shutdown
    (SIGTERM) and at login for rows left 'active' by a prior SIGKILL. SESSION-001
    does NOT change DAEMON-002's behavior — it adds the relay-side detection paths
    (relay_frame, stream_close). The two stories' interrupted-session code coexists
    in the daemon without conflict.
  - >
    Cross-repo batching: SESSION-001 touches packages/relay (trustless-cello) and
    packages/daemon + packages/client (cello-client). The relay changes must be
    batched with M7-WIRE-001 and M7-MANIFEST-002 before any pipeline push.
    Never push relay changes alone — the directory/relay pipeline is 25-30 minutes.
    Check COORDINATION.md batching section and confirm all three stories are ready
    before triggering the push.

