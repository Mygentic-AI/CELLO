  - id: AC-016
    given: "The new @cello-protocol/connect version is live on npm beta"
    when: "packages/relay/package.json in trustless-cello is updated"
    then: >
      - packages/relay/package.json references the new semver ranges for
        @cello-protocol/client and any other modified cello-client packages
      - No workspace:* references to @cello-protocol/crypto, transport,
        protocol-types, or client remain in packages/relay/package.json or
        packages/directory/package.json
      - pnpm install is run and pnpm-lock.yaml is updated in trustless-cello
      - pnpm run typecheck passes in trustless-cello
      - Commit pushed to trustless-cello main — only after confirming with
        COORDINATION.md that M7-WIRE-001 and M7-MANIFEST-002 are also ready
        to batch (never push relay-only changes alone — pipeline is 25-30 min)
    test_type: integration
    component_under_test: directory
    notes: >
      workspace:* resolves to stale local copies post-REPOSPLIT-002. This AC
      ensures relay runs against the published version with the new
