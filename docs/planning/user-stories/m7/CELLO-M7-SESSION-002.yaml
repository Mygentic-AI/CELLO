description: >
  Turns the unilateral seal from an unsigned bookkeeping note into a real FROST
  notarization. The directory reconstructs and VERIFIES the submitter's reported
  root against the session's authenticated signed-leaf chain (it no longer trusts
  reported_root), runs the FROST notarization ceremony (seal initiator + directory
  threshold; the absent counterparty is never a signer), records the counterparty
  ABSENT, and persists a signed, append-only, upgrade-ready SealNotarization
  distinguished as UNILATERAL. The SealUnilateralConfirmed (present party) and
  SealUnilateralNotification (absent party) frames carry the verifiable certificate;
  the absent party verifies the signature over the canonical seal TBS WITHOUT
  trusting the channel. Finally satisfies PERSIST-015's spec'd "write
  conversation_seals with seal_type=UNILATERAL".
