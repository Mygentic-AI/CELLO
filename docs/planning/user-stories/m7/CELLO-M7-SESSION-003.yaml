# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: >
      A counterparty whose session-path connection is alive must NEVER be recorded
      ABSENT in a unilateral seal — an alive-but-silent peer is DELIVERED.
    adversarial_condition: >
      The counterparty B is alive on the session path (relay standing connection
      up, or peer↔peer session-node connection up) but produces NO output for the
      entire delivery-grace window — indistinguishable, at the byte level, from a
      busy or stalled agent. A malicious or impatient present party wants B
      recorded ABSENT (the weaker, more adverse standing). The gate must read
      'alive' and record DELIVERED regardless of B's silence. Verified by: (a)
      keeping B connected and silent for the whole grace window on both a direct
      and a relay-path session; (b) initiating the unilateral seal; (c) asserting
      the recorded counterparty attestation is DELIVERED and that ABSENT is
      recorded nowhere. A determination that seals ABSENT on silence alone fails
      this invariant.
    test_type: e2e
    component_under_test: client

  - id: SI-002
    statement: >
      The directory's connection state must NEVER be used as the counterparty
      liveness authority. The liveness verdict must originate solely from the
      session-path component (relay standing connection for relay sessions,
      session-node connection for direct sessions).
    adversarial_condition: >
      The directory signaling link between the present party and the directory is
      fully up and healthy (and the directory answers DIR-PING-001 pongs), while
      the counterparty's actual session-path component is DEAD. A naive
      implementation reads "directory says I'm connected" as "counterparty alive"
      (false positive) — or, symmetrically, a flaky directory link as
      "counterparty gone" (false negative). The directory-facing node is decoupled
      from the ephemeral session node, so either reading is wrong. Verified by:
      (a) holding the directory link up while the session-path component is dead
      and asserting the verdict is NOT 'alive'; (b) a code-path/grep assertion
      that no directory connection signal, pong, or directory_signaling status
      feeds the liveness determination.
    test_type: integration
    component_under_test: client

  - id: SI-003
    statement: >
      ABSENT must require a POSITIVE connection-gone observation from the
      session-path authority. The mere absence, timeout, or unavailability of a
      liveness signal must NEVER be recorded as ABSENT.
    adversarial_condition: >
      The relay is unreachable, the liveness query times out, or the relay returns
      'unknown' — there is no positive evidence that the counterparty's connection
      dropped. An implementation that treats "no signal" as "gone" would let any
      transient relay/network fault manufacture a false ABSENT against a peer that
      is actually alive. The gate must fail SAFE to DELIVERED. Verified by:
      (a) making the relay unreachable / forcing a timeout / forcing an 'unknown'
      response; (b) initiating the unilateral seal; (c) asserting DELIVERED is
      recorded and ABSENT is not.
    test_type: integration
    component_under_test: client

  - id: SI-004
    statement: >
      For a relay-path (transport_mode: 'relay') session, an ABSENT verdict must
      originate from the relay's session_liveness_response — the present party must
      not be able to manufacture a relay-path ABSENT from its own local state.
    adversarial_condition: >
      A malicious present party wants the counterparty recorded ABSENT on a
      relay-path session (where it is NOT the session-path observer) by
      self-asserting 'gone' from local information. Because the relay holds the
      recipient's standing connection and is the only honest observer for that
      transport mode, the implementation must source the relay-path ABSENT verdict
      from the relay's response and have no fallback path that lets the initiator
      assert it locally. Verified by: (a) attempting to drive a relay-path ABSENT
      while the relay reports 'alive'/'unknown'; (b) asserting the recorded
      attestation is NOT ABSENT — the relay's verdict governs.
    test_type: integration
    component_under_test: client

# ─── Degraded Behavior ──────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While the relay is unreachable when a relay-path liveness query is
      needed for a unilateral-seal ABSENT determination"
    fallback: >
      The client records the counterparty attestation as DELIVERED (alive-but-
      uncertain) instead of ABSENT, emits session.liveness.query.failed with a
      distinct reason, and proceeds with the unilateral seal. This replaces the
      normal behavior of consulting the relay and recording the relay's positive
      verdict. ABSENT is never produced from a missing signal.
    test_type: integration
    component_under_test: client

  - id: DB-002
    condition: "While the directory signaling stream is in 'reconnecting' state
      when the operator calls cello_close_session on the unilateral path"
    fallback: >
      The unilateral seal returns the SESSION-001 'signaling_reconnecting' outcome
      with guidance to wait for directory_signaling to show connected — the
      liveness determination is deferred until the seal can be submitted. The
      session state is unchanged; the operator retries. This story does not change
      SESSION-001's signaling-reconnecting handling; it only ensures the liveness
      step does not run against a dead signaling channel.
    test_type: unit
    component_under_test: client
    notes: >
      Addresses M7 lesson L5 (send-path dead channel). The liveness query and the
      seal submission must both check channel state before sending; a send over a
      dead channel must fail with a distinct error, never hang or silently fail.

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: session.liveness.changed
      level: info
      trigger: "When a session-path liveness entry transitions to 'alive' (relay
        standing connection established, or direct session-node onPeerConnect).
        Fires at WARN instead of INFO when transitioning to 'gone'."
      context_fields: [sessionId, counterpartyPubkey, transportPath, liveness, observedBy]
      correlationId: false
      notes: >
        transportPath is exactly 'direct' | 'relay'. observedBy is exactly
        'relay' | 'session_node'. liveness is exactly 'alive' | 'gone'. The
        'gone' transition is logged at WARN. Relay-side events fire in the relay
        ECS task (CloudWatch-observable); client/session-node events fire in the
        local daemon process (local log only).
    - name: session.seal.attestation.determined
      level: info
      trigger: "When the unilateral-seal path determines the counterparty
        attestation from the session-path liveness verdict"
      context_fields: [sessionId, counterpartyPubkey, attestation, liveness, authority, correlationId]
      correlationId: true
      notes: >
        attestation is exactly 'DELIVERED' | 'ABSENT' for this path (never
        CLEAN/FLAGGED). authority is exactly 'relay' | 'session_node'.
        correlationId is minted at cello_close_session invocation and threaded
        through the liveness query and the determination.
  error_events:
    - name: session.liveness.query.failed
      level: warn
      trigger: "When a relay-path liveness query cannot be answered (relay
        unreachable, query timeout, or response 'unknown' treated as a
        non-determinative failure for ABSENT purposes)"
      context_fields: [sessionId, counterpartyPubkey, reason, error]
      correlationId: true
      notes: >
        reason is one of 'liveness_query_unreachable', 'liveness_query_timeout',
        'liveness_unknown'. error carries the extracted error.message string,
        never the raw error object.
  alarms:
    - condition: "session.liveness.changed with liveness: 'gone' and observedBy:
        'relay' fires more than 20 times in 5 minutes on a single relay task
        across all recipients — indicates relay-side connection churn /
        instability rather than normal session teardown"
      fires_to: "CloudWatch metric filter on the relay log group → relay
        instability alarm; relay-side events ARE CloudWatch-observable (the relay
        runs in ECS)"
    - condition: "session.liveness.query.failed fires more than 10 times in 10
        minutes for relay-path sessions on a single daemon — indicates the daemon
        cannot reach the relay to determine liveness"
      fires_to: "surfaced as persistent WARN in the local daemon log; the daemon
        is a local operator process, not an ECS task, so CloudWatch cannot observe
        it — the threshold is implementer guidance for local monitoring"

# ─── Implementation Notes ────────────────────────────────────
implementation_notes:
  - >
    Relay session-path liveness: extend relay-store.ts to track per-recipient
    liveness keyed by recipient pubkey (the same key as #deliveryQueues). Replace
    the log-only onPeerConnect/onPeerDisconnect handlers in relay-node.ts
    (~272-276) with handlers that update this state. 'gone' must flip back to
    'alive' on reconnect (delivery-queue cleanup parity — cross-ref the M-2
    teardown-leak fix from SESSION-001: a single cleanup authority, idle sweep
    safe). The relay never fabricates 'gone' from a missing entry — no entry is
    'unknown'.
  - >
    Relay liveness frame: add session_liveness_query and session_liveness_response
    to the relay protocol (/cello/relay/1.0.0) and to packages/protocol-types.
    Query: { type: 'session_liveness_query', session_id, counterparty_pubkey }.
    Response: { type: 'session_liveness_response', session_id, counterparty_pubkey,
    liveness: 'alive' | 'gone' | 'unknown', observed_at }. snake_case on the relay
    wire is intentional (cross-ref SESSION-001 L-1).
  - >
    Direct-session liveness: the transport already exposes
    onPeerConnect/onPeerDisconnect (transport/src/node.ts ~183-190) and both fire
    but the client acts on neither (peer-reconnect-libp2p-primitives.md). Wire the
    session node's onPeerDisconnect to a per-session counterparty_liveness flag in
    the session record / session-node manager. Enable a transport keepalive on the
    session node's createNode options so a peer that vanished without a clean close
    is detected (libp2p connection keepalive / ping). The keepalive interval must
    be injectable for tests (adapter pattern) so AC-005 does not require synthetic
    clock manipulation.
  - >
    transport_mode authority: read transport_mode from the session's
    SessionAssignment (WIRE-001) to pick the liveness authority — 'direct' → local
    session-node flag; 'relay' → query the relay. NEVER infer the authority from
    the address format (WIRE-001 SI: transport_mode is the sole authority).
  - >
    The gate: in initiateUnilateralSeal (seal-manager.ts ~280), after the
    directory-enforced grace floor passes (the directory still owns the 'too_early'
    timer), obtain the liveness verdict and map it (alive→DELIVERED, gone→ABSENT,
    unknown→DELIVERED). Add counterparty_liveness and counterparty_attestation to
    the seal_unilateral frame. The PERSISTED FROST-signed SealNotarization with
    the attestation is the unilateral-seal-notarization workstream's job
    (POSTMORTEM Part 4 "A"); this story produces and carries the verdict and
    asserts the directory honors it without self-deriving liveness.
  - >
    Honest limit / no agent heartbeat: do NOT add any timer-driven agent receipt
    emitter. Liveness is connection/node-level only. last_seen_seq is unchanged.
    The DELIVERED attestation is NEVER promotable to Active/CLEAN/FLAGGED by a
    liveness signal — only the counterparty's own signed output (the bilateral
    path) can do that. multi-party §9 rejected periodic agent heartbeats; the
    grep audit (AC-011) enforces this.
  - >
    Cross-repo batching: this story touches packages/relay (trustless-cello) and
    packages/protocol-types + packages/transport + packages/daemon +
    packages/client (cello-client). Batch the relay change with the other pending
    directory/relay M7 changes per COORDINATION.md before any pipeline push. Never
    push relay changes alone — the directory/relay pipeline is 25-30 minutes.

