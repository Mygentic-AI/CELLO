description: >
  Measures peer↔peer SESSION-PATH liveness — "is the counterparty alive?" — on
  the component that actually carries the session, NEVER the directory. For a
  queue/relay-fallback session the relay is the authority (it holds the
  recipient's standing connection for content-queue notify/pull and observes
  connect/disconnect directly); for a direct session the peer↔peer session-node
  connection is the authority (the client must finally ACT on onPeerDisconnect,
  plus a transport keepalive so silent death is detected). The observed liveness
  maps to the attestation enum — connection-alive-but-silent = DELIVERED (busy,
  never sealed ABSENT); connection-gone = ABSENT — and that verdict GATES the
  unilateral-seal ABSENT decision: a peer that is alive-but-busy must never be
  sealed ABSENT. Honest limit, specced explicitly: liveness proves the
  NODE/software is up, not that the agent is engaging or will respond (DELIVERED
  vs Active). NO periodic agent heartbeat is introduced — that mechanism was
  considered and rejected (multi-party §9); last_seen_seq carries engagement as
  a byproduct of responding.
