topics: [seal, seal-certificate, receipt-not-assent, content-frontier, last-seen-seq, attestation, legibility, malicious-tail, live-vs-recovered, notarization, m7]
status: draft
description: >
  Makes the seal certificate honest and legible about what it attests. The
  certificate gains four first-class, machine-readable properties: (1) a
  "receipt, not assent" property stating that a signature attests faithful
  receipt + integrity + ordering of the transcript and NEVER agreement to its
  contents; (2) a per-party content-frontier (the highest counterparty sequence
  number each party provably received, derived from the signed last_seen_seq);
  (3) a per-attestation live-vs-recovered marker; and (4) a "final message
  unanswered" indicator. Net effect: any reader — human, agent, or arbitrator —
  can determine from the certificate alone exactly what each party provably
  received versus merely had delivered, and that no signature implies agreement.
  This holds across full-bilateral, present-party-sealed-tail,
  absent-party-recovered, and never-returned cases.
