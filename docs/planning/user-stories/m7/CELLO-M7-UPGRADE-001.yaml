status: draft
description: >
  Promotes a unilateral seal to bilateral when the previously-ABSENT party
  returns. The returning party recovers AND verifies the content behind every
  leaf in the sealed tree (content possession is the precondition — a party may
  not co-sign a tree it cannot read), signs ONE new Ed25519 ack/SEAL leaf over the
  already-sealed root with its own node's key, and the directory records its
  attestation and writes an APPEND-ONLY SUPERSEDING SealNotarization row marking
  the seal BILATERAL — never mutating the unilateral row. Reverses
  PERSIST-015 SI-002 (a unilateral seal MAY now be supplemented) and inverts its
  test. Disagreement is handled per POSTMORTEM D-3: refuse ONLY on unverifiability
  (content unrecoverable, or recovered content's hash ≠ committed content_hash =
  tamper) — never on disagreement with the message's claims. This is POSTMORTEM
  Workstream C.
