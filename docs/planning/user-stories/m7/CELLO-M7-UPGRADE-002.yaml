topics: [seal, auto-acknowledge, responder-seal, counterparty-closing, verifiability-gate, no-agent-prompt, bilateral-seal, daemon, m7]
status: draft
description: >
  Replaces the agent-mediated responder seal with verifiability-gated node
  auto-co-sign. Today, when A submits its SEAL control leaf, B's node flips to
  'sealing' and enqueues a counterparty_closing event, then waits for B's AGENT to
  call cello_close_session — a pure-ceremony round-trip that becomes a robustness
  seam (slow/busy/crashed agent → A's ceremony times out → unilateral). This story
  makes B's OWN node auto-co-sign the responder SEAL leaf the moment it ingests A's
  SEAL control leaf AND has verified the content, with NO agent prompt;
  counterparty_closing becomes informational. The auto-sign is verifiability-gated:
  B auto-signs only what it can verify; if B is desynced or the content cross-check
  fails, it does NOT auto-sign and surfaces to the agent. Non-negotiable: B's
  signature is ALWAYS produced by B's own node — never the directory, the peer, or
  anyone else. This is POSTMORTEM Workstream E (C-5).
