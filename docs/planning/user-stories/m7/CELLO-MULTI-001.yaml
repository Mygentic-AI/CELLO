# ─── Identity ───────────────────────────────────────────────
id: CELLO-MULTI-001
domain: MULTI
milestone: M7
actor: AGENT_OPERATOR
priority: P0
components:
  - connect

# ─── Intent ─────────────────────────────────────────────────
story: >
  As an agent operator,
  I want my K_local keys stored in a named directory structure
  (`~/.cello/agents/<name>/key`) so that the MCP server can load
  multiple named agent identities at startup, and legacy single-key
  installations continue working without migration.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When the MCP server starts and `~/.cello/agents/` directory exists"
    action: "the server discovers all subdirectories, each treated as a named
      agent; the subdirectory name is the agent's display name; each subdirectory
      contains a `key` file in the existing 37-byte FileKeyProvider format
      (magic 4 + version 1 + seed 32)"

  - trigger: "When the MCP server starts and `~/.cello/agents/` does NOT exist
    but `~/.cello/key` exists"
    action: "the server treats the legacy key file as an agent named `default`;
      behavior is identical to a single `~/.cello/agents/default/key` file;
      no file migration occurs automatically"

  - trigger: "When neither `~/.cello/agents/` nor `~/.cello/key` exists"
    action: "the server starts with zero registered agents; `cello_list_agents`
      returns an empty list; `cello_status` reports no agents available"

  - trigger: "When the MCP server starts with `~/.cello/agents/<name>/` present"
    action: "the agent's SQLCipher database is expected at
      `~/.cello/agents/<name>/client.db`; this is the DB path convention for
      all named agents; if the file does not yet exist it is created on first
      startup (PERSIST-024 first-install path)"

  - trigger: "When the MCP server starts in legacy mode (`~/.cello/key` only)"
    action: "the SQLCipher database for the implicit `default` agent is resolved
      from the `CELLO_DB_PATH` environment variable if set, otherwise defaults
      to `~/.cello/client.db`; this matches the DEMO-001 deployment convention
      and requires no migration"

  - trigger: "When `cello_register` completes successfully for a named agent"
    action: "the agent's key file is persisted at `~/.cello/agents/<name>/key`
      with 0o700 directory permissions and 0o600 file permissions; `~/.cello/`
      and `~/.cello/agents/` are also created with 0o700 if they do not exist"

  - trigger: "When the MCP server scans subdirectory names under `~/.cello/agents/`"
    action: "each name is validated against the pattern `[a-z0-9][a-z0-9_-]{0,62}`;
      uppercase letters are rejected because macOS HFS+ is case-insensitive by
      default — `Alice` and `alice` map to the same directory on macOS, so
      allowing mixed case would produce silent name collisions on the most common
      development platform; the lowercase-only restriction is enforced at both
      discovery time and at `cello_register` write time; subdirectories that fail
      validation are skipped and `agent.storage.skipped` is logged"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "A temporary directory used as the config root (via CELLO_CONFIG_DIR
      env override) containing `agents/alice/key` and `agents/bob/key`, each with
      valid 37-byte key files"
    when: "the MCP server starts"
    then: "both `alice` and `bob` appear in `cello_list_agents` as registered agents;
      AND `agent.storage.discovered` is logged at INFO once for each agent, with
      `agentName` and `keyPath` matching the test directory paths"
    test_type: integration
    component_under_test: connect

  - id: AC-002
    given: "No `agents/` directory exists in the config root but a legacy `key` file
      exists with a valid 37-byte key"
    when: "the MCP server starts"
    then: "an agent named `default` appears in `cello_list_agents` as a registered
      agent; its public key matches the legacy key file; AND `agent.storage.legacy_compat`
      is logged at INFO with `keyPath` matching the legacy file path"
    test_type: integration
    component_under_test: connect

  - id: AC-003
    given: "Neither `agents/` nor a legacy `key` file exists in the config root"
    when: "the MCP server starts"
    then: "the server starts successfully; `cello_list_agents` returns an empty list;
      no error is thrown"
    test_type: integration
    component_under_test: connect

  - id: AC-004
    given: "A key file at `agents/mallory/key` with invalid magic bytes in the config root"
    when: "the MCP server starts"
    then: "the `agent.storage.skipped` event is logged at WARN with `agentName: 'mallory'`,
      `keyPath` matching the file, and `reason` indicating invalid magic bytes;
      `mallory` does NOT appear in `cello_list_agents`; other valid agents load normally"
    test_type: integration
    component_under_test: connect

  - id: AC-005
    given: "A temporary config root directory with no pre-existing files (via
      CELLO_CONFIG_DIR override)"
    when: "an agent registers with name `my-agent` via `cello_register`"
    then: "`<config-root>/agents/my-agent/key` exists with 37 bytes; the directory
      has permissions 0o700; the file has permissions 0o600; `<config-root>/` and
      `<config-root>/agents/` were also created with 0o700 permissions"
    test_type: integration
    component_under_test: connect

  - id: AC-006
    given: "The `CELLO_KEY_FILE` environment variable is set to a custom path"
    when: "the MCP server starts"
    then: "the env var is ignored if `agents/` exists in the config root (regardless
      of whether it is empty — the presence of the directory signals that the new
      convention is in use); if `agents/` does NOT exist, the env var path is treated
      as the `default` agent (same as legacy `~/.cello/key` behavior)"
    test_type: integration
    component_under_test: connect

  - id: AC-007
    given: "An `agents/` directory containing subdirectories with invalid names:
      `Alice` (uppercase), `my agent` (space), `_bad` (leading underscore)"
    when: "the MCP server starts"
    then: "all three subdirectories are skipped; `agent.storage.skipped` is logged
      at WARN for each; none appear in `cello_list_agents`; the reason field
      identifies each as a name validation failure"
    test_type: unit
    component_under_test: connect

  - id: AC-008
    given: "An `agents/alice/` directory exists with a valid `key` file in the
      config root"
    when: "the MCP server starts"
    then: "the server resolves the SQLCipher database path for `alice` as
      `<config-root>/agents/alice/client.db`; `CELLO_DB_PATH` env var is ignored
      when `agents/` directory is present"
    test_type: integration
    component_under_test: connect

  - id: AC-009
    given: "No `agents/` directory exists; a legacy `key` file exists;
      `CELLO_DB_PATH=/custom/path/agent.db` is set in the environment"
    when: "the MCP server starts in legacy mode"
    then: "the `default` agent's SQLCipher database is opened at
      `/custom/path/agent.db`; if `CELLO_DB_PATH` is not set, the fallback
      is `<config-root>/client.db`"
    test_type: integration
    component_under_test: connect

  - id: AC-010
    given: "A call to `cello_register` with `name: 'Alice'` (uppercase) or any
      name not matching `[a-z0-9][a-z0-9_-]{0,62}`"
    when: "cello_register executes"
    then: "an error is returned describing the invalid name; no key file is created;
      no directory is created under `agents/`"
    test_type: integration
    component_under_test: connect

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "Key files must be 0o600; key file parent directories must be 0o700;
      `~/.cello/agents/` itself must be 0o700; `~/.cello/` itself must be 0o700 —
      no directory in the path may be world-readable"
    adversarial_condition: "on a shared machine, other users cannot read agent key
      material OR enumerate which agent names exist via filesystem permissions;
      a world-readable `~/.cello/agents/` would leak agent names even when key
      files are 0o600"
    test_type: integration
    component_under_test: connect

  - id: SI-002
    statement: "A corrupted or malformed key file must never cause the server to
      expose partial key material or crash — it must be skipped gracefully"
    adversarial_condition: "an attacker who can write arbitrary bytes to the
      agents directory cannot crash the server or cause it to leak key data
      from other valid agents"
    test_type: integration
    component_under_test: connect

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: agent.storage.discovered
      level: info
      trigger: "Once per valid agent found during startup scan"
      context_fields: [agentName, keyPath]
      correlationId: false
    - name: agent.storage.skipped
      level: warn
      trigger: "When a subdirectory is skipped (invalid name, bad key, read error)"
      context_fields: [agentName, keyPath, reason]
      correlationId: false
    - name: agent.storage.legacy_compat
      level: info
      trigger: "When falling back to legacy ~/.cello/key at startup"
      context_fields: [keyPath]
      correlationId: false
  error_events:
    - name: agent.storage.read_error
      level: error
      trigger: "When a key file cannot be read (permissions, IO error)"
      context_fields: [agentName, keyPath, error]
      correlationId: false
  notes: >
    The four event names (agent.storage.discovered, agent.storage.skipped,
    agent.storage.legacy_compat, agent.storage.read_error) must be added to
    the canonical event taxonomy in
    docs/planning/discussion_logs/2026-05-16_0753_development-pipeline-and-local-iteration.md
    by the implementer of this story.
  alarms: []

# ─── Implementation Notes ──────────────────────────────────
implementation_notes: >
  FileKeyProvider in packages/crypto/src/ed25519.ts (lines 45-126) already
  handles the 37-byte format. This story adds a discovery layer above it —
  scanning a directory and creating one FileKeyProvider per valid subdirectory.
  The discovery logic lives in @cello-protocol/connect (packages/adapter-claude-code/),
  not in the crypto package. The crypto package gains no new public API.

  All integration ACs use CELLO_CONFIG_DIR to point at a temp directory — they
  must not create or touch the real ~/.cello/ on the test runner's machine.
  MULTI-002 reads the DB path from whatever convention this story establishes —
  the two stories must use the same resolution logic.

