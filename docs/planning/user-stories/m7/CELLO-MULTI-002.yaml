# ─── Identity ───────────────────────────────────────────────
id: CELLO-MULTI-002
domain: MULTI
milestone: M7
actor: AGENT_OPERATOR
priority: P0
components:
  - connect
  - client

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the MCP server,
  I want to manage a registry of CelloClient instances (one per named agent)
  with independent libp2p nodes so that multiple agents can be online
  simultaneously without sharing transport or identity state.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When the MCP server starts with N discovered agents"
    action: "a `Map<string, AgentEntry>` is created where AgentEntry holds:
      name (string), keyProvider (FileKeyProvider), client (CelloClient | null),
      state ('registered' | 'online' | 'current'); all agents begin in
      'registered' state with client = null"

  - trigger: "When the MCP server starts and exactly one agent is discovered"
    action: "that agent is automatically started (CelloClient instantiated,
      libp2p node started, directory connection established); the agent
      transitions to 'online'; MULTI-003 per-connection state automatically
      sets this agent as current for any new MCP connection; the registry
      sets an `autoStartedSingleAgent` flag that MULTI-003 reads"

  - trigger: "When `cello_start_agent(name)` is called for a registered agent"
    action: "the composition root performs the full PERSIST-024 startup sequence
      for that agent in order: (1) read the agent's K_local seed from key_file_path;
      (2) derive db_key = HKDF(seed, info='cello-db-key') using the same derivation
      as the current cello-mcp.ts composition root; (3) open the agent's SQLCipher
      store at the path resolved by MULTI-001's DB path convention; (4) construct
      ClientStatePersistence(store); (5) call client.loadPersistedState(persistence)
      BEFORE any MCP tool call is routed to it; (6) instantiate a new CelloClient
      with its own libp2p node (own Peer ID, own transport key, own listen
      addresses); (7) connect to the directory; the agent transitions to 'online'
      state; skipping any step in this sequence causes registered agents to appear
      as unregistered on every startup — this is the exact regression PERSIST-024
      fixed for single-agent mode; AC-008 is the regression test that enforces it"

  - trigger: "When `cello_stop_agent(name)` is called for an online agent"
    action: "the agent's CelloClient is shut down (all sessions closed,
      libp2p node stopped); the agent transitions back to 'registered' state;
      the Map entry is retained with client = null"

  - trigger: "When the MCP server process shuts down"
    action: "all online agents are stopped gracefully in parallel; libp2p
      nodes are stopped; no state is lost (sessions that were open will need
      re-establishment on next startup)"

  - trigger: "When multi-connection tests are written for this story"
    action: "AC-001, AC-004, AC-006, and any test requiring two independent MCP
      connections in the same process must use InMemoryTransport pairs from the
      MCP SDK — not stdio; with stdio there is only one connection per process;
      InMemoryTransport allows two independent client/server pairs to share the
      same AgentRegistry in the same test process, producing observable
      per-connection routing differences"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "Two agents `alice` and `bob` discovered at startup; two independent
      MCP connections established via InMemoryTransport pairs"
    when: "`cello_start_agent('alice')` then `cello_start_agent('bob')` are called"
    then: "both agents have independent CelloClient instances; each has a
      distinct libp2p Peer ID (`alice.peerId !== bob.peerId`); both report
      state 'online'; `agent.lifecycle.started` is logged at INFO for each
      agent with `agentName` and `peerId` fields"
    test_type: integration
    component_under_test: connect

  - id: AC-002
    given: "Agent `alice` is online"
    when: "`cello_stop_agent('alice')` is called"
    then: "alice's libp2p node is stopped (`node.isStarted()` returns false);
      alice's multiaddrs are no longer advertised; any sessions that were open
      are closed; alice transitions to 'registered'; `agent.lifecycle.stopped`
      is logged at INFO with `agentName: 'alice'`"
    test_type: integration
    component_under_test: connect

  - id: AC-003
    given: "Agent `alice` is online"
    when: "`cello_start_agent('alice')` is called again"
    then: "the call returns an error indicating the agent is already online;
      the agent's state is unchanged"
    test_type: unit
    component_under_test: connect

  - id: AC-004
    given: "No agent named `ghost` exists in the registry"
    when: "`cello_start_agent('ghost')` is called"
    then: "the call returns an error: 'Agent not found: ghost. Available
      agents: alice, bob'"
    test_type: unit
    component_under_test: connect

  - id: AC-005
    given: "Two agents `alice` and `bob` are both online"
    when: "the process receives SIGTERM"
    then: "both agents are stopped gracefully (libp2p nodes stopped, no
      unhandled promise rejections); process exits cleanly within 5 seconds"
    test_type: integration
    component_under_test: connect

  - id: AC-006
    given: "Agents `alice` and `bob` are both online; two independent MCP
      connections established via InMemoryTransport pairs"
    when: "a real libp2p message is sent from a third node to alice's Peer ID"
    then: "alice's CelloClient receives the message; bob's CelloClient receive
      queue is empty — proving the two clients are fully isolated with no
      shared state between CelloClient instances"
    test_type: integration
    component_under_test: connect
    notes: "Uses a real libp2p send (not a direct internal enqueue) so that
      the test verifies isolation via transport routing, not just constructor
      independence. A direct queue write would not catch a shared-session-map bug."

  - id: AC-007
    given: "Agent `alice` is registered (not online)"
    when: "`cello_stop_agent('alice')` is called"
    then: "the call returns an error indicating the agent is not online;
      the agent's state is unchanged"
    test_type: unit
    component_under_test: connect

  - id: AC-008
    given: "Agent `alice` was previously registered via a real DKG ceremony
      (the fixture must complete a live DKG so that a real LocalShare with
      real Uint8Array fields is written to alice's SQLCipher DB — do NOT
      insert a raw bytes row directly); the process was restarted"
    when: "`cello_start_agent('alice')` is called"
    then: "alice's CelloClient reports `registered: true`; `cello_status` for
      alice shows `registered: true`, `directory_reachable: true`; no new DKG
      ceremony is attempted; this proves that `loadPersistedState()` ran and
      the FROST share was deserialized from the SQLCipher DB and is functional
      — verified by alice successfully initiating a session (which requires
      signing with the loaded share, not just asserting the registered flag)"
    test_type: integration
    component_under_test: connect
    notes: "The precondition (real DKG ceremony) is mandatory. A test that
      inserts raw bytes into frost_key_shares and checks registered:true is
      testing the byte round-trip only — it does not verify that the
      deserialized LocalShare can actually be used for signing. This is the
      PERSIST-005 pattern that let Uint8Array corruption through. The
      verification step (initiating a session) is the use-after-load check."

  - id: AC-009
    given: "Two agents `alice` and `bob` each have separate SQLCipher databases;
      both databases have active sessions and connection records"
    when: "the MCP server starts and starts both agents"
    then: "alice's CelloClient is opened with alice's db_key (derived from
      alice's K_local seed); bob's CelloClient is opened with bob's db_key;
      alice cannot read bob's database (keys are independent); both agents
      load their respective persisted state independently"
    test_type: integration
    component_under_test: connect

  - id: AC-010
    given: "The MCP server starts with one or more agents"
    when: "startup discovery completes"
    then: "`agent.registry.initialized` is logged at INFO with `agentCount`
      and `agentNames` fields"
    test_type: integration
    component_under_test: connect

  - id: AC-011
    given: "`cello_start_agent` is called for a valid registered agent"
    when: "the startup sequence fails at any step (DB open failure, libp2p
      start failure, directory connection failure)"
    then: "`agent.lifecycle.start_failed` is logged at ERROR with `agentName`,
      `phase` (one of: 'db_open', 'state_load', 'libp2p_start', 'directory_connect'),
      and `error` fields; the agent remains in 'registered' state; no partial
      state is left in the registry"
    test_type: integration
    component_under_test: connect

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "Each CelloClient instance must have cryptographic isolation —
      alice's KeyProvider is never accessible from bob's client instance"
    adversarial_condition: "a message handler executing on alice's CelloClient
      cannot retrieve bob's KeyProvider through the AgentRegistry or any shared
      reference; verified by asserting that alice's KeyProvider reference is
      unreachable from bob's client instance in the registry Map"
    test_type: unit
    component_under_test: connect

  - id: SI-002
    statement: "libp2p nodes must use independent transport keys — no shared
      Noise session keys between agents"
    adversarial_condition: "each CelloClient is instantiated with a distinct
      `createNode()` call producing a unique libp2p Peer ID and independent
      Noise keypair; verified by asserting `alice.peerId !== bob.peerId` and
      that both Peer IDs differ from any previously seen Peer ID in the test"
    test_type: integration
    component_under_test: connect

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: agent.registry.initialized
      level: info
      trigger: "Once at startup after discovery completes"
      context_fields: [agentCount, agentNames]
      correlationId: false
    - name: agent.lifecycle.started
      level: info
      trigger: "When an agent transitions to online state"
      context_fields: [agentName, peerId, startupCorrelationId]
      correlationId: true
    - name: agent.lifecycle.stopped
      level: info
      trigger: "When an agent transitions back to registered state"
      context_fields: [agentName, reason]
      correlationId: false
    - name: agent.registry.auto_started
      level: info
      trigger: "When the single-agent auto-start convenience path runs at startup"
      context_fields: [agentName]
      correlationId: false
  error_events:
    - name: agent.lifecycle.start_failed
      level: error
      trigger: "When a CelloClient fails to initialize at any startup phase"
      context_fields: [agentName, phase, error]
      correlationId: true
  notes: >
    agent.lifecycle.started and agent.lifecycle.start_failed carry a
    startupCorrelationId minted at the start of the cello_start_agent call
    so that all sub-events in the startup sequence (db_open, state_load,
    libp2p_start, directory_connect) can be correlated in the log stream.

    The five event names (agent.registry.initialized, agent.lifecycle.started,
    agent.lifecycle.stopped, agent.registry.auto_started,
    agent.lifecycle.start_failed) must be added to the canonical event taxonomy
    in docs/planning/discussion_logs/2026-05-16_0753_development-pipeline-and-local-iteration.md
    by the implementer of this story.
  alarms:
    - condition: "agent.lifecycle.start_failed fires more than once for the
        same agentName within a 60-second window"
      fires_to: "cello-agent-start-loop CloudWatch alarm"
      notes: "Indicates a startup crash loop — SQLCipher corruption, missing
        key file, or port conflict that does not self-resolve."

