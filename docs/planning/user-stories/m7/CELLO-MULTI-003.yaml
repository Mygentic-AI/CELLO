topics: [multi-agent, per-connection-state, cello-use-agent, mcp-server, connection-routing]
status: draft
description: Per-connection current-agent state and cello_use_agent switching — each MCP client connection independently tracks which agent is current without affecting other connections.
---
# ─── Identity ───────────────────────────────────────────────
id: CELLO-MULTI-003
domain: MULTI
milestone: M7
actor: AGENT_OPERATOR
priority: P0
components:
  - connect

# ─── Intent ─────────────────────────────────────────────────
story: >
  As an agent operator with multiple Claude Code sessions connected
  to the same MCP server,
  I want each connection to independently track which agent is "current"
  so that switching agents in one session does not affect my other sessions.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When a new MCP client connection is established"
    action: "the connection has no current agent; tool calls that require
      an agent identity return an error prompting the operator to call
      `cello_use_agent(name)`"

  - trigger: "When a new MCP client connection is established AND exactly
    one agent is online (the auto-started single-agent case from MULTI-002)"
    action: "that agent is automatically set as current for the connection;
      no explicit `cello_use_agent` call required; this is the single-agent
      convenience behavior; the MULTI-002 AgentRegistry `autoStartedSingleAgent`
      flag drives this — MULTI-003's connection handler reads that flag when
      wiring up a new connection"

  - trigger: "When `cello_use_agent(name)` is called on a connection"
    action: "the named agent becomes current for THIS connection only;
      if the connection already had a current agent, that agent remains
      online (it does not stop); the previous current agent is simply
      no longer current for this connection"

  - trigger: "When `cello_use_agent(name)` is called and the agent is not online"
    action: "the call returns an error: 'Agent <name> is not online.
      Call cello_start_agent(<name>) first.'"

  - trigger: "When two connections both call `cello_use_agent` with the same agent"
    action: "both connections route to the same CelloClient instance;
      messages sent from either connection use the same K_local and the same
      sessions; this is valid — multiple connections can share a current agent"

  - trigger: "When multi-connection tests are written for this story"
    action: "AC-001 and AC-004 require two independent MCP connections in the
      same test process; these must use InMemoryTransport pairs from the MCP SDK
      — not stdio; stdio supports only one connection per process; InMemoryTransport
      allows two independent client/server pairs to share the same server instance,
      producing observable per-connection state differences"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "Agents `alice` and `bob` are both online; two independent MCP
      connections established via separate InMemoryTransport pairs sharing the
      same server instance"
    when: "Connection 1 calls `cello_use_agent('alice')` and Connection 2
      calls `cello_use_agent('bob')`"
    then: "Connection 1's `cello_status` reports current agent is alice;
      Connection 2's `cello_status` reports current agent is bob;
      `connection.agent.switched` is logged at INFO for each switch with
      `connectionId`, `previousAgent` (null), and `newAgent` fields"
    test_type: integration
    component_under_test: connect

  - id: AC-002
    given: "Connection 1 has alice as current"
    when: "Connection 1 calls `cello_use_agent('bob')`"
    then: "Connection 1's current agent is now bob; alice remains online;
      Connection 1's `cello_list_agents` shows alice as 'online' and bob
      as 'current'"
    test_type: integration
    component_under_test: connect

  - id: AC-003
    given: "A new MCP connection with no current agent set, established via
      InMemoryTransport so the MCP dispatch path is exercised"
    when: "the connection calls `cello_send`"
    then: "the call returns an error: 'No current agent. Call
      cello_use_agent(name) to select an agent for this connection.';
      `connection.no_current_agent` is logged at WARN with `connectionId`
      and `toolName: 'cello_send'`"
    test_type: integration
    component_under_test: connect
    notes: "Must use InMemoryTransport (not a direct internal call) so that
      the guard is verified on the real MCP dispatch path, not on a bypassed
      internal function."

  - id: AC-004
    given: "Connection 1 has alice as current; Connection 2 has bob as current;
      both connections established via separate InMemoryTransport pairs"
    when: "Connection 1 calls `cello_use_agent('bob')`"
    then: "Connection 1 now routes to bob; Connection 2 STILL routes to bob;
      both connections share the same CelloClient for bob; alice remains online"
    test_type: integration
    component_under_test: connect

  - id: AC-005
    given: "Only one agent (`default`) exists and is online (auto-started by
      MULTI-002's single-agent convenience logic, `autoStartedSingleAgent` flag
      is true in the AgentRegistry)"
    when: "a new MCP connection is established"
    then: "the `default` agent is automatically set as current for the
      connection; `cello_status` on the new connection shows current agent
      is `default`; no explicit `cello_use_agent` call was made"
    test_type: integration
    component_under_test: connect

  - id: AC-006
    given: "Connection 1 has alice as current; connection established via
      InMemoryTransport"
    when: "Connection 1 disconnects (InMemoryTransport client closes)"
    then: "alice remains online; no state changes to the agent registry;
      other connections with alice as current are unaffected;
      `connection.closed` is logged at INFO with `connectionId` and
      `currentAgent: 'alice'`"
    test_type: integration
    component_under_test: connect

  - id: AC-007
    given: "`cello_use_agent('ghost')` is called where `ghost` is registered
      but not online"
    when: "the call executes"
    then: "the call returns an error: 'Agent ghost is not online.
      Call cello_start_agent(ghost) first.'; connection current agent is unchanged"
    test_type: unit
    component_under_test: connect

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "Per-connection state must not leak between connections —
      one connection cannot observe or modify another connection's
      current-agent selection"
    adversarial_condition: "the per-connection state Map<connectionId,
      { currentAgent: string | null }> is the only mechanism for routing
      tool calls; no global mutable state is accessible; verified by asserting
      that setting Connection 1's current agent via `cello_use_agent` does not
      change Connection 2's current agent, using two InMemoryTransport connections
      that share the same underlying AgentRegistry"
    test_type: unit
    component_under_test: connect

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: connection.agent.switched
      level: info
      trigger: "When a connection changes its current agent via cello_use_agent"
      context_fields: [connectionId, previousAgent, newAgent]
      correlationId: false
    - name: connection.established
      level: info
      trigger: "When a new MCP client connects"
      context_fields: [connectionId]
      correlationId: false
    - name: connection.closed
      level: info
      trigger: "When an MCP client disconnects"
      context_fields: [connectionId, currentAgent]
      correlationId: false
  error_events:
    - name: connection.no_current_agent
      level: warn
      trigger: "When a tool call requiring an agent identity is made with no
        current agent set on this connection"
      context_fields: [connectionId, toolName]
      correlationId: false
  notes: >
    The four event names (connection.agent.switched, connection.established,
    connection.closed, connection.no_current_agent) must be added to the
    canonical event taxonomy in
    docs/planning/discussion_logs/2026-05-16_0753_development-pipeline-and-local-iteration.md
    by the implementer of this story.

    No alarm threshold is specified: connection.no_current_agent is an expected
    UX event (new connection, user hasn't selected an agent yet). A high rate
    would indicate a UI/UX issue rather than a system failure.
  alarms: []

