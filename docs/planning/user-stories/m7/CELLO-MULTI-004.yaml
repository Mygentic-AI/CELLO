# ─── Identity ───────────────────────────────────────────────
id: CELLO-MULTI-004
domain: MULTI
milestone: M7
actor: AGENT_OPERATOR
priority: P0
components:
  - connect

# ─── Intent ─────────────────────────────────────────────────
story: >
  As an agent operator,
  I want MCP tools to list all agents and their states, bring agents online,
  and take agents offline so that I can manage agent lifecycle without
  restarting the MCP server.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When `cello_list_agents` is called"
    action: "returns an array of objects: { name: string, state: 'registered' |
      'online' | 'current', pubkey: string | null } for every agent in the
      registry; pubkey is the hex-encoded K_local public key (null if key
      failed to load); the 'current' state reflects the calling connection's
      current agent"

  - trigger: "When `cello_start_agent(name)` is called for a registered agent"
    action: "the agent's CelloClient is created, libp2p node started, directory
      connection established; agent transitions to 'online'; returns
      { started: true, name, pubkey: '<hex>', peerId: '<peerID>' }"

  - trigger: "When `cello_stop_agent(name)` is called for an online agent"
    action: "cello_stop_agent sends a SEAL control leaf to all open sessions
      and waits up to 5 seconds for directory acknowledgement; if the
      counterparty is unreachable or the timeout expires, the session
      transitions to 'seal_deferred'; the CelloClient is shut down; the
      libp2p node is stopped; the agent transitions to 'registered'; returns
      { stopped: true, name, sessionsClosedCount, sessionsDeferredCount };
      the 5-second stop timeout is intentionally shorter than the seal-frost-timeout
      (15 seconds) — operator-driven stop is time-bounded for responsiveness,
      whereas autonomous seal waits longer for ceremony completion"

  - trigger: "When `cello_stop_agent(name)` is called for an agent that is
    current for one or more connections"
    action: "the per-connection state layer (MULTI-003) clears currentAgent to
      null for each affected connection; subsequent tool calls on those
      connections return the 'no current agent' error until a new agent is
      selected via cello_use_agent"

  - trigger: "When `cello_stop_agent` is called from any connection regardless
    of which agent is current on that connection"
    action: "the operation is permitted — there is no per-connection authorization
      constraint; any operator connection can stop any agent; this is a
      deliberate single-operator model decision (no multi-tenant concern in M7);
      the security invariant is that the stop must not expose private key material
      from any agent, including the one being stopped"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "Three agents discovered at startup: alice (online), bob (registered),
      carol (online, current for this connection)"
    when: "`cello_list_agents` is called"
    then: "returns [
      { name: 'alice', state: 'online', pubkey: '<hex>' },
      { name: 'bob', state: 'registered', pubkey: '<hex>' },
      { name: 'carol', state: 'current', pubkey: '<hex>' }
    ] sorted alphabetically by name; AND `tool.list_agents.called` is logged
    at DEBUG with `agentCount: 3`"
    test_type: integration
    component_under_test: connect

  - id: AC-002
    given: "Agent `bob` is registered (not online)"
    when: "`cello_start_agent('bob')` is called"
    then: "return value contains `{ started: true, name: 'bob', pubkey: '<hex>',
      peerId: '<peerID>' }`; bob's state is 'online' in `cello_list_agents`;
      bob's libp2p node is listening on at least one multiaddr
      (`bob.libp2p.getMultiaddrs().length > 0`); AND `tool.start_agent.success`
      is logged at INFO with `agentName: 'bob'` and `peerId` fields"
    test_type: integration
    component_under_test: connect

  - id: AC-003
    given: "Agent `alice` is online with 2 active sessions: session S1 with a
      reachable peer (bob's libp2p node running), and session S2 with an
      unreachable peer (charlie's libp2p node stopped BEFORE cello_stop_agent
      is called, so the SEAL attempt to charlie times out after 5 seconds)"
    when: "`cello_stop_agent('alice')` is called"
    then: "cello_stop_agent sends SEAL to both sessions; S1 seals cleanly
      (sessionsClosedCount = 1); S2 times out after 5 seconds and transitions
      to 'seal_deferred' (sessionsDeferredCount = 1); alice transitions to
      registered; return value is `{ stopped: true, name: 'alice',
      sessionsClosedCount: 1, sessionsDeferredCount: 1 }`; the call returns
      within 6 seconds total (5s seal timeout + 1s margin — if this regresses
      toward the 15-second FROST seal timeout, this assertion catches it); AND
      `tool.stop_agent.success` is logged at INFO with `agentName: 'alice'`,
      `sessionsClosedCount: 1`, and `sessionsDeferredCount: 1`"
    test_type: integration
    component_under_test: connect
    notes: "To produce sessionsDeferredCount > 0, charlie's libp2p node must
      be stopped BEFORE calling cello_stop_agent — this makes charlie
      unreachable so the SEAL times out. Without this explicit setup,
      both sessions would seal cleanly and sessionsDeferredCount would
      always be 0, making the deferred path untested."

  - id: AC-004
    given: "Only one agent `default` exists"
    when: "`cello_list_agents` is called"
    then: "returns a single entry; if the server auto-started it (single-agent
      convenience), state is 'current'"
    test_type: integration
    component_under_test: connect

  - id: AC-005
    given: "Agent `alice` is online"
    when: "`cello_start_agent('alice')` is called"
    then: "returns an error: { error: 'Agent alice is already online' }"
    test_type: unit
    component_under_test: connect

  - id: AC-006
    given: "No agent named `ghost` exists"
    when: "`cello_start_agent('ghost')` is called"
    then: "returns an error: { error: 'Agent not found: ghost',
      available: ['alice', 'bob', 'carol'] }; AND `tool.start_agent.failed`
      is logged at WARN with `agentName: 'ghost'` and `error` fields"
    test_type: unit
    component_under_test: connect

  - id: AC-007
    given: "Agent `alice` is current for Connection 1; two connections
      established via InMemoryTransport pairs"
    when: "`cello_stop_agent('alice')` is called from any connection"
    then: "alice transitions to registered; Connection 1's current agent
      becomes null; subsequent tool calls on Connection 1 return the
      'no current agent' error until a new agent is selected via
      `cello_use_agent`"
    test_type: integration
    component_under_test: connect

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "cello_list_agents must never expose private key material —
      only the public key hex"
    adversarial_condition: "a test constructs an AgentRegistry with a loaded
      agent whose K_local seed is known; calls cello_list_agents and JSON-serializes
      the full tool response; asserts that the private key seed bytes are absent
      from the serialized output — verified by checking that the response contains
      no byte sequence matching the 32-byte seed"
    test_type: unit
    component_under_test: connect

  - id: SI-002
    statement: "cello_stop_agent must not expose private key material from
      the stopped agent — the return value and all log events must contain
      only public identifiers"
    adversarial_condition: "a test stops an agent whose K_local seed is known;
      captures the tool return value and all log events emitted during the stop;
      asserts that neither the return value nor any log event context contains
      byte sequences matching the agent's 32-byte private key seed"
    test_type: unit
    component_under_test: connect

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: tool.list_agents.called
      level: debug
      trigger: "On each cello_list_agents invocation"
      context_fields: [connectionId, agentCount]
      correlationId: false
    - name: tool.start_agent.success
      level: info
      trigger: "When an agent successfully transitions to online"
      context_fields: [agentName, peerId]
      correlationId: false
    - name: tool.stop_agent.success
      level: info
      trigger: "When an agent is successfully taken offline"
      context_fields: [agentName, sessionsClosedCount, sessionsDeferredCount]
      correlationId: false
  error_events:
    - name: tool.start_agent.failed
      level: warn
      trigger: "When cello_start_agent fails (agent not found, already online,
        startup error)"
      context_fields: [agentName, error]
      correlationId: false
    - name: tool.stop_agent.failed
      level: warn
      trigger: "When cello_stop_agent fails (agent not found, not online)"
      context_fields: [agentName, error]
      correlationId: false
  notes: >
    The tool.* prefix is new — these five event names must be added to the
    canonical event taxonomy in
    docs/planning/discussion_logs/2026-05-16_0753_development-pipeline-and-local-iteration.md
    by the implementer of this story.

    No alarm thresholds for M7: cello_stop_agent and cello_start_agent are
    operator-driven lifecycle operations. Failures are immediately visible in
    the tool return value. Alarm thresholds for agent lifecycle health are
    deferred to a post-M7 operations story.
  alarms: []

# ─── Interface Changes ──────────────────────────────────────
interface_changes: >
  `seal_deferred` must be added to the `SessionStatus` union in
  `packages/client/src/types.ts` if it is not already present. It represents
  a session where a SEAL was attempted but the counterparty was unreachable —
  the session record is retained but the SEAL did not complete. MULTI-006 and
  MULTI-008 assume this value exists. Verify before implementing:
    grep -n "seal_deferred" packages/client/src/types.ts
  If absent, add it to the union before writing any implementation code.

  `cello_stop_agent` initiates session sealing via a new CelloClient method:
    sealAllSessions(timeoutMs: number): Promise<{ sealed: string[]; deferred: string[] }>
  This method sends a SEAL control leaf to every open session, waits up to
  timeoutMs for acknowledgement, and returns lists of session IDs that sealed
  cleanly vs. timed out. MULTI-004 calls it with timeoutMs = 5000. Add this
  method to the `CelloClient` interface in `packages/interfaces/`.

