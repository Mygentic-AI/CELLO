# ─── Identity ───────────────────────────────────────────────
id: CELLO-MULTI-004
domain: MULTI
milestone: M7
actor: AGENT_OPERATOR
priority: P0
components:
  - connect

# ─── Intent ─────────────────────────────────────────────────
story: >
  As an agent operator,
  I want MCP tools to list all agents and their states, bring agents online,
  and take agents offline so that I can manage agent lifecycle without
  restarting the MCP server.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When `cello_list_agents` is called"
    action: "returns an array of objects: { name: string, state: 'registered' |
      'online' | 'current', pubkey: string | null } for every agent in the
      registry; pubkey is the hex-encoded K_local public key (null if key
      failed to load); the 'current' state reflects the calling connection's
      current agent"

  - trigger: "When `cello_start_agent(name)` is called for a registered agent"
    action: "the agent's CelloClient is created, libp2p node started, directory
      connection established; agent transitions to 'online'; returns
      { started: true, name, pubkey: '<hex>', peerId: '<peerID>' }"

  - trigger: "When `cello_stop_agent(name)` is called for an online agent"
    action: "cello_stop_agent sends a SEAL control leaf to all open sessions
      and waits up to 5 seconds for directory acknowledgement; if the
      counterparty is unreachable or the timeout expires, the session
      transitions to 'seal_deferred'; the CelloClient is shut down; the
      libp2p node is stopped; the agent transitions to 'registered'; returns
      { stopped: true, name, sessionsClosedCount, sessionsDeferredCount }"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "Three agents discovered at startup: alice (online), bob (registered),
      carol (online, current for this connection)"
    when: "`cello_list_agents` is called"
    then: "returns [
      { name: 'alice', state: 'online', pubkey: '<hex>' },
      { name: 'bob', state: 'registered', pubkey: '<hex>' },
      { name: 'carol', state: 'current', pubkey: '<hex>' }
    ] sorted alphabetically by name"
    test_type: integration
    component_under_test: connect

  - id: AC-002
    given: "Agent `bob` is registered (not online)"
    when: "`cello_start_agent('bob')` is called"
    then: "return value contains `{ started: true, name: 'bob', pubkey: '<hex>',
      peerId: '<peerID>' }`; bob's state is 'online' in `cello_list_agents`;
      bob's libp2p node is listening on at least one multiaddr
      (`bob.libp2p.getMultiaddrs().length > 0`)"
    test_type: integration
    component_under_test: connect

  - id: AC-003
    given: "Agent `alice` is online with 2 active sessions: session S1 with a
      reachable peer (bob's libp2p node running), and session S2 with an
      unreachable peer (charlie's libp2p node stopped BEFORE cello_stop_agent
      is called, so the SEAL attempt to charlie times out after 5 seconds)"
    when: "`cello_stop_agent('alice')` is called"
    then: "cello_stop_agent sends SEAL to both sessions; S1 seals cleanly
      (sessionsClosedCount = 1); S2 times out after 5 seconds and transitions
      to 'seal_deferred' (sessionsDeferredCount = 1); alice transitions to
      registered; return value is `{ stopped: true, name: 'alice',
      sessionsClosedCount: 1, sessionsDeferredCount: 1 }`"
    test_type: integration
    component_under_test: connect
    notes: "To produce sessionsDeferredCount > 0, charlie's libp2p node must
      be stopped BEFORE calling cello_stop_agent — this makes charlie
      unreachable so the SEAL times out. Without this explicit setup,
      both sessions would seal cleanly and sessionsDeferredCount would
      always be 0, making the deferred path untested."

  - id: AC-004
    given: "Only one agent `default` exists"
    when: "`cello_list_agents` is called"
    then: "returns a single entry; if the server auto-started it (single-agent
      convenience), state is 'current'"
    test_type: integration
    component_under_test: connect

  - id: AC-005
    given: "Agent `alice` is online"
    when: "`cello_start_agent('alice')` is called"
    then: "returns an error: { error: 'Agent alice is already online' }"
    test_type: unit
    component_under_test: connect

  - id: AC-006
    given: "No agent named `ghost` exists"
    when: "`cello_start_agent('ghost')` is called"
    then: "returns an error: { error: 'Agent not found: ghost',
      available: ['alice', 'bob', 'carol'] }"
    test_type: unit
    component_under_test: connect

  - id: AC-007
    given: "Agent `alice` is current for Connection 1"
    when: "`cello_stop_agent('alice')` is called from any connection"
    then: "alice transitions to registered; Connection 1's current agent
      becomes null; subsequent tool calls on Connection 1 return the
      'no current agent' error until a new agent is selected via
      `cello_use_agent`"
    test_type: integration
    component_under_test: connect

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "cello_list_agents must never expose private key material —
      only the public key hex"
    adversarial_condition: "even if the tool response is logged or displayed,
      no private key bytes are exposed"
    test_type: unit
    component_under_test: connect

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: tool.list_agents.called
      level: DEBUG
      fields: [connectionId, agentCount]
      context: "Emitted on each list_agents invocation (DEBUG — high-frequency
        during normal operation)"
    - name: tool.start_agent.success
      fields: [agentName, peerId]
      context: "Emitted when an agent successfully comes online"
    - name: tool.stop_agent.success
      fields: [agentName, sessionsClosedCount, sessionsDeferredCount]
      context: "Emitted when an agent is taken offline"
  error_events:
    - name: tool.start_agent.failed
      fields: [agentName, error]
      context: "Emitted when start_agent fails"
    - name: tool.stop_agent.failed
      fields: [agentName, error]
      context: "Emitted when stop_agent fails (e.g. agent not found, not online)"
  alarms: []

# ─── Implementation Notes ──────────────────────────────────
implementation_notes: >
  These tools delegate to the AgentRegistry introduced in MULTI-002.
  cello_list_agents is the simplest — iterates the Map and returns state.
  cello_start_agent calls registry.start(name) which creates CelloClient.
  cello_stop_agent calls registry.stop(name) which initiates session sealing
  (with a 5-second timeout per session), then closes sessions and stops the
  libp2p node. The tool handlers are registered in
  packages/adapter-claude-code/src/server.ts alongside the existing 12 tools.

  AC-007 is the stop-while-current scenario: when cello_stop_agent is called
  for an agent that is current on one or more connections, the per-connection
  state layer (MULTI-003) must clear the currentAgent for each affected
  connection, setting it to null. Subsequent tool calls on those connections
  must return the 'no current agent' error.

