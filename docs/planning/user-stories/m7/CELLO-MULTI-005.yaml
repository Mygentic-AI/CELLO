# ─── Identity ───────────────────────────────────────────────
id: CELLO-MULTI-005
domain: MULTI
milestone: M7
actor: CLIENT
priority: P0
components:
  - transport
  - client

# ─── Intent ─────────────────────────────────────────────────
story: >
  As a CelloClient instance,
  I want to receive `peer:connect` and `peer:disconnect` events from my
  libp2p node so that I can detect when counterparties go offline or
  come back online, enabling retry queue drain and presence notifications.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When a peer's libp2p connection drops (Yamux keepalive timeout)"
    action: "the CelloClient emits a `peer:disconnect` event with the peer's
      K_local public key hex (resolved from the CELLO identification exchange);
      all sessions with that peer are marked as 'transport_lost'"

  - trigger: "When a previously disconnected peer's libp2p connection is
    re-established"
    action: "the CelloClient emits a `peer:connect` event with the peer's
      K_local public key hex; sessions with that peer are marked as
      'active'"

  - trigger: "When a peer disconnects and reconnects within the Yamux
    keepalive window"
    action: "no disconnect event fires; the connection is seamlessly
      maintained; this is expected behavior for brief network interruptions"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "Agent A and Agent B have an active session; both libp2p nodes
      are connected; the test harness configures Yamux keepalive explicitly
      (`keepAliveInterval: 1000ms, keepAliveTimeout: 3000ms`)"
    when: "Agent B's libp2p node is stopped (simulating laptop close)"
    then: "within 10 seconds, Agent A's CelloClient emits `peer:disconnect`
      with Agent B's K_local pubkey hex"
    test_type: integration
    component_under_test: client
    notes: "Test location: packages/client/src/__tests__/multi-005-presence.test.ts.
      The fixture must use createSessionFixture() from
      packages/e2e-tests/src/session-fixture.ts with a new opts field
      (e.g. opts.yamuxKeepalive: { interval: 1000, timeout: 3000 }) —
      do NOT create a from-scratch libp2p node fixture. Extend the
      shared fixture instead."

  - id: AC-002
    given: "Agent A has received a `peer:disconnect` for Agent B (established
      by the AC-001 test sequence — same harness instance, Agent B's node
      was stopped and the disconnect event was confirmed)"
    when: "Agent B's libp2p node restarts and reconnects to Agent A"
    then: "Agent A's CelloClient emits `peer:connect` with Agent B's
      K_local pubkey hex"
    test_type: integration
    component_under_test: client
    notes: "Continuation of the AC-001 test — same harness, same describe
      block. Not an independent test that sets up disconnect state from
      scratch."

  - id: AC-003
    given: "Agent A has a session with Agent B"
    when: "Agent B disconnects"
    then: "Agent A's `cello_list_sessions` shows the session with B as
      state 'transport_lost' (the existing SessionStatus value from
      packages/client/src/types.ts); the session is NOT closed — it remains
      open and will resume when B reconnects"
    test_type: integration
    component_under_test: client

  - id: AC-004
    given: "Agent A has a session with Agent B marked 'transport_lost'"
    when: "Agent B reconnects"
    then: "the session transitions back to 'active' state;
      Agent A can immediately send messages to B"
    test_type: integration
    component_under_test: client

  - id: AC-005
    given: "Agent A is connected to peers B and C"
    when: "peer B disconnects but peer C remains connected"
    then: "only a `peer:disconnect` for B is emitted; C's sessions are
      unaffected; the disconnect detection is per-peer, not global"
    test_type: integration
    component_under_test: client

  - id: AC-006
    given: "The libp2p node emits a `peer:disconnect` for a Peer ID"
    when: "the CelloClient processes this event"
    then: "the Peer ID is resolved to a K_local pubkey hex via the
      identification exchange mapping maintained by the client; if no
      mapping exists (unknown peer), the `peer.presence.unmapped_peerid`
      event is emitted and the raw libp2p event is discarded (no presence
      event fired)"
    test_type: unit
    component_under_test: client

  - id: AC-007
    given: "A known peer disconnects from Agent A"
    when: "the `peer:disconnect` event is processed"
    then: "the `peer.presence.disconnected` event is logged with
      `peerPubkeyHex` (non-empty hex string) and `detectionLatencyMs > 0`
      (measured from last confirmed activity to event time)"
    test_type: integration
    component_under_test: client

  - id: AC-008
    given: "The libp2p node emits `peer:disconnect` for a Peer ID with no
      CELLO identification mapping"
    when: "the CelloClient processes this event"
    then: "the `peer.presence.unmapped_peerid` event is logged with the
      raw `peerId` string; no `peer.presence.disconnected` event fires"
    test_type: unit
    component_under_test: client

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "Presence events must not disclose information about agents
      that the recipient has never communicated with — only peers in the
      client's peer registry generate presence events"
    adversarial_condition: "the peer registry contains only peers that have
      completed the CELLO identification exchange with this client; a libp2p
      peer that connects and disconnects without completing the CELLO
      handshake produces no presence event — only a peer.presence.unmapped_peerid
      log; a passive observer cannot use presence events to enumerate agents"
    test_type: unit
    component_under_test: client

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: peer.presence.disconnected
      fields: [peerPubkeyHex, detectionLatencyMs]
      context: "Emitted when a known peer's connection is lost"
    - name: peer.presence.reconnected
      fields: [peerPubkeyHex, offlineDurationMs]
      context: "Emitted when a previously disconnected peer reconnects"
  error_events:
    - name: peer.presence.unmapped_peerid
      fields: [peerId]
      context: "Emitted when peer:disconnect fires for an unknown Peer ID
        (no CELLO identification mapping exists)"
  notes: >
    The three new event names (`peer.presence.disconnected`,
    `peer.presence.reconnected`, `peer.presence.unmapped_peerid`) must be
    added to the canonical event taxonomy in
    `docs/planning/discussion_logs/2026-05-16_0753_development-pipeline-and-local-iteration.md`
    by the implementer of this story.
  alarms: []

# ─── Interface Changes ──────────────────────────────────────
interface_changes: >
  This story adds `onPeerConnect` and `onPeerDisconnect` methods to the
  CelloClient interface in `packages/client/src/types.ts`. These methods
  are consumed by MULTI-006 (retry queue) and MULTI-007 (notifications).

    onPeerConnect(handler: (peerPubkeyHex: string) => void): void;
    onPeerDisconnect(handler: (peerPubkeyHex: string) => void): void;

  The `transport_lost` value is already in `SessionStatus` — no type change
  needed. The `peer_unreachable` state is NOT added; `transport_lost` covers
  the semantic (connection lost but session remains open).

# ─── Implementation Notes ──────────────────────────────────
implementation_notes: >
  libp2p already emits `peer:connect` and `peer:disconnect` events on the
  node instance. Today these are only listened to in directory-node.ts
  (lines 480-489) and relay-node.ts (lines 258-265) for logging. This story
  wires them into CelloClient by: (1) subscribing to node events after
  node.start(); (2) resolving libp2p Peer ID → K_local pubkey hex via the
  existing #peers Map (which stores peerId alongside pubkey); (3) emitting
  typed events on the CelloClient instance that MULTI-006 (retry queue) and
  MULTI-007 (notifications) consume.

  Test harness configuration for AC-001: the test must explicitly configure
  Yamux keepalive in the libp2p node options (`keepAliveInterval: 1000`,
  `keepAliveTimeout: 3000`). Without explicit configuration, default Yamux
  keepalive timing is ~30s, producing a 60s+ test. With explicit config,
  detection happens within approximately 4 seconds (interval + timeout).
  The AC-001 timing assertion is 10 seconds (config + 7s buffer for CI
  variability).

  AC-002 is a continuation of AC-001's test harness — not an independent
  test that sets up the disconnect state from scratch. After AC-001 confirms
  the disconnect event, the same harness starts Agent B's node again and
  waits for the peer:connect event.

  Session state on disconnect: sessions with the disconnected peer transition
  to `transport_lost` (existing SessionStatus value). On reconnect they
  transition back to `active`. Do NOT introduce a `peer_unreachable` variant
  — `transport_lost` already covers this semantic.

