# ─── Identity ───────────────────────────────────────────────
id: CELLO-MULTI-006
domain: MULTI
milestone: M7
actor: CLIENT
priority: P0
components:
  - client

# ─── Intent ─────────────────────────────────────────────────
story: >
  As a CelloClient,
  I want a client-side retry queue that holds undelivered messages and
  drains them on reconnect, paired with nonce-based deduplication on the
  receiver side, so that transient network failures do not lose messages
  and retries do not produce duplicates.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When `send()` fails because the peer is unreachable"
    action: "the message is enqueued in a per-agent, per-session retry queue
      with its original nonce intact; `send()` returns
      { delivered: false, reason: 'queued_for_retry', nonce: '<hex>' }"

  - trigger: "When a `peer:connect` event fires for a peer with queued messages"
    action: "all queued messages for that peer are retried in original send order;
      each retry uses the same nonce as the original send attempt; successfully
      delivered messages are removed from the queue"

  - trigger: "When a message is created for sending"
    action: "a unique nonce (32 bytes, crypto.getRandomValues) is generated and
      assigned to the message; this nonce is included as a signed field in the
      CBOR envelope wrapper (sibling to the TBS bytes, not inside the TBS array);
      the nonce never changes across retries of the same message"

  - trigger: "When a send attempt returns any transport-level error (stream reset,
    connection closed, peer unreachable)"
    action: "the message is queued for retry regardless of whether delivery may
      have occurred; the nonce on the message ensures that if the message WAS
      delivered before the error, the receiver's deduplication set discards the
      duplicate on retry; this is the correct behavior — ambiguous delivery is
      resolved by nonce deduplication, not by avoiding retry"

  - trigger: "When an inbound message arrives with a nonce already seen in
    this session"
    action: "the message is discarded silently after signature verification;
      no event, no error, no notification to the receiver; deduplication happens
      AFTER signature verification to prevent forged-nonce suppression attacks"

  - trigger: "When a session is sealed"
    action: "the deduplication set for that session is cleared; the retry queue
      for that session is cleared (any undelivered messages are discarded —
      the session is over); the `message.retry.session_sealed_cleared` event
      is emitted with the discarded message count"

  - trigger: "When the MCP server process restarts with messages in the retry queue"
    action: "queued messages are NOT restored — the retry queue is intentionally
      ephemeral (in-memory only, not persisted to SQLCipher); this is an
      accepted limitation for M7: the peer must re-send any messages that were
      queued at the time of restart; the nonce deduplication set is also
      ephemeral — it is per-session and per-process; a restart clears it;
      duplicate detection only covers the in-process window, not across
      restarts; both limitations are acceptable for M7 because the retry queue
      protects against transient transport failures (peer offline for seconds
      to minutes), not against process restarts; SQLCipher persistence for the
      retry queue and nonce set is explicitly deferred to a post-M7 story
      (`retry_queue` and `session_seen_nonces` tables were identified in the
      client-db-schema-design discussion log as M7+ scope)"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "Agent A has an active session with Agent B; Agent B goes offline"
    when: "Agent A calls `cello_send` three times"
    then: "all three sends return { delivered: false, reason: 'queued_for_retry' };
      the retry queue for this session contains 3 entries in send order"
    test_type: integration
    component_under_test: client

  - id: AC-002
    given: "Agent A has 3 messages queued for Agent B"
    when: "Agent B comes back online (peer:connect fires)"
    then: "all 3 messages are delivered to Agent B in original order;
      Agent B receives them via `cello_receive` in the same sequence;
      Agent A's retry queue for this session is empty"
    test_type: integration
    component_under_test: client

  - id: AC-003
    given: "Agent A sends a message with nonce X to Agent B; it is delivered"
    when: "Agent A's retry queue replays the same message (nonce X) due to
      a race between delivery confirmation and reconnect"
    then: "Agent B's deduplication logic discards the duplicate; Agent B's
      receive queue contains only one copy of the message"
    test_type: integration
    component_under_test: client

  - id: AC-004
    given: "Agent B has received messages with nonces [X, Y, Z] in session S"
    when: "session S is sealed"
    then: "the deduplication set is cleared; if a new session is created with B,
      nonces X, Y, Z would be accepted again (they belong to a different session)"
    test_type: unit
    component_under_test: client

  - id: AC-005
    given: "Agent A queues a message for Agent B"
    when: "the nonce on the queued message is inspected across retry attempts"
    then: "the nonce is identical on all retry attempts; it was assigned once
      at message creation and never regenerated"
    test_type: unit
    component_under_test: client

  - id: AC-006
    given: "Agent A has messages queued for Agent B in session S"
    when: "session S is sealed (via `cello_close_session`)"
    then: "the retry queue for session S is cleared; the queued messages are
      discarded (they cannot be delivered to a sealed session)"
    test_type: integration
    component_under_test: client

  - id: AC-007
    given: "Agent A sends two different messages (different content) to Agent B"
    when: "both messages are inspected"
    then: "each has a unique nonce; nonces are 32 bytes of randomness;
      nonce collision probability is negligible"
    test_type: unit
    component_under_test: client

  - id: AC-008
    given: "Agent B is in session S with a deduplication set containing nonce N"
    when: "the deduplication and signature verification logic is exercised
      with two test sequences — (a) message with nonce N and VALID signature;
      (b) message with nonce N and INVALID signature"
    then: "(a) message with duplicate nonce N + valid signature is discarded by
      the dedup check — it does not reach the receive queue; no notification is
      generated. (b) message with duplicate nonce N + INVALID signature is
      rejected by signature verification BEFORE reaching the dedup check —
      verifying that sig-verify runs first; the dedup set is NOT consulted for
      an invalid signature. Both test sequences must be explicit and independent."
    test_type: unit
    component_under_test: client
    notes: "Changed from integration to unit: crafting a malformed envelope
      with an invalid Ed25519 signature does not require live libp2p nodes.
      Both test sequences operate on in-memory envelope bytes."

  - id: AC-010
    given: "A nonce (32-byte Uint8Array from crypto.getRandomValues) is placed
      in a CBOR envelope, encoded, and decoded"
    when: "the decoded nonce is extracted from the envelope and compared
      to the original nonce"
    then: "the decoded nonce bytes are byte-for-byte identical to the original;
      AND the deduplication set lookup `seenNonces.has(decoded_nonce_hex)` returns
      true when the original nonce hex was added to the set — proving the nonce
      survives CBOR encode/decode with consistent type representation"
    test_type: unit
    component_under_test: client
    notes: "This AC exists because the entire deduplication mechanism depends
      on nonce identity through a serialization round-trip. CBOR handles
      Uint8Array correctly (major type 2), but the application layer must
      convert nonce bytes to a consistent string key (hex) for the dedup set.
      If the encode/decode produces a Buffer instead of Uint8Array, or the hex
      conversion is inconsistent, lookups silently fail and duplicates are
      delivered. This is the CBOR equivalent of the PERSIST-005 Uint8Array
      corruption pattern."

  - id: AC-009
    given: "Agent A has 100 messages queued for Agent B (stress test)"
    when: "Agent B reconnects"
    then: "all 100 messages drain in order within 5 seconds; no duplicates
      appear in Agent B's receive queue; no messages are lost"
    test_type: integration
    component_under_test: client

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "Nonces must be cryptographically random (32 bytes from
      crypto.getRandomValues) — predictable nonces would allow an attacker
      to pre-forge deduplication entries and suppress legitimate messages"
    adversarial_condition: "an attacker who can inject messages into a session
      cannot predict future nonces to pre-populate the deduplication set"
    test_type: unit
    component_under_test: client

  - id: SI-002
    statement: "Deduplication must happen AFTER signature verification —
      a forged message with a duplicate nonce must not suppress a legitimate
      future message that happens to have the same nonce"
    adversarial_condition: "test sequence: (1) inject a message with stolen
      valid nonce N but invalid signature — signature check rejects it, dedup
      set is NOT updated; (2) send a legitimate message with nonce N and valid
      signature — it is accepted because the dedup set was not poisoned in step 1"
    test_type: integration
    component_under_test: client

  - id: SI-003
    statement: "Retry queue messages retain their original signatures —
      re-signing on retry would change the content hash and break the
      Merkle chain"
    adversarial_condition: "the retry mechanism cannot alter message integrity;
      a retried message is byte-for-byte identical to the original"
    test_type: unit
    component_under_test: client

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: message.retry.queued
      fields: [sessionId, peerPubkeyHex, nonce, queueDepth]
      context: "Emitted when a message is added to the retry queue"
    - name: message.retry.drained
      fields: [sessionId, peerPubkeyHex, messageCount, drainDurationMs]
      context: "Emitted after all queued messages for a peer are retried"
    - name: message.dedup.discarded
      fields: [sessionId, senderPubkeyHex, nonce]
      context: "Emitted when a duplicate nonce is detected and discarded"
    - name: message.retry.session_sealed_cleared
      fields: [sessionId, discardedMessageCount]
      context: "Emitted when a session seals and its retry queue is cleared
        (any undelivered queued messages are discarded)"
  error_events:
    - name: message.retry.failed
      fields: [sessionId, peerPubkeyHex, nonce, error]
      context: "Emitted when a retry attempt fails (peer disconnected again)"
  alarms: []

# ─── Implementation Notes ──────────────────────────────────
implementation_notes: >
  Retry queue: a Map<sessionId, Array<QueuedMessage>> where QueuedMessage is
  { envelope: Uint8Array, nonce: string, peerPubkeyHex: string, createdAt: Date }.
  Lives inside CelloClient. On peer:connect, iterate all sessions with that
  peer and drain in order. If drain fails partway (peer disconnects again),
  remaining messages stay queued.

  Nonce placement decision (authoritative — see 2026-05-27_1400_multi-agent-mcp-planning.md):
  The nonce goes in the signed CBOR envelope wrapper as a sibling field
  alongside the TBS bytes — NOT inside the TBS array. The envelope is already
  signed; any field in the signed envelope surface is protected against
  tampering. This approach avoids modifying Structure 1 TBS, avoids a
  protocol_version bump, and keeps `protocol-types` out of M7 scope.

  Structure 1 TBS is defined in CONTEXT.md as:
  `[protocol_version, content_hash, sender_pubkey, session_id, last_seen_seq, timestamp]`
  This definition is NOT changed by this story. The nonce is a separate field
  in the outer signed envelope, not a new positional element in the TBS array.

  CONTEXT.md update required: the implementer of this story must update CONTEXT.md
  to (1) add `queued_for_retry` to the `SendFailureReason` union type, and (2)
  extend the `SendResult` failure variant to include an optional `nonce` field:
  `{ delivered: false, reason: 'queued_for_retry', nonce: '<hex>' }`.
  Also update `packages/client/src/types.ts` to match.

  Deduplication: Map<sessionId, Set<string>> in CelloClient. Checked in
  #handleInboundLeafDeliver() AFTER signature verification and BEFORE
  enqueueing to receive queue.

