# ─── Identity ───────────────────────────────────────────────
id: CELLO-MULTI-007
domain: MULTI
milestone: M7
actor: AGENT_OPERATOR
priority: P0
components:
  - connect

# ─── Intent ─────────────────────────────────────────────────
story: >
  As an agent operator running multiple agents on one server,
  I want notifications to identify which agent an event belongs to, and
  I want presence notifications when peers go offline or come online,
  so that my Claude Code session can route events to the correct agent
  context and respond to connectivity changes.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When a message arrives for any online agent"
    action: "the MCP notification includes an `agent` field identifying
      which agent received the message:
      { type: 'cello_message', from: '<pubkey>', agent: '<name>' };
      the notification is delivered to ALL connected MCP client connections
      (not filtered by current agent); each client uses the `agent` field
      to determine relevance"

  - trigger: "When a session request arrives for any online agent"
    action: "the MCP notification includes the agent field:
      { type: 'cello_session_request', from: '<pubkey>',
        session_id: '<hex>', agent: '<name>' };
      delivered to ALL connected MCP clients"

  - trigger: "When a known peer goes offline (peer:disconnect)"
    action: "a new notification type is emitted for EACH local agent that
      had sessions with this peer:
      { type: 'cello_peer_offline', peer: '<pubkey>', agent: '<name>' };
      delivered to ALL connected MCP clients"

  - trigger: "When a known peer comes back online (peer:connect)"
    action: "a new notification type is emitted for EACH local agent that
      had sessions with this peer:
      { type: 'cello_peer_online', peer: '<pubkey>', agent: '<name>' };
      delivered to ALL connected MCP clients"

  - trigger: "When `cello_send` or `cello_receive` is called with an
    optional `agent` parameter"
    action: "the tool routes to the named agent's CelloClient regardless of
      which agent is current for this connection; the current agent is NOT
      switched — this is a one-off routing override; the `tool.agent_override`
      event is logged at INFO with connectionId, toolName, requestedAgent,
      and currentAgent fields"

  - trigger: "When `cello_start_agent(name)` brings a new agent online"
    action: "the notification emitter immediately subscribes to that agent's
      presence and message events so that notifications for the newly-online
      agent are delivered to all MCP clients without requiring a server restart"

  - trigger: "When `cello_send` is called with an optional `agent` parameter
    where the session_id belongs to a different agent's CelloClient than
    the one named in `agent`"
    action: "the call returns an error: 'Session <session_id> is not owned
      by agent <name>'; each CelloClient has its own session map and sessions
      are not shared between agents"

  - trigger: "When `cello_send` is called with NO `agent` parameter"
    action: "the tool routes to the current agent's CelloClient for this
      connection — backwards-compatible with pre-M7 single-agent behavior;
      if no current agent is set, returns the 'no current agent' error"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "Agents `alice` and `bob` are both online; a peer sends a message
      to alice; a notification collector is registered on the server before
      the message arrives (via InMemoryTransport onNotification handler)"
    when: "the MCP notification is emitted"
    then: "the notification payload is { type: 'cello_message',
      from: '<peer_pubkey>', agent: 'alice' }; AND the notification counter
      for bob shows zero notifications during this event (verified by the
      notification collector's per-agent count: collector.countFor('bob') === 0);
      AND `notification.emitted` is logged at DEBUG with `type: 'cello_message'`,
      `agent: 'alice'`, and `connectionCount` fields"
    test_type: integration
    component_under_test: connect

  - id: AC-002
    given: "Agent `alice` has an active session with peer X; peer X disconnects"
    when: "the peer:disconnect event propagates to the MCP layer"
    then: "a notification { type: 'cello_peer_offline', peer: '<X_pubkey>',
      agent: 'alice' } is emitted; AND `notification.emitted` is logged at DEBUG
      with `type: 'cello_peer_offline'` and `agent: 'alice'`"
    test_type: integration
    component_under_test: connect

  - id: AC-003
    given: "Agent `alice` received a cello_peer_offline for peer X"
    when: "peer X reconnects"
    then: "a notification { type: 'cello_peer_online', peer: '<X_pubkey>',
      agent: 'alice' } is emitted"
    test_type: integration
    component_under_test: connect

  - id: AC-004
    given: "Connection 1 has `bob` as current agent; `alice` is online"
    when: "Connection 1 calls `cello_receive({ agent: 'alice' })`"
    then: "the receive dequeues from alice's receive queue; bob remains
      current for Connection 1; no agent switch occurs; AND `tool.agent_override`
      is logged at INFO with `connectionId`, `toolName: 'cello_receive'`,
      `requestedAgent: 'alice'`, and `currentAgent: 'bob'`"
    test_type: integration
    component_under_test: connect

  - id: AC-005
    given: "Connection 1 has `bob` as current agent; `alice` is online"
    when: "Connection 1 calls `cello_send({ to: '<peer>', content: '...',
      agent: 'alice' })`"
    then: "the send is executed from alice's CelloClient (signed with
      alice's K_local); bob remains current for Connection 1; AND
      `tool.agent_override` is logged at INFO with `connectionId`,
      `toolName: 'cello_send'`, `requestedAgent: 'alice'`, and
      `currentAgent: 'bob'`"
    test_type: integration
    component_under_test: connect

  - id: AC-006
    given: "Agent `alice` and `bob` both have sessions with peer X;
      peer X disconnects; a notification collector is registered on the
      server before the disconnect event"
    when: "presence notifications fire"
    then: "the collector contains exactly two entries: one notification
      with `agent: 'alice'` and one notification with `agent: 'bob'`;
      both have `type: 'cello_peer_offline'` and `peer: '<X_pubkey>'`"
    test_type: integration
    component_under_test: connect

  - id: AC-007
    given: "Connection 1 calls `cello_receive` with NO agent parameter"
    when: "the tool executes"
    then: "the receive dequeues from the current agent's receive queue
      (same behavior as before M7 for backwards compatibility)"
    test_type: integration
    component_under_test: connect

  - id: AC-008
    given: "Connection 1 calls `cello_send({ agent: 'ghost' })` where
      ghost is not online"
    when: "the tool executes"
    then: "returns an error: 'Agent ghost is not online. Cannot send.';
      AND `tool.agent_override.failed` is logged at WARN with `connectionId`,
      `toolName: 'cello_send'`, `requestedAgent: 'ghost'`, and `reason`"
    test_type: unit
    component_under_test: connect

  - id: AC-009
    given: "Connection 1 calls `cello_send({ session_id: '<sid>', agent: 'alice' })`
      where `<sid>` is a session owned by bob's CelloClient (not alice's)"
    when: "the tool executes"
    then: "returns an error: 'Session <sid> is not owned by agent alice';
      no send occurs; alice's CelloClient is not invoked; AND
      `tool.agent_override.failed` is logged at WARN with `connectionId`,
      `toolName: 'cello_send'`, `requestedAgent: 'alice'`, and
      `reason: 'session_not_owned'`"
    test_type: unit
    component_under_test: connect

  - id: AC-010
    given: "Connection 1 calls `cello_send` with NO `agent` parameter;
      Connection 1's current agent is alice"
    when: "the tool executes"
    then: "the send routes to alice's CelloClient — backwards-compatible
      with pre-M7 behavior where no agent parameter was needed"
    test_type: integration
    component_under_test: connect

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The optional `agent` parameter on send/receive must verify
      the named agent exists and is online — it must not expose a path to
      sign with an agent that is stopped or unloaded"
    adversarial_condition: "a test calls `cello_send({ agent: 'alice', ... })`
      after alice has been stopped via cello_stop_agent; asserts the call
      returns an error without invoking any CelloClient signing operation —
      verified by asserting the registry contains no online entry for alice
      and no send attempt was made (confirmed by alice's send call count
      remaining zero throughout the test)"
    test_type: unit
    component_under_test: connect

# ─── Observability ──────────────────────────────────────────
observability:
  events:
    - name: notification.emitted
      level: debug
      trigger: "For every MCP notification sent to connected clients"
      context_fields: [type, agent, connectionCount]
      correlationId: false
    - name: tool.agent_override
      level: info
      trigger: "When a tool call uses the optional agent parameter to route
        to a non-current agent"
      context_fields: [connectionId, toolName, requestedAgent, currentAgent]
      correlationId: false
  error_events:
    - name: notification.delivery_failed
      level: warn
      trigger: "When a notification cannot be delivered to a connected MCP client"
      context_fields: [type, agent, error]
      correlationId: false
    - name: tool.agent_override.failed
      level: warn
      trigger: "When an agent-override tool call fails (agent not online,
        session not owned by named agent)"
      context_fields: [connectionId, toolName, requestedAgent, reason]
      correlationId: false
  notes: >
    The four event names (notification.emitted, tool.agent_override,
    notification.delivery_failed, tool.agent_override.failed) must be added
    to the canonical event taxonomy in
    docs/planning/discussion_logs/2026-05-16_0753_development-pipeline-and-local-iteration.md
    by the implementer of this story.

    No alarm threshold for notification.delivery_failed in M7: notifications
    are delivered to local MCP clients in the same process; delivery failure
    indicates a client disconnect which is immediately visible to the operator.
    Alarm thresholds for notification health are deferred to a post-M7 story
    covering SSE/HTTP transport modes where delivery failure has broader impact.
  alarms: []

