# ─── Intent ─────────────────────────────────────────────────
story: >
  As an agent operator verifying the M7 milestone,
  I want a live integration test proving that two agents on one MCP server
  can exchange messages end-to-end — including retry queue drain after
  reconnect and nonce deduplication — so that the multi-agent capability
  is verified under realistic conditions before launch.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When the M7 integration test runs"
    action: "two agents (alice and bob) are loaded on the same MCP server;
      both are brought online; both connect to the directory; alice initiates
      a session with bob; messages flow bidirectionally; a network disruption
      is simulated; retry queue and deduplication are exercised; the session
      is sealed"

  - trigger: "When the test fixture for this story is created"
    action: "the test must extend createSessionFixture() from
      packages/e2e-tests/src/session-fixture.ts with a new opts field for
      multi-agent server configuration (e.g. opts.multiAgent: { agents: ['alice', 'bob'] })
      with a non-breaking default of undefined; a from-scratch makeFixture()
      function must NOT be written — this is enforced by /cello-review fixture
      discipline check; the two-agent server capability added here becomes
      available for all future milestone gate tests; the opts.multiAgent extension
      must expose a `stopAgentTransport(name: string): Promise<void>` helper
      that calls libp2p.stop() on the named agent's node — required by AC-004
      and AC-005 to simulate transport disruption for that specific agent"

  - trigger: "When infrastructure prerequisites are checked before running MULTI-008"
    action: "two infrastructure gaps from the M7 outline must be resolved before
      this story's ACs can pass: (1) the /agent-lookup ALB routing rule must be
      deployed — without it, agent_id-based session initiation (AC-002) will fail
      because target resolution falls through to the WebSocket listener, returning
      'Only WebSocket connections are supported'; (2) the cello_service PostgreSQL
      role must have UPDATE grant on agent_profiles — without it, linkAgentToAccount()
      fails silently in production; both gaps are documented in the M7 outline and
      COORDINATION.md; if AC-002 fails with the WebSocket error, stop and deploy
      the ALB rule before continuing — do not attempt to work around it"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "An MCP server started with two agents (alice and bob) loaded via
      createSessionFixture() extended with opts.multiAgent"
    when: "`cello_start_agent('alice')` and `cello_start_agent('bob')` are called"
    then: "both agents are online; `cello_list_agents` shows both as online;
      each has a distinct public key and Peer ID"
    test_type: integration
    component_under_test: connect

  - id: AC-002
    given: "Alice and bob are both online on the same server"
    when: "Connection 1 calls `cello_use_agent('alice')` and initiates a
      session with bob's public key"
    then: "session is established via the directory; both agents can exchange
      messages; messages signed by alice verify against alice's K_local;
      messages signed by bob verify against bob's K_local; AND the session
      returned by `cello_list_sessions` for alice includes a `session_id`
      field whose value matches the `sessionId` from the `SessionAssignment`
      frame that the directory sent during session initiation (proving session
      establishment went through the directory's libp2p signaling path and not
      an in-process shortcut)"
    test_type: integration
    component_under_test: connect
    notes: "cello_list_sessions (not cello_status) is the correct tool to
      retrieve the session_id for an active session. cello_status reports
      aggregate connection state; cello_list_sessions returns per-session
      records including the directory-assigned session_id. The SessionAssignment
      frame's sessionId is captured from the initiation flow and compared to
      the value in cello_list_sessions output."

  - id: AC-003
    given: "Alice and bob have an active session on the same server"
    when: "Connection 1 (alice current) sends a message to bob; Connection 2
      (bob current) calls `cello_receive`"
    then: "bob receives the message; content matches what alice sent;
      signature verification passes; AND bob's received envelope includes a
      relay-assigned `canonicalSeq > 0` (proving the message transited the
      relay's Merkle engine and was not delivered via an in-process shortcut)"
    test_type: integration
    component_under_test: connect

  - id: AC-004
    given: "Alice and bob have an active session"
    when: "bob's libp2p node transport is disrupted (simulated via `libp2p.stop()`
      on bob's node within the same server process); alice sends 3 messages
      while bob is unreachable"
    then: "all 3 messages are queued in alice's retry queue; alice's send
      calls return { delivered: false, reason: 'queued_for_retry' }"
    test_type: integration
    component_under_test: client

  - id: AC-005
    given: "Alice has 3 messages queued for bob"
    when: "bob's transport is restored (bob's libp2p node restarted)"
    then: "all 3 messages are delivered to bob in original order; bob
      receives exactly 3 messages (no duplicates); nonces on received
      messages are all unique; AND bob's received envelopes have ascending
      relay-assigned `canonicalSeq` values (proving retry drain went through
      the relay)"
    test_type: integration
    component_under_test: client

  - id: AC-006
    given: "Alice sends a message to bob (nonce N) that is delivered; the test
      then manually injects a second copy of the same raw envelope bytes (same
      nonce N) directly into bob's inbound handler to simulate a retry replay"
    when: "bob processes both the original delivery and the injected duplicate"
    then: "bob's receive queue contains exactly ONE copy of the message;
      the duplicate was discarded via nonce deduplication"
    test_type: integration
    component_under_test: client
    notes: "The 'inbound handler' that accepts raw envelope bytes for test
      injection is `CelloClient.handleInboundEnvelope(bytes: Uint8Array)` (or
      equivalent — check `packages/client/src/client.ts` for the actual method
      name). If no public test injection point exists on CelloClient, the
      implementer must add one (a package-internal method exposed only in test
      builds, or an accepted-by-convention internal method) before this AC can
      be written. Identify the method name during the Architecture phase."

  - id: AC-007
    given: "The session between alice and bob is active with messages exchanged"
    when: "`cello_close_session` is called"
    then: "the session is sealed successfully; sealed receipt is retrievable;
      retry queue for this session is cleared; deduplication set is cleared"
    test_type: integration
    component_under_test: client

  - id: AC-008
    given: "A system with only `~/.cello/key` (legacy, no agents directory)"
    when: "the MCP server starts"
    then: "a `default` agent is available; it auto-starts and becomes current;
      all existing MCP tools work without calling cello_use_agent;
      backwards compatibility is preserved. See MULTI-001 AC-002 for the full
      backwards-compatibility specification; this AC confirms it holds in the
      full multi-agent server context."
    test_type: integration
    component_under_test: connect

  - id: AC-009
    given: "Two separate MCP client connections to the same server (simulated
      via InMemoryTransport pairs from the MCP SDK)"
    when: "Connection 1 sets alice as current; Connection 2 sets bob as current"
    then: "Connection 1 sending routes through alice; Connection 2 sending
      routes through bob; neither connection's choice affects the other"
    test_type: integration
    component_under_test: connect

  - id: AC-010
    given: "Agent alice is current for Connection 1; alice has a session with
      an external peer"
    when: "the external peer goes offline then comes back online"
    then: "Connection 1 receives `cello_peer_offline` then `cello_peer_online`
      notifications, both with agent: 'alice'"
    test_type: integration
    component_under_test: connect

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "Messages sent by alice must be signed with alice's K_local;
      messages sent by bob must be signed with bob's K_local; cross-signing
      is impossible regardless of which connection routes to which agent"
    adversarial_condition: "a test rapidly switches Connection 1 between alice
      and bob via cello_use_agent while sending messages; extracts the
      senderPubkeyHex from each received envelope's CBOR structure; asserts
      each senderPubkeyHex exactly matches the pubkey of the agent that was
      current at send time — never the other agent's pubkey; a cross-signing
      bug would cause a mismatch between the declared sender and the actual
      signing key"
    test_type: integration
    component_under_test: connect

  - id: SI-002
    statement: "The retry queue must not deliver messages to the wrong session
      or wrong peer after reconnect — session ID and peer pubkey are checked
      before retry delivery"
    adversarial_condition: "a test queues messages from alice to peer X in
      session S; then peer Y (a different peer, different pubkey) reconnects
      while peer X remains offline; asserts that alice's retry queue does NOT
      drain to peer Y — confirmed by peer Y receiving zero messages and the
      queue depth for session S remaining unchanged after peer Y's reconnect
      event fires"
    test_type: integration
    component_under_test: client

