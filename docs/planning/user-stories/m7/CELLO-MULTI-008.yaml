# ─── Implementation Notes ──────────────────────────────────
implementation_notes: >
  This story is the live multi-process smoke test for M7. It follows the
  milestone close gate pattern established in M1+. The test runs as a Vitest
  integration test in packages/e2e-tests/src/m7/ using real libp2p nodes,
  real directory, and real CelloClients — one per agent. The transport
  disruption is simulated by calling libp2p.stop() on one agent's node
  and then restarting it. The nonce race condition (AC-006) is simulated by
  manually replaying a raw envelope with a duplicate nonce. The per-connection
  test (AC-009) uses InMemoryTransport pairs from the MCP SDK to simulate two
  independent connections to the same server.

  Scope boundary for AC-004/AC-005: `libp2p.stop()` on bob's node within
  the same server process triggers alice's `peer:disconnect` via the libp2p
  event system directly — it does NOT exercise the Yamux keepalive detection
  path (which is MULTI-005's concern). AC-004/AC-005 test the retry queue
  DRAIN mechanism, not keepalive detection. The keepalive detection path is
  covered by MULTI-005's unit tests with explicit keepalive configuration.
  This scope boundary is intentional and documented — the integration gate
  validates the full retry/dedup/reconnect flow without requiring a 10-second
  keepalive timeout on every test run.

