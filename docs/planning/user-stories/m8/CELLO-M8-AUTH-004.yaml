status: draft
description: >
  Strong-auth enforcement — a 7-day grace during which an operator may use the portal without
  TOTP, then a hard gate. The required strong factor is the recoverable TOTP floor (journey-01 D6):
  a passkey is a convenience layer and does NOT lift the cliff — a passkey-only account past grace
