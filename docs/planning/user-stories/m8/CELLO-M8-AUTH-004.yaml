topics: [portal, auth, strong-auth-enforcement, grace-period, waiver, admin-override, m8]
status: draft
description: >
  Strong-auth enforcement — a 7-day grace during which an operator may use the portal without
  WebAuthn/TOTP, then a hard gate. The only bypass is a human-granted, per-account waiver flag
