  events: [] # empty by design — gate story; events are defined in the component stories
  error_events: [] # empty by design
  notes: >
    Gate story, not a code story. It exercises events defined in the SCAFFOLD, AUTH,
    PRESENCE, READ, AGENTS, WRITEAPI, LEVER, and TRUST component stories. Events verified
    per AC:
      AC-001: portal.landing.signpost.shown
      AC-002: portal.session.started (accountId via email_stub_hash match, authLevel)
      AC-003: portal.webauthn.enrolled, portal.trust_signal.handed_off (hash, no plaintext),
              daemon.trust_signal.received (verified: true)
      AC-004: portal.totp.enrolled, portal.backup_codes.issued (count only)
      AC-005: directory.presence.transition, portal.agents.viewed
      AC-007: portal.agent.suspend.requested (stepUp: true),
              directory.agent.revocation.recorded (mode: 'pause'),
              directory.agent.revocation.cleared
      AC-008: (UI assertion — no aggregate/TrustRank element; no new event required)
      AC-009: portal.sessions.listed, portal.session.revoked
      DB-001: portal.directory.unreachable
      DB-002: directory.node.heartbeat.stale
    No new events are introduced by this story.
  alarms: [] # verification story; component stories define alarms

# ─── Implementation Notes ────────────────────────────────────
implementation_notes:
  - >
    AC-003 — proving the no-plaintext + replication properties together: write the signal
    hash via the node the portal backend talks to, then read it back from a DIFFERENT node
    (query a second cluster node directly). Assert the daemon ACK caused the pickup-queue
    row to be deleted (poll the queue, assert empty) before asserting the directory still
    holds the hash.
  - >
    AC-007 — proving server-side enforcement: keep the operator's daemon holding the valid
    client share throughout. After pause, attempt cello_initiate_session and assert it fails
    for revocation reasons (not network). Then un-suspend and assert a subsequent ceremony
    succeeds — proving pause is reversible and the share was never destroyed.
  - >
    AC-010 / SI-001 — the invariant audit crosses three stores (directory identity tree +
    pickup queue, portal backend DB, browser storage). Script each query and assert the
    plaintext byte sequence of the WebAuthn signal JSON is absent from all server-side stores,
    and that browser localStorage/IndexedDB hold no agent/identity data.
  - >
    Cohesion pass: after all component stories (SCAFFOLD-001/002, AUTH-001..006, PRESENCE-001,
    READ-001, AGENTS-001, WRITEAPI-001, LEVER-001, TRUST-001/002/003) are written, re-read
    this story and align AC event names, field names, and the agent_revocations record shape
    with what the component stories actually specify. This is a story-writing task.

