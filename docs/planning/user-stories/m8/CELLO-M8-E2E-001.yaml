  alarms: []

# ─── Implementation Notes ────────────────────────────────────
implementation_notes:
  - >
    AC-002 — prove no-plaintext + replication together: write the hash via the node the
    portal talks to, read it back from a SECOND node; assert the daemon ACK deleted the
    pickup-queue row (poll, assert empty) before asserting the directory still holds the hash.
  - >
    AC-004 — prove server-side enforcement: keep the daemon holding the valid client share
    throughout; after pause, assert cello_initiate_session fails for revocation (not
    network); after un-suspend, assert a ceremony succeeds (pause is reversible; the share
    was never destroyed).
  - >
    Cohesion pass: after the component stories are written, align AC event names, field
    names, and the agent_revocations record shape with what they specify.

