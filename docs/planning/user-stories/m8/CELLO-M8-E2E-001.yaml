# ─── Identity ───────────────────────────────────────────────
id: CELLO-M8-E2E-001
domain: End-to-End
milestone: M8
actor: OPS
priority: P0
components:
  - portal            # greenfield frontend + backend
  - directory
  - daemon            # cello-client
  - crypto            # content-seal (sealed box)
  - e2e-tests

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the M8 milestone close gate,
  I want an operator to magic-link into the hosted portal, enroll WebAuthn (flowing a
  real trust signal end-to-end through the handoff pipe), see their ceremony-registered
  agents appear with live presence, suspend one via the lever, and view the four-class
  Trust Signals scaffold —
  so that M8 is provably done: the portal auth model, directory-derived presence, the
  suspend lever, and the general trust-signal mechanism are exercised together against
  the live cluster, with the no-plaintext invariant intact.

# ─── Context ────────────────────────────────────────────────
# M8 adds a hosted portal (frontend + backend) plus new directory surfaces
# (agent_presence, the write API, the revocation honor-check, the trust-signal pickup
# queue) and a new daemon flow (sealed-box pickup). Green unit tests will not prove the
# magic-link → WebAuthn-flows-a-signal → presence → suspend → scaffold flow composes:
# the portal is HOSTED (sees only directory-derived facts, never local daemon state),
# presence is persisted from per-node memory into a replicated table, and the lever is
# a T-of-N replicated revocation — not a single node withholding. This gate exercises
# all of it live.
#
# Written first (E2E-first rule), implemented last. Keep ACs few and load-bearing — the
# component stories own per-component behavior; this gate proves the milestone claim.
# Cohesion pass required after component stories are written.

# ─── Sovereign Node Constraint ──────────────────────────────
# Must run against the real multi-node cluster, not one local instance:
#   - AC-002: the signal hash is written via one node and read back from ANOTHER (the
#     identity-tree write replicates).
#   - AC-003: presence is written by the node the agent connected to and read by the
#     portal from a (possibly different) replicated node; node-liveness needs ≥2 nodes.
#   - AC-004: suspend blocks signing because EVERY honest node refuses its share — a
#     single-node run proves functional correctness only, not sovereign compliance.

# ─── Behavior (EARS) ────────────────────────────────────────
behavior:
  - trigger: "When an operator who completed the ceremony enters their email + 6-digit code"
    action: "the portal resolves the account by matching the directory's email_stub_hash,
      establishes a durable httpOnly-cookie session, and lands on the Agents home — there
      is no portal-side account creation"

  - trigger: "When the operator enrolls a WebAuthn credential"
    action: "the enrollment is turned into a trust signal that flows the full pipe — hash
      to the directory identity tree, sealed ciphertext to the pickup queue, daemon pickup
      + openSealed + verify + store + ACK, directory deletes the ciphertext"

  - trigger: "When the operator views the Agents home"
    action: "each ceremony-registered agent appears with directory-derived presence
      (online iff its presence row is online AND its owning node is fresh); the operator
      never registers/starts/stops an agent from the portal"

  - trigger: "When the operator suspends (pause) an agent via the lever"
    action: "a step-up is required; on success a replicated revocation flag is recorded;
      every honest node refuses its FROST share so the agent cannot complete a ceremony;
      un-suspending restores signing"

  - trigger: "When the operator opens Trust Signals"
    action: "four named classes render; the WebAuthn signal is live; the rest are honest
      placeholders; no composite score / level / TrustRank appears anywhere"

# ─── Acceptance Criteria ────────────────────────────────────
# All ACs require CELLO_E2E_LIVE (live portal + directory cluster + daemon).
acceptance_criteria:
  - id: AC-001
    given: "An operator who completed the ceremony, on a clean browser"
    when: "they enter their email at the portal sign-in and then the 6-digit code"
    then: >
      A durable session is established and the operator lands on the Agents home. The
      account is resolved by matching the typed email's hash against the directory's
      email_stub_hash — NOT minted by the portal (a portal that creates a local account
      without a matching directory record fails). The session credential is an httpOnly
      cookie, absent from document.cookie and localStorage. portal.session.started is
      logged with accountId and correlationId.
    test_type: e2e
    component_under_test: portal

  - id: AC-002
    given: "An authenticated operator with no WebAuthn credential and a daemon running for their agent"
    when: "the operator enrolls a WebAuthn credential"
    then: >
      The enrollment flows the full trust-signal pipe:
        - the signal hash is written to the directory identity tree (agent_id-keyed) and
          is readable from a DIFFERENT cluster node than it was written to;
        - the daemon pulls the sealed ciphertext over signaling, openSealed(k_local)
          succeeds, the recomputed SHA-256 matches the directory hash, the plaintext is
          stored locally, and an ACK is sent;
        - after the ACK, the pickup queue holds no ciphertext for that signal.
      portal.trust_signal.handed_off carries a hash and NO plaintext field;
      daemon.trust_signal.received carries verified: true. A run where the directory keeps
      the ciphertext after ACK, or any event carries the plaintext, fails.
    test_type: e2e
    component_under_test: portal

  - id: AC-003
    given: "An operator whose agent registered via the ceremony, daemon online, ≥2 cluster nodes"
    when: "the operator views the Agents home, then the daemon disconnects"
    then: >
      The agent reads 'online' ONLY while its agent_presence row is online AND its owning
      node's last_heartbeat_at is fresh; the row was written by the node the agent
      connected to and read by the portal from a replicated node. After the daemon
      disconnects, presence transitions to last-seen within the transition-write +
      replication-lag window (directory.presence.transition fires). The portal response
      contains no daemon-local fields (retry queue, interrupted sessions, daemon status).
    test_type: e2e
    component_under_test: portal

  - id: AC-004
    given: "An online agent able to establish FROST sessions, operator with WebAuthn enrolled, full cluster"
    when: "the operator suspends (pause) the agent, then un-suspends it"
    then: >
      Suspend requires a satisfied step-up and records a replicated revocation flag
      (directory.agent.revocation.recorded, mode: 'pause'). While flagged, a FROST session
      establishment for that agent FAILS for revocation reasons even though the daemon
      holds a valid client share — the honest nodes refuse their shares, no threshold
      forms. After un-suspend (directory.agent.revocation.cleared), a subsequent ceremony
      succeeds. A run where one node refusing is enough, or where the agent still signs
      while flagged, fails.
    test_type: e2e
    component_under_test: directory

  - id: AC-005
    given: "An operator with WebAuthn enrolled and the other signals unbuilt"
    when: "the operator opens Trust Signals"
    then: >
      Four named class sections render (Identity / Network graph / Track record / Economic
      stake). The WebAuthn signal shows live (real state); every other signal shows an
      honest placeholder with no functional action. NO aggregate score, level, distance,
      TrustRank, or Trust-Seeder element appears anywhere (asserted by absence). A
      placeholder showing fabricated 'verified' data, or a working-looking Connect button,
      fails.
    test_type: e2e
    component_under_test: portal

  - id: AC-006
    given: "AC-001 through AC-005 have run"
    when: "the no-plaintext invariant is audited across the systems"
    then: >
      The directory holds, for the WebAuthn signal, only a hash (no plaintext row); for the
      suspend, only a flag. The pickup queue is empty for that agent. The portal backend DB
      holds no plaintext trust-signal data and no OAuth token; the only PII is the email,
      stored as KMS-encrypted ciphertext. The browser holds no agent/identity data in
      localStorage/IndexedDB. The milestone writeup
      (docs/planning/milestone-writeups/M8-portal-skeleton.md) is updated with a dated
      confirmation that all conditions passed.
    test_type: manual
    component_under_test: e2e-tests

# ─── Security Invariants ────────────────────────────────────
security_invariants:
  - id: SI-001
    statement: >
      The directory and portal backend must never persist plaintext trust-signal data,
      message content, or an OAuth token — only hashes, flags, and sealed ciphertext that
      is deleted on ACK.
    adversarial_condition: >
      After AC-002, dump the directory identity tree + pickup queue and the portal backend
      DB. Assert the plaintext WebAuthn-signal JSON byte sequence is absent from all of
      them, the pickup queue holds no ciphertext for that signal (ACK deleted it), and no
      OAuth token is present anywhere.
    test_type: e2e
    component_under_test: directory

  - id: SI-002
    statement: >
      A suspended agent must be unable to complete a FROST ceremony even with a valid
      client (k_local) share present — enforcement is server-side across the federation.
    adversarial_condition: >
      With the agent paused (AC-004), the operator's daemon — holding the valid client
      share — calls cello_initiate_session. Assert the ceremony fails for revocation
      reasons (not a transient network error), and that no single honest node alone could
      have produced a signature.
    test_type: e2e
    component_under_test: directory

