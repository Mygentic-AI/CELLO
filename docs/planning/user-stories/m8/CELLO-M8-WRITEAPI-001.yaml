    - CELLO-M8-READ-001
  blocks:
    - CELLO-M8-LEVER-001
    - CELLO-M8-TRUST-001
  notes: "Shared write seam. Producers/consumers: the lever writes a flag; the trust pipe writes a hash + ciphertext."

