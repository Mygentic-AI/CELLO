---
name: CELLO-M8C-DAEMON-002
type: user-story
date: 2026-08-06
topics: [daemon, retry-queue, reap, terminal-session, health-metric, data-minimisation]
status: draft
description: >
  Retry-queue entries whose session goes terminal (abandoned, sealed, etc.) are never
  reaped — every DELETE FROM retry_queue in retry-queue.ts is keyed on a successful
  delivery or ACK, none on terminal session status. This permanently pins
  retryQueueDepth (a health signal that can no longer distinguish a real backlog from
  a corpse) and accumulates a second copy of message plaintext at rest. Not
  launch-blocking (Andre, 2026-08-06 — operator IS told the send failed, nothing is
  lost silently); shipped as a post-launch item. DOD-RETRYQ-STRAND-1 in
  M8C-DEFINITION-OF-DONE.md line 2576.
---
# ─── Identity ───────────────────────────────────────────────
id: CELLO-M8C-DAEMON-002
domain: Session Lifecycle
milestone: M8C
actor: CLIENT
priority: P2
components:
  - daemon

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO Client (the daemon),
  I want retry-queue entries to be removed once their session reaches a terminal
  status, so that `retryQueueDepth` reports a real delivery backlog rather than a
  permanent corpse, and undeliverable plaintext does not accumulate at rest forever.

# ─── Behavior (EARS) ───────────────────────────────────────
behavior:
  - trigger: "When a session transitions to a terminal status (sealed, abandoned, seal_interrupted_pending treated as non-terminal until it resolves)"
    action: "the daemon shall remove that session's retry-queue entries, or re-target them at the relay park path if the content is still deliverable through it"
  - trigger: "If a retry-queue entry's content is dropped rather than delivered as a result of this reap"
    action: "the daemon shall tell the operator (a named event, not a silent delete) — silently discarding a message the sender believes was sent is worse than a stale row"
  - trigger: "Where the reap runs"
    action: "the daemon shall gate removal on session-terminal EVIDENCE only — never on entry age — so a slow-link retry in progress is never discarded for being 'old'"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "A retry-queue entry exists for session S, and S is still active (not terminal)"
    when: "time passes (including past any age threshold that might tempt an age-based sweep)"
    then: "the entry remains queued — it is not removed by age alone"
    test_type: unit
    component_under_test: daemon

  - id: AC-002
    given: "A retry-queue entry exists for session S"
    when: "S transitions to a terminal status (abandoned or sealed)"
    then: "S's retry-queue entries are removed (or re-targeted at the relay park path, if `awaiting_ack: 1` and still relay-deliverable); `retryQueueDepth` in `cello status` drops accordingly"
    test_type: integration
    component_under_test: daemon

  - id: AC-003
    given: "A retry-queue entry is dropped (not delivered) as part of a terminal-session reap"
    when: "the reap runs"
    then: "a named event is emitted telling the operator the message was not delivered — distinct from the existing send-failure warning already emitted at enqueue time (`session-content-handlers.ts:393`)"
    test_type: unit
    component_under_test: daemon

  - id: AC-004
    given: "The live-daemon repro case: a `retry_queue` row with `agent_id: null`, `awaiting_ack: 0`, session status `abandoned`, `message_count: 0`"
    when: "the reap is exercised against this exact row shape"
    then: "the row is removed and `retryQueueDepth` returns to 0"
    test_type: integration
    component_under_test: daemon

# ─── Degraded Behavior ─────────────────────────────────────
degraded_behavior:
  - id: DB-001
    condition: "While a retry-queue entry has `awaiting_ack: 1` and its session goes terminal before the relay park path confirms delivery"
    fallback: "the daemon shall re-target the entry at the relay park path (store-and-forward) rather than deleting it outright, since the content may still be deliverable through that path even though the session's live transport is gone"
    test_type: integration
    component_under_test: daemon

# ─── Observability ─────────────────────────────────────────
observability:
  events:
    - name: "session.retryqueue.reaped"
      level: info
      trigger: "a session's retry-queue entries are removed or re-targeted following the session reaching a terminal status"
      context_fields: [sessionId, entryCount, disposition]
      correlationId: false
  error_events:
    - name: "session.retryqueue.content.dropped"
      level: warn
      trigger: "a retry-queue entry's content is discarded (not delivered, not re-targetable) as part of a terminal-session reap"
      context_fields: [sessionId, contentHash, reason]
  alarms: []
  # No new alarm threshold proposed — this closes an existing pinned metric rather than
  # introducing a new failure mode; retryQueueDepth returning to a real (possibly nonzero)
  # value is the health signal itself, already surfaced in cello status.

# ─── References ─────────────────────────────────────────────
references:
  protocol_map: "Directory Infrastructure"
  discussion_logs: []
