---
name: CELLO-M8C-SESSION-001
type: user-story
date: 2026-08-06
topics: [session-lifecycle, sealed-session, wake, doorbell, inbox, disposition-policy, terminal-state]
status: draft
description: >
  A sealed session's unread messages ring the doorbell as live actionable work, and an
  agent can act on an expired directive from a conversation that already ended. Two
  entry points: (1) message.watermark.advanced firing with a fresh timestamp for an old
  sequence on a terminal session; (2) content.recover.ingest_failed looping forever on
  verified-but-refused content (counterparty_unknown, session_committed) because that
  content is deliberately never confirm-deleted. Disposition policy already agreed with
  Miss_Chelly (daemon side, M12-P14) on 2026-08-05. Combines DOD-TERMINAL-WAKE-1 and
  DOD-SEALED-INBOX-2 (launch-triage.md item 12; shared consumers, one pass).
---
# ─── Identity ───────────────────────────────────────────────
id: CELLO-M8C-SESSION-001
domain: Session Lifecycle
milestone: M8C
actor: CLIENT
priority: P1
components:
  - daemon
  - client

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO Client (the daemon),
  I want a terminal (sealed) session's content to never ring the doorbell as
  actionable work, so that an agent can never mistake a directive from a finished
  conversation for a live one — while the record itself stays honest and complete.

# ─── Behavior (EARS) ───────────────────────────────────────
behavior:
  - trigger: "When content for a session is recovered/ingested (via watermark advance or content.recover) and that session's status is already terminal (sealed, abandoned)"
    action: "the daemon shall confirm-delete the recovered content from the pending/recovery path AND write it to a post-seal annex, in that order (annex write strictly before confirm-delete, so a crash between them cannot produce silent loss)"
  - trigger: "While content sits in the post-seal annex"
    action: "the client shall never surface it in any wake path, any doorbell notification, or any pending-work count — it is reachable only by an explicit operator read"
  - trigger: "If content.recover.ingest_failed would otherwise loop (counterparty_unknown or session_committed) because the content is verified but refused"
    action: "the daemon shall give it a terminal disposition — annex + confirm-delete — instead of leaving it to retry forever"
  - trigger: "Where content cannot be attributed to a session (counterparty_unknown)"
    action: "the daemon shall still key the annex entry on (recipient pubkey, content hash) — the signed park envelope makes the signer verifiable even without a resolved session"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "A sealed session with a message that was unread at seal time"
    when: "the daemon restarts and that message's content is recovered (matching the live 2026-08-05 repro: `message.watermark.advanced` firing with a fresh timestamp for the old sequence)"
    then: "no doorbell/wake notification fires for this session, and it does not appear in any pending-work or unread-actionable count — while `cello_transcript` for the session still shows the message, unchanged, inside the sealed tree"
    test_type: integration
    component_under_test: daemon

  - id: AC-002
    given: "The exact live repro: a session carrying a directive (`[[STANDBY EST:15m]]`) that sealed before the standby expired"
    when: "the session's content re-enters recovery after the daemon restarts, hours after the standby window expired"
    then: "the agent-facing surface (notification-handlers.ts, session-read-handlers.ts, the receptionist skill) does not present this as something requiring a response; an agent polling/receiving cannot observe it as live work"
    test_type: integration
    component_under_test: daemon

  - id: AC-003
    given: "The live repro from the Hermes EC2 daemon: `content.recover.ingest_failed` looping on `counterparty_unknown` (78 occurrences, session `6aa3f24b…`) and on `session_committed` (43 occurrences, session `34a6edbf…`)"
    when: "the disposition fix runs"
    then: "both branches reach a terminal disposition — confirm-deleted from the retry/recovery path, present in the annex — and `content.recover.ingest_failed` stops repeating for that content hash on the next recovery pass"
    test_type: integration
    component_under_test: daemon

  - id: AC-004
    given: "Content reaches the annex-or-delete disposition step"
    when: "the daemon writes the annex entry and then confirm-deletes the source (recovery/retry) copy"
    then: "if the process is killed between the two writes, the next startup finds the content still present via the annex — never in a state where both copies are gone (verifies constraint: annex write strictly before confirm-delete)"
    test_type: integration
    component_under_test: daemon

  - id: AC-005
    given: "A sealed session whose `sealed_root` was computed before this fix runs"
    when: "content for that session is later annexed"
    then: "`sealed_root` is unchanged and `cello_sealed_receipt` still verifies — the annex lives structurally outside the sealed tree, never appended to it"
    test_type: integration
    component_under_test: daemon

# ─── Security Invariants ───────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "The client shall never let an agent obey a directive delivered inside a session that is already terminal"
    adversarial_condition: "even when the directive is well-formed, references a real prior conversation, and the agent has no independent way to check the session's status before acting on it — the exact shape of the live 2026-08-05 incident"
    test_type: integration
    component_under_test: client

  - id: SI-002
    statement: "The annex shall never borrow the seal's evidentiary vocabulary"
    adversarial_condition: "even when annex content is individually verified (signed, hash-matched) — it must not be presented under `sealed_root` or any field name implying directory notarization, since it sits outside the notarized tree"
    test_type: unit
    component_under_test: daemon

# ─── Observability ─────────────────────────────────────────
observability:
  events:
    - name: "session.terminal.content.annexed"
      level: info
      trigger: "recovered/ingested content for a terminal session is written to the post-seal annex and confirm-deleted from the pending path"
      context_fields: [sessionId, contentHash, recipientPubkey, reason]
      correlationId: true
  error_events:
    - name: "session.terminal.content.annex_failed"
      level: error
      trigger: "the annex write fails, so confirm-delete of the source copy must NOT proceed (ordering invariant from AC-004)"
      context_fields: [sessionId, contentHash, error]
  alarms:
    - condition: "session.terminal.content.annex_failed fires at all"
      fires_to: "ops-agent Telegram channel"

# ─── References ─────────────────────────────────────────────
references:
  protocol_map: "Session Lifecycle"
  discussion_logs: []
  # Disposition policy already agreed 2026-08-05 with Miss_Chelly (daemon side, M12-P14) — see
  # launch-triage.md item 12 for the four constraints this story implements verbatim: (1)
  # inertness must be structural not advisory, (2) must not borrow the seal's vocabulary, (3)
  # durable annex write strictly before confirm-delete, (4) key on (recipient pubkey, content
  # hash), session attribution optional. Shares consumers with DOD-SEALED-INBOX-2
  # (notification-handlers.ts, session-read-handlers.ts, session-node-manager.ts,
  # plugins/cello/skills/receptionist/SKILL.md) — implement in the same pass; that item's
  # per-row `status` field is a precondition here since a consumer cannot suppress what it
  # cannot distinguish.
