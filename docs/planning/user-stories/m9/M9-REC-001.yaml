# ─── Identity ───────────────────────────────────────────────
id: M9-REC-001
domain: Security Gateway
actor: CLIENT
priority: P0
components:
  - gateway

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the security gateway, I want to record what I did to every message and compute a
  fingerprint of each record, so that there is a complete local audit of screening — without
  storing the sensitive content I caught — ready to be attested to the directory in Phase 2.

# ─── Behavior (EARS) ───────────────────────────────────────
behavior:
  - trigger: "When the gateway finishes screening a message (inbound or outbound)"
    action: "the gateway shall write one security-pass record — the layers/checks that ran,
      their outcomes, and the disposition — to its own store, and compute a fingerprint of the
      record"
  - trigger: "When the message passed clean with no change"
    action: "the gateway shall still write a record (a clean pass), so absence of a record is
      detectable later"
  - trigger: "When a record references content that was flagged or redacted"
    action: "the gateway shall store the rule/category, offset, and fingerprint — never the raw
      flagged value"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "a sequence of messages screened to clean / redacted / blocked / warned"
    when: "screening completes for each"
    then: "exactly one record per message exists, each with a fingerprint — including the clean
      ones (no record is skipped for a clean pass)"
    test_type: integration
    component_under_test: gateway

  - id: AC-002
    given: "an outbound message whose record covers a redacted AWS secret"
    when: "the record is written and read back"
    then: "the record holds the detector rule/category, the offset, and the fingerprint, and
      the raw secret value appears nowhere in the record"
    test_type: integration
    component_under_test: gateway

  - id: AC-003
    given: "records written, then the gateway restarted"
    when: "the gateway reloads"
    then: "the records are present and queryable after restart, with fingerprints intact"
    test_type: integration
    component_under_test: gateway

# ─── Security Invariants ───────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "a security-pass record shall never contain the raw sensitive payload it screened
      (the secret, the PII value, the injection string)"
    adversarial_condition: "even for a message that was blocked specifically because it carried
      a credential — the record proves THAT it was caught (rule + fingerprint), never WHAT the
      value was"
    test_type: integration
    component_under_test: gateway

# ─── References ─────────────────────────────────────────────
references:
  protocol_map: "Security and Prompt Injection Defense"
  end_to_end_flow: "§7.1"
  discussion_logs:
    - "2026-05-28_1000_security-layer-v3-extensibility-and-split-gateway"

# ─── Implementation notes ──────────────────────────────────
implementation_notes: >
  Local security-pass records (M9-DEFINITION-OF-DONE Phase 1). The CHEAP half of #5: the gateway
  records what it did and computes a fingerprint per record (Infisical's strip-payload-before-
  persist + clean-passes-recorded patterns, M9-CAPABILITY-HARVEST §4). Sending the fingerprint to
  the directory + the directory table + the check job is Phase 2 (M9-ATTEST-001). Records live in
  the gateway's own store (M9-CFG-001's DB or a sibling). Per V3, a separate diff-record table may
  hold the actual removed content under access control — but the security-pass RECORD itself never
  does (SI-001). Flag fingerprint (bytes) for serialization round-trip (AC-003).
