# ─── Identity ───────────────────────────────────────────────
id: M9-REMOTE-001
domain: Security Gateway
actor: CLIENT
priority: P1
components:
  - client
  - gateway

# ─── Intent ─────────────────────────────────────────────────
story: >
  As the CELLO CLIENT, I want to reach the security gateway as a remote service over mTLS, so
  that a company can run the gateway on infrastructure the employee cannot modify — without
  changing how the daemon screens.

# ─── Behavior (EARS) ───────────────────────────────────────
behavior:
  - trigger: "When CELLO_ENV selects a remote gateway"
    action: "the daemon shall reach it through the same SecurityGatewayClient interface, over a
      mutually-authenticated TLS connection, with config living at the remote gateway"
  - trigger: "When the client presents an invalid or absent client certificate"
    action: "the gateway shall refuse the connection"
  - trigger: "When the employee (client side) attempts to change gateway config"
    action: "the gateway shall reject it — config is controlled at the gateway, not the client"

# ─── Acceptance Criteria ────────────────────────────────────
acceptance_criteria:
  - id: AC-001
    given: "a daemon configured with a remote gateway and a valid client certificate"
    when: "the agent sends a message"
    then: "the message is screened by the remote gateway over a real mTLS connection (both
      sides authenticated) and the verdict comes back through the same feedback channel as
      local mode — the SecurityGatewayClient interface is unchanged, only the implementation"
    test_type: e2e
    component_under_test: gateway

  - id: AC-002
    given: "a client with no valid certificate"
    when: "it attempts to connect to the remote gateway"
    then: "the gateway refuses the connection — an unauthenticated client cannot be screened or
      reach the gateway at all"
    test_type: e2e
    component_under_test: gateway

# ─── Security Invariants ───────────────────────────────────
security_invariants:
  - id: SI-001
    statement: "the client shall not be able to read or modify the remote gateway's config or
      records"
    adversarial_condition: "even when the employee controls the entire client machine — the
      gateway runs on separate infrastructure and exposes no config/record write to the client;
      the mTLS surface only carries screen requests and verdicts"
    test_type: e2e
    component_under_test: gateway

# ─── References ─────────────────────────────────────────────
references:
  protocol_map: "Security and Prompt Injection Defense"
  end_to_end_flow: "§7.1"
  discussion_logs:
    - "2026-05-28_1000_security-layer-v3-extensibility-and-split-gateway"

# ─── Implementation notes ──────────────────────────────────
implementation_notes: >
  Phase 2 remote gateway (M9-CAPABILITY-HARVEST §9, V3 enterprise split-deployment). The local
  vs remote split is an adapter swap behind SecurityGatewayClient — the daemon code is unchanged
  from Phase 1; only the transport implementation differs (local socket → mTLS). Reuse the
  Infisical gateway mTLS pattern (per-org ephemeral CA, KMS-wrapped per-identity creds,
  M9-CAPABILITY-HARVEST §4). Only companies need this; an individual launch ships Phase 1 only.
