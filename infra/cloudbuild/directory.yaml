# Cloud Build — CELLO directory image → Artifact Registry.
# Run by trigger (COMMIT_SHA set) or manually:
#   gcloud builds submit --config infra/cloudbuild/directory.yaml \
#     --service-account projects/cello-infra/serviceAccounts/cello-cloud-build@cello-infra.iam.gserviceaccount.com \
#     --substitutions _TAG=manual-$(git rev-parse --short HEAD) .
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s

substitutions:
  _REGISTRY: us-east1-docker.pkg.dev/cello-infra/cello
  _TAG: ${COMMIT_SHA}

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - packages/directory/Dockerfile
      - -t
      - ${_REGISTRY}/directory:${_TAG}
      - -t
      - ${_REGISTRY}/directory:latest
      - .

images:
  - ${_REGISTRY}/directory:${_TAG}
  - ${_REGISTRY}/directory:latest
