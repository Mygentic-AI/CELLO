# Cloud Build — CELLO relay image → Artifact Registry.
#
# Built by the `cello-relay-image` trigger (region us-east1 — a `gcloud builds list` with no
# --region returns a different, stale set) on push to main touching this file's includedFiles.
# COMMIT_SHA is set by the trigger and becomes the immutable tag consumers pin.
#
# The trigger runs as cello-cloud-build@, and that account needs roles/cloudbuild.builds.builder
# to create a build at all — without it push events die at creation and leave NO build record,
# so the failure looks like "the trigger never fired". Declared in infra/terraform/iam.tf.
#
# That grant is restored and both triggers were recreated on 2026-08-05. A push then STILL produced
# no build and no denied-attempt audit entry — the event was not reaching Cloud Build at all (the
# SA half was fixed; the delivery half was not). Tracked as M12-P11.
#
# PROBE 2 — 2026-08-06. The first re-authorization (2026-08-05) did NOT restore event delivery: the
# probe push landed on origin/main touching this file and produced no build and no denied-attempt
# audit entry. The operator re-completed the OAuth again; this edit is the second probe. Same
# distinguishing test: a trigger-fired build has substitutions.TRIGGER_NAME SET, a manual
# `builds submit` leaves it EMPTY — every build in this project is currently empty, which is why
# "a build succeeded" has never been evidence the trigger fired.
#
# 2026-08-05, earlier: the GitHub App OAuth was re-authorized by the operator; the connection reports
# installationState COMPLETE and the CELLO repo is linked. THIS EDIT IS THE TEST — this file is in
# the relay trigger's includedFiles, so a push carrying it must produce a trigger-fired build (one
# with TRIGGER_NAME set, unlike a manual `builds submit`). If it does, M12-P11 is closed; if it does
# not, the event delivery is still broken and the connection state is not evidence of it.
#
# While M12-P11 is open, build a merged revision with:
#   gcloud builds submit \
#     "projects/cello-infra/locations/us-east1/connections/cello-github/repositories/CELLO" \
#     --revision=<SHA> --region=us-east1 --config=infra/cloudbuild/relay.yaml \
#     --service-account=projects/cello-infra/serviceAccounts/cello-cloud-build@cello-infra.iam.gserviceaccount.com \
#     --substitutions=_TAG=<SHA>
#
# A manual `gcloud builds submit` of a LOCAL tree is a last resort: the tag then names a commit
# whose contents were never proven to match, which has already cost this milestone a demoted
# claim. If you must, submit from a clean checkout of the SHA and say so where you claim it.
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s

substitutions:
  _REGISTRY: us-east1-docker.pkg.dev/cello-infra/cello
  _TAG: ${COMMIT_SHA}

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - packages/relay/Dockerfile
      - -t
      - ${_REGISTRY}/relay:${_TAG}
      - .

# No :latest tag on purpose: two concurrent builds finishing out of order would leave :latest
# older than main. Every consumer pins an immutable ${_TAG} (= commit SHA) tag.
images:
  - ${_REGISTRY}/relay:${_TAG}
