AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CELLO CI/CD - GitHub webhook Lambda, pipeline-filter Lambda, EventBridge bus,
  and per-package CodePipelines. Deployed in us-east-1 only.
  Completely independent of cello-agent CI/CD infrastructure (SI-003).

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, production]
    Description: Deployment environment
  GitHubRepo:
    Type: String
    Default: "Mygentic-AI/CELLO"
    Description: GitHub repository (owner/repo)
  GitHubBranch:
    Type: String
    Default: "main"
    Description: Branch to monitor
  GitHubConnectionArn:
    Type: String
    Description: CodeStar connection ARN for GitHub
  # DEPLOY-005 AC-009: staging directory ALB DNS name — read from cello-ecs-directory
  # stack output at deploy time; never hardcoded. deploy.sh populates this from
  # read_output "cello-ecs-directory-{env}" "AlbDnsName".
  StagingDirectoryUrl:
    Type: String
    Default: "PLACEHOLDER"
    Description: >
      DNS name of the staging directory ALB (read from cello-ecs-directory stack outputs
      by deploy.sh — AC-009 requires this is never hardcoded in this template).

Resources:
  # EventBridge bus for GitHub events
  GitHubEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "cello-github-events-${Environment}"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # S3 artifacts bucket for CodePipeline
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      # CI/CD infrastructure is shared across all environments (one deployment).
      # The bucket name is fixed per AC-001: cello-codepipeline-artifacts-us-east-1.
      # This template is deployed once in us-east-1 — not per-environment.
      BucketName: !Sub "cello-codepipeline-artifacts-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireArtifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: cello

  # IAM role for webhook Lambda
  WebhookLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cello-webhook-lambda-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EventBridgePut
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt GitHubEventBus.Arn
        - PolicyName: SecretsManagerHmac
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/pipeline/github-hmac-secret*"
      Tags:
        - Key: Project
          Value: cello

  # Webhook receiver Lambda
  WebhookLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "cello-github-webhook-receiver-${Environment}"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt WebhookLambdaRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          EVENT_BUS_NAME: !Ref GitHubEventBus
          HMAC_SECRET_ID: !Sub "cello/${Environment}/pipeline/github-hmac-secret"
      Code:
        ZipFile: |
          """
          GitHub webhook receiver - validates HMAC signature, forwards to EventBridge.
          Actual implementation deployed via CI; this is the bootstrap placeholder.
          """
          def handler(event, context):
              return {"statusCode": 200, "body": "placeholder"}
      Tags:
        - Key: Project
          Value: cello

  # Webhook Lambda URL (public HTTPS endpoint for GitHub)
  WebhookLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt WebhookLambda.Arn

  WebhookLambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt WebhookLambda.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # IAM role for pipeline-filter Lambda
  PipelineFilterLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cello-pipeline-filter-lambda-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: StartPipelines
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codepipeline:StartPipelineExecution
                # SI-003: Explicit named pipeline ARNs — no wildcard resource.
                # Wildcard access (cello-*-pipeline) would allow triggering
                # unrelated pipelines. Every new pipeline requires an explicit
                # entry here.
                Resource:
                  - !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:cello-crypto-pipeline"
                  - !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:cello-protocol-types-pipeline"
                  - !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:cello-transport-pipeline"
                  - !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:cello-client-pipeline"
                  - !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:cello-adapter-claude-code-pipeline"
                  - !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:cello-directory-pipeline"
                  - !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:cello-relay-pipeline"
                  - !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:cello-e2e-tests-pipeline"
      Tags:
        - Key: Project
          Value: cello

  # Pipeline filter Lambda
  PipelineFilterLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "cello-pipeline-filter-${Environment}"
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt PipelineFilterLambdaRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          """
          Pipeline filter - inspects commit paths, triggers matching CodePipelines.
          Actual implementation deployed via CI; this is the bootstrap placeholder.
          """
          def handler(event, context):
              return {"statusCode": 200, "body": "placeholder"}
      Tags:
        - Key: Project
          Value: cello

  # EventBridge rule: forward GitHub push events to pipeline-filter Lambda
  PipelineFilterRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "cello-github-push-to-filter-${Environment}"
      EventBusName: !Ref GitHubEventBus
      EventPattern:
        source:
          - "cello.github"
        detail-type:
          - "push"
      Targets:
        - Id: PipelineFilterTarget
          Arn: !GetAtt PipelineFilterLambda.Arn

  PipelineFilterLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PipelineFilterLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PipelineFilterRule.Arn

  # IAM roles for CodeBuild and CodePipeline
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cello-codebuild-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/cello-*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${ArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::cello-audit-logs-${Environment}-${AWS::Region}/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::cello-audit-logs-${Environment}-${AWS::Region}"
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource:
                  - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/cello-directory"
                  - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/cello-relay"
              # ── ECS deploy permissions (DEPLOY-003 + DEPLOY-005) ─────────────────
              # Required for buildspec docker build → ECR push → ECS rolling deploy.
              # RegisterTaskDefinition + UpdateService + DescribeServices/TaskDefinition
              # allow the buildspec to register a new task revision and deploy it.
              # iam:PassRole is required so CodeBuild can pass the ECS task execution
              # role (AmazonECSTaskExecutionRolePolicy) to the new task definition.
              # DEPLOY-005: adds cross-region ECS deploy (us-east-1, eu-central-1,
              # ap-northeast-1) in the ProductionDeploy stage. Resource: "*" covers
              # all clusters and services across all regions under this account.
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/cello-${Environment}-directory-execution-role"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/cello-${Environment}-directory-task-role"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/cello-${Environment}-relay-execution-role"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/cello-${Environment}-relay-task-role"
              # ── CloudFormation read-only for ALB URL (DEPLOY-005 AC-009) ───────────
              # StagingDeployBuild reads AlbDnsName from cello-ecs-directory stack output
              # to pass STAGING_DIRECTORY_URL to the smoke test stage.
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/cello-ecs-directory-${Environment}/*"
      Tags:
        - Key: Project
          Value: cello

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cello-codepipeline-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub "${ArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/cello-*"
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref GitHubConnectionArn
      Tags:
        - Key: Project
          Value: cello

  # CodeBuild projects and CodePipelines (8 total, one per package)
  CryptoBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: cello-crypto-build
      Source:
        Type: CODEPIPELINE
        BuildSpec: packages/crypto/buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
      ServiceRole: !GetAtt CodeBuildRole.Arn

  ProtocolTypesBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: cello-protocol-types-build
      Source:
        Type: CODEPIPELINE
        BuildSpec: packages/protocol-types/buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
      ServiceRole: !GetAtt CodeBuildRole.Arn

  TransportBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: cello-transport-build
      Source:
        Type: CODEPIPELINE
        BuildSpec: packages/transport/buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
      ServiceRole: !GetAtt CodeBuildRole.Arn

  ClientBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: cello-client-build
      Source:
        Type: CODEPIPELINE
        BuildSpec: packages/client/buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
      ServiceRole: !GetAtt CodeBuildRole.Arn

  AdapterClaudeCodeBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: cello-adapter-claude-code-build
      Source:
        Type: CODEPIPELINE
        BuildSpec: packages/adapter-claude-code/buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
      ServiceRole: !GetAtt CodeBuildRole.Arn

  DirectoryBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: cello-directory-build
      Source:
        Type: CODEPIPELINE
        BuildSpec: packages/directory/buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
        EnvironmentVariables:
          - Name: CELLO_AUDIT_BUCKET
            Value: cello-audit-logs-dev-us-east-1
      ServiceRole: !GetAtt CodeBuildRole.Arn

  RelayBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: cello-relay-build
      Source:
        Type: CODEPIPELINE
        BuildSpec: packages/relay/buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
      ServiceRole: !GetAtt CodeBuildRole.Arn

  E2eTestsBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: cello-e2e-tests-build
      Source:
        Type: CODEPIPELINE
        BuildSpec: packages/e2e-tests/buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
      ServiceRole: !GetAtt CodeBuildRole.Arn

  # ── DEPLOY-005: Staging deploy, smoke test, and production deploy CodeBuild projects ──

  # StagingDeployBuild: deploys the built image to the staging ECS service (dev = staging in Phase 1).
  # This is a separate CodeBuild project from DirectoryBuild to isolate deploy logic from test logic.
  # Emits: pipeline.staging.deployed (INFO), pipeline.staging.deploy.failed (ERROR)
  # No VpcConfig — runs outside the VPC, calls ECS API.
  StagingDeployDirectoryBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: cello-staging-deploy-directory-build
      # P — Pseudocode:
      # 1. Read STAGING_IMAGE_URI from env (set by CodePipeline from Build stage output)
      # 2. Run: aws ecs describe-task-definition cello-directory-{env} → clone → swap image URI
      # 3. Register new task revision
      # 4. Run: aws ecs update-service --cluster cello-{env} --service cello-directory-{env}
      # 5. Run: aws ecs wait services-stable (10-minute timeout)
      # 6. On success: emit pipeline.staging.deployed {pipeline, commitSha, imageDigest, durationMs}
      # 7. On failure: emit pipeline.staging.deploy.failed {pipeline, commitSha, reason}; exit 1
      #
      # NO_SOURCE is correct here: this project performs only AWS API calls (ecs describe-task-definition,
      # register-task-definition, update-service, wait services-stable) and does not need any repository
      # source code. The aws CLI and jq are pre-installed in aws/codebuild/standard:7.0.
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - export START_MS=$(date +%s%3N)
                - |
                  set -euo pipefail
                  TASK_DEF=$(aws ecs describe-task-definition \
                    --task-definition cello-directory-${CELLO_ENV} \
                    --region us-east-1 \
                    --query "taskDefinition" --output json)
                  NEW_TASK_DEF=$(echo $TASK_DEF | jq \
                    --arg IMAGE "$STAGING_IMAGE_URI" \
                    '(.containerDefinitions[] | select(.name=="directory") | .image) |= $IMAGE
                    | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)')
                  NEW_TASK_ARN=$(aws ecs register-task-definition \
                    --region us-east-1 \
                    --cli-input-json "$NEW_TASK_DEF" \
                    --query "taskDefinition.taskDefinitionArn" --output text)
                  aws ecs update-service \
                    --cluster cello-${CELLO_ENV} \
                    --service cello-directory-${CELLO_ENV} \
                    --task-definition $NEW_TASK_ARN \
                    --region us-east-1 || {
                      echo '{"event":"pipeline.staging.deploy.failed","pipeline":"cello-directory-pipeline","commitSha":"'${COMMIT_SHA}'","reason":"ecs update-service failed"}'
                      exit 1
                    }
                  # Wait for stable state (AC-001: 10-minute timeout = 40 polls * 15s)
                  aws ecs wait services-stable \
                    --cluster cello-${CELLO_ENV} \
                    --services cello-directory-${CELLO_ENV} \
                    --region us-east-1 || {
                      echo '{"event":"pipeline.staging.deploy.failed","pipeline":"cello-directory-pipeline","commitSha":"'${COMMIT_SHA}'","reason":"ecs wait services-stable timed out"}'
                      exit 1
                    }
                  END_MS=$(date +%s%3N)
                  DURATION_MS=$((END_MS - START_MS))
                  echo '{"timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","event":"pipeline.staging.deployed","pipeline":"cello-directory-pipeline","commitSha":"'${COMMIT_SHA}'","imageDigest":"'${STAGING_IMAGE_URI}'","durationMs":'${DURATION_MS}'}'
                  # Note: STAGING_DIRECTORY_URL is passed to SmokeTestBuild via the
                  # StagingDirectoryUrl CloudFormation parameter (read from
                  # cello-ecs-directory stack output by deploy.sh at deploy time).
                  # No inter-container file passing is needed or possible — each
                  # CodeBuild action runs in an isolated container.
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
        EnvironmentVariables:
          - Name: CELLO_ENV
            Value: !Ref Environment
      ServiceRole: !GetAtt CodeBuildRole.Arn

  StagingDeployRelayBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: cello-staging-deploy-relay-build
      # P — Pseudocode: same as StagingDeployDirectoryBuild but for relay service
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - export START_MS=$(date +%s%3N)
                - |
                  set -euo pipefail
                  TASK_DEF=$(aws ecs describe-task-definition \
                    --task-definition cello-relay-${CELLO_ENV} \
                    --region us-east-1 \
                    --query "taskDefinition" --output json)
                  NEW_TASK_DEF=$(echo $TASK_DEF | jq \
                    --arg IMAGE "$STAGING_IMAGE_URI" \
                    '(.containerDefinitions[] | select(.name=="relay") | .image) |= $IMAGE
                    | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)')
                  NEW_TASK_ARN=$(aws ecs register-task-definition \
                    --region us-east-1 \
                    --cli-input-json "$NEW_TASK_DEF" \
                    --query "taskDefinition.taskDefinitionArn" --output text)
                  aws ecs update-service \
                    --cluster cello-${CELLO_ENV} \
                    --service cello-relay-${CELLO_ENV} \
                    --task-definition $NEW_TASK_ARN \
                    --region us-east-1 || {
                      echo '{"event":"pipeline.staging.deploy.failed","pipeline":"cello-relay-pipeline","commitSha":"'${COMMIT_SHA}'","reason":"ecs update-service failed"}'
                      exit 1
                    }
                  aws ecs wait services-stable \
                    --cluster cello-${CELLO_ENV} \
                    --services cello-relay-${CELLO_ENV} \
                    --region us-east-1 || {
                      echo '{"event":"pipeline.staging.deploy.failed","pipeline":"cello-relay-pipeline","commitSha":"'${COMMIT_SHA}'","reason":"ecs wait services-stable timed out"}'
                      exit 1
                    }
                  END_MS=$(date +%s%3N)
                  DURATION_MS=$((END_MS - START_MS))
                  echo '{"timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","event":"pipeline.staging.deployed","pipeline":"cello-relay-pipeline","commitSha":"'${COMMIT_SHA}'","imageDigest":"'${STAGING_IMAGE_URI}'","durationMs":'${DURATION_MS}'}'
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
        EnvironmentVariables:
          - Name: CELLO_ENV
            Value: !Ref Environment
      ServiceRole: !GetAtt CodeBuildRole.Arn

  # SmokeTestBuild: runs the 8-scenario smoke test suite against the staging ALB.
  # AC-006: NO VpcConfig — connects to staging via public ALB URL only.
  # STAGING_DIRECTORY_URL is injected by CodePipeline at action invocation (AC-009).
  # SI-002: receives SourceOutput artifact from the Build stage — no new build occurs.
  # Emits: pipeline.staging.smoke_test.passed (INFO), pipeline.staging.smoke_test.failed (ERROR)
  SmokeTestBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: cello-smoke-test-build
      # P — Pseudocode:
      # 1. Read STAGING_DIRECTORY_URL from env (injected by CodePipeline, not hardcoded)
      # 2. Install Node 24 + pnpm
      # 3. Run: pnpm --filter @cello/e2e-tests run typecheck (compile smoke/run-smoke-tests.ts)
      # 4. Run: node packages/e2e-tests/dist/smoke/run-smoke-tests.js
      # 5. Smoke runner emits pipeline.staging.smoke_test.passed or pipeline.staging.smoke_test.failed
      # 6. Exit code from runner propagates to CodeBuild (non-zero = pipeline fails)
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 24
              commands:
                - npm install -g pnpm@10.33.2
                - pnpm install --frozen-lockfile
            build:
              commands:
                - export START_MS=$(date +%s%3N)
                - pnpm --filter @cello/crypto run typecheck
                - pnpm --filter @cello/interfaces run typecheck
                - pnpm --filter @cello/protocol-types run typecheck
                - pnpm --filter @cello/transport run typecheck
                - pnpm --filter @cello/client run typecheck
                - pnpm --filter @cello/e2e-tests run typecheck
                # Run smoke tests against the staging ALB URL
                # STAGING_DIRECTORY_URL is set by CodePipeline EnvironmentVariableOverride
                - node packages/e2e-tests/dist/smoke/run-smoke-tests.js
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
        # AC-006: NO VpcConfig on this project — smoke test connects via public ALB URL
        # AC-009: STAGING_DIRECTORY_URL is set here from the StagingDirectoryUrl parameter,
        # which deploy.sh reads from cello-ecs-directory stack output AlbDnsName.
        # This is never a hardcoded .elb.amazonaws.com string.
        EnvironmentVariables:
          - Name: STAGING_DIRECTORY_URL
            Value: !Ref StagingDirectoryUrl
      ServiceRole: !GetAtt CodeBuildRole.Arn
      # AC-006: explicitly no VpcConfig — do not add one

  # ProductionDeployBuild: deploys the same image digest to production ECS services.
  # SI-002: receives the image URI from Build stage — same digest, no new build.
  # AC-007: sequential deploy — us-east-1 first, then eu-central-1, then ap-northeast-1.
  # Each region waits for services-stable before the next region starts (RunOrder in pipeline).
  # Emits: pipeline.production.deployed (INFO), pipeline.production.deploy.failed (ERROR)
  ProductionDeployBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: cello-production-deploy-build
      # P — Pseudocode:
      # 1. Receive DEPLOY_REGION (us-east-1 | eu-central-1 | ap-northeast-1) from env
      # 2. Receive PROD_IMAGE_URI from env (same digest from Build stage — SI-002)
      # 3. Receive SERVICE_NAME (cello-directory | cello-relay) from env
      # 4. export START_MS
      # 5. Clone task def, swap image, register new revision
      # 6. aws ecs update-service --region $DEPLOY_REGION
      # 7. aws ecs wait services-stable --region $DEPLOY_REGION (10-min timeout)
      # 8. On success: emit pipeline.production.deployed {pipeline, region, commitSha, imageDigest, durationMs}
      # 9. On failure: emit pipeline.production.deploy.failed {pipeline, region, commitSha, reason}; exit 1
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - export START_MS=$(date +%s%3N)
                - |
                  set -euo pipefail
                  CLUSTER="cello-${CELLO_ENV}"
                  SERVICE="${SERVICE_NAME}-${CELLO_ENV}"
                  TASK_FAMILY="${SERVICE_NAME}-${CELLO_ENV}"
                  CONTAINER_NAME=$(echo ${SERVICE_NAME} | sed 's/cello-//')
                  TASK_DEF=$(aws ecs describe-task-definition \
                    --task-definition ${TASK_FAMILY} \
                    --region ${DEPLOY_REGION} \
                    --query "taskDefinition" --output json)
                  NEW_TASK_DEF=$(echo $TASK_DEF | jq \
                    --arg IMAGE "$PROD_IMAGE_URI" \
                    --arg CONTAINER "${CONTAINER_NAME}" \
                    '(.containerDefinitions[] | select(.name==$CONTAINER) | .image) |= $IMAGE
                    | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)')
                  NEW_TASK_ARN=$(aws ecs register-task-definition \
                    --region ${DEPLOY_REGION} \
                    --cli-input-json "$NEW_TASK_DEF" \
                    --query "taskDefinition.taskDefinitionArn" --output text)
                  aws ecs update-service \
                    --cluster ${CLUSTER} \
                    --service ${SERVICE} \
                    --task-definition $NEW_TASK_ARN \
                    --region ${DEPLOY_REGION} || {
                      echo '{"event":"pipeline.production.deploy.failed","pipeline":"'${SERVICE_NAME}'-pipeline","region":"'${DEPLOY_REGION}'","commitSha":"'${COMMIT_SHA}'","reason":"ecs update-service failed"}'
                      exit 1
                    }
                  # Wait up to 10 minutes for stable state before next region starts (AC-007)
                  aws ecs wait services-stable \
                    --cluster ${CLUSTER} \
                    --services ${SERVICE} \
                    --region ${DEPLOY_REGION} || {
                      echo '{"event":"pipeline.production.deploy.failed","pipeline":"'${SERVICE_NAME}'-pipeline","region":"'${DEPLOY_REGION}'","commitSha":"'${COMMIT_SHA}'","reason":"ecs wait services-stable timed out after 10 minutes"}'
                      exit 1
                    }
                  END_MS=$(date +%s%3N)
                  DURATION_MS=$((END_MS - START_MS))
                  echo '{"timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","event":"pipeline.production.deployed","pipeline":"'${SERVICE_NAME}'-pipeline","region":"'${DEPLOY_REGION}'","commitSha":"'${COMMIT_SHA}'","imageDigest":"'${PROD_IMAGE_URI}'","durationMs":'${DURATION_MS}'}'
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
        EnvironmentVariables:
          - Name: CELLO_ENV
            Value: !Ref Environment
          # DEPLOY_REGION and SERVICE_NAME have no meaningful defaults — they are always
          # overridden by CodePipeline action EnvironmentVariables at runtime.
          # Setting them to OVERRIDE_AT_RUNTIME makes this intent explicit and prevents
          # accidental runs against a hardcoded us-east-1 or cello-directory target.
          - Name: DEPLOY_REGION
            Value: "OVERRIDE_AT_RUNTIME"
          - Name: SERVICE_NAME
            Value: "OVERRIDE_AT_RUNTIME"
      ServiceRole: !GetAtt CodeBuildRole.Arn

  # CodePipelines (one per package)
  CryptoPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      PipelineType: V2
      Name: cello-crypto-pipeline
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref GitHubRepo
                BranchName: !Ref GitHubBranch
                DetectChanges: "false"
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CryptoBuild
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput

  ProtocolTypesPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      PipelineType: V2
      Name: cello-protocol-types-pipeline
      RoleArn: !GetAtt CodePipelineRole.Arn
