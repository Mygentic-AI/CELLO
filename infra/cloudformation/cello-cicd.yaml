  DirectoryPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      PipelineType: V2
      Name: cello-directory-pipeline
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref GitHubRepo
                BranchName: !Ref GitHubBranch
                DetectChanges: "false"
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref DirectoryBuild
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              # V2 variable export: IMAGE_URI is set via exported-variables in buildspec.yml.
              # Downstream stages reference it as #{BuildAction.IMAGE_URI}.
              OutputVariables:
                - IMAGE_URI
        # DEPLOY-005 Stage 3: Deploy built image to staging ECS (dev = staging in Phase 1)
        # AC-001: staging deploy uses same image digest from Build stage
        # AC-005: pipeline halts here if staging deploy fails (smoke test never runs)
        - Name: StagingDeploy
          Actions:
            - Name: StagingDeployAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref StagingDeployDirectoryBuild
                # #{BuildAction.IMAGE_URI} resolves from the exported-variables declared in
                # packages/directory/buildspec.yml post_build phase (DEPLOY-005 review fix).
                EnvironmentVariables: >
                  [{"name":"STAGING_IMAGE_URI","value":"#{BuildAction.IMAGE_URI}","type":"PLAINTEXT"},
                   {"name":"COMMIT_SHA","value":"#{SourceVariables.CommitId}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: BuildOutput
              # No OutputArtifacts: StagingDeployDirectoryBuild has Artifacts.Type=NO_ARTIFACTS.
              # Declaring OutputArtifacts on a NO_ARTIFACTS project causes a pipeline validation error.
        # DEPLOY-005 Stage 4: Smoke test against staging ALB
        # AC-002: 8-scenario smoke suite runs as separate process (no VPC, no direct DB access)
        # AC-004/SI-001: production deploy stage will not run if this stage fails
        # AC-009: STAGING_DIRECTORY_URL is set at the CodeBuild project level from the
        # StagingDirectoryUrl CloudFormation parameter (deploy.sh reads cello-ecs-directory-{env}
        # stack output AlbDnsName and passes it as StagingDirectoryUrl at deploy time).
        # No pipeline-level override is needed — the project env var is already correct.
        - Name: SmokeTest
          Actions:
            - Name: SmokeTestAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref SmokeTestBuild
                EnvironmentVariables: >
                  [{"name":"COMMIT_SHA","value":"#{SourceVariables.CommitId}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: SmokeTestOutput
        # DEPLOY-005 Stage 5: Production deploy — sequential multi-region (AC-003, AC-007)
        # SI-001: this stage only runs if SmokeTest stage completed with passing status
        # SI-002: same image URI from Build stage passed through (no new build)
        # RunOrder ensures sequencing within stage: us-east-1(1) → eu-central-1(2) → ap-northeast-1(3)
        # #{BuildAction.IMAGE_URI} resolves the exported variable from packages/directory/buildspec.yml.
        - Name: ProductionDeploy
          Actions:
            - Name: ProductionDeployUsEast1
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              RunOrder: 1
              Configuration:
                ProjectName: !Ref ProductionDeployBuild
                EnvironmentVariables: >
                  [{"name":"DEPLOY_REGION","value":"us-east-1","type":"PLAINTEXT"},
                   {"name":"SERVICE_NAME","value":"cello-directory","type":"PLAINTEXT"},
                   {"name":"PROD_IMAGE_URI","value":"#{BuildAction.IMAGE_URI}","type":"PLAINTEXT"},
                   {"name":"COMMIT_SHA","value":"#{SourceVariables.CommitId}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: BuildOutput
            - Name: ProductionDeployEuCentral1
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              RunOrder: 2
              Configuration:
                ProjectName: !Ref ProductionDeployBuild
                EnvironmentVariables: >
                  [{"name":"DEPLOY_REGION","value":"eu-central-1","type":"PLAINTEXT"},
                   {"name":"SERVICE_NAME","value":"cello-directory","type":"PLAINTEXT"},
                   {"name":"PROD_IMAGE_URI","value":"#{BuildAction.IMAGE_URI}","type":"PLAINTEXT"},
                   {"name":"COMMIT_SHA","value":"#{SourceVariables.CommitId}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: BuildOutput
            - Name: ProductionDeployApNortheast1
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              RunOrder: 3
              Configuration:
                ProjectName: !Ref ProductionDeployBuild
                EnvironmentVariables: >
                  [{"name":"DEPLOY_REGION","value":"ap-northeast-1","type":"PLAINTEXT"},
                   {"name":"SERVICE_NAME","value":"cello-directory","type":"PLAINTEXT"},
                   {"name":"PROD_IMAGE_URI","value":"#{BuildAction.IMAGE_URI}","type":"PLAINTEXT"},
                   {"name":"COMMIT_SHA","value":"#{SourceVariables.CommitId}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: BuildOutput

  RelayPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      PipelineType: V2
      Name: cello-relay-pipeline
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref GitHubRepo
                BranchName: !Ref GitHubBranch
                DetectChanges: "false"
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref RelayBuild
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              OutputVariables:
                - IMAGE_URI
        # DEPLOY-005: relay pipeline staging deploy + smoke test + production deploy
        - Name: StagingDeploy
          Actions:
            - Name: StagingDeployAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref StagingDeployRelayBuild
                # #{BuildAction.IMAGE_URI} resolves the exported variable from packages/relay/buildspec.yml.
                EnvironmentVariables: >
                  [{"name":"STAGING_IMAGE_URI","value":"#{BuildAction.IMAGE_URI}","type":"PLAINTEXT"},
                   {"name":"COMMIT_SHA","value":"#{SourceVariables.CommitId}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: BuildOutput
              # No OutputArtifacts: StagingDeployRelayBuild has Artifacts.Type=NO_ARTIFACTS.
              # Declaring OutputArtifacts on a NO_ARTIFACTS project causes a pipeline validation error.
        # Relay smoke test: verifies relay health endpoint at port 4000 behind ALB
        # Note: relay ALB is not exposed externally in Phase 1; smoke test uses directory endpoint
        # STAGING_DIRECTORY_URL is set at the CodeBuild project level from the StagingDirectoryUrl
        # CloudFormation parameter — no pipeline-level override needed.
        - Name: SmokeTest
          Actions:
            - Name: SmokeTestAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref SmokeTestBuild
                EnvironmentVariables: >
                  [{"name":"COMMIT_SHA","value":"#{SourceVariables.CommitId}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: SmokeTestOutput
        # #{BuildAction.IMAGE_URI} resolves the exported variable from packages/relay/buildspec.yml.
        - Name: ProductionDeploy
          Actions:
            - Name: ProductionDeployUsEast1
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              RunOrder: 1
              Configuration:
                ProjectName: !Ref ProductionDeployBuild
                EnvironmentVariables: >
                  [{"name":"DEPLOY_REGION","value":"us-east-1","type":"PLAINTEXT"},
                   {"name":"SERVICE_NAME","value":"cello-relay","type":"PLAINTEXT"},
                   {"name":"PROD_IMAGE_URI","value":"#{BuildAction.IMAGE_URI}","type":"PLAINTEXT"},
                   {"name":"COMMIT_SHA","value":"#{SourceVariables.CommitId}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: BuildOutput
            - Name: ProductionDeployEuCentral1
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              RunOrder: 2
              Configuration:
                ProjectName: !Ref ProductionDeployBuild
                EnvironmentVariables: >
                  [{"name":"DEPLOY_REGION","value":"eu-central-1","type":"PLAINTEXT"},
                   {"name":"SERVICE_NAME","value":"cello-relay","type":"PLAINTEXT"},
                   {"name":"PROD_IMAGE_URI","value":"#{BuildAction.IMAGE_URI}","type":"PLAINTEXT"},
                   {"name":"COMMIT_SHA","value":"#{SourceVariables.CommitId}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: BuildOutput
            - Name: ProductionDeployApNortheast1
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              RunOrder: 3
              Configuration:
                ProjectName: !Ref ProductionDeployBuild
                EnvironmentVariables: >
                  [{"name":"DEPLOY_REGION","value":"ap-northeast-1","type":"PLAINTEXT"},
                   {"name":"SERVICE_NAME","value":"cello-relay","type":"PLAINTEXT"},
                   {"name":"PROD_IMAGE_URI","value":"#{BuildAction.IMAGE_URI}","type":"PLAINTEXT"},
                   {"name":"COMMIT_SHA","value":"#{SourceVariables.CommitId}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: BuildOutput

