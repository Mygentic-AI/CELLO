AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CELLO CloudWatch — alarms and dashboards for all regions.
  Deploys named alarms per region routed to cello-ops-critical or
  cello-ops-warning SNS topics, and one multi-region operations dashboard.
  Deploy order: AFTER cello-ecs-directory and cello-ecs-relay (alarm
  dimensions reference ECS service metrics that require those stacks first).

  Cross-stack dependency: RelayAlb5xxAlarm imports
  cello-${Environment}-relay-alb-arn via !ImportValue — this export is
  produced by cello-ecs-relay. If cello-cloudwatch is deployed or updated
  in isolation before cello-ecs-relay has been deployed to the same region,
  CloudFormation will fail with "Export not found". The deploy.sh ordering
  (Step 11 = cello-ecs-relay, Step 12 = cello-cloudwatch) enforces this
  constraint. Never deploy cello-cloudwatch in isolation in a fresh region.

  SECOPS-002: AC-001 (10 alarms), AC-002 (directory task count),
  AC-003 (checkpoint gap), AC-004 (multi-region dashboard),
  AC-005 (SNS topics with subscriptions), AC-006 (rds-storage ops-warning),
  AC-007 (all alarms IaC-only), AC-008 (deploy.sh inclusion).

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, production]
    Description: Deployment environment

  OpsEmail:
    Type: String
    Default: "ops@cello.mygentic.ai"
    Description: >
      Email address for ops notifications. This subscription must be
      confirmed by the recipient after the first deploy. Both SNS topics
      (ops-critical and ops-warning) send to this address.

  # ── Dashboard cross-region references ────────────────────────────────────────
  # The dashboard is deployed in the primary region (us-east-1).
  # It references metrics from all three regions via cross-region widget JSON.
  # These parameters must be the literal region strings — not ARNs.
  RegionEast:
    Type: String
    Default: "us-east-1"
    Description: Primary region (us-east-1)

  RegionEurope:
    Type: String
    Default: "eu-central-1"
    Description: Europe region (eu-central-1)

  RegionAsia:
    Type: String
    Default: "ap-northeast-1"
    Description: Asia-Pacific region (ap-northeast-1)

Conditions:
  # Dashboard is global — deploy only from us-east-1 to avoid name collision
  # across regions. Alarms and SNS topics deploy in every region.
  IsPrimaryRegion: !Equals [!Ref AWS::Region, "us-east-1"]

Resources:

  # ═══════════════════════════════════════════════════════════════════════════
  # SNS TOPICS — AC-005
  # Two topics: ops-critical (P1 paging) and ops-warning (lower-priority).
  # ═══════════════════════════════════════════════════════════════════════════

  OpsCriticalTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "cello-ops-critical-${Environment}"
      DisplayName: !Sub "CELLO Ops Critical (${Environment})"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  OpsWarningTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "cello-ops-warning-${Environment}"
      DisplayName: !Sub "CELLO Ops Warning (${Environment})"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── Subscriptions (at least one per topic — AC-005) ───────────────────────
  # These are email subscriptions. The recipient must confirm the subscription
  # by clicking the link in the confirmation email sent by SNS after the first
  # deploy. Until confirmed, no notifications are delivered.

  OpsCriticalSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OpsCriticalTopic
      Protocol: email
      Endpoint: !Ref OpsEmail

  OpsWarningSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OpsWarningTopic
      Protocol: email
      Endpoint: !Ref OpsEmail

  # ═══════════════════════════════════════════════════════════════════════════
  # ALARMS — AC-001, AC-002, AC-003, AC-006, AC-007
  #
  # All 10 required alarms. Metric dimensions use !Sub to construct the
  # correct ECS cluster/service names from the Environment parameter.
  # No !ImportValue needed — CloudWatch dimensions take string values,
  # not ARNs. This avoids circular dependencies with the ECS stacks.
  #
  # Alarm naming: AC-001 base names with -${Environment} suffix to prevent
  # cross-environment collision when staging and dev deploy to the same account/region.
  # ═══════════════════════════════════════════════════════════════════════════

  # ── 1. cello-directory-ecs-task-count — AC-002, AC-001 ───────────────────
  # Fires ops-critical when running task count < 1 for 5 minutes.
  # Metric: ECS/RunningTaskCount, cluster=cello-${env}, service=cello-directory-${env}
  # EvaluationPeriods=1 × Period=300s = 5 minutes (AC-002 specifies "5 minutes").

  DirectoryEcsTaskCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cello-directory-ecs-task-count-${Environment}"
      AlarmDescription: !Sub >
        [${AWS::Region}] CELLO directory ECS running task count dropped below 1.
        Service: cello-directory-${Environment}, Cluster: cello-${Environment}.
        Investigate ECS console and CloudWatch Logs for task failures.
      MetricName: RunningTaskCount
      Namespace: ECS/ContainerInsights
      Dimensions:
        - Name: ClusterName
          Value: !Sub "cello-${Environment}"
        - Name: ServiceName
          Value: !Sub "cello-directory-${Environment}"
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref OpsCriticalTopic
      OKActions:
        - !Ref OpsCriticalTopic
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── 2. cello-relay-ecs-task-count — AC-001 ───────────────────────────────
  # Fires ops-critical when relay running task count < 1.

  RelayEcsTaskCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cello-relay-ecs-task-count-${Environment}"
      AlarmDescription: !Sub >
        [${AWS::Region}] CELLO relay ECS running task count dropped below 1.
        Service: cello-relay-${Environment}, Cluster: cello-${Environment}.
        Investigate ECS console and CloudWatch Logs for task failures.
      MetricName: RunningTaskCount
      Namespace: ECS/ContainerInsights
      Dimensions:
        - Name: ClusterName
          Value: !Sub "cello-${Environment}"
        - Name: ServiceName
          Value: !Sub "cello-relay-${Environment}"
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref OpsCriticalTopic
      OKActions:
        - !Ref OpsCriticalTopic
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── 2b. cello-operations-agent-ecs-task-count — AC-009 (OPS-AGENT-005A) ─────
  # Fires ops-critical when Operations Agent running task count < 1.
  # Same pattern as directory/relay alarms above.
  # ECS ContainerInsights metric: ECS/ContainerInsights RunningTaskCount.

  OpsAgentEcsTaskCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cello-operations-agent-ecs-task-count-${Environment}"
      AlarmDescription: !Sub >
        [${AWS::Region}] CELLO Operations Agent ECS running task count dropped below 1.
        Service: cello-operations-agent-${Environment}, Cluster: cello-${Environment}.
        The Telegram registration bot is offline. No new registrations can be processed.
        Investigate ECS console and CloudWatch Logs for task failures.
      MetricName: RunningTaskCount
      Namespace: ECS/ContainerInsights
      Dimensions:
        - Name: ClusterName
          Value: !Sub "cello-${Environment}"
        - Name: ServiceName
          Value: !Sub "cello-operations-agent-${Environment}"
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref OpsCriticalTopic
      OKActions:
        - !Ref OpsCriticalTopic
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── 3. cello-rds-cpu — AC-001 ────────────────────────────────────────────
  # Fires ops-warning when RDS CPU > 80% for 5 minutes (1 × 300s period).
  # AC-001 specifies threshold > 80%. Routes to ops-warning (not ops-critical)
  # per AC-006 context: storage fires warning; by parity, CPU fires warning too.

  RdsCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cello-rds-cpu-${Environment}"
      AlarmDescription: !Sub >
        [${AWS::Region}] CELLO RDS CPU utilization exceeded 80% for 5 minutes.
        Instance: cello-${Environment}. Investigate query performance and connection count.
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Sub "cello-${Environment}"
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsWarningTopic
      OKActions:
        - !Ref OpsWarningTopic
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── 4. cello-rds-storage — AC-001, AC-006 ────────────────────────────────
  # Fires ops-warning when free storage < 10GB (10737418240 bytes).
  # AC-006 explicitly confirms this routes to ops-warning.

  RdsStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cello-rds-storage-${Environment}"
      AlarmDescription: !Sub >
        [${AWS::Region}] CELLO RDS free storage dropped below 10GB.
        Instance: cello-${Environment}. Investigate data growth and consider storage expansion.
      MetricName: FreeStorageSpace
      Namespace: AWS/RDS
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Sub "cello-${Environment}"
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10737418240
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsWarningTopic
      OKActions:
        - !Ref OpsWarningTopic
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── 5. cello-checkpoint-gap — AC-001, AC-003 ─────────────────────────────
  # Fires ops-critical when no federation.checkpoint.confirmed metric is emitted
  # for 30 minutes (TreatMissingData: breaching on a 30-minute evaluation window).
  # Custom metric namespace: CELLO/Checkpoint.
  # On a healthy system this alarm is INSUFFICIENT_DATA (no custom metric published yet)
  # or OK. It fires only when 30+ minutes of silence occur.
  # Period=1800s (30min), EvaluationPeriods=1.

  CheckpointGapAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cello-checkpoint-gap-${Environment}"
      AlarmDescription: !Sub >
        [${AWS::Region}] No federation.checkpoint.confirmed event in the last 30 minutes.
        Region: ${AWS::Region}. Investigate directory nodes for federation health.
        Last confirmed checkpoint time visible in CELLO operations dashboard.
      MetricName: ConfirmationsPerPeriod
      Namespace: CELLO/Checkpoint
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
        - Name: Region
          Value: !Ref AWS::Region
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref OpsCriticalTopic
      OKActions:
        - !Ref OpsCriticalTopic
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── 6. cello-replication-slot-inactive — AC-001 ───────────────────────────
  # Fires ops-critical when the logical replication slot is inactive.
  # Custom metric: CELLO/Checkpoint ReplicationSlotActive (0=inactive, 1=active).
  # Alarm when value = 0. On healthy system: INSUFFICIENT_DATA or OK.

  ReplicationSlotInactiveAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cello-replication-slot-inactive-${Environment}"
      AlarmDescription: !Sub >
        [${AWS::Region}] CELLO logical replication slot is inactive.
        Region: ${AWS::Region}. Investigate RDS replication slot health immediately.
        An inactive slot causes WAL accumulation and potential storage exhaustion.
      MetricName: ReplicationSlotActive
      Namespace: CELLO/Checkpoint
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
        - Name: Region
          Value: !Ref AWS::Region
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref OpsCriticalTopic
      OKActions:
        - !Ref OpsCriticalTopic
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── 7. cello-replication-chain-hash-mismatch — AC-001 ────────────────────
  # Fires ops-critical on any hash chain mismatch (tamper detection).
  # Custom metric: CELLO/Checkpoint HashChainMismatches (count per period).
  # Any non-zero count is a critical security event.

  ReplicationChainHashMismatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cello-replication-chain-hash-mismatch-${Environment}"
      AlarmDescription: !Sub >
        [${AWS::Region}] CELLO hash chain mismatch detected.
        Region: ${AWS::Region}. This is a critical security event — possible tamper.
        Investigate hash chain integrity immediately. Do not attempt automated recovery.
      MetricName: HashChainMismatches
      Namespace: CELLO/Checkpoint
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
        - Name: Region
          Value: !Ref AWS::Region
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsCriticalTopic
      OKActions:
        - !Ref OpsCriticalTopic
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── 8. cello-relay-pool-unavailable — AC-001 ─────────────────────────────
  # Fires ops-critical when relay pool availability drops to zero.
  # Custom metric: CELLO/Relay PoolAvailableCount.

  RelayPoolUnavailableAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cello-relay-pool-unavailable-${Environment}"
      AlarmDescription: !Sub >
        [${AWS::Region}] CELLO relay pool has no available relays.
        Region: ${AWS::Region}. No new sessions can be established.
        Investigate relay ECS task health and relay manifest.
      MetricName: PoolAvailableCount
      Namespace: CELLO/Relay
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
        - Name: Region
          Value: !Ref AWS::Region
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref OpsCriticalTopic
      OKActions:
        - !Ref OpsCriticalTopic
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── 9. cello-relay-manifest-invalid — AC-001 ─────────────────────────────
  # Fires ops-critical when the relay manifest fails validation.
  # Custom metric: CELLO/Relay ManifestValidationErrors (count per period).

  RelayManifestInvalidAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cello-relay-manifest-invalid-${Environment}"
      AlarmDescription: !Sub >
        [${AWS::Region}] CELLO relay manifest validation failed.
        Region: ${AWS::Region}. Relay manifest is corrupt or signature invalid.
        Agents cannot verify relay assignments. Investigate relay manifest generation.
      MetricName: ManifestValidationErrors
      Namespace: CELLO/Relay
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
        - Name: Region
          Value: !Ref AWS::Region
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsCriticalTopic
      OKActions:
        - !Ref OpsCriticalTopic
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── 9b. cello-relay-manifest-update-failed — CELLO-M6B-006 AC-008 ────────
  # Fires ops-critical when relay manifest re-sign/upload fails > 3 times in 5 min.
  # Custom metric: CELLO/Relay ManifestUpdateErrors (count per period).
  # Distinct from cello-relay-manifest-invalid (which fires on signature verification
  # failures during manifest load, not upload failures during auto-registration).
  #
  # The log metric filter extracts relay.manifest.update.failed events from the
  # directory ECS log group and publishes a count to the custom metric namespace.
  # Without this filter, the alarm remains permanently in INSUFFICIENT_DATA.

  RelayManifestUpdateFailedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/ecs/cello-directory-${Environment}"
      FilterPattern: '{ $.event = "relay.manifest.update.failed" }'
      MetricTransformations:
        - MetricNamespace: CELLO/Relay
          MetricName: ManifestUpdateErrors
          MetricValue: "1"
          DefaultValue: 0
          Dimensions:
            - Key: Environment
              Value: !Ref Environment
            - Key: Region
              Value: !Ref AWS::Region

  RelayManifestUpdateFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cello-relay-manifest-update-${Environment}"
      AlarmDescription: !Sub >
        [${AWS::Region}] CELLO relay manifest re-sign/upload failed > 3 times in 5 minutes.
        Region: ${AWS::Region}. Relay auto-registration completed but manifest was not updated.
        Agents may use stale relay health check URLs. Aggregated across all relays.
        Investigate S3 access and directory signing key.
      MetricName: ManifestUpdateErrors
      Namespace: CELLO/Relay
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
        - Name: Region
          Value: !Ref AWS::Region
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsCriticalTopic
      OKActions:
        - !Ref OpsCriticalTopic
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── M6B-007 AC-007: cello-relay-alb-5xx — Relay ALB 5xx error rate alarm ────
  # Fires ops-warning when relay ALB 5xx error rate exceeds 5% over 5 minutes.
  #
  # Uses metric math (Metrics list) to compute rate = 5xx_count / request_count * 100.
  # A simple Sum threshold on HTTPCode_ELB_5XX_Count would be an absolute count alarm
  # (e.g. > 5 errors), not a rate alarm — it fires spuriously under load and misses
  # low-volume high-rate incidents. The metric math expression computes the true rate.
  #
  # LoadBalancer dimension: the CloudWatch AWS/ApplicationELB namespace requires the
  # full ARN suffix (app/<name>/<hash>) as the LoadBalancer dimension value, not just
  # the ALB name. The hash is generated by AWS at creation time and is not known at
  # template authoring time. We extract it from the exported RelayAlbArn using:
  #   !Select [1, !Split ["loadbalancer/", !ImportValue "cello-${Environment}-relay-alb-arn"]]
  # which yields "app/cello-relay-dev/a1b2c3d4e5f6a1b2" — matching the dimension format
  # required by AWS/ApplicationELB. Without the hash suffix the alarm is permanently
  # INSUFFICIENT_DATA and never fires.
  #
  # Routes to ops-warning (not ops-critical) — relay sessions degrade gracefully;
  # clients fall back to reconnect or use another relay in the pool.

  RelayAlb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cello-relay-alb-5xx-${Environment}"
      AlarmDescription: !Sub >
        [${AWS::Region}] CELLO relay ALB 5xx error rate exceeded 5% over 5 minutes.
        LoadBalancer: cello-relay-${Environment}. External clients cannot connect to
        the relay via WebSocket. Investigate relay ECS task health and container logs.
      # Metric math: rate = (5xx count / total request count) * 100
      # Threshold 5 = 5% error rate. ReturnData:true on the expression metric only.
      # m1 = HTTPCode_ELB_5XX_Count (5xx responses from the ALB)
      # m2 = RequestCount (all requests processed by the ALB)
      # rate = IF(m2 > 0, m1/m2*100, 0)  — avoids division-by-zero when idle
      Metrics:
        - Id: m1
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_ELB_5XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !Select
                    - 1
                    - !Split
                      - "loadbalancer/"
                      - !ImportValue
                        Fn::Sub: "cello-${Environment}-relay-alb-arn"
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: m2
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: RequestCount
              Dimensions:
                - Name: LoadBalancer
                  Value: !Select
                    - 1
                    - !Split
                      - "loadbalancer/"
                      - !ImportValue
                        Fn::Sub: "cello-${Environment}-relay-alb-arn"
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: rate
          Expression: "IF(m2 > 0, m1/m2*100, 0)"
          Label: "5xx Error Rate %"
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsWarningTopic
      OKActions:
        - !Ref OpsWarningTopic
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── 10. cello-audit-shipper-buffer-full — AC-001 ─────────────────────────
  # Fires ops-warning when the audit log shipper buffer is at capacity.
  # Custom metric: CELLO/Audit ShipperBufferUtilization (percentage 0-100).
  # 90% threshold: conservative buffer-full warning; below this, shipper can absorb burst writes.

  AuditShipperBufferFullAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cello-audit-shipper-buffer-full-${Environment}"
      AlarmDescription: !Sub >
        [${AWS::Region}] CELLO audit log shipper buffer utilization exceeded 90%.
        Region: ${AWS::Region}. Audit logs may be lost if buffer fills completely.
        Investigate audit shipper throughput and S3 upload errors.
      MetricName: ShipperBufferUtilization
      Namespace: CELLO/Audit
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
        - Name: Region
          Value: !Ref AWS::Region
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsWarningTopic
      OKActions:
        - !Ref OpsWarningTopic
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── 11. cello-frost-ceremony-exhausted — M6B-002 ─────────────────────────
  # Fires ops-warning when FROST ceremony failures (ceremony_exhausted) exceed 3
  # occurrences in 5 minutes. Custom metric: derived from frost.ceremony.failed
  # log events via MetricFilter.
  #
  # LIMITATION: CloudWatch Logs MetricFilters cannot group by extracted JSON fields
  # or create per-dimension metrics. This alarm counts ALL ceremony_exhausted events
  # from ANY agents, not per-agent occurrences. This is an AWS platform limitation.
  # The alarm still provides value by detecting sustained FROST failures across the
  # directory, but it may produce false positives if multiple different agents each
  # fail once within the same 5-minute window.

  FrostCeremonyExhaustedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/ecs/cello-directory-${Environment}"
      FilterPattern: '{ $.event = "frost.ceremony.failed" && $.reason = "ceremony_exhausted" }'
      MetricTransformations:
        - MetricNamespace: CelloDirectory
          MetricName: FrostCeremonyExhausted
          MetricValue: "1"
          DefaultValue: 0

  FrostCeremonyExhaustedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cello-frost-ceremony-exhausted-${Environment}"
      AlarmDescription: !Sub >
        [${AWS::Region}] CELLO FROST ceremonies exhausted 3+ times in 5 minutes (across all agents).
        Region: ${AWS::Region}. This indicates sustained FROST failures.
        The ceremony_exhausted reason means the FROST ceremony completed but returned null —
        typically indicates one or more agents have not completed DKG registration or K_server shares
        are missing from the directory's share store. Investigate agent bootstrap status and
        directory share store state. Note: this alarm counts all agents together (AWS MetricFilter
        limitation — cannot group by agentId).
      MetricName: FrostCeremonyExhausted
      Namespace: CelloDirectory
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsWarningTopic
      OKActions:
        - !Ref OpsWarningTopic
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ═══════════════════════════════════════════════════════════════════════════
  # DASHBOARD — AC-004
  #
  # Single multi-region dashboard: one row per region (us-east-1, eu-central-1,
  # ap-northeast-1), 6 panels per region row:
  #   1. ECS directory task count
  #   2. ECS relay task count
  #   3. RDS CPU utilization
  #   4. Checkpoint confirmation rate (confirmations per hour)
  #   5. Error rate (5xx responses per minute via ALB)
  #   6. Replication lag (RDS ReplicaLag metric)
  #
  # All three regions visible on one dashboard — no navigation required (AC-004).
  # Dashboard is deployed in the stack's region. Cross-region widgets reference
  # all three regions explicitly via the "region" property in widget properties.
  #
  # Widget layout: x increments by 8 per panel (6 panels × 8 = width 48, max 24
  # per row so we use 4 panels per row = width 6 each, 2 rows per region).
  # Layout: 3 panels top row (x=0,8,16) + 3 panels bottom row (x=0,8,16),
  # each panel width=8, height=6. Region label widget at top of each section.
  # ═══════════════════════════════════════════════════════════════════════════

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: IsPrimaryRegion
    Properties:
      DashboardName: !Sub "cello-operations-${Environment}"
      DashboardBody: !Sub |
        {
          "widgets": [

            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 1,
              "properties": {
                "markdown": "# CELLO Operations — ${Environment}\nAll three regions. Refresh: auto 1 min."
              }
            },

            {
              "type": "text",
              "x": 0, "y": 1, "width": 24, "height": 1,
              "properties": {
                "markdown": "## Region: ${RegionEast}"
              }
            },

            {
              "type": "metric",
              "x": 0, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "[${RegionEast}] Directory Task Count",
                "region": "${RegionEast}",
                "metrics": [
                  ["ECS/ContainerInsights", "RunningTaskCount",
                   "ClusterName", "cello-${Environment}",
                   "ServiceName", "cello-directory-${Environment}",
                   {"region": "${RegionEast}"}]
                ],
                "stat": "Minimum",
                "period": 60,
                "view": "timeSeries",
                "annotations": {
                  "horizontal": [{"value": 1, "label": "Min healthy", "color": "#ff6600"}]
                }
              }
            },

            {
              "type": "metric",
              "x": 8, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "[${RegionEast}] Relay Task Count",
                "region": "${RegionEast}",
                "metrics": [
                  ["ECS/ContainerInsights", "RunningTaskCount",
                   "ClusterName", "cello-${Environment}",
                   "ServiceName", "cello-relay-${Environment}",
                   {"region": "${RegionEast}"}]
                ],
                "stat": "Minimum",
                "period": 60,
                "view": "timeSeries",
                "annotations": {
                  "horizontal": [{"value": 1, "label": "Min healthy", "color": "#ff6600"}]
                }
              }
            },

            {
              "type": "metric",
              "x": 16, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "[${RegionEast}] RDS CPU %",
                "region": "${RegionEast}",
                "metrics": [
                  ["AWS/RDS", "CPUUtilization",
                   "DBInstanceIdentifier", "cello-${Environment}",
                   {"region": "${RegionEast}"}]
                ],
                "stat": "Average",
                "period": 60,
                "view": "timeSeries",
                "annotations": {
                  "horizontal": [{"value": 80, "label": "80% threshold", "color": "#ff6600"}]
                }
              }
            },

            {
              "type": "metric",
              "x": 0, "y": 8, "width": 8, "height": 6,
              "properties": {
                "title": "[${RegionEast}] Checkpoint Confirmations/hr",
                "region": "${RegionEast}",
                "metrics": [
                  ["CELLO/Checkpoint", "ConfirmationsPerPeriod",
                   "Environment", "${Environment}",
                   "Region", "${RegionEast}",
                   {"region": "${RegionEast}", "stat": "Sum", "period": 3600}]
                ],
                "stat": "Sum",
                "period": 3600,
                "view": "timeSeries"
              }
            },

            {
              "type": "metric",
              "x": 8, "y": 8, "width": 8, "height": 6,
              "properties": {
                "title": "[${RegionEast}] Error Rate (5xx/min)",
                "region": "${RegionEast}",
                "metrics": [
                  ["AWS/ApplicationELB", "HTTPCode_Target_5XX_Count",
                   "LoadBalancer", "app/cello-dir-${Environment}",
                   {"region": "${RegionEast}", "stat": "Sum", "period": 60}]
                ],
                "stat": "Sum",
                "period": 60,
                "view": "timeSeries"
              }
            },

            {
              "type": "metric",
              "x": 16, "y": 8, "width": 8, "height": 6,
              "properties": {
                "title": "[${RegionEast}] Replication Lag (s)",
                "region": "${RegionEast}",
                "metrics": [
                  ["AWS/RDS", "ReplicaLag",
                   "DBInstanceIdentifier", "cello-${Environment}",
                   {"region": "${RegionEast}"}]
                ],
                "stat": "Maximum",
                "period": 60,
                "view": "timeSeries"
              }
            },

            {
              "type": "text",
              "x": 0, "y": 14, "width": 24, "height": 1,
              "properties": {
                "markdown": "## Region: ${RegionEurope}"
              }
