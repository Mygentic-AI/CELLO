AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CELLO ECR — Container registries for directory and relay images.
  Deployed per-region so ECS tasks pull locally (no cross-region latency).
  Image lifecycle: untagged images expire after 14 days.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, production]
    Description: Deployment environment

Resources:
  DirectoryRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    Properties:
      RepositoryName: cello-directory
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  RelayRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    Properties:
      RepositoryName: cello-relay
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  OperationsAgentRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: cello-operations-agent
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # MOVED HERE FROM cello-ops-dashboard.yaml, to break a bootstrap loop.
  #
  # The app stack creates an ECS service whose image must already exist. When the
  # registry lived in that same stack there was no order that worked: deploying
  # it created the repo AND a service pointing at an empty one, which crash-loops
  # and rolls back — taking the just-created repo with it. Registries belong with
  # the other registries, where nothing depends on them at create time.
  OpsDashboardRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: cello-ops-dashboard
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

Outputs:
  OpsDashboardRepoUri:
    Value: !GetAtt OpsDashboardRepo.RepositoryUri
    Export:
      Name: !Sub "cello-${Environment}-ops-dashboard-ecr-uri"

  DirectoryRepoUri:
    Value: !GetAtt DirectoryRepo.RepositoryUri
    Export:
      Name: !Sub "cello-${Environment}-ecr-directory-uri"

  RelayRepoUri:
    Value: !GetAtt RelayRepo.RepositoryUri
    Export:
      Name: !Sub "cello-${Environment}-ecr-relay-uri"

  OperationsAgentRepoUri:
    Value: !GetAtt OperationsAgentRepo.RepositoryUri
    Export:
      Name: !Sub "cello-${Environment}-ecr-operations-agent-uri"
