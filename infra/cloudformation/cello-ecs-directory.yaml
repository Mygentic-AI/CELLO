AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CELLO ECS Directory — Fargate service for the directory node.
  IAM roles are defined in cello-iam.yaml and imported via !ImportValue.
  Task definition uses least-privilege roles from the IAM stack.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, production]
    Description: Deployment environment
  Cpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024"]
    Description: Fargate CPU units (256 = 0.25 vCPU)
  Memory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048"]
    Description: Fargate memory in MB
  ImageUri:
    Type: String
    Description: "ECR image URI for the directory service (e.g. {account}.dkr.ecr.{region}.amazonaws.com/cello-directory:latest)"

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "cello-${Environment}"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/cello-directory-${Environment}"
      RetentionInDays: 90
      Tags:
        - Key: Project
          Value: cello

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "cello-directory-${Environment}"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !ImportValue
        Fn::Sub: "cello-${Environment}-directory-execution-role-arn"
      TaskRoleArn: !ImportValue
        Fn::Sub: "cello-${Environment}-directory-task-role-arn"
      ContainerDefinitions:
        - Name: directory
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 443
              Protocol: tcp
          Environment:
            - Name: CELLO_ENV
              Value: !Ref Environment
            - Name: NODE_ID
              Value: !Ref AWS::Region
            - Name: PORT
              Value: "443"
            - Name: HOME
              Value: /tmp
            # SI-004 (SECOPS-004): inject the secret ARN, not the secret value.
            # ECS Secrets.ValueFrom fetches the value once at task launch and injects
            # it as an env var — this is a snapshot that goes stale after the first
            # 30-day rotation. The application must call GetSecretValue(RDS_CREDENTIALS_SECRET_ARN)
            # at connection-pool refresh time to pick up rotated credentials without
            # a task restart. The ARN is stable; the value is fetched at runtime.
            - Name: RDS_CREDENTIALS_SECRET_ARN
              Value: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/directory/rds-credentials"
            - Name: RDS_ENDPOINT
              Value:
                Fn::ImportValue: !Sub "cello-${Environment}-rds-endpoint"
            - Name: RDS_PORT
              Value:
                Fn::ImportValue: !Sub "cello-${Environment}-rds-port"
            - Name: RDS_DB_NAME
              Value: !Sub "cello_${Environment}"
          Secrets:
            # NODE_PRIVATE_KEY is safe to inject at task launch — it changes only
            # on manual key rotation, which requires a coordinated task restart
            # (documented in infra/runbooks/node-key-rotation.md).
            # It is NOT injected via RDS_CREDENTIALS_SECRET_ARN pattern.
            - Name: NODE_PRIVATE_KEY
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/directory/node-private-key"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: directory
          HealthCheck:
            Command: ["CMD-SHELL", "curl -f -k https://localhost:443/health || curl -f http://localhost:443/health || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "cello-dir-${Environment}"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !ImportValue
          Fn::Sub: "cello-${Environment}-public-subnet-a"
        - !ImportValue
          Fn::Sub: "cello-${Environment}-public-subnet-b"
      SecurityGroups:
        - !ImportValue
          Fn::Sub: "cello-${Environment}-alb-sg"
      Tags:
        - Key: Project
          Value: cello

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "cello-dir-${Environment}"
      Port: 443
      Protocol: HTTP
      TargetType: ip
      VpcId: !ImportValue
        Fn::Sub: "cello-${Environment}-vpc-id"
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckPort: "443"
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      Tags:
        - Key: Project
          Value: cello

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub "cello-directory-${Environment}"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue
              Fn::Sub: "cello-${Environment}-private-subnet-a"
            - !ImportValue
              Fn::Sub: "cello-${Environment}-private-subnet-b"
          SecurityGroups:
            - !ImportValue
              Fn::Sub: "cello-${Environment}-ecs-directory-sg"
      LoadBalancers:
        - ContainerName: directory
          ContainerPort: 443
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - Key: Project
          Value: cello

Outputs:
  ClusterArn:
    Value: !GetAtt Cluster.Arn
    Export:
      Name: !Sub "cello-${Environment}-cluster-arn"

  DirectoryServiceArn:
    Value: !Ref Service
    Export:
      Name: !Sub "cello-${Environment}-directory-service-arn"

  AlbDnsName:
    Value: !GetAtt Alb.DNSName
    Export:
      Name: !Sub "cello-${Environment}-alb-dns-name"

  AlbHostedZoneId:
    Value: !GetAtt Alb.CanonicalHostedZoneID
    Export:
      Name: !Sub "cello-${Environment}-alb-hosted-zone-id"
