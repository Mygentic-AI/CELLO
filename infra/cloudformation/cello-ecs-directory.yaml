AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CELLO ECS Directory — Fargate service for the directory node.
  IAM roles are defined in cello-iam.yaml and imported via !ImportValue.
  Task definition uses least-privilege roles from the IAM stack.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, production]
    Description: Deployment environment
  RelayMultiaddr:
    Type: String
    Description: "Relay libp2p multiaddr including peer ID (e.g. /ip4/10.x.x.x/tcp/4001/p2p/12D3KooW...)"
  Cpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024"]
    Description: Fargate CPU units (256 = 0.25 vCPU)
  Memory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048"]
    Description: Fargate memory in MB
  ImageUri:
    Type: String
    Description: "ECR image URI for the directory service (e.g. {account}.dkr.ecr.{region}.amazonaws.com/cello-directory:latest)"

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "cello-${Environment}"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/cello-directory-${Environment}"
      RetentionInDays: 90
      Tags:
        - Key: Project
          Value: cello

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "cello-directory-${Environment}"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !ImportValue
        Fn::Sub: "cello-${Environment}-directory-execution-role-arn"
      TaskRoleArn: !ImportValue
        Fn::Sub: "cello-${Environment}-directory-task-role-arn"
      ContainerDefinitions:
        - Name: directory
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            # Port 8080: libp2p WebSocket listener (REPOSPLIT-001 AC-007).
            # ALB forwards external port 80 → container port 8080 (WS upgrade).
            - ContainerPort: 8080
              Protocol: tcp
            # Port 9090: health check HTTP server. Not exposed via ALB.
            # ECS health checks and ALB target group health checks use this port.
            # Separated from port 8080 so the WS listener can own port 8080.
            - ContainerPort: 9090
              Protocol: tcp
          Environment:
            - Name: CELLO_ENV
              Value: !Ref Environment
            - Name: NODE_ID
              Value: !Ref AWS::Region
            - Name: HEALTH_PORT
              Value: "9090"
            - Name: HOME
              Value: /tmp
            - Name: CELLO_RELAY_MULTIADDR
              Value: !Ref RelayMultiaddr
            - Name: CELLO_AUDIT_BUCKET
              Value:
                Fn::ImportValue: !Sub "cello-${Environment}-audit-bucket"
            # SI-004 (SECOPS-004): inject the secret ARN, not the secret value.
            # ECS Secrets.ValueFrom fetches the value once at task launch and injects
            # it as an env var — this is a snapshot that goes stale after the first
            # 30-day rotation. The application must call GetSecretValue(RDS_CREDENTIALS_SECRET_ARN)
            # at connection-pool refresh time to pick up rotated credentials without
            # a task restart. The ARN is stable; the value is fetched at runtime.
            - Name: RDS_CREDENTIALS_SECRET_ARN
              Value: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/directory/rds-credentials"
            - Name: RDS_ENDPOINT
              Value:
                Fn::ImportValue: !Sub "cello-${Environment}-rds-endpoint"
            - Name: RDS_PORT
              Value:
                Fn::ImportValue: !Sub "cello-${Environment}-rds-port"
            - Name: RDS_DB_NAME
              Value: !Sub "cello_${Environment}"
            - Name: RELAY_MANIFEST_BUCKET
              Value: !Sub "cello-relay-manifest-${Environment}-${AWS::Region}"
            - Name: RELAY_MANIFEST_SIGNER_PUBKEY
              Value: !Sub "{{resolve:ssm:/cello/${Environment}/directory/manifest-signer-pubkey}}"
          Secrets:
            # NODE_PRIVATE_KEY is safe to inject at task launch — it changes only
            # on manual key rotation, which requires a coordinated task restart
            # (documented in infra/runbooks/node-key-rotation.md).
            # It is NOT injected via RDS_CREDENTIALS_SECRET_ARN pattern.
            - Name: NODE_PRIVATE_KEY
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/directory/node-private-key"
            # DEV_ENVELOPE_KEY: 64-char hex AES-256 key used by LocalEnvelopeKeyProvider
            # for dev/staging (placeholder until KmsEnvelopeKeyProvider is wired in M5+).
            - Name: DEV_ENVELOPE_KEY
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/directory/envelope-key"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: directory
          HealthCheck:
            # REPOSPLIT-001 AC-007: health server moved to port 9090 so port 8080 is
            # free for the libp2p WebSocket listener.
            Command: ["CMD-SHELL", "curl -f http://localhost:9090/health || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "cello-dir-${Environment}"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !ImportValue
          Fn::Sub: "cello-${Environment}-public-subnet-a"
        - !ImportValue
          Fn::Sub: "cello-${Environment}-public-subnet-b"
      SecurityGroups:
        - !ImportValue
          Fn::Sub: "cello-${Environment}-alb-sg"
      # REPOSPLIT-001 AC-007: 300-second idle timeout so long-lived WebSocket
      # connections (libp2p sessions) are not silently dropped by the ALB.
      # AWS default is 60 seconds, which drops idle WebSocket connections.
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "300"
      Tags:
        - Key: Project
          Value: cello

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      # REPOSPLIT-001 AC-007: port 8080 is the libp2p WebSocket listener.
      # ALB forwards external port 80 → container port 8080 for WS connections.
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !ImportValue
        Fn::Sub: "cello-${Environment}-vpc-id"
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      # REPOSPLIT-001 AC-007: health check uses port 9090 (health server port)
      # because port 8080 is now owned by the libp2p WebSocket listener.
      HealthCheckPort: "9090"
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      Tags:
        - Key: Project
          Value: cello

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub "cello-directory-${Environment}"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue
              Fn::Sub: "cello-${Environment}-private-subnet-a"
            - !ImportValue
              Fn::Sub: "cello-${Environment}-private-subnet-b"
          SecurityGroups:
            - !ImportValue
              Fn::Sub: "cello-${Environment}-ecs-directory-sg"
      LoadBalancers:
        - ContainerName: directory
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - Key: Project
          Value: cello

Outputs:
  ClusterArn:
    Value: !GetAtt Cluster.Arn
    Export:
      Name: !Sub "cello-${Environment}-cluster-arn"

  DirectoryServiceArn:
    Value: !Ref Service
    Export:
      Name: !Sub "cello-${Environment}-directory-service-arn"

  AlbDnsName:
    Value: !GetAtt Alb.DNSName
    Export:
      Name: !Sub "cello-${Environment}-alb-dns-name"

  AlbHostedZoneId:
    Value: !GetAtt Alb.CanonicalHostedZoneID
    Export:
      Name: !Sub "cello-${Environment}-alb-hosted-zone-id"

  AlbArn:
    Value: !Ref Alb
    Export:
      Name: !Sub "cello-${Environment}-alb-arn"
