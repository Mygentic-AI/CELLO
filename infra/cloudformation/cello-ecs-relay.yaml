AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CELLO ECS Relay — Fargate service for relay nodes.
  Task role has minimal permissions: Secrets Manager GetSecretValue for relay
  private key only. No KMS, no S3, no directory secret access.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, production]
    Description: Deployment environment
  Cpu:
    Type: String
    Default: "256"
    Description: Fargate CPU units (256 = 0.25 vCPU)
  Memory:
    Type: String
    Default: "512"
    Description: Fargate memory in MB
  ImageUri:
    Type: String
    Description: "ECR image URI for the relay service (e.g. {account}.dkr.ecr.{region}.amazonaws.com/cello-relay:latest)"

Resources:
  # Task execution role (ECS agent — pulls images, writes logs)
  RelayTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cello-${Environment}-relay-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: RelaySecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/relay/*"
      Tags:
        - Key: Project
          Value: cello

  # Task role (application code — minimal permissions)
  RelayTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cello-${Environment}-relay-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RelayPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SecretsManagerRelayKeyOnly
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/relay/node-private-key*"
      Tags:
        - Key: Project
          Value: cello

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/cello-relay-${Environment}"
      RetentionInDays: 90
      Tags:
        - Key: Project
          Value: cello

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "cello-relay-${Environment}"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !GetAtt RelayTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt RelayTaskRole.Arn
      ContainerDefinitions:
        - Name: relay
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 4000
              Protocol: tcp
          Environment:
            - Name: CELLO_ENV
              Value: !Ref Environment
            - Name: PORT
              Value: "4000"
          Secrets:
            - Name: NODE_PRIVATE_KEY
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/relay/node-private-key"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: relay
          HealthCheck:
            Command: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "cello-relay-${Environment}"
      Cluster: !ImportValue
        Fn::Sub: "cello-${Environment}-cluster-arn"
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue
              Fn::Sub: "cello-${Environment}-private-subnet-a"
            - !ImportValue
              Fn::Sub: "cello-${Environment}-private-subnet-b"
          SecurityGroups:
            - !ImportValue
              Fn::Sub: "cello-${Environment}-ecs-relay-sg"
      Tags:
        - Key: Project
          Value: cello

Outputs:
  RelayTaskRoleArn:
    Value: !GetAtt RelayTaskRole.Arn
    Export:
      Name: !Sub "cello-${Environment}-relay-task-role-arn"

  RelayServiceArn:
    Value: !Ref Service
    Export:
      Name: !Sub "cello-${Environment}-relay-service-arn"
