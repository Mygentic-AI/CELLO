AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CELLO ECS Relay — Fargate service for relay nodes.
  IAM roles are defined in cello-iam.yaml and imported via !ImportValue.
  Task role has minimal permissions: Secrets Manager GetSecretValue for relay
  private key only. No KMS, no S3, no directory secret access.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, production]
    Description: Deployment environment
  Cpu:
    Type: String
    Default: "256"
    Description: Fargate CPU units (256 = 0.25 vCPU)
  Memory:
    Type: String
    Default: "512"
    Description: Fargate memory in MB
  ImageUri:
    Type: String
    Description: "ECR image URI for the relay service (e.g. {account}.dkr.ecr.{region}.amazonaws.com/cello-relay:latest)"
  DirectoryNodePubkey:
    Type: String
    Description: "Hex-encoded Ed25519 public key of the directory node (64 chars)"
  DirectoryMultiaddr:
    Type: String
    Description: "Directory node multiaddr including /p2p/{peer-id} suffix (e.g. /dns4/directory-us1.cello.mygentic.ai/tcp/443/wss/p2p/12D3Koo...)"
    Default: ""

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/cello-relay-${Environment}"
      RetentionInDays: 90
      Tags:
        - Key: Project
          Value: cello

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "cello-relay-${Environment}"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !ImportValue
        Fn::Sub: "cello-${Environment}-relay-execution-role-arn"
      TaskRoleArn: !ImportValue
        Fn::Sub: "cello-${Environment}-relay-task-role-arn"
      ContainerDefinitions:
        - Name: relay
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 4000
              Protocol: tcp
          Environment:
            - Name: CELLO_ENV
              Value: !Ref Environment
            - Name: PORT
              Value: "4000"
            - Name: WAL_DIR
              Value: /tmp/wal
            - Name: HOME
              Value: /tmp
            - Name: CELLO_DIRECTORY_PUBKEY
              Value: !Ref DirectoryNodePubkey
            # CELLO-M6B-006: Directory multiaddr for auto-registration on startup.
            # The relay dials the directory and calls relay_register when this is set.
            - Name: CELLO_DIRECTORY_MULTIADDR
              Value: !Ref DirectoryMultiaddr
            # CELLO-M6B-006: Health check URL is derived from ECS task metadata at startup.
            # The relay binary fetches its private IP from 169.254.170.2/v2/metadata
            # and constructs http://{privateIp}:4000/health. No env var needed — the binary
            # defaults to fetching from ECS metadata when CELLO_RELAY_HEALTH_CHECK_URL is unset.
            # Explicit override available for testing/debugging:
            # - Name: CELLO_RELAY_HEALTH_CHECK_URL
            #   Value: "http://10.0.1.50:4000/health"
          Secrets:
            - Name: NODE_PRIVATE_KEY
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/relay/node-private-key"
            # CELLO-M6B-006: Stable transport key ensures consistent libp2p Peer ID across restarts.
            # Same pattern as CELLO_DIRECTORY_TRANSPORT_KEY_HEX in the directory task def.
            - Name: CELLO_RELAY_TRANSPORT_KEY_HEX
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/relay/transport-key"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: relay
          HealthCheck:
            Command: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "cello-relay-${Environment}"
      Cluster: !ImportValue
        Fn::Sub: "cello-${Environment}-cluster-arn"
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      # DEPLOY-005 / inherited DEPLOY-003 AC-007:
      # ECS Exec enables in-VPC health check of relay port 4000 via:
      #   aws ecs execute-command --cluster cello-{env} --container relay --command "curl -f http://localhost:4000/health"
      # Also required by DEPLOY-005 in-VPC smoke test tooling.
      # Requires ssmmessages:* permissions on the relay task role (added in cello-iam.yaml).
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue
              Fn::Sub: "cello-${Environment}-private-subnet-a"
            - !ImportValue
              Fn::Sub: "cello-${Environment}-private-subnet-b"
          SecurityGroups:
            - !ImportValue
              Fn::Sub: "cello-${Environment}-ecs-relay-sg"
      Tags:
        - Key: Project
          Value: cello

Outputs:
  RelayServiceArn:
    Value: !Ref Service
    Export:
      Name: !Sub "cello-${Environment}-relay-service-arn"
