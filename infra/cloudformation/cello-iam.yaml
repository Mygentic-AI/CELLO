AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CELLO IAM — all ECS task and execution roles for directory and relay services.
  Deploys first (no dependencies on other CELLO stacks). Exports four role ARNs
  that are imported by cello-kms.yaml, cello-s3.yaml, cello-ecs-directory.yaml,
  and cello-ecs-relay.yaml via !ImportValue — eliminating the circular dependency
  between IAM roles and the resources they need permissions for.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, production]
    Description: Deployment environment

Conditions:
  # us-east-1 roles already exist with non-region-scoped names and are referenced
  # by live CloudFormation exports — renaming them would break those exports.
  # Non-primary regions use region-scoped names to avoid IAM global name collision.
  IsPrimaryRegion: !Equals [!Ref AWS::Region, "us-east-1"]

Resources:
  # ── Directory task execution role (ECS agent: pull images, write logs, read secrets) ──

  DirectoryTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryRegion
        - !Sub "cello-${Environment}-directory-execution-role"
        - !Sub "cello-${Environment}-${AWS::Region}-directory-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: DirectorySecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # SI-003 (SECOPS-004): enumerate specific secrets — do NOT use directory/*
              # wildcard, which would grant access to rds-admin-credentials.
              # rds-admin-credentials is accessible ONLY to the rotation Lambda role.
              - Sid: SecretsManagerGetForExecution
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/directory/rds-credentials*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/directory/node-private-key*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/directory/kms-key-arn*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/directory/envelope-key*"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── Directory task role (application code: KMS, Secrets Manager, S3 audit) ──
  # KMS permission uses the alias ARN pattern — no dependency on cello-kms.yaml.
  # The alias is created by cello-kms.yaml with the predictable name
  # alias/cello-${Environment}-master-key. AWS resolves the alias to the key at
  # policy evaluation time. The KMS key policy in cello-kms.yaml additionally
  # grants this role kms:Decrypt/DescribeKey via !ImportValue of this role's ARN.

  DirectoryTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryRegion
        - !Sub "cello-${Environment}-directory-task-role"
        - !Sub "cello-${Environment}-${AWS::Region}-directory-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DirectoryPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: KmsDecryptOnly
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource:
                  - !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/cello-${Environment}-master-key"
              # SI-003 (SECOPS-004): enumerate specific secrets — do NOT use directory/*
              # wildcard, which would grant access to rds-admin-credentials.
              - Sid: SecretsManagerGet
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/directory/rds-credentials*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/directory/node-private-key*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/directory/kms-key-arn*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/directory/envelope-key*"
              - Sid: S3AuditPutOnly
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::cello-audit-logs-${Environment}-${AWS::Region}/*"
              # ECS Exec (EnableExecuteCommand: true on the service) requires these
              # ssmmessages permissions on the task role.
              - Sid: EcsExecSsmMessages
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── Relay task execution role (ECS agent: pull images, write logs, read secrets) ──

  RelayTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryRegion
        - !Sub "cello-${Environment}-relay-execution-role"
        - !Sub "cello-${Environment}-${AWS::Region}-relay-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: RelaySecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Enumerate specific secrets rather than using relay/* wildcard,
              # consistent with directory role narrowing (SI-003). If new relay
              # secrets are added, this list must be extended explicitly.
              - Sid: SecretsManagerGetForExecution
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/relay/node-private-key*"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── Relay task role (application code: Secrets Manager relay key + ECS Exec) ──

  RelayTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryRegion
        - !Sub "cello-${Environment}-relay-task-role"
        - !Sub "cello-${Environment}-${AWS::Region}-relay-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RelayPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SecretsManagerRelayKeyOnly
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/relay/node-private-key*"
              # DEPLOY-005 / inherited DEPLOY-003 AC-007:
              # ECS Exec (EnableExecuteCommand: true on the service) requires these
              # ssmmessages permissions on the task role. Without them, exec-command
              # calls fail with "InvalidParameterException: cannot run in Exec mode".
              # These 4 actions are the minimum required by the SSM Session Manager plugin.
              - Sid: EcsExecSsmMessages
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── Operations Agent task execution role (ECS agent: pull images, write logs, read secrets) ──

  OpsAgentTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryRegion
        - !Sub "cello-${Environment}-ops-agent-execution-role"
        - !Sub "cello-${Environment}-${AWS::Region}-ops-agent-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: OpsAgentSecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # SI-001: enumerate exact secret ARNs — no wildcard that would grant access
              # to directory/relay key material. The Ops Agent must not reach node private
              # keys, envelope keys, or directory/relay RDS credentials.
              - Sid: SecretsManagerGetForExecution
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/ops-agent/telegram-bot-token*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/ops-agent/ses-credentials*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/ops-agent/directory-api-key*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/ops-agent/rds-credentials*"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── Operations Agent task role (application code: secrets, logs, ECS Exec) ──
  # AC-006 (OPS-AGENT-005A): Permissions are ONLY:
  #   - secretsmanager:GetSecretValue on the four Ops Agent secret ARNs
  #   - logs:CreateLogStream + logs:PutLogEvents on the Ops Agent log group
  #   - ssmmessages:* for ECS Exec (debugging)
  # No S3, no KMS, no IAM, no access to directory/relay secret ARNs.
  # SI-001: even if the Ops Agent container is compromised, the attacker cannot
  # read directory or relay private keys — IAM policy does not grant that access.

  OpsAgentTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryRegion
        - !Sub "cello-${Environment}-ops-agent-task-role"
        - !Sub "cello-${Environment}-${AWS::Region}-ops-agent-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OpsAgentPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # SI-001: enumerate exact secret ARNs — no wildcard.
              - Sid: SecretsManagerOpsAgentOnly
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/ops-agent/telegram-bot-token*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/ops-agent/ses-credentials*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/ops-agent/directory-api-key*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cello/${Environment}/ops-agent/rds-credentials*"
              - Sid: CloudWatchLogsOpsAgent
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/cello-operations-agent-${Environment}:*"
              # ECS Exec requires ssmmessages permissions on the task role.
              - Sid: EcsExecSsmMessages
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

Outputs:
  DirectoryTaskRoleArn:
    Value: !GetAtt DirectoryTaskRole.Arn
    Export:
      Name: !Sub "cello-${Environment}-directory-task-role-arn"

  DirectoryTaskExecutionRoleArn:
    Value: !GetAtt DirectoryTaskExecutionRole.Arn
    Export:
      Name: !Sub "cello-${Environment}-directory-execution-role-arn"

  RelayTaskRoleArn:
    Value: !GetAtt RelayTaskRole.Arn
    Export:
      Name: !Sub "cello-${Environment}-relay-task-role-arn"

  RelayTaskExecutionRoleArn:
    Value: !GetAtt RelayTaskExecutionRole.Arn
    Export:
      Name: !Sub "cello-${Environment}-relay-execution-role-arn"

  OpsAgentTaskRoleArn:
    Value: !GetAtt OpsAgentTaskRole.Arn
    Export:
      Name: !Sub "cello-${Environment}-ops-agent-task-role-arn"

  OpsAgentTaskExecutionRoleArn:
    Value: !GetAtt OpsAgentTaskExecutionRole.Arn
    Export:
      Name: !Sub "cello-${Environment}-ops-agent-execution-role-arn"
