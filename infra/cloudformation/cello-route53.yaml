AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CELLO Route 53 + ACM — hosted zone, regional ALIAS records, and TLS certificates.
  One certificate per region, DNS-validated against the Route 53 zone.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, production]
    Description: Deployment environment
  DomainName:
    Type: String
    Default: "cello.mygentic.ai"
    Description: Root domain for CELLO services
  AlbDnsName:
    Type: String
    Description: DNS name of the regional ALB
  AlbHostedZoneId:
    Type: String
    Description: Hosted zone ID of the regional ALB
  Subdomain:
    Type: String
    Description: Subdomain prefix (e.g. directory-us1, directory-eu1, directory-ap1)

Resources:
  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: !Sub "CELLO ${Environment} hosted zone"

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub "${Subdomain}.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub "${Subdomain}.${DomainName}"
          HostedZoneId: !Ref HostedZone
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  AliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub "${Subdomain}.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !Ref AlbDnsName
        HostedZoneId: !Ref AlbHostedZoneId

Outputs:
  HostedZoneId:
    Value: !Ref HostedZone
    Export:
      Name: !Sub "cello-${Environment}-hosted-zone-id"

  CertificateArn:
    Value: !Ref Certificate
    Export:
      Name: !Sub "cello-${Environment}-certificate-arn-${Subdomain}"
