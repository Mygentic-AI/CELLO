AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CELLO Secrets Manager — creates secret resources with empty placeholder values.
  Actual secret values are populated by the operator after stack creation via
  AWS CLI or console. No secret material in this template (SI-001).

  Rotation configuration (SECOPS-004):
    - rds-credentials: automatic rotation enabled (30 days) via cello-rotation Lambda
    - rds-admin-credentials: NO rotation (populated once by operator; used only by Lambda)
    - node-private-key secrets: NO rotation — manual coordinated procedure required
      (see infra/runbooks/node-key-rotation.md and infra/scripts/generate-node-keys.sh)

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, production]
    Description: Deployment environment

Resources:
  # Directory secrets
  RdsCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/directory/rds-credentials"
      Description: !Sub "CELLO ${Environment} directory RDS service account credentials (auto-rotated every 30 days)"
      SecretString: '{"username":"cello_service","password":"PLACEHOLDER_POPULATE_VIA_CLI"}'
      # AC-001: automatic rotation every 30 days via the multi-user rotation Lambda.
      # The rotation Lambda ARN is imported from the cello-rotation stack.
      # SI-001: ECS tasks pick up the rotated credential via Secrets Manager ARN
      # reference at connection-pool refresh time — never cached in an env var (SI-004).
      RotationLambdaARN: !ImportValue
        Fn::Sub: "cello-${Environment}-rds-rotation-lambda-arn"
      RotationRules:
        AutomaticallyAfterDays: 30
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  RdsAdminCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/directory/rds-admin-credentials"
      Description: !Sub "CELLO ${Environment} directory RDS admin credentials (migration use)"
      SecretString: '{"username":"postgres","password":"PLACEHOLDER_POPULATE_VIA_CLI"}'
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  DirectoryNodePrivateKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/directory/node-private-key"
      Description: !Sub "CELLO ${Environment} directory node Ed25519 private key (hex). NO automatic rotation — see infra/runbooks/node-key-rotation.md"
      SecretString: "PLACEHOLDER_POPULATE_VIA_CLI"
      # AC-006: node-private-key secrets intentionally have NO RotationLambdaARN
      # and NO RotationRules. Node key rotation is a manual, protocol-coordinated
      # operation: directory nodes must distribute the new public key to all peers
      # before the old key is deactivated. Automatic rotation would break the protocol.
      # Use infra/scripts/generate-node-keys.sh to generate and store a new key pair.
      # Rotation procedure: infra/runbooks/node-key-rotation.md
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  DirectoryKmsKeyArn:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/directory/kms-key-arn"
      Description: !Sub "CELLO ${Environment} KMS master key ARN reference"
      SecretString: "PLACEHOLDER_POPULATE_VIA_CLI"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # Relay secrets
  RelayNodePrivateKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/relay/node-private-key"
      Description: !Sub "CELLO ${Environment} relay node Ed25519 private key (hex). NO automatic rotation — see infra/runbooks/node-key-rotation.md"
      SecretString: "PLACEHOLDER_POPULATE_VIA_CLI"
      # AC-006: relay node-private-key has NO RotationLambdaARN and NO RotationRules.
      # Relay key rotation requires: new key stored, ECS task restarted, new relayId
      # registered with directory. Automatic rotation would produce an unregistered relayId.
      # Use infra/scripts/generate-node-keys.sh for manual key generation.
      # Rotation procedure: infra/runbooks/node-key-rotation.md
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

Outputs:
  RdsCredentialsArn:
    Value: !Ref RdsCredentials
    Export:
      Name: !Sub "cello-${Environment}-rds-credentials-arn"

  RdsAdminCredentialsArn:
    Value: !Ref RdsAdminCredentials
    Export:
      Name: !Sub "cello-${Environment}-rds-admin-credentials-arn"

  DirectoryNodePrivateKeyArn:
    Value: !Ref DirectoryNodePrivateKey
    Export:
      Name: !Sub "cello-${Environment}-directory-node-private-key-arn"

  DirectoryKmsKeyArnSecret:
    Value: !Ref DirectoryKmsKeyArn
    Export:
      Name: !Sub "cello-${Environment}-directory-kms-key-arn-secret"

  RelayNodePrivateKeyArn:
    Value: !Ref RelayNodePrivateKey
    Export:
      Name: !Sub "cello-${Environment}-relay-node-private-key-arn"
