AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CELLO Secrets Manager - creates secret resources with empty placeholder values.
  Actual secret values are populated by the operator after stack creation via
  AWS CLI or console. No secret material in this template (SI-001).

  Rotation configuration (SECOPS-004):
    - rds-credentials: rotation schedule is configured in cello-rotation.yaml via
      AWS::SecretsManager::RotationSchedule (avoids first-deploy circular dependency).
    - rds-admin-credentials: NO rotation (populated once by operator; used only by Lambda)
    - node-private-key secrets: NO rotation - manual coordinated procedure required
      (see infra/runbooks/node-key-rotation.md and infra/scripts/generate-node-keys.sh)

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, production]
    Description: Deployment environment

Resources:
  # Directory secrets
  RdsCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/directory/rds-credentials"
      Description: !Sub "CELLO ${Environment} directory RDS service account credentials (auto-rotated every 30 days via cello-rotation stack)"
      SecretString: '{"username":"cello_service","password":"PLACEHOLDER_POPULATE_VIA_CLI"}'
      # AC-001: rotation schedule (RotationLambdaARN + RotationRules) is wired in
      # cello-rotation.yaml via AWS::SecretsManager::RotationSchedule. This avoids a
      # first-deploy circular dependency: cello-secrets (Step 2) cannot !ImportValue
      # the rotation Lambda ARN until cello-rotation (Step 6a) has deployed.
      # SI-004: ECS tasks consume the credential via Secrets Manager ARN at
      # connection-pool refresh time — never injected as a snapshot env var.
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  RdsAdminCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/directory/rds-admin-credentials"
      Description: !Sub "CELLO ${Environment} directory RDS admin credentials (migration use)"
      SecretString: '{"username":"postgres","password":"PLACEHOLDER_POPULATE_VIA_CLI"}'
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  DirectoryNodePrivateKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/directory/node-private-key"
      Description: !Sub "CELLO ${Environment} directory node Ed25519 private key (hex). NO automatic rotation - see infra/runbooks/node-key-rotation.md"
      SecretString: "PLACEHOLDER_POPULATE_VIA_CLI"
      # AC-006: node-private-key secrets intentionally have NO RotationLambdaARN
      # and NO RotationRules. Node key rotation is a manual, protocol-coordinated
      # operation: directory nodes must distribute the new public key to all peers
      # before the old key is deactivated. Automatic rotation would break the protocol.
      # Use infra/scripts/generate-node-keys.sh to generate and store a new key pair.
      # Rotation procedure: infra/runbooks/node-key-rotation.md
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  DirectoryTransportKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/directory/transport-key"
      Description: !Sub "CELLO ${Environment} directory libp2p transport key (32-byte hex). Persisted so peer ID is stable across ECS task restarts. NO automatic rotation."
      SecretString: "PLACEHOLDER_POPULATE_VIA_CLI"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  DirectoryKmsKeyArn:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/directory/kms-key-arn"
      Description: !Sub "CELLO ${Environment} KMS master key ARN reference"
      SecretString: "PLACEHOLDER_POPULATE_VIA_CLI"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  DirectoryEnvelopeKey:
    Type: AWS::SecretsManager::Secret
    # DeletionPolicy: Retain prevents accidental deletion of this secret.
    # In us-east-1 this secret was created manually before being added to IaC —
    # it was imported into the stack via CloudFormation resource import.
    DeletionPolicy: Retain
    Properties:
      Name: !Sub "cello/${Environment}/directory/envelope-key"
      Description: !Sub "CELLO ${Environment} directory envelope encryption key (AES-256, 64-char hex). Populated by bootstrap.sh."
      SecretString: "PLACEHOLDER_POPULATE_VIA_CLI"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # Operations Agent secrets (OPS-AGENT-005A)
  # These are created as placeholders here so:
  #   1. The rotation stack (cello-rotation.yaml) can reference the rds-credentials ARN via !ImportValue.
  #   2. bootstrap.sh can populate the real values after deploy.sh completes.
  #   3. The ECS execution role can enumerate the specific secret ARNs.
  # telegram-bot-token, ses-credentials, directory-api-key: must be populated manually.
  # rds-credentials: populated automatically by the rotation Lambda at first deploy (AC-009e).

  OpsAgentTelegramBotToken:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/ops-agent/telegram-bot-token"
      Description: !Sub "CELLO ${Environment} Operations Agent Telegram bot token. Populate manually via CLI."
      # WARNING: Each CloudFormation update resets this secret to PLACEHOLDER_POPULATE_VIA_CLI.
      # Re-populate manually after any stack update:
      #   aws secretsmanager put-secret-value --secret-id cello/${Environment}/ops-agent/telegram-bot-token --secret-string "<real-token>"
      SecretString: "PLACEHOLDER_POPULATE_VIA_CLI"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  OpsAgentSesCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/ops-agent/ses-credentials"
      Description: !Sub "CELLO ${Environment} Operations Agent SES credentials. Populate manually via CLI."
      # WARNING: Each CloudFormation update resets this secret to PLACEHOLDER_POPULATE_VIA_CLI.
      # Re-populate manually after any stack update:
      #   aws secretsmanager put-secret-value --secret-id cello/${Environment}/ops-agent/ses-credentials --secret-string '{"accessKeyId":"...","secretAccessKey":"..."}'
      SecretString: "PLACEHOLDER_POPULATE_VIA_CLI"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  OpsAgentDirectoryApiKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/ops-agent/directory-api-key"
      Description: !Sub "CELLO ${Environment} Operations Agent directory API key. Populate manually via CLI."
      # WARNING: Each CloudFormation update resets this secret to PLACEHOLDER_POPULATE_VIA_CLI.
      # Re-populate manually after any stack update:
      #   aws secretsmanager put-secret-value --secret-id cello/${Environment}/ops-agent/directory-api-key --secret-string "<real-api-key>"
      SecretString: "PLACEHOLDER_POPULATE_VIA_CLI"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  OpsAgentRdsCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/ops-agent/rds-credentials"
      Description: !Sub "CELLO ${Environment} Operations Agent RDS credentials (cello_ops_agent role). Auto-populated by rotation Lambda at first deploy (AC-009e)."
      SecretString: '{"username":"cello_ops_agent","password":"PLACEHOLDER_POPULATE_VIA_CLI"}'
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # Relay secrets
  RelayNodePrivateKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/relay/node-private-key"
      Description: !Sub "CELLO ${Environment} relay node Ed25519 private key (hex). NO automatic rotation - see infra/runbooks/node-key-rotation.md"
      SecretString: "PLACEHOLDER_POPULATE_VIA_CLI"
      # AC-006: relay node-private-key has NO RotationLambdaARN and NO RotationRules.
      # Relay key rotation requires: new key stored, ECS task restarted, new relayId
      # registered with directory. Automatic rotation would produce an unregistered relayId.
      # Use infra/scripts/generate-node-keys.sh for manual key generation.
      # Rotation procedure: infra/runbooks/node-key-rotation.md
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

Outputs:
  RdsCredentialsArn:
    Value: !Ref RdsCredentials
    Export:
      Name: !Sub "cello-${Environment}-rds-credentials-arn"

  RdsAdminCredentialsArn:
    Value: !Ref RdsAdminCredentials
    Export:
      Name: !Sub "cello-${Environment}-rds-admin-credentials-arn"

  DirectoryNodePrivateKeyArn:
    Value: !Ref DirectoryNodePrivateKey
    Export:
      Name: !Sub "cello-${Environment}-directory-node-private-key-arn"

  DirectoryTransportKeyArn:
    Value: !Ref DirectoryTransportKey
    Export:
      Name: !Sub "cello-${Environment}-directory-transport-key-arn"

  DirectoryKmsKeyArnSecret:
    Value: !Ref DirectoryKmsKeyArn
    Export:
      Name: !Sub "cello-${Environment}-directory-kms-key-arn-secret"

  RelayNodePrivateKeyArn:
    Value: !Ref RelayNodePrivateKey
    Export:
      Name: !Sub "cello-${Environment}-relay-node-private-key-arn"

  OpsAgentRdsCredentialsArn:
    Value: !Ref OpsAgentRdsCredentials
    Export:
      Name: !Sub "cello-${Environment}-ops-agent-rds-credentials-arn"

  OpsAgentTelegramBotTokenArn:
    Value: !Ref OpsAgentTelegramBotToken
    Export:
      Name: !Sub "cello-${Environment}-ops-agent-telegram-bot-token-arn"

  OpsAgentSesCredentialsArn:
    Value: !Ref OpsAgentSesCredentials
    Export:
      Name: !Sub "cello-${Environment}-ops-agent-ses-credentials-arn"

  OpsAgentDirectoryApiKeyArn:
    Value: !Ref OpsAgentDirectoryApiKey
    Export:
      Name: !Sub "cello-${Environment}-ops-agent-directory-api-key-arn"
