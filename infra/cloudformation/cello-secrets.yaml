AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CELLO Secrets Manager — creates secret resources with empty placeholder values.
  Actual secret values are populated by the operator after stack creation via
  AWS CLI or console. No secret material in this template (SI-001).

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, production]
    Description: Deployment environment

Resources:
  # Directory secrets
  RdsCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/directory/rds-credentials"
      Description: !Sub "CELLO ${Environment} directory RDS service account credentials"
      SecretString: '{"username":"cello_service","password":"PLACEHOLDER_POPULATE_VIA_CLI"}'
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  RdsAdminCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/directory/rds-admin-credentials"
      Description: !Sub "CELLO ${Environment} directory RDS admin credentials (migration use)"
      SecretString: '{"username":"postgres","password":"PLACEHOLDER_POPULATE_VIA_CLI"}'
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  DirectoryNodePrivateKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/directory/node-private-key"
      Description: !Sub "CELLO ${Environment} directory node Ed25519 private key (hex)"
      SecretString: "PLACEHOLDER_POPULATE_VIA_CLI"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  DirectoryKmsKeyArn:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/directory/kms-key-arn"
      Description: !Sub "CELLO ${Environment} KMS master key ARN reference"
      SecretString: "PLACEHOLDER_POPULATE_VIA_CLI"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # Relay secrets
  RelayNodePrivateKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cello/${Environment}/relay/node-private-key"
      Description: !Sub "CELLO ${Environment} relay node Ed25519 private key (hex)"
      SecretString: "PLACEHOLDER_POPULATE_VIA_CLI"
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

Outputs:
  RdsCredentialsArn:
    Value: !Ref RdsCredentials
    Export:
      Name: !Sub "cello-${Environment}-rds-credentials-arn"

  RdsAdminCredentialsArn:
    Value: !Ref RdsAdminCredentials
    Export:
      Name: !Sub "cello-${Environment}-rds-admin-credentials-arn"

  DirectoryNodePrivateKeyArn:
    Value: !Ref DirectoryNodePrivateKey
    Export:
      Name: !Sub "cello-${Environment}-directory-node-private-key-arn"

  DirectoryKmsKeyArnSecret:
    Value: !Ref DirectoryKmsKeyArn
    Export:
      Name: !Sub "cello-${Environment}-directory-kms-key-arn-secret"

  RelayNodePrivateKeyArn:
    Value: !Ref RelayNodePrivateKey
    Export:
      Name: !Sub "cello-${Environment}-relay-node-private-key-arn"
