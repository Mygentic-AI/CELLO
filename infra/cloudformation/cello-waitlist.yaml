AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CELLO M11 waitlist — Lambdas, API Gateway, schedules and the SES bounce topic.

  Every function here reaches the PORTAL RDS (DOD-INV-SINGLE-DB — no new database
  is provisioned), which is PubliclyAccessible:false, so all of them are VPC-
  attached to the private subnets. That in turn means they have no route to SES,
  Secrets Manager or the public internet without egress, which is why this stack
  creates interface endpoints rather than relying on a NAT: the NAT gateways are
  deleted on every hibernate, and an email pipeline that stops working overnight
  because the environment was parked is not a pipeline.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, production]
    Description: Deployment environment.

  # No Default. A required value with an empty default silently disables the
  # feature it configures — infra/CLAUDE.md's Required Config Anti-Pattern.
  WaitlistDatabaseUrl:
    Type: String
    NoEcho: true
    Description: >
      Postgres connection string for the portal RDS instance. Read from Secrets
      Manager by deploy.sh and passed at deploy time; never hardcoded.
      KNOWN TRADEOFF, taken deliberately (M11-D25): this lands as a plaintext
      Lambda environment variable, readable by anyone holding
      lambda:GetFunctionConfiguration on this account. ECS avoids that with
      ValueFrom; Lambda has no equivalent, so the alternative is a cold-start
      Secrets Manager fetch inside all twelve handlers. Not taken for launch —
      single-operator account, and the twelve connect() paths are the most
      heavily tested surface in M11. Revisit before any second operator gets
      IAM access.

  ApiDomainName:
    Type: String
    Default: api.cello.mygentic.ai
    Description: >
      Custom domain for the waitlist API. LOAD-BEARING, not cosmetic: the session
      cookie is SameSite=Lax, and a Lax cookie is never attached to a cross-SITE
      fetch. Serving this API from execute-api.amazonaws.com while the app is on
      cello.mygentic.ai means /status can never authenticate and every user loops
      between /status and /auth forever.

  ApiCertificateArn:
    Type: String
    Description: ACM certificate ARN covering ApiDomainName (us-east-1).

  HostedZoneId:
    Type: String
    Default: Z02692523DOH7NW521CL8
    Description: Route53 zone for cello.mygentic.ai.

  FromEmailAddress:
    Type: String
    Default: CELLO <noreply@mygentic.ai>
    Description: Verified SES sender.

Resources:

  # ── Security group ──────────────────────────────────────────────────────────

  WaitlistLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "CELLO ${Environment} waitlist Lambdas"
      VpcId: !ImportValue
        Fn::Sub: "cello-${Environment}-vpc-id"
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !ImportValue
            Fn::Sub: "cello-${Environment}-vpc-cidr"
          Description: Postgres to the portal RDS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !ImportValue
            Fn::Sub: "cello-${Environment}-vpc-cidr"
          Description: HTTPS to the VPC interface endpoints (SES, Secrets Manager, Lambda)
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  RdsIngressFromWaitlist:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !ImportValue
        Fn::Sub: "cello-${Environment}-rds-sg"
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref WaitlistLambdaSecurityGroup
      Description: Waitlist Lambdas

  # ── VPC endpoints ───────────────────────────────────────────────────────────
  # NOT a NAT gateway. Hibernate deletes NAT gateways, so an email pipeline that
  # depended on one would stop delivering every night the environment is parked
  # — silently, since a job that cannot reach SES just retries.

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "CELLO ${Environment} waitlist VPC endpoints"
      VpcId: !ImportValue
        Fn::Sub: "cello-${Environment}-vpc-id"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref WaitlistLambdaSecurityGroup
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  SesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !ImportValue
        Fn::Sub: "cello-${Environment}-vpc-id"
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.email-smtp"
      PrivateDnsEnabled: true
      SubnetIds:
        - !ImportValue
          Fn::Sub: "cello-${Environment}-private-subnet-a"
        - !ImportValue
          Fn::Sub: "cello-${Environment}-private-subnet-b"
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !ImportValue
        Fn::Sub: "cello-${Environment}-vpc-id"
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      PrivateDnsEnabled: true
      SubnetIds:
        - !ImportValue
          Fn::Sub: "cello-${Environment}-private-subnet-a"
        - !ImportValue
          Fn::Sub: "cello-${Environment}-private-subnet-b"
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  # ── Execution role ──────────────────────────────────────────────────────────

  WaitlistLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cello-waitlist-lambda-${Environment}-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: waitlist-send-email
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: "*"
                Condition:
                  StringEquals:
                    # Scoped to our own verified identity. Without this the role
                    # can send as anything SES will accept, which is a spoofing
                    # surface rather than a permission.
                    ses:FromAddress: noreply@mygentic.ai
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── SES bounce + complaint notifications ────────────────────────────────────

  BounceTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "cello-waitlist-bounces-${Environment}"
      DisplayName: CELLO waitlist SES bounces and complaints

  BounceTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref BounceTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref BounceTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  # ── HTTP API ────────────────────────────────────────────────────────────────
  #
  # The custom domain is the reason this section exists rather than letting the
  # default execute-api hostname serve. A SameSite=Lax session cookie is never
  # attached to a cross-SITE request, so an API on execute-api.amazonaws.com
  # cannot authenticate a browser on cello.mygentic.ai — /status 401s, redirects
  # to /auth, and the user loops forever. Same-site is a functional requirement
  # here, not branding.

  WaitlistApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "cello-waitlist-${Environment}"
      ProtocolType: HTTP
      # CORS is handled per-Lambda, not here. The reads are wildcard-public and
      # the writes are origin-restricted, and expressing that split at the
      # gateway would put the rule in two places that can disagree.
      Tags:
        Project: cello
        Environment: !Ref Environment

  WaitlistApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WaitlistApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        # A public, unauthenticated signup endpoint with 8-byte bearer codes
        # behind it. The throttle is the only thing between a script and the
        # whole code space.
        ThrottlingRateLimit: 50
        ThrottlingBurstLimit: 100

  WaitlistApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref ApiDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  WaitlistApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref WaitlistApi
      DomainName: !Ref WaitlistApiDomain
      Stage: !Ref WaitlistApiStage

  WaitlistApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt WaitlistApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt WaitlistApiDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

  SignupFunctionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WaitlistApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SignupFunction.Arn
      PayloadFormatVersion: "2.0"

  SignupFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SignupFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WaitlistApi}/*"

  SignupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /waitlist/signup"
      Target: !Sub "integrations/${SignupFunctionIntegration}"

  AuthFunctionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WaitlistApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AuthFunction.Arn
      PayloadFormatVersion: "2.0"

  AuthFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AuthFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WaitlistApi}/*"

  AuthRequestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /waitlist/auth/request"
      Target: !Sub "integrations/${AuthFunctionIntegration}"

  AuthVerifyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "GET /waitlist/auth/verify"
      Target: !Sub "integrations/${AuthFunctionIntegration}"

  AuthSessionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "GET /waitlist/auth/session"
      Target: !Sub "integrations/${AuthFunctionIntegration}"

  AuthLogoutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /waitlist/auth/logout"
      Target: !Sub "integrations/${AuthFunctionIntegration}"

  UnsubGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "GET /waitlist/unsubscribe"
      Target: !Sub "integrations/${AuthFunctionIntegration}"

  UnsubPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /waitlist/unsubscribe"
      Target: !Sub "integrations/${AuthFunctionIntegration}"

  ActionsFunctionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WaitlistApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ActionsFunction.Arn
      PayloadFormatVersion: "2.0"

  ActionsFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
