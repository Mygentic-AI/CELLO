  EmailFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "cello-waitlist-email-${Environment}"
      Description: "Drains email_jobs and sends via SES."
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt WaitlistLambdaRole.Arn
      # Longer: a batch of 25 makes 25 SES round trips. The delivery model
      # commits the claim before each send, so a timeout mid-batch leaves
      # 'sending' rows that are reclaimed rather than lost.
      Timeout: 120
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: "cello-${Environment}-private-subnet-a"
          - !ImportValue
            Fn::Sub: "cello-${Environment}-private-subnet-b"
        SecurityGroupIds:
          - !Ref WaitlistLambdaSecurityGroup
      Environment:
        Variables:
          DATABASE_URL: !Ref WaitlistDatabaseUrl
          WAITLIST_API_BASE: !Sub "https://${ApiDomainName}/waitlist"
          WAITLIST_SITE: https://cello.mygentic.ai
          WAITLIST_FROM_EMAIL: !Ref FromEmailAddress
          CELLO_ENV: !Ref Environment
      Code:
        ZipFile: |
