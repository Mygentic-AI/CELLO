          Value: cello
        - Key: Environment
          Value: !Ref Environment

  ActionsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "cello-waitlist-actions-${Environment}"
      Description: "Survey, readiness, interview commit, post URL, content alerts."
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt WaitlistLambdaRole.Arn
