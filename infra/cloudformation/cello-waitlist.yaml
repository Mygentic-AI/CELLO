AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CELLO M11 waitlist — Lambdas, API Gateway, schedules and the SES bounce topic.

  Every function reaches the PORTAL RDS — cello-{env}-portal-db-* exports,
  database cello_portal, user portal_admin. NEVER the directory instance
  (cello-{env}-rds-*, database cello_{env}, user postgres): DOD-INV-SINGLE-DB
  makes a connection string pointing there a blocking finding, and that instance
  holds agent profiles under pgaudit.

  The portal DB is PubliclyAccessible:false, so every function is VPC-attached to
  the private subnets and reaches SES and the AWS APIs over the NAT gateway that
  cello-vpc.yaml already provides.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, production]
    Description: Deployment environment.

  # No Default. A required value with an empty default silently disables the
  # feature it configures — infra/CLAUDE.md's Required Config Anti-Pattern.
  WaitlistDatabaseUrl:
    Type: String
    NoEcho: true
    Description: >
      Postgres connection string for the portal RDS instance. Read from Secrets
      Manager by deploy.sh and passed at deploy time; never hardcoded.
      KNOWN TRADEOFF, taken deliberately (M11-D25): this lands as a plaintext
      Lambda environment variable, readable by anyone holding
      lambda:GetFunctionConfiguration on this account. ECS avoids that with
      ValueFrom; Lambda has no equivalent, so the alternative is a cold-start
      Secrets Manager fetch inside all twelve handlers. Not taken for launch —
      single-operator account, and the twelve connect() paths are the most
      heavily tested surface in M11. Revisit before any second operator gets
      IAM access.

  ApiDomainName:
    Type: String
    Default: api.cello.mygentic.ai
    Description: >
      Custom domain for the waitlist API. LOAD-BEARING, not cosmetic: the session
      cookie is SameSite=Lax, and a Lax cookie is never attached to a cross-SITE
      fetch. Serving this API from execute-api.amazonaws.com while the app is on
      cello.mygentic.ai means /status can never authenticate and every user loops
      between /status and /auth forever.

  HostedZoneId:
    Type: String
    Default: Z02692523DOH7NW521CL8
    Description: Route53 zone for cello.mygentic.ai.

  FromEmailAddress:
    Type: String
    Default: CELLO <noreply@mygentic.ai>
    Description: Verified SES sender.

Resources:

  # ── Security group ──────────────────────────────────────────────────────────

  WaitlistLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "CELLO ${Environment} waitlist Lambdas"
      VpcId: !ImportValue
        Fn::Sub: "cello-${Environment}-vpc-id"
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !ImportValue
            Fn::Sub: "cello-${Environment}-vpc-cidr"
          Description: Postgres to the portal RDS
        # 0.0.0.0/0, routed through the NAT gateway in cello-vpc.yaml. Scoped to
        # the VPC CIDR in the first draft, which silently blocked SES entirely:
        # boto3's SES client resolves email.<region>.amazonaws.com, a PUBLIC
        # address, so every send would have hung until the Lambda timed out and
        # the job cycled pending → sending → reclaimed forever.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
          Description: HTTPS to SES and the AWS APIs, via the NAT gateway
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # NOTE TO A FUTURE EDITOR: the export names below are written with {env}
  # rather than the real CFN syntax ON PURPOSE. verify-m11-invariants.sh greps
  # this whole file for the directory SG name, so spelling it properly here —
  # the natural tidy-up — makes the invariant check fail on a correct file.
  #
  # cello-{env}-portal-db-sg, NOT cello-{env}-rds-sg. Those two names are one
  # word apart and point at different databases: the second is the DIRECTORY's
  # instance (agent profiles, pgaudit), which this stack must never touch —
  # DOD-INV-SINGLE-DB calls a connection to it a blocking finding, and its
  # master credential is the one cello-rotation.yaml deliberately withholds from
  # every task role. The first draft of this file imported the wrong one.
  PortalDbIngressFromWaitlist:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !ImportValue
        Fn::Sub: "cello-${Environment}-portal-db-sg"
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref WaitlistLambdaSecurityGroup
      Description: Waitlist Lambdas

  # ── No VPC endpoints, deliberately ────────────────────────────────────────
  # The first draft created interface endpoints for SES and Secrets Manager,
  # reasoning that hibernate deletes the NAT gateway and an email pipeline must
  # not depend on one. The premise is true and the conclusion was wrong: hibernate
  # also STOPS the RDS instance, so during hibernation these Lambdas have no
  # email_jobs table to read. Endpoints would have bought the ability to reach SES
  # while the queue they drain is unreachable — nothing — and they would have
  # billed straight through every hibernation, since hibernate.sh only discovers
  # the ssmmessages endpoint and would never have torn them down.
  #
  # M6B-014 stage 2 already removed six interface endpoints per region in favour
  # of the NAT for exactly this cost reason. Reintroducing two here would have
  # quietly reversed that decision for the least important service in the stack.

  # ── Execution role ──────────────────────────────────────────────────────────

  WaitlistLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cello-waitlist-lambda-${Environment}-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: waitlist-send-email
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: "*"
                Condition:
                  StringEquals:
                    # Scoped to our own verified identity. Without this the role
                    # can send as anything SES will accept, which is a spoofing
                    # surface rather than a permission.
                    ses:FromAddress: noreply@mygentic.ai
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  # ── SES bounce + complaint notifications ────────────────────────────────────

  BounceTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "cello-waitlist-bounces-${Environment}"
      DisplayName: CELLO waitlist SES bounces and complaints

  # WITHOUT THESE TWO, NOTHING PUBLISHES TO THE TOPIC. The first draft created the
  # topic, the policy, the subscription and the Lambda permission — a complete
  # delivery path with nothing at the top of it — and deferred "point SES at
  # this" to a manual step that was never written down. The visible result would
  # have been a bounce handler that never fires, so email_status is never set to
  # bounced or complained, DOD-INV-EMAIL-SUPPRESS becomes unenforceable, and the
  # sending domain's reputation degrades with nothing reporting it.
  #
  # SES emits events to THIS TOPIC only for mail sent with THIS configuration
  # set. (Identity-level notifications via SetIdentityNotificationTopic are a
  # separate mechanism that would cover all mail from the verified identity;
  # the configuration set is chosen because it is scoped and IaC-managed.)
  # The dispatcher must send WITH this configuration set for events to be
  # emitted; waitlist-email passes ConfigurationSetName from WAITLIST_SES_CONFIG_SET.
  SesConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub "cello-waitlist-${Environment}"

  SesBounceDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    # CreateConfigurationSetEventDestination validates that SES may publish to
    # the topic. !Ref BounceTopic orders this after the TOPIC but not after the
    # POLICY that grants it, so a first deploy can lose the race and fail with
    # InvalidSNSDestination — an error that reads as an SES problem and rolls
    # back the stack.
    DependsOn: BounceTopicPolicy
    Properties:
      ConfigurationSetName: !Ref SesConfigurationSet
      EventDestination:
        Name: bounces-and-complaints
        Enabled: true
        # Only the events that change deliverability state. Sends, opens and
        # clicks would be volume the handler has to filter and a per-notification
        # cost for data nothing reads.
        MatchingEventTypes: [bounce, complaint, reject, renderingFailure]
        SnsDestination:
          TopicARN: !Ref BounceTopic

  BounceTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref BounceTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref BounceTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  # ── HTTP API ────────────────────────────────────────────────────────────────
  #
  # The custom domain is the reason this section exists rather than letting the
  # default execute-api hostname serve. A SameSite=Lax session cookie is never
  # attached to a cross-SITE request, so an API on execute-api.amazonaws.com
  # cannot authenticate a browser on cello.mygentic.ai — /status 401s, redirects
  # to /auth, and the user loops forever. Same-site is a functional requirement
  # here, not branding.

  WaitlistApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "cello-waitlist-${Environment}"
      ProtocolType: HTTP
      # CORS is handled per-Lambda, not here. The reads are wildcard-public and
      # the writes are origin-restricted, and expressing that split at the
      # gateway would put the rule in two places that can disagree.
      Tags:
        Project: cello
        Environment: !Ref Environment

  WaitlistApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WaitlistApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        # A public, unauthenticated signup endpoint with 8-byte bearer codes
        # behind it. The throttle is the only thing between a script and the
        # whole code space.
        ThrottlingRateLimit: 50
        ThrottlingBurstLimit: 100

  # CREATED HERE, not looked up. The first draft took the ARN as a parameter and
  # had deploy.sh find it with `acm list-certificates` — but no template in this
  # repo ever created a cert for api.*, so the lookup returned nothing on every
  # run and the stack skipped itself permanently while the deploy still printed
  # complete. A resource IaC owns cannot go missing that way.
  #
  # DNS-validated against HostedZoneId, the same pattern as PortalCertificate in
  # cello-portal-data.yaml. CFN writes the validation record itself and blocks
  # until ACM issues, so the first deploy of this stack is slower than later ones.
  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref ApiDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref ApiDomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: cello

  WaitlistApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref ApiDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificate
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  WaitlistApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref WaitlistApi
      DomainName: !Ref WaitlistApiDomain
      Stage: !Ref WaitlistApiStage

  WaitlistApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt WaitlistApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt WaitlistApiDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

  SignupFunctionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WaitlistApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SignupFunction.Arn
      PayloadFormatVersion: "2.0"

  SignupFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SignupFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WaitlistApi}/*"

  SignupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /waitlist/signup"
      Target: !Sub "integrations/${SignupFunctionIntegration}"

  # ── CORS preflight ──────────────────────────────────────────────────────────
  #
  # WITHOUT THESE, EVERY WRITE ENDPOINT IS DEAD IN A BROWSER. All four handlers
  # implement `if method == "OPTIONS": return 204` — but the first draft routed
  # no OPTIONS request to any of them and defined no $default, so API Gateway
  # answered every preflight itself with 404 and no Access-Control-Allow-Origin,
  # and the handler-side CORS code was dead by wiring.
  #
  # cello.mygentic.ai → api.cello.mygentic.ai is same-SITE, which is what keeps
  # the Lax session cookie attached (see ApiDomainName). It is still cross-ORIGIN,
  # and a POST carrying application/json is not CORS-safelisted, so it always
  # preflights. Same shape of bug as the SameSite one: a property of the wiring
  # that no handler test can see.
  #
  # EACH PREFIX GOES TO THE HANDLER THAT OWNS IT — not one catch-all. A single
  # OPTIONS /waitlist/{proxy+} pointed at signup would have been worse than no
  # route at all: signup's preflight response omits Access-Control-Allow-
  # Credentials (it has no session), while /auth/* and the action endpoints are
  # all credentialed. The browser rejects a credentialed request whose preflight
  # lacks that header, so the catch-all would have broken precisely the calls the
  # status page depends on, while appearing to fix CORS.
  #
  # HTTP API routes most-specific-first, so the exact and deeper-prefix keys win
  # over the trailing {proxy+}, which catches survey / readiness /
  # interview-commit / post-url / content-alerts and any endpoint added later.
  SignupPreflightRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "OPTIONS /waitlist/signup"
      Target: !Sub "integrations/${SignupFunctionIntegration}"

  AuthPreflightRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "OPTIONS /waitlist/auth/{proxy+}"
      Target: !Sub "integrations/${AuthFunctionIntegration}"

  UnsubPreflightRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "OPTIONS /waitlist/unsubscribe"
      Target: !Sub "integrations/${AuthFunctionIntegration}"

  ActionsPreflightRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "OPTIONS /waitlist/{proxy+}"
      Target: !Sub "integrations/${ActionsFunctionIntegration}"

  GalleryPreflightRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "OPTIONS /gallery/{proxy+}"
      Target: !Sub "integrations/${GalleryFunctionIntegration}"

  AuthFunctionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WaitlistApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AuthFunction.Arn
      PayloadFormatVersion: "2.0"

  AuthFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AuthFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WaitlistApi}/*"

  AuthRequestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /waitlist/auth/request"
      Target: !Sub "integrations/${AuthFunctionIntegration}"

  AuthVerifyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "GET /waitlist/auth/verify"
      Target: !Sub "integrations/${AuthFunctionIntegration}"

  AuthSessionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "GET /waitlist/auth/session"
      Target: !Sub "integrations/${AuthFunctionIntegration}"

  AuthLogoutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /waitlist/auth/logout"
      Target: !Sub "integrations/${AuthFunctionIntegration}"

  UnsubGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "GET /waitlist/unsubscribe"
      Target: !Sub "integrations/${AuthFunctionIntegration}"

  UnsubPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /waitlist/unsubscribe"
      Target: !Sub "integrations/${AuthFunctionIntegration}"

  ActionsFunctionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WaitlistApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ActionsFunction.Arn
      PayloadFormatVersion: "2.0"

  ActionsFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ActionsFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WaitlistApi}/*"

  SurveyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /waitlist/survey"
      Target: !Sub "integrations/${ActionsFunctionIntegration}"

  ReadinessRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /waitlist/readiness"
      Target: !Sub "integrations/${ActionsFunctionIntegration}"

  InterviewRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /waitlist/interview-commit"
      Target: !Sub "integrations/${ActionsFunctionIntegration}"

  PostUrlRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /waitlist/post-url"
      Target: !Sub "integrations/${ActionsFunctionIntegration}"

  ContentAlertsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /waitlist/content-alerts"
      Target: !Sub "integrations/${ActionsFunctionIntegration}"

  GalleryFunctionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WaitlistApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GalleryFunction.Arn
      PayloadFormatVersion: "2.0"

  GalleryFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GalleryFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WaitlistApi}/*"

  GalleryIndexRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "GET /gallery/receipts"
      Target: !Sub "integrations/${GalleryFunctionIntegration}"

  GalleryReceiptRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "GET /gallery/receipts/{hash}"
      Target: !Sub "integrations/${GalleryFunctionIntegration}"

  GalleryPublishRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /gallery/publish"
      Target: !Sub "integrations/${GalleryFunctionIntegration}"

  # ── The functions ───────────────────────────────────────────────────────────
  # All VPC-attached, because every one of them reaches the portal RDS.

  SignupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "cello-waitlist-signup-${Environment}"
      Description: "Public signup endpoint. Behind API Gateway."
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt WaitlistLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: "cello-${Environment}-private-subnet-a"
          - !ImportValue
            Fn::Sub: "cello-${Environment}-private-subnet-b"
        SecurityGroupIds:
          - !Ref WaitlistLambdaSecurityGroup
      Environment:
        Variables:
          DATABASE_URL: !Ref WaitlistDatabaseUrl
          WAITLIST_API_BASE: !Sub "https://${ApiDomainName}/waitlist"
          WAITLIST_SITE: https://cello.mygentic.ai
          WAITLIST_FROM_EMAIL: !Ref FromEmailAddress
      Code:
        ZipFile: |
          # Placeholder. The authoritative source is infra/lambda/waitlist-signup/handler.py
          # and CI replaces this on deploy. Raising rather than returning is
          # deliberate: a stub that returned a plausible empty result would let a
          # half-deployed stack look healthy.
          def lambda_handler(event, context):
              raise NotImplementedError(
                  "Deploy via deploy-lambdas.sh — see infra/lambda/waitlist-signup/handler.py"
              )
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  AuthFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "cello-waitlist-auth-${Environment}"
      Description: "Magic link, session, unsubscribe. Behind API Gateway."
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt WaitlistLambdaRole.Arn
      # The response floor that flattens the enumeration timing channel is a
      # SLEEP, so the timeout must comfortably exceed it or the guard turns
      # into a 502 for exactly the addresses it protects.
      Timeout: 30
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: "cello-${Environment}-private-subnet-a"
          - !ImportValue
            Fn::Sub: "cello-${Environment}-private-subnet-b"
        SecurityGroupIds:
          - !Ref WaitlistLambdaSecurityGroup
      Environment:
        Variables:
          DATABASE_URL: !Ref WaitlistDatabaseUrl
          WAITLIST_API_BASE: !Sub "https://${ApiDomainName}/waitlist"
          WAITLIST_SITE: https://cello.mygentic.ai
          WAITLIST_FROM_EMAIL: !Ref FromEmailAddress
      Code:
        ZipFile: |
          # Placeholder. The authoritative source is infra/lambda/waitlist-auth/handler.py
          # and CI replaces this on deploy. Raising rather than returning is
          # deliberate: a stub that returned a plausible empty result would let a
          # half-deployed stack look healthy.
          def lambda_handler(event, context):
              raise NotImplementedError(
                  "Deploy via deploy-lambdas.sh — see infra/lambda/waitlist-auth/handler.py"
              )
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  ActionsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "cello-waitlist-actions-${Environment}"
      Description: "Survey, readiness, interview commit, post URL, content alerts."
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt WaitlistLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: "cello-${Environment}-private-subnet-a"
          - !ImportValue
            Fn::Sub: "cello-${Environment}-private-subnet-b"
        SecurityGroupIds:
          - !Ref WaitlistLambdaSecurityGroup
      Environment:
        Variables:
          DATABASE_URL: !Ref WaitlistDatabaseUrl
          WAITLIST_API_BASE: !Sub "https://${ApiDomainName}/waitlist"
          WAITLIST_SITE: https://cello.mygentic.ai
          WAITLIST_FROM_EMAIL: !Ref FromEmailAddress
      Code:
        ZipFile: |
          # Placeholder. The authoritative source is infra/lambda/waitlist-actions/handler.py
          # and CI replaces this on deploy. Raising rather than returning is
          # deliberate: a stub that returned a plausible empty result would let a
          # half-deployed stack look healthy.
          def lambda_handler(event, context):
              raise NotImplementedError(
                  "Deploy via deploy-lambdas.sh — see infra/lambda/waitlist-actions/handler.py"
              )
      Tags:
        - Key: Project
          Value: cello
        - Key: Environment
          Value: !Ref Environment

  EmailFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "cello-waitlist-email-${Environment}"
      Description: "Drains email_jobs and sends via SES."
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt WaitlistLambdaRole.Arn
      # Longer: a batch of 25 makes 25 SES round trips. The delivery model
      # commits the claim before each send, so a timeout mid-batch leaves
      # 'sending' rows that are reclaimed rather than lost.
      Timeout: 120
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: "cello-${Environment}-private-subnet-a"
          - !ImportValue
            Fn::Sub: "cello-${Environment}-private-subnet-b"
        SecurityGroupIds:
          - !Ref WaitlistLambdaSecurityGroup
      Environment:
        Variables:
          DATABASE_URL: !Ref WaitlistDatabaseUrl
          WAITLIST_API_BASE: !Sub "https://${ApiDomainName}/waitlist"
          WAITLIST_SITE: https://cello.mygentic.ai
          WAITLIST_FROM_EMAIL: !Ref FromEmailAddress
          # Only the dispatcher sends mail, so only the dispatcher needs this.
          WAITLIST_SES_CONFIG_SET: !Ref SesConfigurationSet
      Code:
        ZipFile: |
          # Placeholder. The authoritative source is infra/lambda/waitlist-email/handler.py
          # and CI replaces this on deploy. Raising rather than returning is
          # deliberate: a stub that returned a plausible empty result would let a
          # half-deployed stack look healthy.
