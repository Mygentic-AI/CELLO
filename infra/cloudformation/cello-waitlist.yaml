  FirstWinFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "cello-waitlist-firstwin-${Environment}"
      # NO INVOKER EXISTS YET, and this description says so rather than implying
      # one. The handler takes {agent_pubkey} by direct invoke; the seal event
      # originates in the operator's daemon, which holds no AWS credentials and
      # cannot call this. Closing that gap means either a public authenticated
      # route or a portal-side relay — DOD-INV-NO-DIRECTORY-RELAY rules out
      # doing it from the directory. Deliberately left unwired instead of given
      # a schedule: a sweep would have to invent "which seal is new?", which is
      # a harder question than the one the handler answers.
      Description: "First-win detection. Direct invoke, {agent_pubkey}. CALL SITE NOT YET WIRED."
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt WaitlistLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      VpcConfig:
        SubnetIds:
