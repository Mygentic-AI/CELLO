  # ── EventBridge schedules ───────────────────────────────────────────────────
  #
  # DELIBERATELY ABSENT: any schedule for wave assembly. DOD-INV-WAVE-GATE means
  # admission is an operator action and never a calendar one, so that function
  # must never be given a rule. Recorded here because the absence of a resource
  # is invisible in a template and the next person to add one will be trying to
  # be helpful.

  EmailDispatchSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "cello-waitlist-email-${Environment}"
      # Every minute. NOT a 60-second guarantee: a job enqueued just after a
      # tick waits until the next one, then adds VPC cold start and the SES
      # round trip, so the p99 exceeds 60s by construction (M11-D27). One
      # minute is the polling interval, not a latency bound.
      Description: Drains email_jobs. Polls every minute.
      ScheduleExpression: "rate(1 minute)"
      State: ENABLED
      Targets:
        - Id: dispatcher
          Arn: !GetAtt EmailFunction.Arn

  FeedbackSweepSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "cello-waitlist-feedback-${Environment}"
      Description: High-activity detection (§5c). Daily.
      ScheduleExpression: "cron(17 6 * * ? *)"
      State: ENABLED
      Targets:
        - Id: sweep
          Arn: !GetAtt FeedbackFunction.Arn

  OutreachSweepSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "cello-waitlist-outreach-${Environment}"
      Description: Day-6 no-response invite grant. Daily, after the feedback sweep.
      ScheduleExpression: "cron(47 6 * * ? *)"
      State: ENABLED
      Targets:
        - Id: sweep
          Arn: !GetAtt OutreachFunction.Arn

  # DAILY, and pointed at the same function as the per-minute drain but with an
  # Input that selects a different action. The sweep scans every waiting user
  # against three NOT EXISTS subqueries to answer a question whose answer can
  # only change once a day; running that 1440 times a day to enqueue the same
  # zero rows is work nobody asked for.
  ReEngageSweepSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "cello-waitlist-re-engage-${Environment}"
      Description: E-re 60-day re-engagement sweep. Daily, before the feedback sweeps.
      ScheduleExpression: "cron(23 6 * * ? *)"
      State: ENABLED
      Targets:
        - Id: sweep
          Arn: !GetAtt EmailFunction.Arn
          # Without this the daily rule would just drain the queue a second
          # time, and E-re would never be enqueued by anything.
          Input: '{"action": "sweep_re_engagement"}'

  EmailSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt EmailFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EmailDispatchSchedule.Arn

  # A SECOND permission, not a reuse of the one above. Lambda scopes each
  # permission to a single SourceArn, so the drain rule's grant does not let the
  # sweep rule invoke anything — the sweep would fail with AccessDenied at the
  # EventBridge layer, where nothing in the function's own logs would show it.
  ReEngageSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt EmailFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReEngageSweepSchedule.Arn

  FeedbackSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FeedbackFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FeedbackSweepSchedule.Arn

  OutreachSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt OutreachFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OutreachSweepSchedule.Arn

  BounceSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref BounceTopic
      Protocol: lambda
      Endpoint: !GetAtt BounceFunction.Arn

  BounceInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BounceFunction.Arn
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref BounceTopic

Outputs:
  ApiEndpoint:
    Description: The raw execute-api endpoint. Use ApiDomain in anything a browser touches.
    Value: !GetAtt WaitlistApi.ApiEndpoint

  ApiDomain:
    Description: >
      The waitlist API origin. Must be same-site with the web app or the
      SameSite=Lax session cookie is never sent.
    Value: !Sub "https://${ApiDomainName}"
    Export:
      Name: !Sub "cello-${Environment}-waitlist-api-domain"

  BounceTopicArn:
    Description: Subscribe the SES configuration set's bounce and complaint destinations to this.
    Value: !Ref BounceTopic
    Export:
      Name: !Sub "cello-${Environment}-waitlist-bounce-topic"

  LambdaSecurityGroupId:
    Value: !Ref WaitlistLambdaSecurityGroup
    Export:
      Name: !Sub "cello-${Environment}-waitlist-lambda-sg"
