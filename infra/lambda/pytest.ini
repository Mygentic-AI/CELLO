[pytest]
# Rooted here so the shared fixtures are discovered for every Lambda below it.
# pythonpath puts this directory on sys.path so `from waitlist_testdb import ...`
# works from a test file one level down.
pythonpath = .

# NOT a hand-maintained list. An explicit testpaths stops covering the moment
# somebody adds a Lambda and forgets to append it — the run still says green,
# which is the same failure the invariant checker had until it was globbed.
# Discovery from the root picks up every waitlist-* suite on creation.
testpaths = .
norecursedirs = .git __pycache__ node_modules *.egg-info

# Declared by suites that touch no database. `clean_tables` honours it and skips
# the fixture that would otherwise skip THEM when Postgres is absent.
markers =
    no_database: this module needs no Postgres and must run without one
