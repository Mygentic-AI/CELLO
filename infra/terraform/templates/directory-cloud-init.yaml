#cloud-config
# CELLO directory node on Container-Optimized OS (DOD-NODE-DIR-GCP-1).
#
# NO SECRETS APPEAR IN THIS FILE. It lands in instance metadata, which is readable by anything
# holding compute.instances.get. What appears here is the secret RESOURCE NAMES; the node resolves
# them itself at boot with its attached workload identity (gcp-boot-env.ts).
#
# Three units:
#   cello-firewall.service   opens the CELLO ports in the COS HOST firewall. Not redundant with the
#                            VPC rules — see the unit; without it nothing reaches this node.
#   cello-directory.service  the node. Restarts on failure; the MIG heals it if it stops answering.
#   cello-backup.timer       daily pg_dump to GCS. The node's key shares exist in its database and
#                            nowhere else, so this is the only copy off the VM.

write_files:
  - path: /etc/cello/directory.env
    permissions: "0644"
    owner: root
    content: |
      CELLO_ENV=${environment}
      CELLO_CLOUD=gcp
      NODE_ID=${node_id}
      CELLO_REGION=${region}
      HEALTH_PORT=9090
      CELLO_DIRECTORY_LISTEN_ADDR=/ip4/0.0.0.0/tcp/4000
      CELLO_DIRECTORY_WS_LISTEN_ADDR=/ip4/0.0.0.0/tcp/8080/ws
      CELLO_DIRECTORY_HOSTNAME=${hostname}
      # The advertised bootstrap address must match what a client can actually DIAL. The default
      # (port 80 / ws) describes the AWS shape, where an ALB fronts 80 → 8080. A GCP node has no
      # load balancer in front of it: it listens on 8080 itself. Advertising 80 here would publish
      # an address nothing is bound to, and the failure would surface only as clients unable to
      # connect — far from this file. Becomes 443/wss once TLS terminates in front of the node.
      CELLO_DIRECTORY_PUBLIC_PORT=${public_port}
      CELLO_DIRECTORY_PUBLIC_TRANSPORT=${public_transport}
      CELLO_AUDIT_BUCKET=${audit_bucket}
      RELAY_MANIFEST_BUCKET=${relay_bucket}
      RELAY_MANIFEST_POLL_INTERVAL_MS=120000
      DIRECTORY_PG_POOL_MAX=50
      CELLO_KMS_PROJECT=${project_id}
      CELLO_KMS_LOCATION=${kms_location}
      CELLO_KMS_KEYRING=${kms_keyring}
      CELLO_KMS_KEY=${kms_key}
      # Two database credentials: the schema owner for Flyway's DDL, the restricted role for the
      # node itself. See sql.tf — connecting the node as the owner silently disables RLS and the
      # UPDATE/DELETE revokes that make the seal tables append-only.
      CELLO_GSM_DB_CREDENTIALS=${gsm_db}
      CELLO_GSM_DB_APP_CREDENTIALS=${gsm_db_app}
      CELLO_GSM_NODE_KEY=${gsm_node_key}
      CELLO_GSM_TRANSPORT_KEY=${gsm_transport}
      CELLO_GSM_INTERNAL_API_KEY=${gsm_internal}
      CELLO_GSM_PREAUTH_ISSUER_KEY=${gsm_preauth}
      HOME=/tmp

  - path: /etc/cello/backup.env
    permissions: "0644"
    owner: root
    content: |
      NODE_ID=${node_id}
      CELLO_BACKUP_BUCKET=${backup_bucket}
      # The SCHEMA OWNER's credential, deliberately — pg_dump reads catalogs and ownership metadata
      # that the node's restricted role has no business holding. The app credential is not here.
      CELLO_GSM_DB_CREDENTIALS=${gsm_db}
      HOME=/tmp

  - path: /etc/systemd/system/cello-firewall.service
    permissions: "0644"
    owner: root
    content: |
      [Unit]
      Description=Open the CELLO ports in the COS host firewall
      # Must be in place before anything can be reached, including the MIG health probe.
      Before=cello-directory.service
      DefaultDependencies=no
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=true
      # Container-Optimized OS ships INPUT with policy DROP, permitting only established
      # connections, loopback, ICMP and tcp/22. A GCP firewall rule is NOT sufficient on its own:
      # the packet is allowed onto the wire and then dropped by the host. Without this the MIG
      # health probe times out, the autohealer resets the instance on a loop, and no peer or client
      # can reach the node at all — while every VPC-level rule reads as correct.
      #
      # -I (insert), and idempotent: COS rebuilds these rules on every boot, and this unit re-runs
      # on every boot, so a -D before each -I keeps a restart from stacking duplicates.
      ExecStart=/bin/sh -c 'for p in 4000 8080 9090; do iptables -w -D INPUT -p tcp --dport $p -j ACCEPT 2>/dev/null; iptables -w -I INPUT -p tcp --dport $p -j ACCEPT; done'

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/cello-directory.service
    permissions: "0644"
    owner: root
    content: |
      [Unit]
      Description=CELLO directory node
      Wants=gcr-online.target
      After=gcr-online.target

      [Service]
      Environment=HOME=/home/cello
      # Artifact Registry auth comes from the VM's attached service account.
      ExecStartPre=/usr/bin/docker-credential-gcr configure-docker --registries=${registry_host}
      ExecStartPre=-/usr/bin/docker rm -f cello-directory
      ExecStartPre=/usr/bin/docker pull ${image}
      ExecStart=/usr/bin/docker run --rm --name cello-directory \
        --network host \
        --env-file /etc/cello/directory.env \
        ${image}
      ExecStop=/usr/bin/docker stop cello-directory
      Restart=always
      # A crash loop that restarts instantly buries its own cause in log noise; 10s keeps the
      # serial console readable while still recovering unattended.
      RestartSec=10

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/cello-backup.service
    permissions: "0644"
    owner: root
    content: |
      [Unit]
      Description=CELLO directory pg_dump to GCS
      Wants=gcr-online.target
      After=gcr-online.target

      [Service]
      Type=oneshot
      Environment=HOME=/home/cello
      ExecStartPre=/usr/bin/docker-credential-gcr configure-docker --registries=${registry_host}
      ExecStart=/usr/bin/docker run --rm --name cello-backup \
        --network host \
        --env-file /etc/cello/backup.env \
        --entrypoint /app/packages/directory/scripts/pg-backup-to-gcs.sh \
        ${image}

  - path: /etc/systemd/system/cello-backup.timer
    permissions: "0644"
    owner: root
    content: |
      [Unit]
      Description=Daily CELLO directory backup

      [Timer]
      OnCalendar=*-*-* 04:17:00 UTC
      # A missed window (instance replaced overnight) must still produce a backup, or the gap is
      # invisible until it is needed.
      Persistent=true

      [Install]
      WantedBy=timers.target

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now cello-firewall.service
  - systemctl enable --now cello-directory.service
  - systemctl enable --now cello-backup.timer
