version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - npm install -g pnpm@10.33.2
      - pnpm install --frozen-lockfile
  build:
    commands:
      - pnpm --filter @cello-protocol/adapter-claude-code run typecheck
      - pnpm --filter @cello-protocol/adapter-claude-code run test
