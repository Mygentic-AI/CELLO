version: 0.2
# IMAGE_URI is written to imageUri.txt in the build output artifact so downstream
# pipeline stages (StagingDeploy, ProductionDeploy) can read it with:
#   STAGING_IMAGE_URI=$(cat imageUri.txt)
# This avoids CodePipeline V2 #{BuildAction.IMAGE_URI} variable syntax which
# CloudFormation rejects during stack CREATE/UPDATE (CFN+CodePipeline V2 bug).
phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - npm install -g pnpm@10.33.2
      - pnpm install --frozen-lockfile
  build:
    commands:
      # ── Migration version gate ───────────────────────────────────────────────
      # Fails fast if a new V{N} migration exists but cello-ssm-parameters.yaml
      # has not been updated to match. Catches the case where a coder adds a
      # migration without bumping OpsAgentExpectedMigrationVersion.
      - |
        HIGHEST_MIGRATION=$(ls packages/directory/db/migrations/V*.sql \
          | sed 's/.*\/V\([0-9]*\)__.*/\1/' \
          | sort -n | tail -1)
        SSM_YAML_VERSION=$(grep -A6 'OpsAgentExpectedMigrationVersion:' \
          infra/cloudformation/cello-ssm-parameters.yaml \
          | grep 'Value:' | head -1 | tr -d ' "' | cut -d: -f2)
        if [ "$HIGHEST_MIGRATION" != "$SSM_YAML_VERSION" ]; then
          echo "ERROR: Highest migration is V${HIGHEST_MIGRATION} but cello-ssm-parameters.yaml has OpsAgentExpectedMigrationVersion: ${SSM_YAML_VERSION} — validate that this should be ${HIGHEST_MIGRATION}."
          exit 1
        fi
        echo "Migration version gate passed: V${HIGHEST_MIGRATION}"
      - pnpm --filter @cello-protocol/crypto run typecheck
      - pnpm --filter @cello-protocol/interfaces run typecheck
      - pnpm --filter @cello-protocol/protocol-types run typecheck
      - pnpm --filter @cello-protocol/transport run typecheck
      - pnpm --filter @cello-protocol/client run typecheck
      - pnpm --filter @cello-protocol/relay run typecheck
      - pnpm --filter @cello-protocol/directory run typecheck
      - pnpm --filter @cello-protocol/directory run test -- --pool-options.threads.maxThreads=1 --pool-options.threads.minThreads=1
      # ── Docker build → ECR push (DEPLOY-003) ────────────────────────────────
      # IMAGE_TAG = first 7 chars of git commit SHA (CodeBuild sets CODEBUILD_RESOLVED_SOURCE_VERSION)
      - export IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - export ECR_REPO=257394457473.dkr.ecr.us-east-1.amazonaws.com/cello-directory
      - export IMAGE_URI=${ECR_REPO}:${IMAGE_TAG}
      # Authenticate to ECR
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 257394457473.dkr.ecr.us-east-1.amazonaws.com
      # Build linux/amd64 image (ECS Fargate requires x86_64; CodeBuild may run on arm64)
      - docker build --platform linux/amd64 -t ${IMAGE_URI} -f packages/directory/Dockerfile .
      # Push to ECR
      - docker push ${IMAGE_URI}
      # Write IMAGE_URI to SSM for downstream stages (StagingDeploy, ProductionDeploy).
      # Avoids CodePipeline V2 #{BuildAction.IMAGE_URI} syntax which CloudFormation rejects.
      - aws ssm put-parameter --name /cello/${CELLO_ENV}/pipeline/directory-image-uri --value "${IMAGE_URI}" --type String --overwrite --region us-east-1
artifacts:
  files:
    - packages/directory/buildspec.yml
