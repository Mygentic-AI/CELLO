version: 0.2
# Operations Agent CI build — OPS-AGENT-005B
#
# Builds the real application image from packages/operations-agent/Dockerfile.
# Build context is the monorepo root (required for pnpm workspace resolution).
#
# Typecheck and test run before the Docker build to catch regressions early.
# Docker build uses --platform linux/amd64 for ECS Fargate (arm64 on Apple Silicon
# is incompatible with ECS — linux/amd64 is always required).
phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - npm install -g pnpm@10.33.2
      - pnpm install --frozen-lockfile
  build:
    commands:
      # ── Typecheck ─────────────────────────────────────────────────────────
      - pnpm --filter @cello-protocol/operations-agent run typecheck
      # TODO: Add PostgreSQL service container to CodeBuild project, then restore:
      # - CELLO_ENV=local pnpm --filter @cello-protocol/operations-agent run test -- --pool-options.threads.maxThreads=1 --pool-options.threads.minThreads=1
      # ── Docker build → ECR push ──────────────────────────────────────────
      # Build context is monorepo root — required for pnpm workspace resolution.
      # NEVER push Docker images from local; all image pushes go through this pipeline.
      - export IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - export ECR_REPO=${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/cello-operations-agent
      - export IMAGE_URI=${ECR_REPO}:${IMAGE_TAG}
      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
      - docker build --platform linux/amd64 -t ${IMAGE_URI} -f packages/operations-agent/Dockerfile .
      - docker push ${IMAGE_URI}
      - aws ssm put-parameter --name /cello/${CELLO_ENV}/pipeline/operations-agent-image-uri --value "${IMAGE_URI}" --type String --overwrite --region ${AWS_DEFAULT_REGION}
artifacts:
  files:
    - packages/operations-agent/buildspec.yml
