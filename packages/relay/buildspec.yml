version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - npm install -g pnpm@10.33.2
      - pnpm install --frozen-lockfile
  build:
    commands:
      - pnpm --filter @cello-protocol/crypto run typecheck
      - pnpm --filter @cello-protocol/interfaces run typecheck
      - pnpm --filter @cello-protocol/protocol-types run typecheck
      - pnpm --filter @cello-protocol/transport run typecheck
      - pnpm --filter @cello-protocol/relay run typecheck
      - pnpm --filter @cello-protocol/relay run test -- --pool-options.threads.maxThreads=1 --pool-options.threads.minThreads=1
      # ── Docker build → ECR push (DEPLOY-003) ────────────────────────────────
      - export IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - export ECR_REPO=257394457473.dkr.ecr.us-east-1.amazonaws.com/cello-relay
      - export IMAGE_URI=${ECR_REPO}:${IMAGE_TAG}
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 257394457473.dkr.ecr.us-east-1.amazonaws.com
      - docker build --platform linux/amd64 -t ${IMAGE_URI} -f packages/relay/Dockerfile .
      - docker push ${IMAGE_URI}
      - aws ssm put-parameter --name /cello/${CELLO_ENV}/pipeline/relay-image-uri --value "${IMAGE_URI}" --type String --overwrite --region us-east-1
artifacts:
  files:
    - packages/relay/buildspec.yml
